name: cleanup-merged-branches

# .github/workflows/cleanup-merged-branches.yml — מחיקת כל ענף שכולו כבר בתוך main, וכל ענף זמני (tmp/)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Delete fully-merged branches and tmp/ branches
        run: |
          set -u
          git fetch origin --prune --quiet
          deleted=0; skipped=0
          for ref in $(git for-each-ref --format='%(refname)' refs/remotes/origin/); do
            branch="${ref#refs/remotes/origin/}"
            # main והמצביע HEAD — לעולם אינם מועמדים.
            case "$branch" in main|HEAD) continue ;; esac
            # ענף זמני — בתחילית tmp/: נפתח במכוון לזמן קצר, ונמחק בכל ריצה.
            case "$branch" in
              tmp/*)
                echo "🗑️  deleting temporary branch: $branch"
                git push origin --delete "$branch" || echo "⚠️  failed to delete $branch (continuing)"
                deleted=$((deleted+1)); continue ;;
            esac
            # כל ענף אחר, בכל שם — נמחק רק כשכולו כבר בתוך main; ענף עם שינוי שלא מוזג נשאר.
            if git merge-base --is-ancestor "$ref" origin/main; then
              echo "🗑️  deleting fully-merged branch: $branch"
              git push origin --delete "$branch" || echo "⚠️  failed to delete $branch (continuing)"
              deleted=$((deleted+1))
            else
              echo "⏭️  skipping unmerged branch: $branch"
              skipped=$((skipped+1))
            fi
          done
          echo "done: $deleted deleted, $skipped skipped"
