name: cleanup-merged-branches

# .github/workflows/cleanup-merged-branches.yml — מחיקת ענפי claude/ שמוזגו ל-main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Delete fully-merged claude/ branches
        run: |
          set -u
          git fetch origin --prune --quiet
          deleted=0; skipped=0
          for ref in $(git for-each-ref --format='%(refname)' refs/remotes/origin/); do
            branch="${ref#refs/remotes/origin/}"
            # קו הגנה ראשון: רק ענפי claude/ — כל ענף אחר, כולל main, אינו נבדק כלל.
            case "$branch" in
              claude/*) ;;
              *) continue ;;
            esac
            # קו הגנה שני: נמחק רק ענף שה-HEAD שלו כבר בתוך main.
            if git merge-base --is-ancestor "$ref" origin/main; then
              echo "🗑️  deleting fully-merged branch: $branch"
              git push origin --delete "$branch" || echo "⚠️  failed to delete $branch (continuing)"
              deleted=$((deleted+1))
            else
              echo "⏭️  skipping unmerged branch: $branch"
              skipped=$((skipped+1))
            fi
          done
          echo "done: $deleted deleted, $skipped skipped"
