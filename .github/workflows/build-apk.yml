name: Build APK

# Builds the native WebView shell in android/ (NOT a TWA — see CLAUDE.md) and
# signs it with the project's permanent key. The key is NOT in the repo: the
# repo is public, and a committed key is a public key. It lives in the
# KEYSTORE_B64 / KEYSTORE_PASS secrets, is decoded to a temp file for the
# signing step only, and is removed when the job ends.
#
# Signing runs through signing/sign-apk.sh — the same script used by hand — so
# the fingerprint gate exists in exactly one place.
# ⛔ אין לשכפל כאן את לוגיקת החתימה — מסלול חתימה שני הוא מסלול
# בלי שער, וטעות בו אינה ניתנת לתיקון אצל אף משתמש מותקן.

on:
  workflow_dispatch:
  # Also build whenever the shell itself changes. Web-only changes (index.html,
  # sw.js, …) do NOT need a new APK — the app loads the live site — so those
  # paths are deliberately not listed here.
  #
  # This trigger is also what makes the workflow runnable before it reaches the
  # default branch: GitHub only offers "Run workflow" for files that already
  # exist on the default branch, while push events fire from any branch.
  push:
    paths:
      - 'android/**'
      # ⛔ התיעוד אינו נכנס ל-APK — ⚠️ שינוי בו אינו בנייה ואינו קידום גרסה.
      - '!android/README.md'
      - 'signing/**'
      - '.github/workflows/build-apk.yml'

env:
  # ⛔ נתיב אחד לשלב שכותב ולשלב שמוחק — ⚠️ שני נתיבים הם מפתח שנשאר
  # על הדיסק של הרץ אחרי שהמחיקה "הצליחה".
  SIGN_KEYSTORE: /tmp/apk-signing.keystore

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ⛔ שם האפליקציה נקרא מהתצורה — ⚠️ והקובץ הזה אינו נושא ערך של אפליקציה.
      - name: Read the app id from the config
        run: echo "APP_ID=$(node tools/gen-app.mjs --get id)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # ⛔ החבילות מוצהרות ואינן ברירת המחדל — ⚠️ ברירת המחדל של הפעולה
      # מבקשת את החבילה `tools`, שהוסרה ממאגר ה-SDK: ⭐ ומאז היא נופלת
      # בכל בנייה, לפני שהחתימה בכלל מתחילה.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # ⛔ No "copy web assets" step, and it must never be added.
      # The shell loads the live Pages site over the network,
      # so a bundled copy would be a SECOND source of truth that only ever goes stale —
      # and worse, it lives in the file:// storage origin, a different localStorage
      # partition from the https site. Anything typed into it offline would be invisible
      # to the real app. See android/README.md.
      - name: Generate Gradle wrapper
        run: |
          set -euo pipefail
          cd android
          gradle wrapper --gradle-version 8.7 --no-daemon

      - name: Build release APK (unsigned)
        run: |
          set -euo pipefail
          cd android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Sign with the permanent key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          SIGN_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          # ⛔ המפתח נכתב מחוץ לעץ העבודה — ⚠️ קובץ בעץ נכנס ל-artifact
          # ולסטטוס של git, והמפתח חוזר לריפו בדלת האחורית.
          umask 077
          # ⛔ שלושת השלבים בסדר הזה: נרמול ⟵ שער האלפבית ⟵ פענוח.
          # ⚠️ שער שרץ לפני הנרמול מפיל ערך שהנרמול היה מציל, ⛔ וההודעה
          # שולחת את הקורא לחפש סיסמה שגויה במקום הדבקה מזוהמת.
          #
          # ⛔ וערך שמגיע מסוד מנורמל לפני שהוא נצרך — ⚠️ רווח, תווי סוף
          # שורה וסימנים בלתי-נראים מוסרים: ⭐ ערך שעבר דרך ממשק אנושי
          # נושא אותם — BOM, סימני כיווניות, רווח קשיח — ⛔ ואין להם
          # משמעות בתוכן. ⚠️ ומה שאינו באלפבית עדיין מפיל — נרמול אינו סליחה.
          B64=$(printf '%s' "$KEYSTORE_B64" \
                | LC_ALL=C tr -d ' \t\r\n' \
                | LC_ALL=C sed -e 's/\xEF\xBB\xBF//g' \
                               -e 's/\xE2\x80[\x8B-\x8F]//g' \
                               -e 's/\xC2[\xA0\xAD]//g')
          if ! printf '%s' "$B64" | LC_ALL=C grep -qE '^[A-Za-z0-9+/]+=*$'; then
            echo "❌ KEYSTORE_B64 carries a character outside the base64 alphabet — a contaminated paste, not a wrong password" >&2
            exit 1
          fi
          printf '%s' "$B64" | base64 -d > "$SIGN_KEYSTORE"
          [ -s "$SIGN_KEYSTORE" ] || { echo "❌ KEYSTORE_B64 decoded to an empty file" >&2; exit 1; }
          # The signing tools live in build-tools, which is not on PATH by default.
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BT"
          echo "$BT" >> "$GITHUB_PATH"
          export PATH="$BT:$PATH"
          ./signing/sign-apk.sh \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            app-signed.apk

      # ⛔ המחיקה רצה גם כשהחתימה נפלה — ⚠️ שלב שרץ רק בהצלחה משאיר את
      # המפתח על הרץ בדיוק בריצות שנעצרו באמצע.
      - name: Remove the decoded key
        if: always()
        run: rm -f "$SIGN_KEYSTORE"

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_ID }}-apk
          path: app-signed.apk
          if-no-files-found: error
