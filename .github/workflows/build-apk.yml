name: Build APK

# Builds the native WebView shell in android/ (NOT a TWA — see CLAUDE.md) and
# signs it with the project's permanent key, which lives in the repo. No secret,
# no manual input: there is no way to accidentally produce an APK signed with a
# different key.
#
# Signing runs through signing/sign-apk.sh — the same script used by hand — so
# the fingerprint gate exists in exactly one place.
# ⛔ אין לשכפל כאן את לוגיקת החתימה (סבב 41) — מסלול חתימה שני הוא מסלול
# בלי שער, וטעות בו אינה ניתנת לתיקון אצל אף משתמש מותקן.

on:
  workflow_dispatch:
  # Also build whenever the shell itself changes. Web-only changes (index.html,
  # sw.js, …) do NOT need a new APK — the app loads the live site — so those
  # paths are deliberately not listed here.
  #
  # This trigger is also what makes the workflow runnable before it reaches the
  # default branch: GitHub only offers "Run workflow" for files that already
  # exist on the default branch, while push events fire from any branch.
  push:
    paths:
      - 'android/**'
      - 'signing/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ⛔ No "copy web assets" step, and it must never be added.
      # The shell loads https://ygtotlrl-lab.github.io/yoman-avoda/ over the network,
      # so a bundled copy would be a SECOND source of truth that only ever goes stale —
      # and worse, it lives in the file:// storage origin, a different localStorage
      # partition from the https site. Anything typed into it offline would be invisible
      # to the real app. See android/README.md.
      - name: Generate Gradle wrapper
        run: |
          set -euo pipefail
          cd android
          gradle wrapper --gradle-version 8.7 --no-daemon

      - name: Build release APK (unsigned)
        run: |
          set -euo pipefail
          cd android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Sign with the permanent key
        run: |
          set -euo pipefail
          # The signing tools live in build-tools, which is not on PATH by default.
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BT"
          echo "$BT" >> "$GITHUB_PATH"
          export PATH="$BT:$PATH"
          ./signing/sign-apk.sh \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            yoman-avoda.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: yoman-avoda-apk
          path: yoman-avoda.apk
          if-no-files-found: error
