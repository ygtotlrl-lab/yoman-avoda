name: Build Signed APK

on:
  workflow_dispatch:
  # Also build whenever the shell itself changes. Web-only changes (index.html,
  # sw.js, …) do NOT need a new APK — the app loads the live site — so those
  # paths are deliberately not listed here.
  #
  # This trigger is also what makes the workflow runnable before it reaches the
  # default branch: GitHub only offers "Run workflow" for files that already
  # exist on the default branch, while push events fire from any branch.
  push:
    paths:
      - 'android/**'
      - 'signing/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ⛔ No "copy web assets" step any more, and it must not come back.
      # The shell loads https://ygtotlrl-lab.github.io/yoman-avoda/ over the network,
      # so a bundled copy would be a SECOND source of truth that only ever goes stale —
      # and worse, it lives in the file:// storage origin, a different localStorage
      # partition from the https site. Anything typed into it offline would be invisible
      # to the real app. See android/README.md, "למה אין יותר נכסים מוטבעים".

      - name: Generate Gradle wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.7 --no-daemon

      - name: Build release APK (unsigned)
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Sign APK with permanent keystore
        run: |
          cd android
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BT"
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign \
            --ks ../signing/yoman.keystore \
            --ks-key-alias yoman \
            --ks-pass pass:yoman123 \
            --key-pass pass:yoman123 \
            --out yoman-avoda-signed.apk \
            aligned.apk
          "$BT/apksigner" verify --print-certs yoman-avoda-signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: yoman-avoda-signed-apk
          path: android/yoman-avoda-signed.apk
