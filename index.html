function gregDateStr(jsDate) {
  var d = jsDate.getDate(), m = jsDate.getMonth()+1, y = jsDate.getFullYear();
  var GREG_MONTHS = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
  return d + " " + GREG_MONTHS[m-1] + " " + y;
}

function checkDayChange() {
  var lastDay = lsGet("tb_last_day"+LS) || "";
  var today = new Date().toDateString();
  if (lastDay && lastDay !== today && liveOnly(ENTRIES).length > 0) {
    // זוהה יום חדש — ארכוב מקומי בלבד.
    // ⛔ אין לדחוף לענן כאן (נרשם בסבב 67) — syncFromCloud() ירוץ מיד
    // אחרי וימזג כראוי; דחיפת ENTRIES ריק לענן הייתה מוחקת רשומות
    // שמכשיר אחר כבר הוסיף להיום.
    var prev = new Date(lastDay);
    var live = liveOnly(ENTRIES);
    // ⭐ שדות היום נגזרים מהרשומות עצמן קודם כול (סבב 31) — הן נכתבו עם התאריך
    //    שהמשתמש באמת עבד בו, וזה בדיוק מה ש-`autoArchiveDay` מקבל במסלול הידני.
    //    השעון הוא נפילה-חזרה, לא מקור ראשון.
    var withG = live.find(function(e){ return e && e.gdate; });
    var withH = live.find(function(e){ return e && hasHebMonth(e.hdate); });
    var withD = live.find(function(e){ return e && e.day; });
    var gdate = (withG && withG.gdate) || gregDateStr(prev);
    // ⛔ נפילה-חזרה מפורשת ולא שדה ריק בשקט (סבב 31) — `hebrewDate` מחזירה ""
    //    כשהלוח אינו זמין, ו-hdate ריק הוא בדיוק מה שהעיף סנאפשוטים
    //    לדלי «לא ידוע». בהיעדר שניהם נשמר לפחות `name` שממנו `snapHDate` גוזרת.
    var hdate = (withH && withH.hdate) || hebrewDate(prev) || "";
    var dayKey = (withD && withD.day) || DAY_VALUE_MAP[prev.getDay()] || "";
    // אותה חותמת לעותקים שבארכיון ול-tombstones — בשוויון הסנאפשוט מנצח,
    // ולכן ארכוב אינו מחיקה מהארכיון
    var ts = Date.now();
    var carried = JSON.parse(JSON.stringify(live));
    carried.forEach(function(e){ recTouch(e, ts); });
    // ⛔ אותו בונה בדיוק כמו המסלול הידני (סבב 31) — `auto` הוא סימון מקור
    //    ותו לא, ואינו מחליף שדה. ר' הבלוק שמעל `arcPutSnapshot`.
    arcPutSnapshot(dayKey, hdate, gdate, carried, ts, { auto: true });
    lsSetArray("tb_archive"+LS, hwDiskFilter('tb_archive'+LS, ARCHIVE), _tbRecTs);
    // tombstones במקום ENTRIES = [] — אחרת הענן היה מחזיר את הרשומות לחיים
    ENTRIES.forEach(function(e){ if (isLive(e)) recDelete(e, ts); });
    lsSetArray("tb_entries"+LS, ENTRIES, _tbRecTs);
    toast("📅 יום חדש! הרשומות הועברו לארכיון אוטומטית");
  }
  lsSet("tb_last_day"+LS, today);
}

function initDate() {
  var now = new Date();
  var hd = hebrewDate(now);
  var gd = gregDateStr(now);
  document.getElementById("hebDateInput").value = hd;
  document.getElementById("gregDateInput").value = gd;
  autoSelectTodayChip();
}

// ממפה את getDay() של JS (0=ראשון) לתוויות הצ'יפים
var DAY_LABEL_MAP = ["ראשון","שני","שלישי","רביעי","חמישי","ערב שבת","מוצ\"ש"];
var DAY_VALUE_MAP = ["יום ראשון","יום שני","יום שלישי","יום רביעי","יום חמישי","ערב שבת","מוצאי שבת"];

function autoSelectTodayChip() {
  var dow = new Date().getDay(); // 0=ראשון
  var label = DAY_LABEL_MAP[dow] || "";
  var value = DAY_VALUE_MAP[dow] || "";
  selDay = value;
  document.querySelectorAll(".day-chip").forEach(function(b){
    b.classList.remove("active");
    if (b.textContent.trim() === label) b.classList.add("active");
  });
}

function pickDay(el, day) {
  selDay = day;
  document.querySelectorAll(".day-chip").forEach(function(b){ b.classList.remove("active"); });
  el.classList.add("active");
  // כשהמשתמש בוחר יום ידנית, מזיז בהתאם את התאריך העברי והלועזי
  syncDatesToDay(day);
  renderLog();
}

function syncDatesToDay(dayValue) {
  // מזהה איזה יום בשבוע נבחר
  var targetDow = DAY_VALUE_MAP.indexOf(dayValue);
  if (targetDow < 0) return;
  var now = new Date();
  var currDow = now.getDay();
  var diff = targetDow - currDow;
  // נשאר בתוך השבוע הנוכחי (עד ±3 ימים)
  if (diff > 3) diff -= 7;
  if (diff < -3) diff += 7;
  var target = new Date(now.getTime() + diff * 86400000);
  document.getElementById("hebDateInput").value = hebrewDate(target) || hebrewDate(now);
  document.getElementById("gregDateInput").value = gregDateStr(target);
}

function onGregDateChange() {
  var val = document.getElementById("gregDateInput").value.trim();
  // ניסיון פענוח dd/mm/yyyy או yyyy-mm-dd
  var parts, d;
  if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(val)) {
    parts = val.split("/");
    d = new Date(+parts[2], +parts[1]-1, +parts[0]);
  } else if (/^\d{4}-\d{2}-\d{2}$/.test(val)) {
    d = new Date(val);
  }
  if (d && !isNaN(d.getTime())) {
    var dow = d.getDay();
    var label = DAY_LABEL_MAP[dow] || "";
    var value = DAY_VALUE_MAP[dow] || "";
    selDay = value;
    document.querySelectorAll(".day-chip").forEach(function(b){
      b.classList.remove("active");
      if (b.textContent.trim() === label) b.classList.add("active");
    });
    document.getElementById("hebDateInput").value = hebrewDate(d) || document.getElementById("hebDateInput").value;
    renderLog();
  }
}

// רשת הקטגוריות
function buildCatGrid() {
  var g = document.getElementById("catGrid");
  g.innerHTML = "";
  liveOnly(CATS).forEach(function(cat) {
    var c = CAT_COLORS[cat.letter] || {bg:"#888",fg:"white"};
    var btn = document.createElement("button");
    btn.className = "cat-btn";
    btn.style.borderColor = c.bg;
    btn.style.backgroundColor = (selCat && selCat.letter === cat.letter) ? c.bg : "";
    btn.style.color = (selCat && selCat.letter === cat.letter) ? c.fg : c.bg;
    btn.innerHTML = "<span style=\"font-size:13px;font-weight:700\">" + esc(cat.name) + "</span>";
    btn.onclick = function() { pickCat(cat); };
    g.appendChild(btn);
  });
}

function pickCat(cat) {
  selCat = cat; selTask = null; selSub = null;
  buildCatGrid(); buildTaskBtns(); buildSubBtns();
}

function buildTaskBtns() {
  var el = document.getElementById("taskBtns");
  el.innerHTML = "";
  if (!selCat) { el.innerHTML = '<span class="hint">בחר קטגוריה...</span>'; return; }
  selCat.tasks.forEach(function(t) {
    var b = document.createElement("button");
    b.className = "qbtn" + (selTask === t ? " active" : "");
    b.textContent = t;
    b.onclick = function() { pickTask(t); };
    el.appendChild(b);
  });
}

function pickTask(t) {
  selTask = t; selSub = null;
  // אפקט הבזק למובייל: הדגשה קצרה ואז שחרור
  if (event && event.currentTarget) {
    var btn = event.currentTarget;
    btn.classList.add("tapped");
    setTimeout(function(){ btn.classList.remove("tapped"); }, 600);
  }
  document.getElementById("taskInput").value = t;
  buildTaskBtns(); buildSubBtns();
}

function buildSubBtns() {
  var el = document.getElementById("subBtns");
  el.innerHTML = "";
  var ci = selCat ? CATS.indexOf(selCat) : -1;
  var subs = (selTask && ci >= 0) ? (SUBS[subKey(ci, selTask)] || SUBS[selTask] || []) : [];
  if (!subs.length) {
    el.innerHTML = '<span class="hint">' + (selTask ? "אין תת-משימות" : "בחר משימה...") + '</span>';
    return;
  }
  subs.forEach(function(s) {
    var b = document.createElement("button");
    b.className = "qbtn" + (selSub === s ? " active" : "");
    b.textContent = s;
    b.onclick = function() { pickSub(s); };
    el.appendChild(b);
  });
}

function pickSub(s) {
  selSub = s;
  if (event && event.currentTarget) {
    var btn = event.currentTarget;
    btn.classList.add("tapped");
    setTimeout(function(){ btn.classList.remove("tapped"); }, 600);
  }
  document.getElementById("subInput").value = s;
  buildSubBtns();
}


// ארכוב אוטומטי — נקרא אחרי כל addEntry / deleteEntry
/* ══════════════════════════════════════════════════════════════════════════
   בניית סנאפשוט ארכיון — מסלול אחד לידני ולאוטומטי (סבב 31)
   ══════════════════════════════════════════════════════════════════════════
   ⭐ עד סבב 31 היו כאן **שני** מסלולי יצירה עם שדות שונים: `autoArchiveDay`
      (נקרא מהוספה/מחיקה/עריכה) מילא `hdate`, `gdate`, `day`, `date` ו-`name`,
      ואילו `checkDayChange` (מעבר יום) מילא `name` ו-`date` בלבד — בלי `gdate`,
      בלי `hdate` ובלי `day`. זה שורש שתי תקלות שנמדדו:
      • הסנאפשוט נפל לדלי «לא ידוע» בארכיון, כי אין ממה לגזור חודש ושנה.
      • `archiveKey` נפל ל-`i:<id>` במקום ל-`g:<gdate>`, ולכן אותו יום הופיע
        כשתי שורות מתחרות בענן (נמדד ברמת אביב: «11 אוגוסט 2026»).

   ⛔ אין להחזיר מסלול יצירה שני (סבב 31) — רשומה אוטומטית חייבת להיות זהה
      בשדותיה לרשומה ידנית, ושדה שנשאר ריק בשקט הוא בדיוק מה שייצר את
      «לא ידוע». `tools/test_archive.mjs` נכשל על כל שדה שחסר.
   ⚠️ `arcPutSnapshot` **אינה** כותבת לענן — הקורא מחליט. זה מכוון:
      `checkDayChange` חייבת להישאר מקומית (ר' ההערה שם).
   ══════════════════════════════════════════════════════════════════════════ */
function arcPutSnapshot(dayKey, hdate, gdate, dayEntries, ts, extra) {
  if (!gdate) return null;   // בלי תאריך אין סנאפשוט — אחרת נוצר סנאפשוט זבל עם gdate ריק
  var existIdx = ARCHIVE.findIndex(function(a){ return a.gdate === gdate && isLive(a); });
  var exist = existIdx >= 0 ? ARCHIVE[existIdx] : null;
  // מיזוג ולא החלפה: הסנאפשוט הקיים הוא הצד ה"מרוחק" (מנצח בשוויון), הרשומות
  // החיות הן הצד המקומי. כך רשומה שכבר אורכבה לא נמחקת מהארכיון רק
  // מפני שהעותק החי שלה הפך ל-tombstone, אבל מחיקה אמיתית (updatedAt חדש יותר)
  // כן עוברת.
  var mergedEntries = mergeRecords(
    JSON.parse(JSON.stringify(dayEntries)),
    exist ? (exist.entries || []) : [],
    entryKey
  );
  var snapshot = {
    id: exist ? exist.id : ts,
    name: hdate || (exist ? exist.name : "") || "",
    hdate: hdate || (exist ? exist.hdate : "") || "",
    gdate: gdate,
    day: dayKey || (exist ? exist.day : "") || "",
    date: gdate,
    entries: mergedEntries,
    count: liveOnly(mergedEntries).length,
    updatedAt: ts
  };
  if (extra) Object.keys(extra).forEach(function(k){ snapshot[k] = extra[k]; });
  if (exist) ARCHIVE[existIdx] = snapshot; else ARCHIVE.unshift(snapshot);
  return snapshot;
}

function autoArchiveDay(dayKey, hdate, gdate) {
  // סינון לפי gdate (מחרוזת תאריך ייחודית) ⛔ ולא לפי שם היום (נרשם בסבב 67) —
  // שמות הימים חוזרים בכל שבוע, ורשומות מתאריכים שונים היו ממוזגות תחת היום הנוכחי.
  if (!gdate) return;
  // כולל tombstones — כך שמחיקה מהיומן מגיעה גם לסנאפשוט של אותו יום
  var dayEntries = ENTRIES.filter(function(e){ return e.gdate === gdate; });
  if (!dayEntries.length) return;
  if (arcPutSnapshot(dayKey, hdate, gdate, dayEntries, Date.now(), null)) saveArchive();
}

// הוספת רשומה
function addEntry() {
  var task = document.getElementById("taskInput").value.trim() || selTask || "";
  var sub  = document.getElementById("subInput").value.trim() || selSub || "";
  var notes = document.getElementById("notesInput").value.trim();
  var count = document.getElementById("countInput").value.trim();
  var hdate = document.getElementById("hebDateInput").value.trim();
  if (!selCat) { toast("⚠️ יש לבחור קטגוריה"); return; }
  if (!task)   { toast("⚠️ יש להזין משימה"); return; }
  var now = new Date();
  var entry = {
    // ⭐ סבב 38 — מזהה שנוצר במכשיר דרך המודול המשותף (שורת מזהי הרשומות במטריצה).
    //    עד כאן היה `now.getTime()`: שני מכשירים שהוסיפו רשומה באותה
    //    מילישנייה קיבלו **אותו מזהה**, והמיזוג ראה בהם רשומה אחת.
    id: newClientId(),
    // ⛔ `createdAt` נפרד מהמזהה (סבב 38) — הסדר היה נגזר מה-`id`, ו-uuid
    //    אינו ניתן להשוואה מספרית. ר' `entryOrderTs`.
    createdAt: now.getTime(),
    day: selDay, hdate: hdate, gdate: document.getElementById("gregDateInput").value.trim(),
    cat: selCat.letter, catName: selCat.name,
    task: task, sub: sub, notes: notes, count: count,
    updatedAt: now.getTime()   // חובה — בלעדיה הרשומה נחשבת "ותיקה" במיזוג
    // השעה הוסרה
  };
  ENTRIES.unshift(entry);
  // ⚠️ הרשומה נשמרה במכשיר בלבד — סימון ⏳ יורד רק כש-`sbSet` תחזיר `ok`.
  pendMark(PK_ENTRY + entry.id);
  saveEntries();
  autoArchiveDay(entry.day, entry.hdate, entry.gdate);
  clearForm();
  // השמירה המקומית הושלמה בנקודה זו; דחיפת הענן עוד לא התחילה —
  // scheduleSyncPush() מדווחת על התוצאה האמיתית כשהיא מסתיימת.
  toast("✅ נוסף — שומר בענן…");
  scheduleSyncPush();
}

function clearForm() {
  document.getElementById("taskInput").value = "";
  document.getElementById("subInput").value = "";
  document.getElementById("notesInput").value = "";
  document.getElementById("countInput").value = "";
  selTask = null; selSub = null;
  buildTaskBtns(); buildSubBtns();
}

// יומן
function renderLog() {
  var list = document.getElementById("logList");
  var cnt  = document.getElementById("logCount");
  // מציג רק רשומות של התאריך הנבחר
  var curKey = getCurrentDateKey();
  var filtered = liveOnly(ENTRIES).filter(function(e){ return e.gdate === curKey; });
  cnt.textContent = filtered.length;
  if (!filtered.length) {
    list.innerHTML = '<div class="empty">📋<br>אין רשומות לתאריך זה</div>';
    return;
  }
  filtered = tbSortEntries(filtered);
  list.innerHTML = filtered.map(function(e) {
    var c = CAT_COLORS[e.cat] || {bg:"#888",fg:"white"};
    var dateStr = [e.day, e.hdate, e.gdate ? "("+e.gdate+")" : ""].filter(Boolean).join("  ");
    return '<div class="entry-row" style="border-right:4px solid ' + c.bg + '">'
      + '<div class="entry-badge" style="background:' + c.bg + '"></div>'
      + '<div class="entry-body">'
      + '<div class="e-main">' + esc(e.catName) + ' &larr; ' + esc(e.task) + (e.sub ? " &rarr; " + esc(e.sub) : "") + pendTag(PK_ENTRY + e.id) + '</div>'
      + (e.notes ? '<div class="e-sub">' + esc(e.notes) + '</div>' : '')
      + '<div class="e-meta">' + [dateStr, e.count ? "כמות: "+esc(e.count) : "", ].filter(Boolean).join(" | ") + '</div>'
      + '</div>'
      + '<button class="edit-btn" data-act="entry-edit" data-id="' + esc(e.id) + '" style="background:none;border:none;cursor:pointer;font-size:13px;padding:2px 4px;">✏️</button>'
      + '<button class="del-btn" data-act="entry-del" data-id="' + esc(e.id) + '">✕</button>'
      + '</div>';
  }).join("");
}

function delEntry(id) {
  // tombstone במקום הסרה פיזית: הסרה פיזית נראית למכשיר אחר כ"רשומה שאני לא
  // מכיר" — הוא היה מחזיר אותה לחיים בסנכרון הבא.
  var deleted = ENTRIES.find(function(e){ return idEq(e.id, id) && isLive(e); });
  if (!deleted) return;
  recDelete(deleted);
  pendMark(PK_ENTRY + deleted.id);   // מחיקה היא כתיבה — ממתינה לאישור
  saveEntries();
  autoArchiveDay(deleted.day, deleted.hdate, deleted.gdate);
  renderLog();
  scheduleSyncPush();
}

function clearAll() {
  showConfirm("🗑 מחיקת כל הרשומות", "האם למחוק את כל רשומות היום הנוכחי?", function() {
    var curKey = getCurrentDateKey();
    var ts = Date.now();
    var sample = ENTRIES.find(function(e){ return e.gdate === curKey; });
    ENTRIES.forEach(function(e){ if (e.gdate === curKey && isLive(e)) recDelete(e, ts); });
    saveEntries(); renderLog();
    // מעבירים את ה-tombstones גם לסנאפשוט של אותו יום, אחרת הארכיון ימשיך להציג אותן
    if (sample) autoArchiveDay(sample.day, sample.hdate, curKey);
    toast("✅ הרשומות נמחקו");
    scheduleSyncPush();
  });
}
/* ── LS_TOAST — הדבר היחיד שנבדל בין האפליקציות ─────────────────────────── */
/*  ⛔ החתימה `toast(msg, dur, kind)` זהה בארבעתן (סבב 87) — ⚠️ ומה שנשאר
 *  נבדל הוא **שם המחלקה** בלבד: ⭐ המשך הוא ערך משותף שיושב בבלוק, ⛔ ולכן
 *  גוף `lsToast` זהה בית-לבית בארבעתן. */
var LS_TOAST = { kind: '' };
/* ═══ שכבת המודאל — מודול משותף (סבב 86) ══════════════════════════════════
   ⛔ שכבת המודאל ושלושת העוזרים ישבו **מחוץ** לכל בלוק חתום ⛔ ונסחפו:
      ⚠️ `esc` לשלוש צורות — והיא הגנת ה-HTML היחידה שיש; `openModal` לשלוש,
      ⛔ ובאחת מהן נעדרה נעילת הגלילה לגמרי; ו-`lsToast` לשתיים.
   ⛔ שינוי כאן — ארבע האפליקציות **וארבעת עותקי השער**, באותו סבב: ⚠️ אחרת
      החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ⛔ מיכל אחד ומסלול סגירה יחיד — ⚠️ מסלול נפרד לכל דיאלוג הוא בדיוק מה
      שנשבר בשקט; ⭐ והכותרת ב-`textContent` ⛔ ולא ב-HTML, מפני שהיא מגיעה
      גם משם שהמשתמש הקליד. ⛔ וגוף `ask` ב-`textContent` אף הוא — ⚠️ דיאלוג
      שדורש HTML עובר ב-`openModal`.
   ⛔ ו-`locked` על ה-`body` אינה קישוט — ⚠️ בלעדיה הדף שמאחורי המודאל נגלל
      מתחתיו, ⭐ והמשתמש מאבד את מקומו ברשימה שממנה פתח אותו; ⛔ וההסרה
      מותנית בכך שהדיאלוג השני סגור — ⚠️ אחרת סגירת אחד משחררת את השני.
   ⚠️ `askResolve` יחיד — ⛔ אין תמיכה בשני דיאלוגי אישור פתוחים בו-זמנית,
      וגם אין בכך צורך: `#ask` הוא אלמנט יחיד ב-DOM.
   ═══════════════════════════════════════════════════════════════════════ */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
/*  ⛔ מיכל שאינו ב-DOM ⟵ **זעקה**, ⛔ ולא יציאה בשקט — ⚠️ הנימוק המדוד:
 *  המיכל ישב באחת מהן **בתוך מסך אחד מתוך שבעה** ⛔ ונמחק יחד איתו,
 *  ⭐ ו-`openModal` יצאה ב-`return` בלי שגיאה ובלי הודעה: ⛔ הכפתור «לא
 *  עשה כלום», ⚠️ ושלושה סבבים חיפשו בדלגציה ובמטפל. ⛔ ו-`locked` מוסרת
 *  גם במסלול הכשל — ⚠️ מחלקה ששרדה פתיחה קודמת חוסמת את גלילת הדף,
 *  ⭐ והמשתמש קורא לזה «המסך איטי» ⛔ ולא «המודאל תקוע». */
function uiNoDialog(where, id) {
  try { console.error('[ui] ' + where + ': #' + id + ' אינו ב-DOM'); } catch (e) {}
  try { document.body.classList.remove('locked'); } catch (e) {}
  try { toast('שגיאה: הדיאלוג אינו זמין (#' + id + ')', null, 'bad'); } catch (e) {}
}
function openModal(title, body, foot) {
  var m = document.getElementById('modal');
  var ttl = document.getElementById('modal-title');
  var bd = document.getElementById('modal-body');
  var ft = document.getElementById('modal-foot');
  if (!m || !ttl || !bd || !ft) { uiNoDialog('openModal', 'modal'); return; }
  ttl.textContent = title || '';
  bd.innerHTML = body || '';
  ft.innerHTML = foot || '';
  m.classList.add('open');
  document.body.classList.add('locked');
}
function closeModal() {
  var m = document.getElementById('modal');
  if (!m) { uiNoDialog('closeModal', 'modal'); return; }
  m.classList.remove('open');
  var bd = document.getElementById('modal-body');
  var ft = document.getElementById('modal-foot');
  if (bd) bd.innerHTML = '';
  if (ft) ft.innerHTML = '';
  var a = document.getElementById('ask');
  if (!a || !a.classList.contains('open')) document.body.classList.remove('locked');
}
var askResolve = null;
/*  ⛔ דיאלוג אישור שמיכלו חסר נענה **«לא»** — ⚠️ הבטחה שלא נפתרת משאירה
 *  את הקורא תלוי לנצח, ⭐ ו-`true` היה מבצע את הפעולה ההרסנית בלי שאיש
 *  אישר: ⛔ נכשל-סגור, ⛔ ובקול. */
function ask(title, text, yesLabel) {
  var a = document.getElementById('ask');
  var ttl = document.getElementById('ask-title');
  var bd = document.getElementById('ask-body');
  var yes = document.getElementById('ask-yes');
  if (!a || !ttl || !bd || !yes) { uiNoDialog('ask', 'ask'); return Promise.resolve(false); }
  ttl.textContent = title || '';
  bd.textContent = text || '';
  yes.textContent = yesLabel || 'אישור';
  a.classList.add('open');
  document.body.classList.add('locked');
  return new Promise(function (res) { askResolve = res; });
}
function closeAsk(v) {
  var a = document.getElementById('ask');
  if (!a) uiNoDialog('closeAsk', 'ask');
  else a.classList.remove('open');
  var m = document.getElementById('modal');
  if (!m || !m.classList.contains('open')) document.body.classList.remove('locked');
  if (askResolve) { askResolve(v); askResolve = null; }
}
/*  ⛔ `div` לכל הודעה, ⛔ ולא אלמנט קבוע אחד — ⚠️ הנימוק המדוד: בשלוש
 *  מהן הטוסט היה אלמנט יחיד, ⭐ והודעה שנייה דרסה את הראשונה: ⛔ «נשמר»
 *  ו«שגיאת רשת» ברצף השאירו על המסך אחת בלבד, ⚠️ ומי שקרא את המסך לא ידע
 *  שהייתה שנייה. ⛔ `kind` הוא שם מחלקה ⛔ ולא משך — ⚠️ ומי שאין לו ערך
 *  מוסר `null`; ⭐ והמשך יושב ב-`TOAST_DEFAULT_MS`, ⛔ הערך היחיד שנבדל. */
function toast(msg, dur, kind) {
  // שער סבב 11 — אין טוסט הצלחה אחרי כישלון שמירה מקומית. אין להסיר.
  if (typeof lsGuardToast === 'function' && !lsGuardToast(msg)) return;
  var box = document.getElementById('toasts');
  /*  ⛔ מיכל הטוסטים חסר ⟵ קונסולה, ⛔ ולא שתיקה — ⚠️ זהו משפך ההודעות
   *  היחיד, ⭐ ובלעדיו **כל** הודעה שהאפליקציה מנסה להציג נעלמת: ⛔ דיווח
   *  דרך טוסט היה חוזר לכאן, ⚠️ ולכן הוא בקונסולה בלבד. */
  if (!box) { try { console.error('[ui] toast: #toasts אינו ב-DOM — ' + msg); } catch (e) {} return; }
  var el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(function () {
    el.style.transition = 'opacity .25s'; el.style.opacity = '0';
    setTimeout(function () { el.remove(); }, 260);
  }, dur || TOAST_DEFAULT_MS);
}
/*  ⛔ משך הודעת האחסון ⛔ ואינו ברירת המחדל של הטוסט — ⚠️ היא מדווחת על
   כשל כתיבה, ⭐ והקורא חייב זמן לקרוא אותה. */
var LS_TOAST_MS = 5000;
function lsToast(msg, dur) { try { toast(msg, dur || LS_TOAST_MS, LS_TOAST.kind); } catch (e) {} }
/* ═══════════════ סוף מודול שכבת המודאל ═════════════════════════════════ */
/*  ⛔ מסלול סגירה אחד לשלושת הדרכים (סבב 68) — כפתור, לחיצה על הרקע
 *  ו-`Escape`; ⚠️ מסלול נפרד לכל אחת הוא בדיוק מה שנשבר בשקט. */
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  var a = document.getElementById('ask'), m = document.getElementById('modal');
  if (a && a.classList.contains('open')) closeAsk(false);
  else if (m && m.classList.contains('open')) closeModal();
});
document.addEventListener('click', function (e) {
  if (e.target && e.target.id === 'modal') closeModal();
  if (e.target && e.target.id === 'ask') closeAsk(false);
});

/*  ⚠️ `showConfirm` נשארת כשם הקורא ⛔ ואינה מסלול שני (סבב 68) — היא
 *  מעטפת דקה מעל `ask`, שהיא המימוש היחיד. */
function showConfirm(title, msg, onOk) {
  ask(title, msg, 'מחק').then(function (yes) { if (yes) onOk(); });
}

// שם המוסד הפעיל — מקור אמת יחיד לכל הפלטים (PDF / דוח תמונה / סיגנל).
// קודם היה מקודד קשיח "ראשון לציון", כך שרמת אביב הוציאה דוחות בשם
// הישיבה השנייה.
function instName() {
  var el = document.getElementById("instNameInput");
  var v = el && el.value ? el.value.trim() : '';
  if (v) return v;
  return (YESHIVA === 'ramataviv')
    ? 'ישיבת תומכי תמימים ליובאוויטש רמת אביב'
    : 'ישיבת תומכי תמימים ליובאוויטש ראשון לציון';
}


// ייצוא PDF
/* ══════════════════════════════════════════════════════════════════════════
   פלטים — PDF ותמונת הדוח
   ══════════════════════════════════════════════════════════════════════════ */
/*  ⛔ **הייצוא מצלם את הדוח ⛔ ואינו בונה HTML חדש** — ⚠️ המסלול הזה בנה
 *  מסמך שני עם צבעים משלו (`#333` · `#ffffff` · `#f0f0f0` · `#ddd`),
 *  ⭐ ואיבד את צבעי הקטגוריות שהמסך מראה: ⛔ שני מקורות לאותו דוח הם
 *  שתי הזדמנויות שאחד מהם ייסחף. */
function exportPDF() {
  var live = liveOnly(ENTRIES);
  if (!live.length) { toast("אין רשומות"); return; }
  /*  ⛔ הכותרת נגזרת **לפני** הרינדור הא-סינכרוני — ⚠️ מסלול הארכיון מחליף
   *  את `ENTRIES` ואת שדה התאריך ומשחזר אותם מיד אחרי הקריאה, ⭐ והרינדור
   *  מסתיים אחרי השחזור: ⛔ קריאה מאוחרת הייתה מקבלת את תאריך היום. */
  var today = document.getElementById("hebDateInput").value || hebrewDate(new Date());
  var todayGreg = document.getElementById("gregDateInput").value || gregDateStr(new Date());
  var fileTitle = "יומן עבודה " + today + " " + todayGreg;
  toast("מכין PDF...");
  _buildReportDiv(function (div) {
    _renderReport(div).then(function (canvas) {
      div.style.left = '-9999px';
      _printCanvas(canvas, fileTitle);
    }).catch(function (e) { _reportError(div, e); });
  }, live);
}
/*  ⛔ מעטפת הדפסה לצילום ⛔ ואינה מסמך הדוח — ⚠️ אין בה טבלה, כותרת או
 *  צבע: ⭐ כל מה שנראה בדף הוא הפיקסלים שנמדדו, ⛔ ולכן אין מה שייסחף. */
function _printCanvas(canvas, title) {
  var w = null;
  try { w = window.open("", "_blank", "width=900,height=700"); } catch (e) { w = null; }
  // חוסם חלונות קופצים מחזיר null — בלי הבדיקה הפונקציה נפלה בשקט
  // ("w is null") והמשתמש לא ידע למה לא קרה כלום.
  if (!w || !w.document) {
    toast("⚠️ החלון נחסם — אפשר חלונות קופצים לאתר ונסה שוב");
    return;
  }
  w.document.write('<!DOCTYPE html><html dir="rtl" lang="he"><head><meta charset="UTF-8">'
    + '<title>' + esc(title) + '</title><style>@page{size:A4 portrait;margin:10mm}'
    + 'html,body{margin:0;padding:0;background:#fff}img{width:100%;height:auto;display:block}'
    + '</style></head><body><img alt="' + esc(title) + '" src="' + canvas.toDataURL('image/png') + '">'
    + '<' + 'script>window.onload=function(){setTimeout(function(){window.print();},500);}<\/script>'
    + '</body></html>');
  w.document.close();
  setTimeout(function () { try { w.document.title = title; } catch (e) {} }, 80);
  toast("📄 PDF נפתח!");
}

// ── רשת ביטחון לרינדור הדוח ──
// ‎#_rpDiv הוא פאנל לבן position:fixed שמוצג **לפני** הרינדור.
// אם הרינדור זורק (אופליין ⇐ html2canvas לא נטען ⇐ ReferenceError, או כשל
// canvas/CORS), הפאנל היה נשאר מעל האפליקציה עד רענון.
function _hideReportDiv(div){
  try { if (div) div.style.left = '-9999px'; } catch(e) {}
}
function _reportError(div, e){
  _hideReportDiv(div);
  console.error('[report] rendering failed:', e);
  toast(
    (typeof html2canvas === 'undefined')
      ? "⚠️ יצירת התמונה לא זמינה — נדרש חיבור לאינטרנט פעם אחת"
      : "⚠️ יצירת התמונה נכשלה — נסה שוב"
  );
}
// מחזירה תמיד promise, ⛔ ולעולם אינה זורקת סינכרונית (נרשם בסבב 67) —
// זריקה סינכרונית כאן הייתה משאירה את פאנל הדוח על המסך עד רענון.
function _renderReport(div){
  if (typeof html2canvas !== 'function') {
    return Promise.reject(new Error('html2canvas not loaded'));
  }
  try {
    return Promise.resolve(
      html2canvas(div,{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false})
    );
  } catch(e) {
    return Promise.reject(e);
  }
}

/*  ⛔ `entries` אופציונלי ⛔ ואינו נקודת הפעלה שנייה — ⚠️ המשמיט מקבל את
 *  רשומות היום, ⭐ והייצוא מוסר את רשומות הארכיון: ⛔ סינון קשיח ליום
 *  הנוכחי היה מוציא דוח ריק לכל יום שאינו היום. */
function _buildReportDiv(cb, entries){
  var div=document.getElementById('_rpDiv');
  if(!div){div=document.createElement('div');div.id='_rpDiv';document.body.appendChild(div);}
  div.style.cssText='position:fixed;top:0;left:0;background:#fff;padding:20px;width:900px;direction:rtl;font-family:Heebo,Arial,sans-serif;z-index:9999;';
  var today=document.getElementById("hebDateInput")?document.getElementById("hebDateInput").value:hebrewDate(new Date());
  var todayGreg=document.getElementById("gregDateInput")?document.getElementById("gregDateInput").value:gregDateStr(new Date());
  var dayLabel=document.getElementById("dayNameEl")?document.getElementById("dayNameEl").textContent:'';
  var instTitle=instName();
  var logoEl=document.getElementById('appLogo')||document.querySelector('.hdr-logo');
  var logoUrl=logoEl?logoEl.src:'';
  var curKey = getCurrentDateKey();
  var src = Array.isArray(entries) ? entries
          : liveOnly(ENTRIES).filter(function(e){ return e.gdate === curKey; });
  var sortedPDF = tbSortEntries(src);
  var byCAT={};sortedPDF.forEach(function(e){if(!byCAT[e.cat])byCAT[e.cat]={name:e.catName||e.cat,list:[]};byCAT[e.cat].list.push(e);});
  var catLetters=CATS.map(function(c){return c.letter;}).filter(function(l){return !!byCAT[l];});
  var rows='';
  var globalTaskIdx = 0;
  catLetters.forEach(function(letter){
    var data=byCAT[letter];
    var c=(typeof CAT_COLORS!=='undefined'&&CAT_COLORS[letter])||{bg:'#555',fg:'white'};
    var tgs=[];data.list.forEach(function(e){var last=tgs[tgs.length-1];if(last&&last.task===(e.task||''))last.items.push(e);else tgs.push({task:e.task||'',items:[e]});});
    var cri=0;
    tgs.forEach(function(tg,ti){
      var bg=(globalTaskIdx%2===0)?'#fff':'#f0f0f0'; globalTaskIdx++;
      tg.items.forEach(function(e,ii){
        rows+='<tr>';
        if(cri===0)rows+='<td rowspan="'+data.list.length+'" style="background:'+c.bg+';color:'+c.fg+';font-weight:900;font-size:14px;text-align:center;vertical-align:middle;border:1px solid #ddd;padding:8px;min-width:65px">'+data.name+'</td>';
        if(ii===0)rows+='<td rowspan="'+tg.items.length+'" style="padding:6px 10px;border:1px solid #ddd;font-size:12px;font-weight:600;vertical-align:middle;background:'+bg+';">'+tg.task+'</td>';
        rows+='<td style="padding:6px 10px;border:1px solid #ddd;font-size:11px;background:'+bg+';">'+esc(e.sub||'')+'</td>';
        rows+='<td style="padding:6px 10px;border:1px solid #ddd;font-size:11px;text-align:center;background:'+bg+';">'+esc(e.count||'')+'</td>';
        rows+='<td style="padding:6px 10px;border:1px solid #ddd;font-size:11px;background:'+bg+';">'+esc(e.notes||'')+'</td>';
        rows+='</tr>';cri++;
      });
    });
  });
  var li=logoUrl?'<img src="'+logoUrl+'" style="width:50px;height:50px;object-fit:contain;border-radius:4px;">':'';
  div.innerHTML='<div style="display:flex;align-items:center;gap:14px;border-bottom:3px solid #1A2B5E;padding-bottom:12px;margin-bottom:14px;">'+li
    +'<div style="flex:1;text-align:center;"><div style="font-size:10px;color:#999;letter-spacing:2px;">ב"ה | ימות המשיח</div>'
    +'<div style="font-size:26px;font-weight:900;color:#1A2B5E;">יומן עבודה</div>'
    +'<div style="font-size:11px;color:#555;">'+instTitle+'</div></div>'
    +'<div style="text-align:left;min-width:80px;"><div style="font-size:13px;font-weight:700;color:#1A2B5E;">'+dayLabel+'</div>'
    +'<div style="font-size:11px;color:#444;">'+today+'</div><div style="font-size:10px;color:#888;">'+todayGreg+'</div></div></div>'
    +'<table style="width:100%;border-collapse:collapse;font-family:Heebo,Arial,sans-serif;"><thead><tr style="background:#1A2B5E;color:white;">'
    +'<th style="padding:9px 10px;text-align:right;font-size:12px;">קטגוריה</th>'
    +'<th style="padding:9px 10px;text-align:right;font-size:12px;">משימה</th>'
    +'<th style="padding:9px 10px;text-align:right;font-size:12px;">תת-משימה</th>'
    +'<th style="padding:9px 10px;text-align:center;font-size:12px;">כמות</th>'
    +'<th style="padding:9px 10px;text-align:right;font-size:12px;">הרחבה</th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table>';
    // סה״כ = בדיוק השורות שבטבלה (רשומות היום הנבחר). קודם נספרו כל ENTRIES,
    // כך שהדוח שנשלח להנהלה הציג סיכום שלא תאם את השורות שבו.
    div.innerHTML += '<div style="margin-top:14px;text-align:center;font-size:10px;color:#999;border-top:1px solid #eee;padding-top:10px;font-family:Heebo,Arial,sans-serif;">' + 'יחי אדוננו מורנו ורבינו מלך המשיח לעולם ועד! | סה״כ ' + sortedPDF.length + ' רשומות</div>';
  div.style.left='0';cb(div);
}


/* ══════════════════════════════════════════════════════════════════════════
   שיתוף — סיגנל והגשר המקורי של המעטפת
   ══════════════════════════════════════════════════════════════════════════ */
// דחיפה מושהית לענן אחרי כל שינוי במסך
var _syncPushTimer = null;
// ⭐ גוף הדחיפה, בלי ההשהיה (סבב 44) — חולץ כדי שמודול הניסיון
//    החוזר יקרא לאותה דחיפה בדיוק. ⛔ אין לשכפל את הגוף הזה
//    למסלול שני (סבב 44) — שתי דחיפות שונות לאותם נתונים הן שתי
//    הזדמנויות שאחת מהן תיסחף.
async function tbSyncPushNow() {
    // ⚠️ t0 לפני שהצילום נקרא — רשומה שתסומן אחרי הרגע הזה אינה במה שנדחף
    //    עכשיו, והורדת הסימון ממנה הייתה מאבדת אותה בשקט (סבב 12).
    var _t0 = Date.now();
    /*  ⛔ ההקשר נלכד בכניסה (סבב 88) — ⚠️ המסלול הזה נקרא גם מהתקתוק
     *  המושהה וגם ממודול הניסיון החוזר, ⭐ ושניהם יכולים להתעורר בדיוק
     *  בזמן ההחלפה. */
    var _ep = ysTenantEpoch();
    // ⭐ מסבב 35 הדחיפה כאן היא שורות (סבב 35) — קודם המסלול הזה דחף את
    //    בלוקי ה-kv בלבד, אסימטריה מול saveEntries/saveArchive שנסגרה
    //    יחד עם כיבוי הכתיבה הכפולה.
    var rEntries = await tbRowsPush("tb_entries", ENTRIES);
    if (ysTenantStale(_ep)) return;
    var rArchive = await tbRowsPush("tb_archive", ARCHIVE);
    if (ysTenantStale(_ep)) return;
    if (TB_KV_LEGACY_WRITE) { await sbSet("tb_entries", ENTRIES); await sbSet("tb_archive", ARCHIVE); }
    if (ysTenantStale(_ep)) return;
    // ⛔ אישור ה-⏳ פר-קטגוריה, כאן ולא רק ב-saveEntries/saveArchive (סבב 52) —
    //    זהו מסלול הריקון האוטומטי (מודול הניסיון החוזר, אירוע `online`,
    //    ו-`scheduleSyncPush`), ובלי האישור הסימון שרד דחיפה שהצליחה: המונה
    //    נשאר על המסך עד שפעולה חדשה גררה אותו, `_rtyPending()` נשאר אמת,
    //    והניסיון החוזר הצליח שוב ושוב — ועם כל הצלחה חזר «✅ נשמר בענן».
    //    ⚠️ פר-קטגוריה ולא גורף: דחיפה שהצליחה באחת אינה ראיה לשנייה.
    if (rEntries.ok) { _tbMarkPushed('tb_entries'); pendConfirmPush(PK_ENTRY, _t0); }
    if (rArchive.ok) { _tbMarkPushed('tb_archive'); pendConfirmPush(PK_ARC, _t0); }
    if (!rEntries.ok || !rArchive.ok) {
      // ⛔ אין לחתום tb_last_changed על נתון שלא הגיע (נרשם בסבב 67) —
      // מכשירים אחרים היו מושכים את העותק הענני הישן מעל רשומות חדשות שלהם.
      toast("⚠️ נשמר במכשיר בלבד — הענן לא עודכן");
      return;
    }
    // Write timestamp AFTER data is saved — so other devices always get fresh data
    // ⭐ סבב 51 — דרך `PL_CFG.stamp` ולא ב-`sbSet` ישיר: זו אותה כתיבה
    //    בדיוק, ⛔ ומסלול שני לחותמת (סבב 51) היה יוצא מסנכרון מול
    //    המודול ביום שבו מקום האחסון שלה ישתנה. כאן, בשונה מ-`plTouch()`,
    //    הקורא זקוק לתוצאה עצמה כדי להזהיר את המשתמש.
    var stampTs = Date.now();
    var rTs = await PL_CFG.stamp(stampTs);
    if (ysTenantStale(_ep)) return;
    if (!rTs.ok) { toast("⚠️ נשמר בענן, אך מכשירים אחרים לא יעודכנו כעת"); return; }
    PL_CFG.note(stampTs);
    toast("✅ נשמר בענן");
}
function scheduleSyncPush() {
  if (_syncPushTimer) clearTimeout(_syncPushTimer);
  // ⚠️ משפך הכתיבה המקומית היחיד כאן, ולכן זו נקודת הדריכה
  //    היחידה של מודול הניסיון החוזר (סבב 44).
  rtyNote();
  _syncPushTimer = setTimeout(tbSyncPushNow, 500);
}

// Native share bridge: in the WebView APK the shell decodes the image to a cache file
// (FileProvider) and fires ACTION_SEND through the system share sheet.
// Returns true if the native bridge handled it; false in a plain browser (use Web Share / fallback).
//
// ⛔ אין כאן פרמטר יעד (סבב 60) — הבורר של המערכת הוא שבוחר, ⛔ ונעילה על
//    יעד אחד מסירה מהמשתמש את הבחירה שהמערכת נותנת בחינם.
// ⚠️ הגשר הוא חוזה בין הדף ל-Java, ולכן החתימה ירדה בשני הצדדים
//    באותו קומיט; ⛔ הסרה בצד אחד בלבד שוברת את השיתוף.
//
// ⚠️ שני גשרים, ולא במקרה. מאז שהמעטפת טוענת את האתר **מהרשת** ולא מנכסים
// מוטבעים, גשר מקורי הוא הרשאה שניתנת לדף שמגיע מהרשת — ולכן הוא חייב להיות
// מוגבל לדומיין שלנו:
//   • `AndroidShareBridge.postMessage` — `WebViewCompat.addWebMessageListener`,
//     שבו **WebView עצמו** בודק את רשימת המקורות המותרים, פר-frame, לפני
//     שההודעה נמסרת. זה המסלול המועדף ולכן הוא נוסה ראשון.
//   • `AndroidShare.shareImage` — הגשר הישן (`addJavascriptInterface`), למכשירים
//     עם WebView ישן מ-88. שם ההגבלה נאכפת בצד הג'אווה: המעטפת מחברת אותו רק
//     כשהיא על הדומיין שלנו, ובכל קריאה מאמתת מחדש את מקור הדף.
// **אין להסיר את סדר הניסיון הזה** — נפילה-חזרה לגשר הישן כשהחדש קיים היא
// ויתור על האכיפה שהפלטפורמה נותנת בחינם.
function _androidShareImage(canvas){
  try {
    var br = window.AndroidShareBridge;
    if (br && typeof br.postMessage === 'function') {
      br.postMessage(JSON.stringify({
        data: canvas.toDataURL('image/jpeg',0.95).split(',')[1],
        mime: 'image/jpeg'
      }));
      return true;
    }
    if (window.AndroidShare && typeof window.AndroidShare.shareImage === 'function') {
      var b64 = canvas.toDataURL('image/jpeg',0.95).split(',')[1];
      window.AndroidShare.shareImage(b64, 'image/jpeg');
      return true;
    }
  } catch(e) { /* נופל להתנהגות ברירת המחדל של הדפדפן */ }
  return false;
}

// ⛔ נפילה-חזרה של הורדה בלבד — בלי קישור-עומק ליעד ספציפי (סבב 58):
//    קישור כזה הוא מסלול שיתוף שני, מקביל לבורר של המערכת, שאיש אינו
//    קורא לו ואינו נבדק — והוא נשבר בשקט ביום שהיעד משנה סכימה.
function _shareDownloadFallback(canvas){
  var dataUrl = canvas.toDataURL('image/jpeg',0.95);
  var a=document.createElement('a');
  a.href=dataUrl;
  a.download='yoman.jpg';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
// הגדרות
var _dragKind = null; // "cat" | "task" | "sub" — סוג הגרירה
var _dragData = {};

/* ══════════════════════════════════════════════════════════════════════════
   מסך ההגדרות — קטגוריות, משימות ותתי-משימות (כולל גרירה)
   ══════════════════════════════════════════════════════════════════════════ */
// ── גרירת קטגוריה (מטופלת על set-card) ──
// (מחווטת ב-renderSettings דרך addEventListener)

// ── גרירת משימה ──
function taskDragStart(e, ci, ti) {
  _dragKind = "task";
  _dragData = {ci:ci, ti:ti};
  e.dataTransfer.setData("text/plain", "task");
  e.dataTransfer.effectAllowed = "move";
  e.stopPropagation();
  var el = e.currentTarget;
  requestAnimationFrame(function(){ el.classList.add("dragging"); });
}
function taskDragEnd(e) {
  _dragKind = null;
  e.currentTarget.classList.remove("dragging");
  document.querySelectorAll(".drag-over").forEach(function(el){ el.classList.remove("drag-over"); });
}
function taskDragOver(e) {
  if (_dragKind !== "task") return;
  e.preventDefault();
  e.stopPropagation();
  e.currentTarget.classList.add("drag-over");
}
function taskDragLeave(e) {
  e.currentTarget.classList.remove("drag-over");
}
function taskDrop(e, ci, ti) {
  e.preventDefault();
  e.stopPropagation();
  e.currentTarget.classList.remove("drag-over");
  if (_dragKind !== "task" || _dragData.ci !== ci || _dragData.ti === ti) return;
  var moved = CATS[ci].tasks.splice(_dragData.ti, 1)[0];
  CATS[ci].tasks.splice(ti, 0, moved);
  recTouch(CATS[ci]);   // סדר המשימות הוא חלק מרשומת הקטגוריה
  _dragKind = null;
  saveCats();
  renderSettings();
}

// ── גרירת תת-משימה ──
function subDragStart(e, ci, ti, si) {
  _dragKind = "sub";
  _dragData = {ci:ci, ti:ti, si:si};
  e.dataTransfer.setData("text/plain", "sub");
  e.dataTransfer.effectAllowed = "move";
  e.stopPropagation();
  var el = e.currentTarget;
  requestAnimationFrame(function(){ el.classList.add("dragging"); });
}
function subDragEnd(e) {
  _dragKind = null;
  e.currentTarget.classList.remove("dragging");
  document.querySelectorAll(".drag-over").forEach(function(el){ el.classList.remove("drag-over"); });
}
function subDragOver(e) {
  if (_dragKind !== "sub") return;
  e.preventDefault();
  e.stopPropagation();
  e.currentTarget.classList.add("drag-over");
}
function subDragLeave(e) {
  e.currentTarget.classList.remove("drag-over");
}
function subDrop(e, ci, ti, si) {
  e.preventDefault();
  e.stopPropagation();
  e.currentTarget.classList.remove("drag-over");
  if (_dragKind !== "sub" || _dragData.ci !== ci || _dragData.ti !== ti || _dragData.si === si) return;
  var taskName = CATS[ci].tasks[ti];
  var sk = subKey(ci, taskName);
  if (!SUBS[sk]) { SUBS[sk] = SUBS[taskName] || []; }
  var moved = SUBS[sk].splice(_dragData.si, 1)[0];
  SUBS[sk].splice(si, 0, moved);
  touchSubKey(sk);
  _dragKind = null;
  saveSubs();
  renderSettings();
}

function editSubInline(ci, ti, si, oldVal, taskName) {
  var lbl = document.getElementById("sub-lbl-"+ci+"-"+ti+"-"+si);
  if (!lbl) return;
  var inp = document.createElement("input");
  inp.value = oldVal;
  inp.style.cssText = "border:1px solid var(--primary);border-radius:6px;padding:2px 6px;font-family:Heebo;font-size:12px;width:90px;";
  lbl.replaceWith(inp);
  inp.focus();
  inp.select();
  function save() {
    var newVal = inp.value.trim();
    if (newVal && newVal !== oldVal) {
      var sk = subKey(ci, taskName);
      if (!SUBS[sk]) SUBS[sk] = SUBS[taskName] || [];
      SUBS[sk][si] = newVal;
      touchSubKey(sk);
      saveSubs();
    }
    renderSettings();
  }
  inp.onblur = save;
  inp.onkeydown = function(e){ if(e.key==="Enter") { inp.blur(); } if(e.key==="Escape") { inp.value=oldVal; inp.blur(); } };
}
function removeSub(ci, taskName, si) {
  var sk = subKey(ci, taskName);
  if (!SUBS[sk]) { if (!SUBS[taskName]) return; SUBS[sk] = SUBS[taskName]; }
  SUBS[sk].splice(si, 1);
  touchSubKey(sk);   // המחיקה מתועדת בחותמת של הרשימה — אחרת היא נעלמת במיזוג
  saveSubs();
  renderSettings();
}

function addSub(ci, ti) {
  var taskName = CATS[ci].tasks[ti];
  var inp = document.getElementById("snewsub-" + ci + "-" + ti);
  if (!inp) return;
  var val = inp.value.trim();
  if (!val) return;
  var sk = subKey(ci, taskName);
  if (!SUBS[sk]) SUBS[sk] = SUBS[taskName] ? [...SUBS[taskName]] : [];
  SUBS[sk].push(val);
  touchSubKey(sk);
  inp.value = "";
  saveSubs();
  renderSettings();
}

function editTaskInline(ci, ti) {
  var lbl = document.getElementById("task-lbl-"+ci+"-"+ti);
  if (!lbl) return;
  var oldVal = CATS[ci].tasks[ti];
  var inp = document.createElement("input");
  inp.value = oldVal;
  inp.style.cssText = "border:1px solid var(--primary);border-radius:6px;padding:2px 8px;font-family:Heebo;font-size:13px;width:120px;font-weight:600;";
  lbl.replaceWith(inp);
  inp.focus(); inp.select();
  function save() {
    var newVal = inp.value.trim();
    if (newVal && newVal !== oldVal) {
      // מהגר את SUBS — בודק גם את פורמט המפתח הישן (taskName) וגם את החדש (ci::taskName)
      var oldSk = subKey(ci, oldVal);   // המפתח הישן, בצורה "ci::שם"
      var newSk = subKey(ci, newVal);   // המפתח החדש, באותה צורה
      if (SUBS[oldSk]) {
        // מפתח בפורמט החדש קיים ⇐ מהגרים אותו
        SUBS[newSk] = SUBS[oldSk];
        delete SUBS[oldSk];
      } else if (SUBS[oldVal]) {
        // מפתח בפורמט הישן (שם המשימה בלבד) ⇐ מהגרים ומנקים
        SUBS[newSk] = SUBS[oldVal];
        delete SUBS[oldVal];
      }
      CATS[ci].tasks[ti] = newVal;
      recTouch(CATS[ci]); touchSubKey(newSk);
      saveCats(); saveSubs();
    }
    renderSettings(); buildCatGrid(); buildTaskBtns();
  }
  inp.onblur = save;
  inp.onkeydown = function(e){ if(e.key==="Enter") inp.blur(); if(e.key==="Escape"){ inp.value=oldVal; inp.blur(); } };
}

/* ⛔⛔ אזור ההגדרות — הערת הגנה משותפת לארבע האפליקציות (סבב 26)
   ⛔ **אין להוסיף שער סיסמה נפרד מעל מסך ההגדרות.** ההרשאה נגזרת
   מהמשתמש המחובר בלבד, ואין שכבה שנייה מעליה.

   **הרקע — וזו אינה זהירות תיאורטית.** ב-schar-limud היה שער כזה בדיוק
   (`admin_pass` ב-`sl_settings`) עד סבב 26, והוא הוסר משתי סיבות שכל
   אחת מהן מספיקה לבדה:
   1. הוא יצר **שכבת הרשאה כפולה** שלא הייתה קיימת באף אחת
      מהאחרות — מנגנון שני עם מסך משלו, מסלול שינוי משלו ותחזוקה
      משלו, לאותו אדם.
   2. **בהתקנה טרייה הוא נפל חזרה למחרוזת `'admin'`** — כלומר השער
      נפתח לכל מי שהקליד «admin». מה שעמד בין ההתקנה לשער
      הפתוח היה שורת זריעה בקובץ הסכימה; הגנה שתלויה בכך
      שמישהו הריץ קובץ אינה הגנה.

   ⛔ **ואין לזרוע ערך ברירת מחדל לסיסמה או לתפקיד בשום מקום** — לא
   בסכימה, לא במיגרציה, לא בקוד ולא בקובץ בדיקה. ברירת מחדל
   לסיסמה היא חשבון שסיסמתו ידועה לכל העולם (כלל ברזל 8, סעיף 7);
   ברירת מחדל לתפקיד היא הרשאה שניתנת למי שאיש לא החליט
   להעניק לו אותה. תפקיד נכתב **במפורש** ביצירת המשתמש.

   ⚠️ **הערה זו זהה בית-לבית בארבע האפליקציות** פרט לשורת «כאן:» שבסופה.
   לקח אבטחתי שנלמד באפליקציה אחת נרשם בארבעתן — גם כשהמנגנון עצמו
   רלוונטי רק לאחת (כלל ברזל 9). הערה שיושבת במקום אחד אינה
   מגינה על הארגון.

   כאן: `renderSettings` — ⚠️ **ליומן אין טבלת משתמשים, אין מסך כניסה
   ואין תפקידים כלל** — הכניסה היא בחירת מוסד, ולכן אין כאן הרשאה
   לגזור ואין סוד לשמור. ההערה נרשמת כדי שגם כאן לא יומצא שער
   בעתיד — שער סיסמה כאן היה **שכבה שלמה יש מאין**, לא יישור לאחיות.
   ═════════════════════════════════════════════════════════════════════ */
function renderSettings() {
  statusAreaMount();
  bkStatusMount();
  hwRestoreMount();
  var ed = document.getElementById("settingsEditor");
  ed.innerHTML = "";
  CATS.forEach(function(cat, ci) {
    if (!isLive(cat)) return;   // ci חייב להישאר האינדקס הגולמי — עליו בנויים מפתחות SUBS
    var c = CAT_COLORS[cat.letter] || {bg:"#888",fg:"white"};
    var div = document.createElement("div");
    div.className = "set-card";
    div.draggable = true;
    div.dataset.idx = ci;
    div.addEventListener("dragstart", function(e) {
      _dragKind = "cat";
      e.dataTransfer.setData("text/plain", ci);
      setTimeout(function(){ div.classList.add("dragging"); }, 0);
    });
    div.addEventListener("dragend", function() { _dragKind = null; div.classList.remove("dragging"); });
    div.addEventListener("dragover", function(e) { e.preventDefault(); });
    div.addEventListener("drop", function(e) {
      e.preventDefault();
      // מטפל רק בגרירת קטגוריה לקטגוריה; גרירת משימה או תת-משימה אינה אמורה להגיע לכאן
      if (_dragKind !== "cat") { _dragKind = null; return; }
      var fromIdx = parseInt(e.dataTransfer.getData("text/plain"));
      var toIdx = parseInt(div.dataset.idx);
      if (isNaN(fromIdx) || isNaN(toIdx) || fromIdx === toIdx) return;
      var moved = CATS.splice(fromIdx, 1)[0];
      CATS.splice(toIdx, 0, moved);
      _dragKind = null;
      saveCats();
      renderSettings();
      buildCatGrid();
    });
    var hdr = '<div class="set-hdr">'
      + '<span class="drag-handle">⠿</span>'
      + '<div class="set-badge" style="background:' + c.bg + '"></div>'
      + '<input aria-label="שם קטגוריה" class="set-name-inp" id="sname-' + ci + '" value="' + esc(cat.name) + '" placeholder="שם קטגוריה" onblur="saveCatName('+ ci +')" />'
      + '</div>';
    var tasksHtml = '<div class="set-lbl">משימות (גרור לשינוי סדר):</div>'
      + cat.tasks.map(function(t, ti){
          var subs = SUBS[subKey(ci, t)] || SUBS[t] || [];
          var subsSection = '';
          if(subs.length > 0) {
            subsSection = '<div class="set-lbl" style="font-size:9px;margin:4px 0 2px 0;color:var(--textlite)">תתי משימות:</div>'
              + '<div class="sub-chips">'
              + subs.map(function(s,si){
                  return '<div class="chip chip-sub" draggable="true" '
                    + 'ondragstart="subDragStart(event,'+ci+','+ti+','+si+')" '
                    + 'ondragover="subDragOver(event)" '
                    + 'ondragleave="subDragLeave(event)" '
                    + 'ondrop="subDrop(event,'+ci+','+ti+','+si+')" '
                    + 'ondragend="subDragEnd(event)">'
                    + '<span style="cursor:grab;color:#bbb;font-size:10px;margin-left:2px">⠿</span>'
                    + '<span id="sub-lbl-'+ci+'-'+ti+'-'+si+'">'+esc(s)+'</span>'
                    + '<button data-act="cat-sub-edit" data-ci="'+ci+'" data-ti="'+ti+'" data-si="'+si+'" data-sub="'+esc(s)+'" data-task="'+esc(t)+'" style="background:none;border:none;cursor:pointer;font-size:11px;padding:1px 3px;color:var(--primary);">✏️</button>'

          }
          var addSubRow = '<div style="display:flex;gap:4px;margin-top:4px">'
            + '<input aria-label="תת-משימה חדשה" class="set-add-inp" id="snewsub-'+ci+'-'+ti+'" placeholder="+ תת-משימה..." style="font-size:11px" />'
            + '<button class="btn-mini" data-act="cat-sub-add" data-ci="'+ci+'" data-ti="'+ti+'" style="font-size:10px;padding:4px 8px;white-space:nowrap">+ הוסף</button>'
            + '</div>';
          return '<div class="task-block" draggable="true" '
            + 'ondragstart="taskDragStart(event,'+ci+','+ti+')" '
            + 'ondragover="taskDragOver(event)" '
            + 'ondragleave="taskDragLeave(event)" '
            + 'ondrop="taskDrop(event,'+ci+','+ti+')" '
            + 'ondragend="taskDragEnd(event)">'
            + '<div class="task-block-hdr">'
            + '<span class="task-drag-icon">⠿</span>'
            + '<span class="task-name" id="task-lbl-'+ci+'-'+ti+'">'+esc(t)+'</span>'
            + '<button data-act="cat-task-edit" data-ci="'+ci+'" data-ti="'+ti+'" style="background:none;border:none;cursor:pointer;font-size:11px;padding:1px 3px;color:var(--primary);">✏️</button>'
            + '<button data-act="cat-task-del" data-ci="'+ci+'" data-ti="'+ti+'" class="task-del-btn">×</button>'
            + '</div>'
            + subsSection
            + addSubRow
            + '</div>';
        }).join('')
      + '<div class="set-add-row" style="margin-top:8px">'

// TOAST — חתימה משותפת לשלושת הפרויקטים (סבב 8): toast(msg, dur).
// dur באלפיות שנייה, אופציונלי; ברירת המחדל היא `TOAST_DEFAULT_MS`. קודם הפרמטר
// השני פשוט נבלע — ארבעה קוראים העבירו משך והוא לא כובד.
/*  ⛔ מספר שיש לו משמעות מקבל שם (סבב 67, כלל ברזל 11 סעיף 5) —
 *  ⚠️ הערך במקרה זהה ל-`LS_SUCCESS_MUTE_MS`, ⛔ אך הוא מושג אחר
 *  לגמרי (משך תצוגה מול חלון השתקה), ⛔ ואין לאחד ביניהם. */
var TOAST_DEFAULT_MS = 2500;


// ארכיון
// מתמלא פר-מוסד ע"י loadLocalData() אחרי הבחירה, ⛔ מהדיסק בלבד — הזרע
// המוטבע ירד, וההיסטוריה מגיעה מהענן
var ARCHIVE = [];

// saveArchive מוגדרת למעלה, בשכבת Supabase


/* ══════════════════════════════════════════════════════════════════════════
   הארכיון — ניווט שנה ← חודש ← יום, ועריכה במקום
   ══════════════════════════════════════════════════════════════════════════ */
// ═══ מצב הארכיון ═══
var arcSelYear = null;
var arcSelMonth = null;
var arcSelDayKey = null;  // מחרוזת gdate
var arcEditMode = false;

// סדר החודשים לניווט בארכיון. "מרחשון" הוסר — normHMonth ממפה אותו ל"חשון",
// אחרת אותה שנה מקבלת שני כפתורי חשוון. "אדר" (שנה פשוטה) ו"אדר א"/"אדר ב"
// (שנה מעוברת) חיים זה לצד זה: בכל שנה נתונה מופיע רק אחד מהמצבים.
var HMO = ["תשרי","חשון","כסלו","טבת","שבט","אדר","אדר א","אדר ב","ניסן","אייר","סיון","תמוז","אב","אלול"];
// דלי "לא ידוע" — יום שאי אפשר לפענח את תאריכו העברי. קודם הוא נשמט לגמרי
// מרשימת השנים והרשומות שבו היו בלתי נגישות; עכשיו הן נשארות בהישג יד.
var HUNKNOWN = "לא ידוע";
// מפתח יום מוטמע בתוך מחרוזת JS בתוך אטריביוט onclick — חייב בריחה
function jsQ(s) { return String(s == null ? "" : s).replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/"/g, "&quot;"); }

function extractYM(hdate) {
  function unknown() { return {year: HUNKNOWN, month: HUNKNOWN, order: 99}; }
  if (!hdate) return unknown();
  // חייב להכיל סימן של שנה עברית
  if (!/ה׳תש/.test(hdate)) return unknown();
  var parts = normHDate(hdate).trim().split(" ");
  var year = "", month = "";
  for (var i = parts.length-1; i >= 0; i--) {
    if (parts[i].indexOf("׳") >= 0 && /ה׳תש/.test(parts[i])) { year = parts[i]; parts.splice(i,1); break; }
  }
  // שומר רק חלקים שהם מילים עבריות (בלי ספרות ובלי לטינית)
  var hebrewParts = parts.filter(function(p) { return p && !/[0-9a-zA-Z]/.test(p); });
  month = normHMonth(hebrewParts.slice(1).join(" "));
  // מאמת שהחודש נמצא ברשימה המוכרת
  if (!year || HMO.indexOf(month) < 0) return unknown();
  return {year: year, month: month, order: HMO.indexOf(month)};
}

/* ══════════════════════════════════════════════════════════════════════════
   שחזור התאריך העברי — hdate ואם אין, מתוך שם היום (סבב 31)
   ══════════════════════════════════════════════════════════════════════════
   הקיבוץ בארכיון נשען על `extractYM(hdate)`. סנאפשוט בלי `hdate` נפל ל-HUNKNOWN
   («לא ידוע») — גם כשהתאריך העברי המלא יושב בשדה `name`. נמדד בשני המוסדות:
   13 סנאפשוטים (6 בראשון לציון, 7 ברמת אביב) עם `name` בצורת
   «יום כ״ט אב ה׳תשפ״ו (אוטומטי)» ובלי `hdate` כלל — כולם נערמו תחת «לא ידוע».

   סדר הנפילה-חזרה: `hdate` תקין ⇐ חילוץ מתוך `name` ⇐ ורק אז HUNKNOWN.

   ⛔ `snapHDate` טהורה ואינה נוגעת בסנאפשוט (סבב 31) — זהו תיקון **תצוגה**,
      והמפתחות הישנים ב-`kv` הם נתיב החזרה. כתיבה כאן הייתה משנה נתונים
      קיימים בלי שהמנהל ביקש, ומקדמת את `updatedAt` של 13 סנאפשוטים בבת אחת.
   ⛔ החיתוך הוא אחרי אסימון השנה, ואז השלת אסימונים מ**שמאל** (סבב 31) —
      `extractYM` קוראת את החודש כ-`hebrewParts.slice(1)`, ולכן כל תחילית
      («יום», «יום רביעי», «מוצאי שבת») וכל זנב אחרי השנה («(אוטומטי)»,
      «| 11 אפריל 2026») מזיזים אותה לאסימון הלא נכון. השלה גנרית מכסה את כל
      הצורות בלי רשימת תחיליות שתתיישן.
   ══════════════════════════════════════════════════════════════════════════ */
function hebFromText(txt) {
  var t = normHDate(String(txt == null ? "" : txt))
            .replace(/\([^)]*\)/g, " ").replace(/\|/g, " ")
            .replace(/\s+/g, " ").trim();
  if (!t) return "";
  var p = t.split(" ");
  for (var j = 0; j < p.length; j++) {
    if (/ה׳תש/.test(p[j])) { p = p.slice(0, j + 1); break; }   // hdate תקין נגמר בשנה
  }
  for (var i = 0; i < p.length; i++) {
    var cand = p.slice(i).join(" ");
    if (extractYM(cand).year !== HUNKNOWN) return cand;
  }
  return "";
}
// התאריך העברי של סנאפשוט/רשומה לצורך תצוגה וקיבוץ, עם נפילה-חזרה ל-`name`.
function snapHDate(rec) {
  var h = normHDate((rec && rec.hdate) || "");
  if (extractYM(h).year !== HUNKNOWN) return h;
  var t = hebFromText(rec && rec.name);
  if (t) return t;
  /*  ⛔ ונפילה-חזרה שלישית: **תאריך לועזי שיושב בשדה העברי** (סבב 89) —
   *  ⚠️ הנימוק המדוד: ארבעה סנאפשוטים נושאים `hdate` בצורת «30 בנוב׳ 2025
   *  ה׳תשפ״ו» — ⭐ לועזי במלואו, עם שנה עברית בזנב, ⛔ ו-`gdate` ריק בכולם:
   *  ⚠️ `extractYM` מחפשת שם חודש עברי ואינה מוצאת אף אחד, ⛔ ו-138 רשומות
   *  נערמו תחת «שנה לא ידוע». ⭐ והחודש העברי **גזיר** מהלועזי שבמחרוזת,
   *  ⛔ ואין כאן מנוע שני — `hebrewDate` היא אותה נקודה שכל הצרכנים יושבים
   *  עליה. ⛔ וכמו שתי הנפילות שמעליה, זהו תיקון **תצוגה** בלבד: ⚠️ הפונקציה
   *  טהורה ואינה כותבת לסנאפשוט, ⭐ שכתיבה כאן הייתה משנה נתוני מסד בלי
   *  שהמנהל ביקש ⛔ ומקדמת את `updatedAt` שלהם בבת אחת. */
  var g = parseGregLike(h) || parseGregLike((rec && rec.name) || "") ||
          parseGregLike((rec && rec.gdate) || "");
  if (g) {
    // ⛔ עוגן בצהריים מקומיים — מעבר לשעון חורף מפיל חצות ליום הקודם
    var hd = hebrewDate(new Date(g.y, g.m - 1, g.d, 12, 0, 0));
    if (hd && extractYM(hd).year !== HUNKNOWN) return hd;
  }
  return h;
}

// מחזיר את כל הימים (מסנאפשוטים של ARCHIVE + רשומות חיות שאינן של היום)
function getAllArchiveDays() {
  var todayKey = getTodayKey();
  var days = {};

  // From ARCHIVE snapshots — סנאפשוט שנמחק (tombstone) ורשומות מחוקות בתוכו לא מוצגים
  liveOnly(ARCHIVE).forEach(function(snap) {
    var k = String(snap.gdate || snap.id);
    // key — המפתח האמיתי במפה. סנאפשוט ישן בלי gdate ממופתח לפי id, ובלי לשמור
    // אותו הכפתור בארכיון היה שולח arcGoDetail('') ופותח את היום הלא נכון.
    if (!days[k]) days[k] = {key:k, gdate:snap.gdate||"", hdate:snapHDate(snap), day:snap.day||"",
      name:normHDate(snap.name||""), entries:[], seen:{}, snapId:snap.id};
    // merge entries from snapshot if not already there
    // ⛔ הבדיקה מול `seen` נדרשת גם כאן ולא רק בלולאת ENTRIES (סבב 31) — כששני
    //    סנאפשוטים ממופתחים לאותו יום, הרשומה המשותפת נדחפה פעמיים ונספרה
    //    פעמיים בכפתור היום. נמדד ברמת אביב: «11 אוגוסט 2026» הציג 6 רשומות
    //    במקום 5. ה-`seen` כבר נכתב כאן מאז ומעולם — רק אף אחד לא קרא אותו.
    (snap.entries||[]).forEach(function(e){
      if (e && e.id != null) {
        if (days[k].seen[String(e.id)]) return;                   // כבר נכנסה מסנאפשוט אחר
        days[k].seen[String(e.id)] = true;                        // כולל tombstones
      }
      if (isLive(e)) days[k].entries.push(e);
    });
  });

  // From live ENTRIES (including today — so current day is visible in archive).
  // הסנאפשוט הוא המקור הקובע לרשומה שכבר נכנסה אליו: אחרי "סיום יום" העותק החי
  // הוא tombstone, והרשומה עדיין שייכת לארכיון.
  ENTRIES.forEach(function(e) {
    var k = String(e.gdate || "");
    if (!days[k]) {
      if (!isLive(e)) return;   // אין יום כזה בארכיון ורשומה מחוקה — אין מה להציג
      days[k] = {key:k, gdate:e.gdate||"", hdate:snapHDate(e), day:e.day||"",
        name:normHDate([e.day,e.hdate,e.gdate?"| "+e.gdate:""].filter(Boolean).join(" ")), entries:[], seen:{}, snapId:null};
    }
    if (days[k].seen[String(e.id)]) return;             // כבר טופל ע"י הסנאפשוט
    days[k].seen[String(e.id)] = true;
    if (isLive(e)) days[k].entries.push(e);
  });

  return days;
}

function getYearsWithData() {
  var days = getAllArchiveDays();
  var years = {};
  Object.values(days).forEach(function(d) {
    var ym = extractYM(d.hdate);
    if (ym.year) years[ym.year] = true;
  });
  return years;
}

function getMonthsWithData(year) {
  var days = getAllArchiveDays();
  var months = {};
  Object.values(days).forEach(function(d) {
    var ym = extractYM(d.hdate);
    if (ym.year === year) months[ym.month] = true;
  });
  return months;
}

function getDaysInMonth(year, month) {
  var days = getAllArchiveDays();
  var result = [];
  Object.values(days).forEach(function(d) {
    if (!d.entries.length) return;   // יום שכל רשומותיו נמחקו — לא מציגים כפתום ריק
    var ym = extractYM(d.hdate);
    if (ym.year === year && ym.month === month) result.push(d);
  });
  // מיון לפי מספר היום העברי בתוך החודש
  var HEB_ORD = {"א":1,"ב":2,"ג":3,"ד":4,"ה":5,"ו":6,"ז":7,"ח":8,"ט":9,"י":10,"יא":11,"יב":12,"יג":13,"יד":14,"טו":15,"טז":16,"יז":17,"יח":18,"יט":19,"כ":20,"כא":21,"כב":22,"כג":23,"כד":24,"כה":25,"כו":26,"כז":27,"כח":28,"כט":29,"ל":30};
  function hdayNum(hdate) {
    var d = (hdate||"").split(" ")[0].replace(/[׳״]/g,"");
    return HEB_ORD[d] || 999;
  }
  result.sort(function(a,b){ return hdayNum(a.hdate) - hdayNum(b.hdate); });
  return result;
}

// ── זיהוי השנה והחודש העבריים הנוכחיים ──
function getNowHebYM() {
  var hd = hebrewDate(new Date());
  return extractYM(hd);
}

// ── שביל הניווט ──
function renderArcBreadcrumb() {
  var bc = document.getElementById("arc-breadcrumb");
  if (!bc) return;

  parts.push('<span class="arc-crumb" data-act="arc-go-years">שנים</span>');

  }
  if (arcSelMonth) {
    parts.push('<span class="arc-crumb-sep">›</span>');
    parts.push('<span class="arc-crumb" data-act="arc-nav-days" data-year="'+esc(arcSelYear)+'" data-month="'+esc(arcSelMonth)+'">' + arcSelMonth + '</span>');
  }
  if (arcSelDayKey) {
    var days = getAllArchiveDays();
    var d = days[arcSelDayKey];
    var label = d ? (d.hdate||d.gdate||arcSelDayKey) : arcSelDayKey;
    // מציג רק את חלק היום והחודש (שני הטוקנים הראשונים של hdate)
    var dayParts = label.split(" ");

    parts.push('<span class="arc-crumb-sep">›</span>');
    parts.push('<span class="arc-crumb active">' + shortLabel + '</span>');

  bc.innerHTML = parts.join("");
}

// ── רמה 1: שנים ──
function arcGoYears() {
  arcSelYear = null; arcSelMonth = null; arcSelDayKey = null;
  document.getElementById("arc-years").style.display = "block";
  document.getElementById("arc-months").style.display = "none";
  document.getElementById("arc-days").style.display = "none";
  document.getElementById("arc-detail").style.display = "none";
  renderArcYears();
  renderArcBreadcrumb();
}

function renderArcYears() {
  var el = document.getElementById("arc-years");
  var nowYM = getNowHebYM();
  var allYears = {};
  // בונה את רשימת השנים **רק** משנים שיש להן רשומות במוסד הזה.
  // ⛔ אין לזרוע מטווח קבוע (נרשם בסבב 67) — כך הוצגו בעבר שנים ריקות מדומות.
  var withData = getYearsWithData();
  Object.keys(withData).forEach(function(y){ allYears[y] = true; });
  // תמיד כולל את השנה העברית הנוכחית (ייתכן שריקה — וזו תצוגת ברירת המחדל התקינה).
  if (nowYM.year) allYears[nowYM.year] = true;

  // Sort years: older first, "לא ידוע" always last
  var yearList = Object.keys(allYears).sort(function(a,b){
    if (a === HUNKNOWN) return 1;
    if (b === HUNKNOWN) return -1;
    return a > b ? 1 : -1;
  });

  var html = '<div style="font-size:11px;color:var(--textmid);margin-bottom:8px">בחר שנה:</div><div class="arc-grid">';
  yearList.forEach(function(y) {
    var isNow = (y === nowYM.year);
    var hasDat = !!withData[y];
    html += '<button class="arc-btn'+(isNow?" active":"")
          + '" data-act="arc-nav-months" data-year="'+esc(y)+'">' + y + '</button>';
  });
  html += '</div>';
  el.innerHTML = html;
}

// ── רמה 2: חודשים ──
function arcGoMonths(year) {
  arcSelYear = year; arcSelMonth = null; arcSelDayKey = null;
  document.getElementById("arc-years").style.display = "none";
  document.getElementById("arc-months").style.display = "block";
  document.getElementById("arc-days").style.display = "none";
  document.getElementById("arc-detail").style.display = "none";
  renderArcMonths(year);
  renderArcBreadcrumb();
}

function renderArcMonths(year) {
  var el = document.getElementById("arc-months");
  var nowYM = getNowHebYM();

  // החודשים נגזרים רק מרשומות אמיתיות של השנה הזו (מונע-נתונים, פר-מוסד)
  var monthSet = {};
  var withData = getMonthsWithData(year);
  Object.keys(withData).forEach(function(m){ monthSet[m] = true; });

  // Sort by HMO order; חודש לא מזוהה (indexOf === -1) בסוף ולא בהתחלה
  var monthList = Object.keys(monthSet).sort(function(a,b){
    var ia = HMO.indexOf(a); if (ia < 0) ia = 999;
    var ib = HMO.indexOf(b); if (ib < 0) ib = 999;
    return ia - ib;
  });

  var html = '<div style="font-size:11px;color:var(--textmid);margin-bottom:8px">בחר חודש <b>' + year + '</b>:</div><div class="arc-grid">';
  monthList.forEach(function(m) {
    var isNow = (year === nowYM.year && m === nowYM.month);
    var hasDat = !!withData[m];
    html += '<button class="arc-btn'+(isNow?" active":"")
          + '" data-act="arc-nav-days" data-year="'+esc(year)+'" data-month="'+esc(m)+'">' + m + '</button>';
  });
  html += '</div>';
  el.innerHTML = html;
}

// ── רמה 3: ימים ──
function arcGoDays(year, month) {
  arcSelYear = year; arcSelMonth = month; arcSelDayKey = null;

function renderArcDays(year, month) {
  var el = document.getElementById("arc-days");
  var days = getDaysInMonth(year, month);
  var nowKey = getTodayKey();

  if (!days.length) {
    el.innerHTML = '<div style="color:#bbb;font-size:12px;padding:8px">אין רשומות לחודש זה</div>';
    return;
  }

  var html = '<div style="font-size:11px;color:var(--textmid);margin-bottom:8px">בחר יום ב<b>' + month + ' ' + year + '</b>:</div><div class="arc-grid">';
  days.forEach(function(d) {
    // Show day-of-month only (first token of hdate = גמטריה)
    var parts = (d.hdate||"").split(" ");
    var dayNum = parts[0] || d.gdate || d.key || "?";
    var isNow = (d.gdate === nowKey);
    // הניווט לפי d.key ולא לפי d.gdate — סנאפשוט ישן בלי gdate ממופתח לפי id,
    // ושליחת מחרוזת ריקה הייתה פותחת יום אחר לגמרי.
    html += '<button class="arc-btn'+(isNow?" active":"")
          + '" data-act="arc-nav-detail" data-key="'+esc(d.key)+'" title="'+(d.hdate||d.name||"")+'">'
          + dayNum + '<br><small style="font-size:9px;font-weight:400;opacity:0.8">' + (d.entries.length) + ' רש׳</small></button>';
  });

      html += '<div class="arc-entry-row">'+
        (arcEditMode ? '<button class="arc-entry-edit" data-act="arc-entry-edit" data-key="'+esc(arcSelDayKey)+'" data-id="'+esc(e.id)+'" style="background:none;border:none;cursor:pointer;font-size:13px;padding:2px 3px;" title="ערוך">✏️</button>' +
        '<button class="arc-entry-del" data-act="arc-entry-del" data-key="'+esc(arcSelDayKey)+'" data-id="'+esc(e.id)+'">×</button>' : '')+
        '<div style="width:12px;height:12px;border-radius:3px;background:'+c.bg+';flex-shrink:0"></div>'+
        '<span style="color:var(--textmid);font-size:11px">'+esc(e.catName)+'</span>'+
        '<span style="color:#bbb">←</span>'+
        '<span style="font-weight:700;color:var(--text)">'+esc(e.task)+'</span>'+
        (e.sub ? '<span style="color:#bbb">→</span><span style="color:#888">'+esc(e.sub)+'</span>' : '')+
        (e.notes ? '<span style="color:#aaa;font-size:10px;flex:1;text-align:left"> · '+esc(e.notes)+'</span>' : '<span style="flex:1"></span>')+

      '</select>'+

function arcDeleteEntry(gdateKey, entryId) {
  // tombstone בכל מקום שבו הרשומה מופיעה — בסנאפשוטים ובחי — עם אותה חותמת
  var ts = Date.now();
  ARCHIVE.forEach(function(snap) {
    var hit = false;
    (snap.entries||[]).forEach(function(e){ if (idEq(e.id, entryId) && isLive(e)) { recDelete(e, ts); hit = true; } });
    if (hit) { snap.count = liveOnly(snap.entries).length; recTouch(snap, ts); }
  });
  saveArchive();
  ENTRIES.forEach(function(e){ if (idEq(e.id, entryId) && isLive(e)) recDelete(e, ts); });
  saveEntries();
  renderArcDetail();
  renderArcBreadcrumb();
}

function arcAddEntry(gdateKey) {
  var days = getAllArchiveDays();
  var d = days[arcSelDayKey];
  if (!d) return;
  var catSel = document.getElementById("arc-add-cat");
  var taskSel = document.getElementById("arc-add-task");
  var notesSel = document.getElementById("arc-add-notes");
  if (!catSel || !taskSel) return;
  var letter = catSel.value;
  var cat = CATS.find(function(c){ return c.letter === letter; });
  if (!cat) return;
  // ⭐ סבב 38 — אותו דפוס בדיוק כמו ב-`addEntry`: מזהה מהמודול המשותף,
  //    וחותמת יצירה נפרדת לסדר.
  var _now = Date.now();
  var newEntry = {
    id: newClientId(),
    createdAt: _now,
    day: d.day, hdate: d.hdate, gdate: d.gdate,
    cat: letter, catName: cat.name,
    task: taskSel.value, sub: "", notes: notesSel ? notesSel.value.trim() : "", count: "",
    updatedAt: _now
  };
  // Add to ARCHIVE snapshot if exists.
  // יום בלי gdate ממופתח לפי snapId — התאמה לפי gdate ריק הייתה בוחרת סנאפשוט שגוי.
  var snap = ARCHIVE.find(function(s){
    return isLive(s) && (d.gdate ? s.gdate === d.gdate : (d.snapId != null && idEq(s.id, d.snapId)));
  });
  if (snap) {
    snap.entries = snap.entries || [];
    snap.entries.unshift(newEntry);
    snap.count = liveOnly(snap.entries).length;
    recTouch(snap);
    saveArchive();
  } else {
    // הוספה ל-ENTRIES החיים
    ENTRIES.unshift(newEntry);
    saveEntries();
  }
  renderArcDetail();
}

function renderArchive() {
  // מאתחל את תצוגת הארכיון ברמת השנה, עם השנה הנוכחית כברירת מחדל
  var nowYM = getNowHebYM();
  arcSelYear = nowYM.year || null;
  arcSelMonth = null;
  arcSelDayKey = null;
  arcEditMode = false;

  // מציג את פאנל השנים ומסתיר את השאר
  document.getElementById("arc-years").style.display = "block";
  document.getElementById("arc-months").style.display = "none";
  document.getElementById("arc-days").style.display = "none";
  document.getElementById("arc-detail").style.display = "none";

  renderArcYears();
  renderArcBreadcrumb();

  // ירידה אוטומטית לשנה הנוכחית
  if (arcSelYear) {
    arcGoMonths(arcSelYear);
    // ירידה אוטומטית לחודש הנוכחי
    if (nowYM.month) {
      arcGoDays(arcSelYear, nowYM.month);
    }
  }
}


function exportArchivePDF(id) {
  var snap = ARCHIVE.find(function(s){ return idEq(s.id, id); });
  if (!snap) return;
  var savedEntries = ENTRIES;
  ENTRIES = liveOnly(snap.entries);
  var savedDay = selDay;
  selDay = snap.name;
  var origHeb = document.getElementById("hebDateInput").value;
  document.getElementById("hebDateInput").value = snap.name;
  exportPDF();
  ENTRIES = savedEntries;
  selDay = savedDay;
  document.getElementById("hebDateInput").value = origHeb;
}

var GITHUB_USER = "ygtotlrl-lab";
var GITHUB_REPO = "yoman-avoda";
var GITHUB_FILE = "index.html"; // חייב להתאים לשם הקובץ האמיתי בריפו — אחרת האוטו-אפדייט מקבל 404
/*  ⛔ בסיס אחד לכל משיכה גולמית מהריפו — ⚠️ שני צרכנים לו: האוטו-אפדייט
 *  ומציג טבלת התשתית, ⭐ וכתובת שנייה הייתה מקור אמת שני. */
var RAW_BASE = "https://raw.githubusercontent.com/" + GITHUB_USER + "/" + GITHUB_REPO + "/main/";
var RAW_URL = RAW_BASE + GITHUB_FILE;

// מזהה בנייה מפורש, נקרא מ-<meta name="app-version"> שבראש הקובץ.
// מחליף את simpleHash() הישנה: היא גיבבה רק את 5000 התווים הראשונים,
// שנגמרים בתוך תגי ה-<link> שב-<head> — ולכן כל בנייה הפיקה את אותו גיבוב
// והבאנר לא הופיע מעולם. ⛔ יש לקדם את תג ה-meta בכל שינוי קוד
// (נרשם בסבב 67) — בלי הקידום העדכון אינו מגיע למכשירים.
var APP_VERSION = (function(){
  var m = document.querySelector('meta[name="app-version"]');
  return (m && m.getAttribute("content")) || "";
})();

// הגרסה שהמשתמש סגר במפורש (✕) — כדי לא לנדנד בכל בדיקה.
var UPDATE_KEY = "tb_dismissed_version";

// כל כמה זמן לחפש בנייה חדשה, וכמה להמתין לפני ויתור.
// היה כל 5 דקות על הקובץ המלא (~950KB) — כ-11MB לשעה בסלולר, וכל אחת
// מהמשיכות נשמרה במטמון ה-service worker תחת כתובת ?t= ייחודית.
var UPDATE_INTERVAL_MS = 60 * 60 * 1000;
var UPDATE_TIMEOUT_MS  = 10000;
var VERSION_META_RE = /name=["']app-version["'][^>]*content=["']([^"']+)["']/i;

// ממשק אחד לשני מנגנוני הזיהוי. הבאנר עצמו (התחתון, id="sw-update-banner")
// מוגדר בסקריפט שבראש הקובץ יחד עם רישום ה-service worker — כך שגם לחיצה על
// "עדכן עכשיו" מהזיהוי הזה יודעת לשחרר worker ממתין. הבאנר העליון ברוחב מלא
// (id="updateBanner") בוטל: שני באנרים הופיעו יחד.
/* ══════════════════════════════════════════════════════════════════════════
   עדכוני גרסה וסנכרון ברקע
   ══════════════════════════════════════════════════════════════════════════ */

// סנכרון חכם: בדיקת חותמת כל 3 שניות (זול), ומשיכת נתונים רק כשהיא השתנתה
var _lastKnownTimestamp = 0;
// סבב 17: מועד הסנכרון המוצלח האחרון — לשורת המצב שבאזור המצב בהגדרות.
// נכתב על כל שיחה מוצלחת עם הענן, ולכן הוא נכון גם בדפדפן שרק קורא.
// ⛔ אינו עֵד דחיפה ואינו משמש לפינוי — לזה יש `_tbPushedAt` פר-מפתח.
var _tbLastSyncAt = 0, _tbNetWarned = false;
function _tbMarkSynced() {
  _tbLastSyncAt = Date.now();
  // הכישלון עצמו נשאר שקט כאן (הפולינג הוא כל 3 שניות — טוסט על כל מחזור
  // היה רעש), אבל **החזרה** כן נאמרת: היא הרגע שבו מה שהמתין מתחיל לעלות.
  if (_tbNetWarned) { _tbNetWarned = false; toast(MSG_SYNC_BACK); }
  // ⛔ הגיבוי והיומן **אינם** נתלים כאן (סבב 30, השלמה) — הניסוח הראשון
  //    תלה אותם בשיחה מוצלחת עם הענן, כלומר בפעילות סנכרון. זו בדיוק
  //    הצורה שהשביתה את הגיבוי של הנהלה ל-25 יום בלי שאיש ידע: מנגנון
  //    בטיחות שרץ רק כשמשהו אחר רץ. נקודת ההפעלה היא `bkBoot()`
  //    ב-`selectYeshiva`, לצד `lsBoot()` ו-`pendBoot()`.
}
// ⭐ סבב 51 — כאן ישבה `autoSyncData`, שקראה את שורת החותמת **ואז** מיזגה.
//    בדיקת החותמת עברה למודול המשותף (`PL_CFG` + `plTick`), ומה שנשאר
//    כאן הוא **המשיכה עצמה** — בדיוק כמו `ysPullFromCloud` בהנהלה.
//    ⛔ אין להחזיר לכאן את בדיקת החותמת (סבב 51) — מסלול שני שמכריע מתי
//    למשוך היה יוצא מסנכרון מול המודול, וזה בדיוק «מקור אמת שני».
async function tbPullFromCloud() {
  /*  ⛔⛔ שער ההקשר של **מסלול הפולינג** — ⚠️ הנימוק המדוד: סבב 87 סגר את
   *  `syncFromCloud` וסבב 88 את מסלול הדחיפה, ⛔ והמשיכה הזו — שרצה
   *  **כל שלוש שניות** מ-`plTick` — נשארה בלי שער: ⭐ נמדד בדפדפן
   *  שהחלפת מוסד בזמן משיכה בטיסה כתבה רשומת ראשון למפתח
   *  `tb_entries_ramataviv`, ⛔ ומילאה את מפת החותמות בחותמות ראשון
   *  אחרי ש-`ysResetTenantState` כבר איפסה אותה.
   *  ⚠️ וזה מה שדווח מהשטח: הקטגוריות והארכיון מתערבבים בין המוסדות. */
  var _ep = ysTenantEpoch(), _ls = LS;
  try {
    console.log("[sync] pulling data...");

    // מיזוג ברמת רשומה במקום החלפה מלאה. ההחלפה היא שגרמה לאובדן: מכשיר
    // שדחף blob ישן עם חותמת חדשה יותר מחק כאן עבודה שמכשיר אחר הרגע הקליד.
    /* ⛔ הקריאה מהטבלה בלבד, ⛔ ובלי נפילה-חזרה לערך השלם — ⚠️ השקילות
       נמדדה מול המסד בשני המוסדות, והבלוק חדל להיות רשת ביטחון והפך
       למקור אמת שני. ⛔ וכשל מחזיר «אין ראיה» ⛔ ולא «הענן ריק» — ⚠️ מיזוג
       מול מערך ריק מוחק את מה שלא הספיק לעלות. */
    var _rowsE = await tbRowsGet('tb_entries');
    if (ysTenantStale(_ep)) { console.warn('[sync] ההקשר התחלף באמצע — המשיכה נעצרה'); return; }
    if (_rowsE.ok) {
      var cloudEntries = _rowsE.data;
      if (Array.isArray(cloudEntries)) {
        ENTRIES = mergeEntries(ENTRIES, cloudEntries);
        ENTRIES.sort(function(a,b){ return entryOrderTs(b) - entryOrderTs(a); });
        lsSetArray("tb_entries"+_ls, ENTRIES, _tbRecTs);
        renderLog();
        console.log("[sync] merged, entries=" + liveOnly(ENTRIES).length +
                    " (+" + (ENTRIES.length - liveOnly(ENTRIES).length) + " tombstones)");
      }
    }
    var _rowsA = await tbRowsGet('tb_archive');
    if (ysTenantStale(_ep)) { console.warn('[sync] ההקשר התחלף באמצע — המשיכה נעצרה'); return; }
    if (_rowsA.ok) {
      hwNoteCloud('tb_archive'+_ls, _rowsA.data);   // ראיה עננית לשער הדיסק (סבב 35)
      var cloudArchive = _rowsA.data;
      if (Array.isArray(cloudArchive)) {
        ARCHIVE = mergeArchive(ARCHIVE, cloudArchive);
        lsSetArray("tb_archive"+_ls, hwDiskFilter('tb_archive'+_ls, ARCHIVE), _tbRecTs);
        // הארכיון מוצג רק כשלוחצים על הלשונית — רענון רק אם הוא פתוח כרגע
        var arcPanel = document.getElementById("panel-archive");
        if (arcPanel && arcPanel.style.display !== "none" && arcSelDayKey) renderArcDetail();
      }
    }
  } catch(e) { _tbNetWarned = true; console.error("[sync] error:", e); }
}

function checkForUpdates() {
  if (!APP_VERSION) return;   // אין סמן מקומי ⇐ אין מול מה להשוות
  var ctl = (typeof AbortController !== "undefined") ? new AbortController() : null;
  var timer = ctl ? setTimeout(function(){ ctl.abort(); }, UPDATE_TIMEOUT_MS) : null;
  var done = function(){ if (timer) { clearTimeout(timer); timer = null; } };
  fetch(RAW_URL, {
    // Range: ראש הקובץ בלבד — תג הגרסה יושב ב-KB הראשון.
    // שרת שמתעלם מ-Range פשוט שולח 200 עם הקובץ כולו; עדיין נכון.
    headers: { "Range": "bytes=0-4095" },
    // no-store: בעבר זו הייתה כתובת ?t= ייחודית, ולכן ה-service worker שמר
    // רשומת מטמון טרייה של ~950KB בכל בדיקה. (מעכשיו sw.js גם מדלג עליהן.)
    cache: "no-store",
    signal: ctl ? ctl.signal : undefined
  })
    .then(function(r){
      // ⛔ אין להתייחס ל-404/500 כאל "האפליקציה" (נרשם בסבב 67) — כך נוצר בעבר גיבוב שקרי.
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    })
    .then(function(text){
      var m = text.match(VERSION_META_RE);
      if (!m) return;                                // גוף לא צפוי — ולעולם לא לנחש
      var remoteVersion = m[1];
      if (remoteVersion === APP_VERSION) return;     // מעודכן

function _infCells(line) {
  var p = line.split('|');

  var lines = md.split('\n');

  for (var i = 0; i < lines.length; i++) {

    var bs = /^<!--\s*SHARED:start\s+id="(rules-[a-z]+)"/.exec(l);
    if (bs) { inRules = true; blk = bs[1]; continue; }
    if (/^<!--\s*SHARED:end/.test(l)) { inRules = false; blk = ''; continue; }

    cur.rows.push(row);
  }
  /*  ⛔ שם השורה ⟵ מספרה, בדיוק כפי שהשער גוזר — ⚠️ סימן הלולאה נחתך
