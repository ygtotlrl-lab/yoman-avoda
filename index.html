     התגיות זהות לרשימת המטמון של ה-service worker. -->

<body>
<!-- הקליפה מתחילה חשופה — המסגרת נחשפת רק כשנבחרה ישיבה, ולא בטעינה ובמסך הבחירה. -->
<div class="app is-bare">

  <div class="hdr">
    <div class="hdr-top">
      <div class="hdr-logo-wrap"><button class="hdr-logo-btn" data-act="open-yeshiva-picker" aria-label="החלפת ישיבה" title="החלפת ישיבה"><img id="appLogo" class="hdr-logo" alt="" /></button></div>
      <div class="hdr-mid">
        <div class="hdr-bh">ב״ה | ימות המשיח</div>
        <div class="hdr-title-wrap"><div class="hdr-h1">יומן עבודה</div></div>
        <div class="hdr-sub" id="hdrSub"></div>
      </div>
    </div>
    <div class="hdr-div"></div>
    <div class="hdr-yechi">יחי אדוננו מורנו ורבינו מלך המשיח לעולם ועד</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-act="show-tab" data-tab="entry">📝 הזנה</button>
    <button class="tab-btn" data-act="show-tab" data-tab="log">📋 יומן</button>
    <button class="tab-btn" data-act="show-tab" data-tab="settings">⚙️ עריכה</button>
    <button class="tab-btn" data-act="show-tab" data-tab="archive">🗄 ארכיון</button>
  </div>

  <main id="view"><div class="view-loading" role="status" aria-label="טוען"><span class="view-spin"></span></div></main>

</div>

<div id="toasts" aria-live="polite"></div>
<div id="updater">
  <div class="in">
    <span>🔄 גרסה חדשה זמינה</span>
    <button data-act="sw-apply">עדכן עכשיו</button>
    <button class="x" data-act="sw-dismiss" aria-label="סגור">✕</button>
  </div>
</div>


<script type="module">
// המסמך עצמו מודול — סקריפט קלאסי רץ לפני כל מודול, וקריאה ממנו לליבה בעלייה הייתה מוצאת undefined.
import { MSG_DELETE, MSG_KV_BAD, MSG_SAVED, MSG_SAVED_LOCAL, MSG_SERVER_ERR,
         MSG_SYNC_BACK, appConfigure, dayNoon, errMsg, getDeviceId, kvParse,
         uniqHas, uniqList, withTimeout } from './core/util.js';
import { _rowsPaged, ctxEpoch, ctxStale, ctxSwitch, eraKeys, eraKick, idEq,
         mergeCore, newClientId, pendAlertDismiss, pendBoot,
         pendConfirmPush, pendCount, pendForget, pendHas, pendMark,
         pendReload, pendTag, plBoot, plForget, plStampWrite,
         prunePastTombstones, pushDirty, pushTable, rtyBoot, runSave,
         sbWatch, schedulePush, tombAt, tombBoot, tombPruneMerged } from './core/sync.js';
import { hwBoot, hwDiskFilter, hwForget, hwNoteCloud, lsBoot,
         lsClearHorizons, lsGet, lsRemove, lsSet, lsSetArray } from './core/storage.js';
import { bkBoot, logAction } from './core/backup.js';
import { actRun, ask, closeAsk, closeModal, esc, ksKey, modalBackdrop,
         modalEsc, openModal, pullRender, shellBare, swApply, swHideUpdate,
         toast } from './core/ui.js';
import './core/hebrew.js';

// התצורה נמסרת בשומרי קריאה — חלקה מוגדר בהמשך הדף, והשומר קורא אותה בזמן הקריאה ולא בזמן המסירה.
document.title = self.APP.name;
appConfigure({
  get BK_CFG() { return BK_CFG; },
  get DATA_ERA() { return DATA_ERA; },
  get DEV_CFG() { return DEV_CFG; },
  get DOM_ACTIONS() { return DOM_ACTIONS; },
  get ERA_CFG() { return ERA_CFG; },
  get HW_CFG() { return HW_CFG; },
  get LS_CFG() { return LS_CFG; },
  get PEND_CFG() { return PEND_CFG; },
  get PL_CFG() { return PL_CFG; },
  get PUSH_CFG() { return PUSH_CFG; },
  get RTY_CFG() { return RTY_CFG; },
  get TOAST_DEFAULT_MS() { return TOAST_DEFAULT_MS; },
  get saveRefresh() { return saveRefresh; }
});

// ── המסכים ──
// mountView מציירת את המסכים לפני כל קוד שמחפש אלמנט בתוכם — אין להזיז את הקריאה אליה מטה.
// אין ברירת מחדל לישיבה — ישיבה שאינה במפה אינה נבחרת כלל, ואינה נכתבת לטבלה של אחרת.
var YESHIVOT = [
  { id: 'rishon',    name: 'ראשון לציון',
    full: 'ישיבת תומכי תמימים ליובאוויטש ראשון לציון',
    table: 'ya_settings_rishon',    logo: 'logos/rishon.png' },
  { id: 'ramataviv', name: 'רמת אביב',
    full: 'ישיבת תומכי תמימים ליובאוויטש רמת אביב',
    table: 'ya_settings_ramataviv', logo: 'logos/ramataviv.png' },
];
function yaYeshiva(y) {
  for (var i = 0; i < YESHIVOT.length; i++) if (idEq(YESHIVOT[i].id, y)) return YESHIVOT[i];
  return null;
}
// מציג הטבלה במסך הבחירה ולא בתוך הישיבה — הטבלה של הארגון, ומסך שנפתח מתוך מוסד נקרא כמתאר אותו.
function screenPickHTML() {
  return `
<div id="yeshivaSelect">
  <div class="ys-pick-card">
    <svg class="ys-pick-mark" viewBox="0 0 268 264" aria-hidden="true" focusable="false">
      <rect x="72" y="0" width="196" height="48" rx="24" opacity="0.6"></rect>
      <rect x="0" y="72" width="268" height="48" rx="24" opacity="0.73"></rect>
      <rect x="28" y="144" width="240" height="48" rx="24" opacity="0.87"></rect>
      <rect x="114" y="216" width="154" height="48" rx="24" opacity="1"></rect>
    </svg>
    <h1 class="ys-pick-h1">יומן עבודה</h1>
    <div class="ys-pick-lead">בחר ישיבה</div>
    <div class="ys-pick-btns">${YESHIVOT.map(function (y) {
      return '<button class="ys-pick-btn" data-act="pick-yeshiva" data-yeshiva="' + y.id + '">' + esc(y.name) + '</button>';
    }).join('')}</div>
    <div class="ys-pick-aside">
      <button class="ys-pick-alt" data-act="inf-open">📊 טבלת התשתית</button>
    </div>
  </div>
</div>
`;
}
// תאריך עברי נשאר טקסט חופשי — אין לו פקד תאריך בדפדפן.
function screenEntryHTML() {
  return `
<div class="panel" id="panel-entry">
  <div class="card">
    <div class="card-ttl">תאריך ויום</div>
    <div class="date-row">
      <span class="date-lbl">יום:</span>
      <div class="day-chips">
        <button class="day-chip" data-act="pick-day" data-day="יום ראשון">ראשון</button>
        <button class="day-chip" data-act="pick-day" data-day="יום שני">שני</button>
        <button class="day-chip" data-act="pick-day" data-day="יום שלישי">שלישי</button>
        <button class="day-chip" data-act="pick-day" data-day="יום רביעי">רביעי</button>
        <button class="day-chip" data-act="pick-day" data-day="יום חמישי">חמישי</button>
        <button class="day-chip" data-act="pick-day" data-day="ערב שבת">ערב שבת</button>
        <button class="day-chip" data-act="pick-day" data-day="מוצאי שבת">מוצ"ש</button>
      </div>
      <!-- ⛔ תאריך עברי נשאר טקסט חופשי — אין בורר תאריך עברי
           מקורי בדפדפן, ואין לו inputmode או pattern שמתארים אותו;
           ⚠️ הערך נגזר ממילא מ-gregDateInput דרך hebrewDate(). -->
      <input aria-label="תאריך עברי" class="heb-inp" id="hebDateInput" type="text" autocomplete="off" placeholder="תאריך עברי..." />
      <!-- ⛔ בלי inputmode בכוונה — הפורמט המתקבל הוא dd/mm/yyyy,
           yyyy-mm-dd או הפורמט השמור, ומקלדת המספרים של iOS אינה מציעה
           «/» ולא «-»; ⚠️ ה-pattern הוא רמז הצורה, וההכרעה ב-parseGregLike,
           שנכשלת-סגור על כל קלט אחר ⭐ ומתורגמת לפורמט השמור. -->
      <input aria-label="תאריך לועזי" class="greg-inp heb-inp" id="gregDateInput" type="text" pattern="\d{1,2}/\d{1,2}/\d{4}|\d{4}-\d{2}-\d{2}|\d{1,2} [א-ת]+ \d{4}" autocomplete="off" placeholder="תאריך לועזי..." data-inp="greg-date" />
    </div>
  </div>

  <div class="card">
    <div class="card-ttl">קטגוריה ומשימה</div>
    <div class="cat-grid" id="catGrid"></div>
    <div class="qsec">
      <div class="qlbl">משימה</div>
      <div class="qrow" id="taskBtns"><span class="hint">בחר קטגוריה...</span></div>
    </div>
    <div class="qsec">
      <div class="qlbl">תת-משימה</div>
      <div class="qrow" id="subBtns"><span class="hint">בחר משימה...</span></div>
    </div>
    <div class="ksave">
    <div class="inp-grid">
      <div class="fld"><label for="taskInput">משימה (ידנית)</label><input id="taskInput" type="text" placeholder="הקלד..." /></div>
      <div class="fld"><label for="subInput">תת-משימה / פרטים</label><input id="subInput" type="text" placeholder="פרטים..." /></div>
    </div>
    <div class="inp-grid">
      <div class="fld"><label for="notesInput">הרחבה / הערות</label><input id="notesInput" type="text" placeholder="הערות..." /></div>
      <div class="fld"><label for="countInput">כמות</label><input id="countInput" type="text" inputmode="numeric" autocomplete="off" placeholder="1" /></div>
    </div>
    <button class="btn-add" data-act="add-entry" data-ksave>+ הוסף לסדר היום</button>
    </div>

  </div>
</div>
`;
}
function screenLogHTML() {
  return `
<div class="is-hidden panel" id="panel-log">
  <div class="card">
    <div class="log-hd">
      <div class="log-ttl card-ttl">רשומות יומן</div>
      <div class="log-cnt" id="logCount">0</div>
    </div>
    <div id="logList"><div class="empty">📋<br>עוד אין רשומות</div></div>
    <div class="exp-row">
      <button class="btn-sm btn-red" data-act="clear-all">🗑 נקה</button>
      <span id="outputBtnSlot"></span>
    </div>
  </div>
</div>
`;
}
function screenSettingsHTML() {
  return `
<div class="is-hidden panel" id="panel-settings">
  <div class="card">
    <div class="card-ttl">עריכת קטגוריות ומשימות</div>
    <div id="settingsEditor"></div>
    <button class="btn-save" data-act="save-settings">💾 שמור שינויים</button>
  </div>
</div>
`;
}
function screenArchiveHTML() {
  return `
<div class="is-hidden panel" id="panel-archive">
  <div class="card">
    <div id="arc-breadcrumb" class="arc-crumbs"></div>
    <div id="arc-years"></div>
    <div id="arc-months" class="is-hidden"></div>
    <div id="arc-days" class="is-hidden"></div>
    <div id="arc-detail" class="is-hidden"></div>
  </div>
</div>
`;
}
function mountView() {
  var v = document.getElementById('view');
  if (!v) { console.error('[ui] אין מיכל תוכן — #view'); return; }
  v.innerHTML = screenPickHTML() + screenEntryHTML() + screenLogHTML() +
    screenSettingsHTML() + screenArchiveHTML();
}
mountView();

// ── שכבת Supabase ועוזרים משותפים ──
const SB_URL = self.APP.supabase.url;
const SB_KEY = self.APP.supabase.key;
// ── משתני רב-הדיירות (מוסד) ──
var YESHIVA = null; // נבחר בכל עלייה ואינו נשמר לדיסק
var KV_TABLE = null;
var LS = ''; // סיומת מפתח האחסון פר-מוסד — בידוד אופליין
function yaSuffix(y) { return '_' + y; }
// בסיס שנכתב עם סיומת המוסד ואינו כאן — המפתח שלו נמחק בעלייה.
function yaLsBases() {
  return ['ya_entries', 'ya_archive', 'ya_cats', 'ya_subs', 'ya_subs_meta',
          CATS_RESET_LS, SUBS_RESET_LS, 'ya_last_day',
          'ya_pending', 'ya_last_backup', 'ya_log_queue'];
}

var _sb = null;

// ── בריחת HTML ──
// המשווה נבנה פעם אחת ברמת המודול — localeCompare בונה משווה בכל קריאה, ובתוך sort זה O(n log n) פעמים.
// בלי Intl.Collator — נפילה-חזרה ל-localeCompare עם he מפורש, באותו סדר בדיוק.
var _heColl = null;
try { _heColl = new Intl.Collator('he'); } catch (e) { _heColl = null; }
var HE = _heColl || { compare: function (a, b) { return String(a).localeCompare(String(b), 'he'); } };

// ── הודעות פר-אפליקציה ──
var MSG_SYNCED = '✅ מסונכרן';
var MSG_SYNC_FAIL_LOCAL = '⚠️ הסנכרון נכשל — עובד עם הנתונים שבמכשיר';
var MSG_SYNC_PARTIAL = '⚠️ סנכרון חלקי — נכשל: ';
var MSG_OFFLINE_LOCAL = '⚠️ אין חיבור לאינטרנט — עובד עם הנתונים שבמכשיר';
var MSG_DAY_ARCHIVED = '📅 יום חדש! הרשומות הועברו לארכיון אוטומטית';
var MSG_PICK_CATEGORY = '⚠️ יש לבחור קטגוריה';
var MSG_NEED_TASK = '⚠️ יש להזין משימה';
var MSG_NO_ROWS = 'אין רשומות';
var MSG_PDF_PREP = 'מכין PDF...';
var MSG_POPUP_BLOCKED = '⚠️ החלון נחסם — אפשר חלונות קופצים לאתר ונסה שוב';
var MSG_IMG_OFFLINE = '⚠️ יצירת התמונה לא זמינה — נדרש חיבור לאינטרנט פעם אחת';
var MSG_IMG_FAIL = '⚠️ יצירת התמונה נכשלה — נסה שוב';
var MSG_LOCAL_ONLY = '⚠️ נשמר במכשיר בלבד — הענן לא עודכן';
var MSG_CLOUD_NO_FANOUT = '⚠️ נשמר בענן, אך מכשירים אחרים לא יעודכנו כעת';
var MSG_SAVED_CLOUD = '✅ נשמר בענן';
var MSG_SUBTASK_EXISTS = '⚠️ תת-המשימה כבר קיימת';
var MSG_TASK_EXISTS = '⚠️ המשימה כבר קיימת בקטגוריה';
var MSG_INFRA_TABLE = 'טבלת התשתית';
var MSG_SYNC_LOAD_FAIL = '⚠️ לא הצליח לטעון סנכרון';
// המסך הריק אינו מבטיח פעולה — אין במסך דרך להוסיף קטגוריה, וקטגוריות המוסד נבנות במסד.
var MSG_NO_CATS = '⚠️ אין קטגוריות למוסד הזה';
var MSG_SWITCH_YESHIVA = 'החלפת ישיבה';
var MSG_ALREADY_AT = 'כבר במוסד ';
var MSG_YESHIVA_UNKNOWN = '❌ הישיבה אינה מוכרת — לא נבחרה';
var MSG_BOOT_FAIL = '⚠️ שגיאה בעליית האפליקציה — נסה לרענן';
var MSG_NOTHING_TO_SHARE = 'אין רשומות לשיתוף להיום';
var MSG_IMG_PREP = 'מכין תמונה...';
var MSG_EDIT_FORM_CLOSED = '⚠️ טופס העריכה נסגר — נסה שוב';
var MSG_ROW_GONE = '⚠️ הרשומה לא נמצאה — לא נשמר';
var MSG_CLEAR_ALL_TITLE = '🗑 מחיקת כל הרשומות';
var MSG_CLEAR_ALL_BODY = 'האם למחוק את כל רשומות היום הנוכחי?';
// ── מדיניות האחסון המקומי ──
// עד שנבחר מוסד המדיניות ריקה — אין עֵד סנכרון למוסד שלא נטען.
var LS_CFG = {
  // cachePrefix נגזר משם האפליקציה שבתצורה ולא מקידומת האחסון — שם אחסון שישתנה היה מחזיר רשימה ריקה, והבאנר היה חוזר בכל טעינה.
  cachePrefix: self.APP.id + '-',
  logKey: 'ya_ls_log',
  hzPrefix: 'ya_ls_hz_',
  // הסימן נושא את תחילית האפליקציה — ה-origin משותף, וסימן אחד היה נדרס בכל דחייה.
  dismissKey: 'ya_sw_dismissed',
  // מפתח פר-מוסד מוצהר לכל המוסדות ולא לפעיל בלבד — המוסד שאינו פתוח הוא נתון שממתין, ולא שארית.
  keys: function () {
    var out = [LS_CFG.logKey, LS_CFG.dismissKey, DEV_CFG.key].concat(eraKeys());
    YESHIVOT.forEach(function (y) {
      var sfx = yaSuffix(y.id);
      yaLsBases().forEach(function (b) { out.push(b + sfx); });
    });
    return out;
  },

  // חלון הפינוי נגזר מסוג האפליקציה — אין מספר ימים באף רשומה.
  appType: { type: 'annual', why: 'החישוב שלה נפרש על שנה — ⚠️ דוח יום נבנה מרשומות היומן ומתצלומי הארכיון, ⛔ והם נקראים לאורך שנת העבודה' },

  // אין כאן מטמון-מהירות לזרוק — כל מפתח ya_ הוא העותק המקומי עצמו, ומחיקתו מרוקנת את המסך אופליין.
  wholeKeys: [],
  // oldRecords נבנית מחדש בכל בחירת מוסד — המפתחות נושאים סיומת מוסד.
  oldRecords: [],
  // מפתח שגדל ואינו בפינוי ממלא את האחסון המשותף וחונק את כל האפליקציות שעל ה-origin.
  fixedSize: [

// ── קריאה וכתיבה של kv ──

// כתיבת אות הפולינג בלבד — ההגדרות עוברות בשכבת הדחיפה.

async function sbSet(key, value) {

    if (ctxStale(_ep)) return { ok: false, error: "ההקשר התחלף", ctxStale: true };
    if (res.error) {

// מפתח חסר (PGRST116 מ-single()) הוא תוצאה ריקה ולא כשל.
async function sbGetResult(key) {

async function sbGet(key) {

  return r.data;

// ── מנוע המיזוג ברמת רשומה ──

// ── סדר רשומות היומן ──

// הרשומות שבתוך הסנאפשוט ממוזגות אחת-אחת — אחרת שני מכשירים שהוסיפו לאותו יום דורסים זה את זה.

// tasks ממוזג פר-פריט לפי tasksMeta — מיזוג ברמת רשומה היה מחליף את המערך כולו.

// מחיקת פריט מורידה אותו מהמערך ומקדמת את חותמת המפתח; מחיקת מפתח שלם היא סימון ב-SUBS_META ולא היעדר.

// צד שאינו מכיר את המפתח אינו מכריע עליו — אחרת מפתח שנוצר אופליין יורד במשיכה הראשונה.

// ── שכבת השורות בענן ──
// היומן והארכיון בטבלה אחת ומופרדים בעמודת archived; הסנאפשוט הוא יחידת הארכיון — שורה ליום.

// ── סדר טעינה יציב ──

// רשומה ממתינה נחשבת תמיד לדחיפה — בלי בדיקת הממתין היא נשארת מסומנת לנצח ואינה נדחפת.

  var map = _yaRemote[kvKey] || (_yaRemote[kvKey] = {});

function saveCats() {
  lsSet("ya_cats"+LS, JSON.stringify(CATS));
  yaSetDirty(['cats']);
}
// ── ההגדרות ──
// הכתיבה אינה פונה לענן — המפתח מסומן ממתין ונדחף ב-schedulePush.

  return Object.keys(YA_SET_VALUES).filter(function (k) { return pendHas(PK_SET + k); })
    .map(function (k) {

var SUBS_META = {};

  // הקלט נשמר בפורמט השמור בלבד, ובהיעדרו מפתח היום — gdate ריק שובר את הארכוב ואת סינון היומן.
  return p ? gregKeyFromParts(p) : getTodayKey();
}

function getTodayKey() {
  return gregDateStr(new Date());
}

function arcShowLevel(level) {
  ["years", "months", "days", "detail"].forEach(function (x) {
    showEl(document.getElementById("arc-" + x), x === level);
  });
}
// הסתרה במחלקה ולא ב-style.display — סגנון מוטבע גובר על כל מחלקה בגיליון.
function showEl(el, on) { if (el) el.classList.toggle("is-hidden", !on); }
function showTab(name, el) {
  document.querySelectorAll(".panel").forEach(function(p){ showEl(p, false); });
  document.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.remove("active"); });
  showEl(document.getElementById("panel-"+name), true);
  el.classList.add("active");
  renderTab(name);
}
// מעבר לשונית ורענון אחרי שמירה מציירים דרך אותה נקודה — שני מרשמים נבדלים ביום שנוספת לשונית.
function renderTab(name) {
  if (name === "log") renderLog();
  if (name === "settings") renderSettings();
  if (name === "archive") renderArchive();
}
// רענון אינו ניווט — שמירה שמנווטת מוציאה את המשתמש מהמקום שבו הוא עומד.
function saveRefresh() {
  var on = document.querySelector(".tab-btn.active");
  var p = document.querySelector('.panel:not(.is-hidden)');
  if (p && p.id) renderTab(String(p.id).replace(/^panel-/, ""));
  else if (on) renderTab("log");
}

function gregDateStr(jsDate) {
  var d = jsDate.getDate(), m = jsDate.getMonth()+1, y = jsDate.getFullYear();
  return d + " " + GREG_MONTHS_HE[m-1] + " " + y;
}

function checkDayChange() {
  var lastDay = lsGet("ya_last_day"+LS) || "";
  var today = new Date().toDateString();
  if (lastDay && lastDay !== today && liveOnly(ENTRIES).length > 0) {
    // ארכוב מקומי בלבד — syncFromCloud רץ מיד אחרי, ודחיפת ENTRIES ריק הייתה מוחקת רשומות שמכשיר אחר הוסיף להיום.
    var prev = new Date(lastDay);
    var live = liveOnly(ENTRIES);
    // שדות היום נגזרים מהרשומות קודם — הן נכתבו עם התאריך שבו עבדו בפועל; השעון הוא נפילה-חזרה.
    var withG = live.find(function(e){ return e && e.gdate; });
    var withH = live.find(function(e){ return e && hasHebMonth(e.hdate); });
    var withD = live.find(function(e){ return e && e.day; });
    var gdate = (withG && withG.gdate) || gregDateStr(prev);
    // hebrewDate מחזירה מחרוזת ריקה כשהלוח אינו זמין — hdate ריק שולח את הסנאפשוט לדלי «לא ידוע».
    var hdate = (withH && withH.hdate) || hebrewDate(prev) || "";
    var dayKey = (withD && withD.day) || DAY_VALUE_MAP[prev.getDay()] || "";
    // אותה חותמת לעותקים שבארכיון ול-tombstones — בשוויון הסנאפשוט מנצח, ולכן ארכוב אינו מחיקה מהארכיון.
    var ts = Date.now();
    var carried = JSON.parse(JSON.stringify(live));
    carried.forEach(function(e){ recTouch(e, ts); });
    // אותו בונה כמו המסלול הידני — auto הוא סימון מקור בלבד; שני בונים הם שני סנאפשוטים שונים לאותו יום.
    arcPutSnapshot(dayKey, hdate, gdate, carried, ts, { auto: true });
    lsSetArray("ya_archive"+LS, hwDiskFilter('ya_archive'+LS, ARCHIVE), _yaRecTs);
    // tombstones ולא ENTRIES = [] — אחרת הענן מחזיר את הרשומות לחיים
    ENTRIES.forEach(function(e){ if (isLive(e)) recDelete(e, ts); });
    lsSetArray("ya_entries"+LS, ENTRIES, _yaRecTs);
    toast(MSG_DAY_ARCHIVED, null, 'good');
  }
  lsSet("ya_last_day"+LS, today);
}

function initDate() {
  var now = new Date();
  var hd = hebrewDate(now);
  var gd = gregDateStr(now);
  document.getElementById("hebDateInput").value = hd;

// getDay() מתחיל ב-0 = ראשון
var DAY_LABEL_MAP = ["ראשון","שני","שלישי","רביעי","חמישי","ערב שבת","מוצ\"ש"];
var DAY_VALUE_MAP = ["יום ראשון","יום שני","יום שלישי","יום רביעי","יום חמישי","ערב שבת","מוצאי שבת"];

function autoSelectTodayChip() {
  var dow = new Date().getDay();
  var label = DAY_LABEL_MAP[dow] || "";
  var value = DAY_VALUE_MAP[dow] || "";
  selDay = value;
  document.querySelectorAll(".day-chip").forEach(function(b){
    b.classList.remove("active");
    if (b.textContent.trim() === label) b.classList.add("active");
  });
}

function pickDay(el, day) {
  selDay = day;
  document.querySelectorAll(".day-chip").forEach(function(b){ b.classList.remove("active"); });
  el.classList.add("active");
  syncDatesToDay(day);
  renderLog();
}

function syncDatesToDay(dayValue) {
  var targetDow = DAY_VALUE_MAP.indexOf(dayValue);
  if (targetDow < 0) return;
  var now = new Date();
  var currDow = now.getDay();
  var diff = targetDow - currDow;
  // נשאר בתוך השבוע הנוכחי — עד ±3 ימים
  if (diff > 3) diff -= 7;
  if (diff < -3) diff += 7;
  var target = new Date(now.getTime() + diff * 86400000);
  document.getElementById("hebDateInput").value = hebrewDate(target) || hebrewDate(now);
  document.getElementById("gregDateInput").value = gregDateStr(target);
}

function onGregDateChange() {
  var inp = document.getElementById("gregDateInput");
  var p = parseGregLike(inp.value);
  if (p) {
    var d = dayNoon(p.y, p.m - 1, p.d);
    var dow = d.getDay();
    var label = DAY_LABEL_MAP[dow] || "";
    var value = DAY_VALUE_MAP[dow] || "";
    selDay = value;
    document.querySelectorAll(".day-chip").forEach(function(b){
      b.classList.remove("active");
      if (b.textContent.trim() === label) b.classList.add("active");
    });
    document.getElementById("hebDateInput").value = hebrewDate(d) || document.getElementById("hebDateInput").value;
    renderLog();
  }
}

function buildCatGrid() {

    btn.dataset.letter = cat.letter;

// הקטגוריה נמצאת לפי האות שב-DOM — סגור פר-כפתור הוא מאזין ישיר, בדיוק מה שההאצלה מונעת.
function pickCat(letter) {

  CATS.forEach(function (c) { if (c && String(c.letter) === String(letter)) hit = c; });
  if (!hit) { console.error('[cat] אין קטגוריה לאות: ' + letter); return; }

function buildTaskBtns() {

// הכפתור מגיע כארגומנט — בהאצלה currentTarget הוא document, וההבזק היה נצבע על כל הדף.

function buildSubBtns() {

function pickSub(s, btn) {

function tapFlash(btn) {

// ── בניית סנאפשוט ארכיון ──
// מסלול יצירה אחד ל-autoArchiveDay ול-checkDayChange — סנאפשוט בלי gdate, hdate ו-day נופל לדלי «לא ידוע».
// אינה כותבת לענן — checkDayChange חייבת להישאר מקומית עד המיזוג שאחריה.
function arcPutSnapshot(dayKey, hdate, gdate, dayEntries, ts, extra) {
  if (!gdate) return null; // סנאפשוט עם gdate ריק הוא זבל בלי מפתח מיזוג
  var existIdx = ARCHIVE.findIndex(function(a){ return a.gdate === gdate && isLive(a); });
  var exist = existIdx >= 0 ? ARCHIVE[existIdx] : null;
  // מיזוג ולא החלפה: הסנאפשוט הקיים הוא הצד המרוחק — רשומה שאורכבה לא נמחקת כשעותקה החי הפך ל-tombstone,
  // אבל מחיקה אמיתית עם updatedAt חדש יותר עוברת.
  var mergedEntries = mergeRecords(
    JSON.parse(JSON.stringify(dayEntries)),
    exist ? (exist.entries || []) : [],
    entryKey
  );
  var snapshot = {
    id: exist ? exist.id : ts,
    name: hdate || (exist ? exist.name : "") || "",
    hdate: hdate || (exist ? exist.hdate : "") || "",
    gdate: gdate,
    day: dayKey || (exist ? exist.day : "") || "",
    date: gdate,
    entries: mergedEntries,
    count: liveOnly(mergedEntries).length,
    updatedAt: ts
  };
  if (extra) Object.keys(extra).forEach(function(k){ snapshot[k] = extra[k]; });
  if (exist) ARCHIVE[existIdx] = snapshot; else ARCHIVE.unshift(snapshot);
  return snapshot;
}

function autoArchiveDay(dayKey, hdate, gdate) {
  // סינון לפי gdate ולא לפי שם היום — שמות ימים חוזרים בכל שבוע.
  if (!gdate) return;
  // כולל tombstones — כך שמחיקה מהיומן מגיעה גם לסנאפשוט של אותו יום
  var dayEntries = ENTRIES.filter(function(e){ return e.gdate === gdate; });
  if (!dayEntries.length) return;
  if (arcPutSnapshot(dayKey, hdate, gdate, dayEntries, Date.now(), null)) saveArchive();
}

function addEntry() {
  var task = document.getElementById("taskInput").value.trim() || selTask || "";
  var sub  = document.getElementById("subInput").value.trim() || selSub || "";
  var notes = document.getElementById("notesInput").value.trim();
  var count = document.getElementById("countInput").value.trim();
  var hdate = document.getElementById("hebDateInput").value.trim();
  if (!selCat) { toast(MSG_PICK_CATEGORY, null, 'bad'); return; }
  if (!task)   { toast(MSG_NEED_TASK, null, 'bad'); return; }
  var now = new Date();
  var entry = {
    // newClientId ולא השעון — שני מכשירים באותה מילישנייה היו מקבלים אותו מזהה.
    id: newClientId(),
    // createdAt נפרד מהמזהה — הסדר נגזר ממנו, ו-uuid אינו ניתן להשוואה מספרית.
    createdAt: now.getTime(),
    day: selDay, hdate: hdate, gdate: getCurrentDateKey(),
    cat: selCat.letter,
    task: task, sub: sub, notes: notes, count: count,
    updatedAt: now.getTime() // בלעדיה הרשומה נחשבת ותיקה במיזוג
  };
  ENTRIES.unshift(entry);
  pendMark(PK_ENTRY + entry.id);
  saveEntries();
  autoArchiveDay(entry.day, entry.hdate, entry.gdate);
  clearForm();
  // אין טוסט כאן — הדחיפה שאחרי מודיעה את התוצאה.
  schedulePush();
}

function clearForm() {
  document.getElementById("taskInput").value = "";
  document.getElementById("subInput").value = "";
  document.getElementById("notesInput").value = "";
  document.getElementById("countInput").value = "";
  selTask = null; selSub = null;
  buildTaskBtns(); buildSubBtns();
}

function renderLog() {
  var list = document.getElementById("logList");
  var cnt  = document.getElementById("logCount");
  var curKey = getCurrentDateKey();
  var filtered = liveOnly(ENTRIES).filter(function(e){ return e.gdate === curKey; });
  cnt.textContent = filtered.length;
  if (!filtered.length) {
    list.innerHTML = '<div class="empty">📋<br>אין רשומות לתאריך זה</div>';
    return;
  }
  filtered = yaSortEntries(filtered);
  list.innerHTML = filtered.map(function(e) {
    var dateStr = [e.day, e.hdate, e.gdate ? "("+e.gdate+")" : ""].filter(Boolean).join("  ");
    return '<div class="entry-row cat-edge ' + catCls(e.cat) + '">'
      + '<div class="entry-badge cat-fill"></div>'
      + '<div class="entry-body">'
      + '<div class="e-main">' + esc(catNameOf(e)) + ' &larr; ' + esc(e.task) + (e.sub ? " &rarr; " + esc(e.sub) : "") + pendTag(PK_ENTRY + e.id) + '</div>'
      + (e.notes ? '<div class="e-sub">' + esc(e.notes) + '</div>' : '')
      + '<div class="e-meta">' + [dateStr, e.count ? "כמות: "+esc(e.count) : "", ].filter(Boolean).join(" | ") + '</div>'
      + '</div>'
      + '<button data-act="entry-edit" data-id="' + esc(e.id) + '" class="entry-edit">✏️</button>'
      + '<button class="del-btn" data-act="entry-del" data-id="' + esc(e.id) + '">✕</button>'
      + '</div>';
  }).join("");
}

function delEntry(id) {
  // tombstone ולא הסרה — מכשיר אחר רואה הסרה כ«רשומה שאינני מכיר» ומחזיר אותה לחיים.
  var deleted = ENTRIES.find(function(e){ return idEq(e.id, id) && isLive(e); });
  if (!deleted) return;
  recDelete(deleted);
  pendMark(PK_ENTRY + deleted.id);
  saveEntries();
  autoArchiveDay(deleted.day, deleted.hdate, deleted.gdate);
  renderLog();
  schedulePush();
}

function clearAll() {
  ask(MSG_CLEAR_ALL_TITLE, MSG_CLEAR_ALL_BODY, MSG_DELETE).then(function (yes) {
    if (!yes) return;
    var curKey = getCurrentDateKey();
    var ts = Date.now();
    var sample = ENTRIES.find(function(e){ return e.gdate === curKey; });
    ENTRIES.forEach(function(e){ if (e.gdate === curKey && isLive(e)) recDelete(e, ts); });
    saveEntries(); renderLog();
    // ה-tombstones עוברים גם לסנאפשוט של אותו יום — אחרת הארכיון ממשיך להציג אותן
    if (sample) autoArchiveDay(sample.day, sample.hdate, curKey);
    schedulePush();
  });
}

// שם המוסד נקרא מההגדרות לכל הפלטים — שם קשיח מוציא דוחות של מוסד אחד בשם השני.

// ── פלטים — PDF ותמונת הדוח ──
// הייצוא מצלם את הדוח ואינו בונה HTML חדש — מסמך שני מאבד את צבעי הקטגוריות שהמסך מראה.
function exportPDF() {
  var live = liveOnly(ENTRIES);
  if (!live.length) { toast(MSG_NO_ROWS); return; }
  // הכותרת נגזרת לפני הרינדור הא-סינכרוני — מסלול הארכיון משחזר את ENTRIES ואת שדה התאריך לפני שהרינדור מסתיים.
  var today = document.getElementById("hebDateInput").value || hebrewDate(new Date());
  var todayGreg = getCurrentDateKey();
  var fileTitle = "יומן עבודה " + today + " " + todayGreg;
  toast(MSG_PDF_PREP);
  _buildReportDiv(function (div) {
    _renderReport(div).then(function (canvas) {
      _hideReportDiv(div);
      _printCanvas(canvas, fileTitle);
    }).catch(function (e) { _reportError(div, e); });
  }, live);
}
// מעטפת הדפסה לצילום בלבד — אין בה טבלה, כותרת או צבע, רק הפיקסלים שנמדדו.
function _printCanvas(canvas, title) {
  var w = null;
  try { w = window.open("", "_blank", "width=900,height=700"); } catch (e) { w = null; }
  // חוסם חלונות קופצים מחזיר null — בלי הבדיקה הפונקציה נופלת בשקט.
  if (!w || !w.document) {
    toast(MSG_POPUP_BLOCKED, null, 'bad');
    return;
  }
  w.document.write('<!DOCTYPE html><html dir="rtl" lang="he"><head><meta charset="UTF-8">'
    + '<title>' + esc(title) + '</title><style>@page{size:A4 portrait;margin:10mm}'
    + 'html,body{margin:0;padding:0;background:var(--card)}img{width:100%;height:auto;display:block}'
    + '</style></head><body><img alt="' + esc(title) + '" src="' + canvas.toDataURL('image/png') + '">'
    + '<' + 'script>window.onload=function(){setTimeout(function(){window.print();},500);}<\/script>'
    + '</body></html>');
  w.document.close();
  setTimeout(function () { try { w.document.title = title; } catch (e) {} }, 80);
}

// ── רשת ביטחון לרינדור הדוח ──
// פאנל _rpDiv מוצג לפני הרינדור — אם הרינדור זורק (html2canvas לא נטען אופליין, או כשל canvas/CORS)
// הפאנל היה נשאר מעל האפליקציה עד רענון.
function _hideReportDiv(div){
  showEl(div, false);
}
function _reportError(div, e){
  _hideReportDiv(div);
  console.error('[report] rendering failed:', e);
  toast(
    (typeof html2canvas === 'undefined')
      ? MSG_IMG_OFFLINE
      : MSG_IMG_FAIL
  , null, 'bad');
}
// מחזירה תמיד promise ואינה זורקת סינכרונית — זריקה הייתה משאירה את פאנל הדוח על המסך.
function _renderReport(div){
  if (typeof html2canvas !== 'function') {
    return Promise.reject(new Error('html2canvas not loaded'));
  }
  try {
    return Promise.resolve(
      html2canvas(div,{scale:2,useCORS:true,backgroundColor:getComputedStyle(div).backgroundColor,logging:false})
    );
  } catch(e) {
    return Promise.reject(e);
  }
}

// entries אופציונלי — הייצוא מוסר את רשומות הארכיון, וסינון קשיח ליום הנוכחי היה מוציא דוח ריק.
// הדוח נצרב לתמונה ונושא את סגנונו מוטבע; שורשו .rp מחיל את הערכה הבהירה גם במצב כהה,
// וכל צבע הוא var(--…) — html2canvas קורא את הסגנון המחושב, והמשתנה נפתר לפני הצריבה.
function _buildReportDiv(cb, entries){
  var div=document.getElementById('_rpDiv');
  if(!div){div=document.createElement('div');div.id='_rpDiv';document.body.appendChild(div);}
  // שורש הפלט שנצרב לתמונה נושא את סגנונו מוטבע, וכך כל ילדיו — מחלקה כאן הייתה מפצלת את הדוח בין הגיליון לבונה.
  div.className='rp';div.style.cssText='position:fixed;top:0;left:0;background:var(--card);padding:20px;width:900px;direction:rtl;font-family:Heebo,Arial,sans-serif;z-index:9999;';
  var today=document.getElementById("hebDateInput")?document.getElementById("hebDateInput").value:hebrewDate(new Date());
  var todayGreg=getCurrentDateKey();
  var dayLabel=document.getElementById("dayNameEl")?document.getElementById("dayNameEl").textContent:'';
  var instTitle=instName();
  var logoEl=document.getElementById('appLogo')||document.querySelector('.hdr-logo');
  var logoUrl=logoEl?logoEl.src:'';
  var curKey = getCurrentDateKey();
  var src = Array.isArray(entries) ? entries

// ── שיתוף ──
// גוף הדחיפה בלי ההשהיה, בפונקציה משלו — כדי שמודול הניסיון החוזר יקרא לאותה דחיפה בדיוק.
async function yaSyncPushNow() {
    // t0 לפני הצילום — הורדת הסימון מרשומה שסומנה אחריו הייתה מאבדת אותה בשקט.
    var _t0 = Date.now();
    // ההקשר נלכד בכניסה — המסלול נקרא גם מהתקתוק המושהה וגם מהניסיון החוזר, ושניהם יכולים להתעורר בזמן ההחלפה.
    var _ep = ctxEpoch();
    var rEntries = await pushTable("ya_entries", ENTRIES);
    if (ctxStale(_ep)) return;
    var rArchive = await pushTable("ya_archive", ARCHIVE);
    if (ctxStale(_ep)) return;
    var rSet = await pushTable(SET_PUSH);
    if (ctxStale(_ep)) return;
    // אישור הממתין פר-קטגוריה גם כאן — זה מסלול הריקון האוטומטי, ובלעדיו הסימון שורד דחיפה שהצליחה והניסיון החוזר חוזר לנצח.
    // פר-קטגוריה ולא גורף — הצלחה באחת אינה ראיה לשנייה.
    if (rEntries.ok) pendConfirmPush(PK_ENTRY, _t0);
    if (rArchive.ok) pendConfirmPush(PK_ARC, _t0);
    if (!rEntries.ok || !rArchive.ok || !rSet.ok) {
      // אין לחתום last_changed על נתון שלא הגיע — מכשירים אחרים היו מושכים עותק ענני ישן מעל רשומות חדשות.
      // בלי רשת השמירה הצליחה במכשיר ואינה שגיאה; כשל עם רשת הוא שגיאה.
      if (!navigator.onLine) toast(MSG_SAVED_LOCAL, null, 'good');
      else toast(MSG_LOCAL_ONLY, null, 'bad');
      return;
    }
    // החותמת נכתבת אחרי הנתונים — מכשיר שרואה אותה מושך נתון שכבר בענן.
    // כאן, בשונה מ-plTouch(), הקורא זקוק לתוצאה כדי להזהיר את המשתמש.
    var stampTs = Date.now();
    var rTs = await plStampWrite(stampTs);
    if (ctxStale(_ep)) return;
    if (!rTs.ok) { toast(MSG_CLOUD_NO_FANOUT, null, 'bad'); return; }
    PL_CFG.note(stampTs);
    toast(MSG_SAVED_CLOUD, null, 'good');
}

// אין כאן פרמטר יעד — בורר המערכת בוחר; והחתימה היא חוזה עם Java, ומשתנה בשני הצדדים יחד.
// AndroidShareBridge (addWebMessageListener) נוסה ראשון — בו WebView עצמו אוכף את רשימת המקורות;
// AndroidShare (addJavascriptInterface) נשאר ל-WebView ישן מ-88, והמעטפת מאמתת בו את מקור הדף.
function _androidShareImage(canvas){
  try {
    var br = window.AndroidShareBridge;
    if (br && typeof br.postMessage === 'function') {
      br.postMessage(JSON.stringify({
        data: canvas.toDataURL('image/jpeg',0.95).split(',')[1],
        mime: 'image/jpeg'
      }));
      return true;
    }
    if (window.AndroidShare && typeof window.AndroidShare.shareImage === 'function') {
      var b64 = canvas.toDataURL('image/jpeg',0.95).split(',')[1];
      window.AndroidShare.shareImage(b64, 'image/jpeg');
      return true;
    }
  } catch(e) { /* נופל לשיתוף של הדפדפן */ }
  return false;
}

// ── מסך ההגדרות ──
// הסדר נקרא מהעץ אחרי הגרירה ולא מצמד מאיפה-לאן — גרירה על פני כמה שורות אינה קפיצה אחת.
// מדד שאינו מספר אינו נכנס לסדר.
function domOrder(list, kind, attr) {
  var out = [];
  for (var i = 0; i < list.children.length; i++) {
    var x = list.children[i];
    if (x.dataset && x.dataset.drag === kind) out.push(+x.dataset[attr]);
  }
  return out;
}
// קטגוריה מחוקה אינה ברשימה אך שומרת את מקומה במערך — סידור שמתעלם ממנה היה מזיז אותה.
function reorderKeep(arr, order) {
  var slots = order.slice().sort(function (a, b) { return a - b; });
  var out = arr.slice();
  for (var i = 0; i < order.length; i++) out[slots[i]] = arr[order[i]];
  return out;
}
function applyCatOrder(list, kind) {
  CATS = reorderKeep(CATS, domOrder(list, kind, 'idx'));
  saveCats();
  renderSettings();
  buildCatGrid();
}
function applyTaskOrder(list, kind) {
  var order = domOrder(list, kind, 'ti');
  var ci = +list.querySelector('[data-drag="' + kind + '"]').dataset.ci;
  CATS[ci].tasks = reorderKeep(CATS[ci].tasks, order);
  recTouch(CATS[ci]); // סדר המשימות הוא חלק מרשומת הקטגוריה
  saveCats();
  renderSettings();
}
function applySubOrder(list, kind) {
  var one = list.querySelector('[data-drag="' + kind + '"]');
  var ci = +one.dataset.ci, ti = +one.dataset.ti;
  var taskName = CATS[ci].tasks[ti];
  var sk = subKey(ci, taskName);
  if (!SUBS[sk]) { SUBS[sk] = SUBS[taskName] || []; }
  SUBS[sk] = reorderKeep(SUBS[sk], domOrder(list, kind, 'si'));
  touchSubKey(sk);
  saveSubs();
  renderSettings();
}

function editSubInline(ci, ti, si, oldVal, taskName) {

      var oldSk = subKey(ci, oldVal);

// הערך זהה במקרה ל-LS_SUCCESS_MUTE_MS אך הוא מושג אחר (משך תצוגה מול חלון השתקה) — אין לאחד.
var TOAST_DEFAULT_MS = 2500;


// מתמלא פר-מוסד מהדיסק בלבד — אין זרע מוטבע, וההיסטוריה מגיעה מהענן.
var ARCHIVE = [];


// ── הארכיון ──
var arcSelYear = null;
var arcSelMonth = null;
var arcSelDayKey = null; // מחרוזת gdate
var arcEditMode = false;

// אין בו מרחשון — monthKeyOf ממפה אותו לחשון, אחרת לאותה שנה שני כפתורי חשוון.
// אדר ואדר א׳/ב׳ חיים זה לצד זה — בכל שנה מופיע רק אחד מהם.
var HMO = ["תשרי","חשון","כסלו","טבת","שבט","אדר","אדר א׳","אדר ב׳","ניסן","אייר","סיון","תמוז","מנחם אב","אלול"];
// הדלי לא ידוע אינו נשמט מרשימת השנים — אחרת הרשומות שבו בלתי נגישות.
var HUNKNOWN = "לא ידוע";

function extractYM(hdate) {
  function unknown() { return {year: HUNKNOWN, month: HUNKNOWN, order: 99}; }
  if (!hdate) return unknown();
  if (!/ה׳תש/.test(hdate)) return unknown();
  var parts = normHDate(hdate).trim().split(" ");
  var year = "", month = "";
  for (var i = parts.length-1; i >= 0; i--) {
    if (parts[i].indexOf("׳") >= 0 && /ה׳תש/.test(parts[i])) { year = parts[i]; parts.splice(i,1); break; }
  }
  var hebrewParts = parts.filter(function(p) { return p && !/[0-9a-zA-Z]/.test(p); });
  month = monthKeyOf(hebrewParts.slice(1).join(" "));
  if (!year || HMO.indexOf(month) < 0) return unknown();
  return {year: year, month: month, order: HMO.indexOf(month)};
}

// ── שחזור התאריך העברי ──
// סדר הנפילה-חזרה: hdate תקין, חילוץ מתוך name, ורק אז לא ידוע; זו גזירת תצוגה ואינה כותבת לסנאפשוט.
// החיתוך אחרי אסימון השנה והשלה משמאל — extractYM קורא את החודש כ-slice(1), וכל תחילית מזיזה אותו.
function hebFromText(txt) {
  var t = normHDate(String(txt == null ? "" : txt))
            .replace(/\([^)]*\)/g, " ").replace(/\|/g, " ")
            .replace(/\s+/g, " ").trim();
  if (!t) return "";
  var p = t.split(" ");
  for (var j = 0; j < p.length; j++) {
    if (/ה׳תש/.test(p[j])) { p = p.slice(0, j + 1); break; } // hdate תקין נגמר בשנה
  }
  for (var i = 0; i < p.length; i++) {
    var cand = p.slice(i).join(" ");
    if (extractYM(cand).year !== HUNKNOWN) return cand;
  }
  return "";
}
function snapHDate(rec) {
  var h = normHDate((rec && rec.hdate) || "");
  if (extractYM(h).year !== HUNKNOWN) return h;
  var t = hebFromText(rec && rec.name);
  if (t) return t;
  // נפילה-חזרה שלישית מ-gdate — תצוגה בלבד; כתיבה לסנאפשוט הייתה משנה נתוני מסד בלי שהמנהל ביקש.
  var g = gdateParse(rec && rec.gdate);
  if (g) {
    // עוגן בצהריים מקומיים — מעבר לשעון חורף מפיל חצות ליום הקודם
    var hd = hebrewDate(dayNoon(g.y, g.m - 1, g.d));
    if (hd && extractYM(hd).year !== HUNKNOWN) return hd;
  }
  return h;
}

function getAllArchiveDays() {
  var days = {};

  liveOnly(ARCHIVE).forEach(function(snap) {
    var k = String(snap.gdate || snap.id);
    // סנאפשוט ישן בלי gdate ממופתח לפי id — בלי key הכפתור היה שולח מחרוזת ריקה ופותח יום שגוי.
    if (!days[k]) days[k] = {key:k, gdate:snap.gdate||"", hdate:snapHDate(snap), day:snap.day||"",
      name:normHDate(snap.name||""), entries:[], seen:{}, snapId:snap.id};
    // בדיקת seen נדרשת גם כאן — שני סנאפשוטים לאותו יום היו סופרים רשומה משותפת פעמיים.
    (snap.entries||[]).forEach(function(e){
      if (e && e.id != null) {
        if (days[k].seen[String(e.id)]) return;
        days[k].seen[String(e.id)] = true; // כולל tombstones
      }
      if (isLive(e)) days[k].entries.push(e);
    });
  });

  // הסנאפשוט קובע לרשומה שכבר נכנסה אליו — אחרי סיום יום העותק החי הוא tombstone, והרשומה עדיין בארכיון.
  ENTRIES.forEach(function(e) {
    var k = String(e.gdate || "");
    if (!days[k]) {
      if (!isLive(e)) return;
      days[k] = {key:k, gdate:e.gdate||"", hdate:snapHDate(e), day:e.day||"",
        name:normHDate([e.day,e.hdate,e.gdate?"| "+e.gdate:""].filter(Boolean).join(" ")), entries:[], seen:{}, snapId:null};
    }
    if (days[k].seen[String(e.id)]) return;
    days[k].seen[String(e.id)] = true;
    if (isLive(e)) days[k].entries.push(e);
  });

  return days;
}

function getYearsWithData() {
  var days = getAllArchiveDays();
  var years = {};
  Object.values(days).forEach(function(d) {
    var ym = extractYM(d.hdate);
    if (ym.year) years[ym.year] = true;
  });
  return years;
}

function monthsWithData(year) {
  var days = getAllArchiveDays();
  var months = {};
  Object.values(days).forEach(function(d) {
    var ym = extractYM(d.hdate);
    if (ym.year === year) months[ym.month] = true;
  });
  return months;
}

function getDaysInMonth(year, month) {
  var days = getAllArchiveDays();
  var result = [];
  Object.values(days).forEach(function(d) {
    if (!d.entries.length) return;
    var ym = extractYM(d.hdate);
    if (ym.year === year && ym.month === month) result.push(d);
  });
  var HEB_ORD = {"א":1,"ב":2,"ג":3,"ד":4,"ה":5,"ו":6,"ז":7,"ח":8,"ט":9,"י":10,"יא":11,"יב":12,"יג":13,"יד":14,"טו":15,"טז":16,"יז":17,"יח":18,"יט":19,"כ":20,"כא":21,"כב":22,"כג":23,"כד":24,"כה":25,"כו":26,"כז":27,"כח":28,"כט":29,"ל":30};
  function hdayNum(hdate) {
    var d = (hdate||"").split(" ")[0].replace(/[׳״]/g,"");
    return HEB_ORD[d] || 999;
  }
  result.sort(function(a,b){ return hdayNum(a.hdate) - hdayNum(b.hdate); });
  return result;
}

function getNowHebYM() {
  var hd = hebrewDate(new Date());
  return extractYM(hd);
}

  if (nowYM.year) allYears[nowYM.year] = true;

function arcDeleteEntry(gdateKey, entryId) {
  // tombstone בכל מקום שבו הרשומה מופיעה — בסנאפשוטים ובחי — באותה חותמת
  var ts = Date.now();
  ARCHIVE.forEach(function(snap) {
    var hit = false;
    (snap.entries||[]).forEach(function(e){ if (idEq(e.id, entryId) && isLive(e)) { recDelete(e, ts); hit = true; } });
    if (hit) { snap.count = liveOnly(snap.entries).length; recTouch(snap, ts); }
  });
  saveArchive();
  ENTRIES.forEach(function(e){ if (idEq(e.id, entryId) && isLive(e)) recDelete(e, ts); });
  saveEntries();
  renderArcDetail();
  renderArcBreadcrumb();
}

function arcAddEntry(gdateKey) {
  var days = getAllArchiveDays();
  var d = days[arcSelDayKey];
  if (!d) return;
  var catSel = document.getElementById("arc-add-cat");
  var taskSel = document.getElementById("arc-add-task");
  var notesSel = document.getElementById("arc-add-notes");
  if (!catSel || !taskSel) return;
  var letter = catSel.value;
  if (!CATS.some(function(c){ return c.letter === letter; })) return;
  // createdAt נפרד לסדר — uuid אינו ניתן להשוואה מספרית.
  var _now = Date.now();
  var newEntry = {
    id: newClientId(),
    createdAt: _now,
    day: d.day, hdate: d.hdate, gdate: d.gdate,
    cat: letter,
    task: taskSel.value, sub: "", notes: notesSel ? notesSel.value.trim() : "", count: "",
    updatedAt: _now
  };
  // יום בלי gdate מותאם לפי snapId — התאמה לפי gdate ריק הייתה בוחרת סנאפשוט שגוי.
  var snap = ARCHIVE.find(function(s){
    return isLive(s) && (d.gdate ? s.gdate === d.gdate : (d.snapId != null && idEq(s.id, d.snapId)));
  });
  if (snap) {
    snap.entries = snap.entries || [];
    snap.entries.unshift(newEntry);
    snap.count = liveOnly(snap.entries).length;
    recTouch(snap);
    saveArchive();
  } else {
    ENTRIES.unshift(newEntry);
    saveEntries();
  }
  renderArcDetail();
}

function renderArchive() {
  var nowYM = getNowHebYM();
  arcSelYear = nowYM.year || null;
  arcSelMonth = null;
  arcSelDayKey = null;
  arcEditMode = false;

  arcShowLevel("years");

  renderArcYears();
  renderArcBreadcrumb();

  if (arcSelYear) {
    arcGoMonths(arcSelYear);
    if (nowYM.month) {
      arcGoDays(arcSelYear, nowYM.month);
    }
  }
}


function exportArchivePDF(id) {
  var snap = ARCHIVE.find(function(s){ return idEq(s.id, id); });
  if (!snap) return;
  var savedEntries = ENTRIES;
  ENTRIES = liveOnly(snap.entries);
  var savedDay = selDay;
  selDay = snap.name;
  var origHeb = document.getElementById("hebDateInput").value;
  document.getElementById("hebDateInput").value = snap.name;
  exportPDF();
  ENTRIES = savedEntries;
  selDay = savedDay;
  document.getElementById("hebDateInput").value = origHeb;
}


// צרכנו היחיד של RAW_BASE הוא מציג טבלת התשתית — כתובת שנייה הייתה מקור אמת שני.
var GITHUB_USER = "ygtotlrl-lab";
var GITHUB_REPO = "yoman-avoda";
var RAW_BASE = "https://raw.githubusercontent.com/" + GITHUB_USER + "/" + GITHUB_REPO + "/main/";

var _lastKnownTimestamp = 0;
// נכתב על כל שיחה מוצלחת עם הענן, גם במשיכה — ולכן אינו עד דחיפה ואינו משמש לפינוי; העד הוא _yaPushedAt פר-מפתח.
var _yaLastSyncAt = 0, _yaNetWarned = false;
function _yaMarkSynced() {
  _yaLastSyncAt = Date.now();
  // הכשל נשאר שקט (פולינג כל 3 שניות — טוסט בכל מחזור היה רעש), אבל החזרה נאמרת.
  if (_yaNetWarned) { _yaNetWarned = false; toast(MSG_SYNC_BACK, null, 'good'); }
  // הגיבוי והיומן אינם נתלים כאן — מנגנון שרץ רק כשהסנכרון רץ נעצר בדיוק כשאין סנכרון; הם מופעלים בעלייה.
}
// אין כאן בדיקת חותמת — מסלול שני שמכריע מתי למשוך היה מקור אמת שני מול plTick.
async function yaPullFromCloud() {
  // ההקשר נלכד כאן — המשיכה רצה כל 3 שניות, והחלפת מוסד בזמן משיכה בטיסה
  // הייתה כותבת רשומות של מוסד אחד למפתח של השני, אחרי שמפת החותמות כבר אופסה.
  var _ep = ctxEpoch(), _ls = LS;
  try {
    console.log("[sync] pulling data...");

    // מיזוג ברמת רשומה ולא החלפה — blob ישן עם חותמת חדשה היה מוחק עבודה שמכשיר אחר הרגע הקליד.
    // כשל מחזיר אין ראיה ולא ענן ריק — מיזוג מול מערך ריק מוחק את מה שטרם עלה.
    var _rowsE = await yaRowsGet('ya_entries');
    if (ctxStale(_ep)) { console.warn('[sync] ההקשר התחלף באמצע — המשיכה נעצרה'); return; }
    if (_rowsE.ok) {
      var cloudEntries = _rowsE.data;
      if (Array.isArray(cloudEntries)) {
        ENTRIES = mergeEntries(ENTRIES, cloudEntries);
        ENTRIES.sort(function(a,b){ return entryOrderTs(b) - entryOrderTs(a); });
        lsSetArray("ya_entries"+_ls, ENTRIES, _yaRecTs);
        pullRender(renderLog);
        console.log("[sync] merged, entries=" + liveOnly(ENTRIES).length +
                    " (+" + (ENTRIES.length - liveOnly(ENTRIES).length) + " tombstones)");
      }
    }
    var _rowsA = await yaRowsGet('ya_archive');
    if (ctxStale(_ep)) { console.warn('[sync] ההקשר התחלף באמצע — המשיכה נעצרה'); return; }
    if (_rowsA.ok) {
      hwNoteCloud('ya_archive'+_ls, _rowsA.data); // ראיה עננית לשער הדיסק
      var cloudArchive = _rowsA.data;
      if (Array.isArray(cloudArchive)) {
        ARCHIVE = mergeArchive(ARCHIVE, cloudArchive);
        lsSetArray("ya_archive"+_ls, hwDiskFilter('ya_archive'+_ls, ARCHIVE), _yaRecTs);
        var arcPanel = document.getElementById("panel-archive");
        if (arcPanel && !arcPanel.classList.contains("is-hidden") && arcSelDayKey) pullRender(renderArcDetail);
      }
    }
  } catch(e) { _yaNetWarned = true; console.error("[sync] error:", e); }
}

// ── מציג טבלת התשתית ──
// הקובץ נמשך בזמן אמת ואינו מוטבע — עותק בקוד מתיישן; וכשל משיכה מוצג גלוי, שמסך ריק נקרא כאין נתונים.
var YA_INF_MD = RAW_BASE + 'TABLE.md';

// הפרדה על | משאירה תא ריק בשני הקצוות
function _infCells(line) {
  var p = line.split('|');
  if (p.length && p[0].trim() === '') p.shift();
  if (p.length && p[p.length - 1].trim() === '') p.pop();
  return p.map(function (x) { return x.trim(); });
}
// ההמרה אחרי esc — המרה לפניו הייתה מחזירה HTML מהקובץ אל תוך הדף.
function _infMd(t) {
  return esc(t).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
               .replace(/`([^`]+)`/g, '<code>$1</code>');
}
// תא שאינו אחד משלושת הסימנים מוצג כפי שהוא ואינו נבלע.
// שם אפליקציה בלי סמל מוצג באות הראשונה — אפליקציה שנוספה לטבלה אינה נעלמת.
var INF_ICONS = {
  'יומן': '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v18"/><path d="M12 8h4M12 12h4M12 16h4"/>',
  'הנהלה': '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M15 11l2 2 4-4"/>',

  'גיוס': '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',

};
function _infAppTh(a) {
  var icoSvg = INF_ICONS[a];
  var cellHtml = icoSvg
    ? '<svg class="inf-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + icoSvg + '</svg>'
    : '<span class="inf-ico-l" aria-hidden="true">' + esc(String(a).charAt(0)) + '</span>';

function _infDot(cell) {
  if (cell === '✅') return '<span class="inf-dot ok" title="תקין"></span>';
  if (cell === '⭕') return '<span class="inf-dot gap" title="חסר-מנומק"></span>';
  if (cell === '❌') return '<span class="inf-dot bad" title="לא מטופל"></span>';
  return esc(cell);

// אין כאן סיכום כללים — הטבלה היא ההוראה, ואין פרק כללים לפרק.
function _infParse(md) {
  var lines = md.split('\n');
  var chaps = [], chap = null, cats = [], cur = null, rows = [], apps = null, width = 0;
  for (var i = 0; i < lines.length; i++) {
    var l = lines[i];
    // כל פרק נפתח בטבלה משלו — ולכן הקטגוריה שמעליו נסגרת כאן.
    if (l.indexOf('### ') === 0) {
      chap = { title: l.slice(4).trim(), cats: [] };
      chaps.push(chap);
      cur = null;
      continue;
    }
    if (l.charAt(0) !== '|') continue;
    var c = _infCells(l);
    // האפליקציות נגזרות מהעמודות שבין מה זה להערה — רשימה מוקלדת הייתה מציגה עמודה תחת כותרת של אחרת.
    if (c[0] === '#') { apps = c.slice(3, -1); width = c.length; continue; }
    if (!width || c.length !== width) continue;
    // שורת סדר-הפנים אינה שורת נתונים ואינה כותרת — בלי הענף הזה היא נקראת ונזרקת.
    if (c[0] === '' && cur && c[1].charAt(0) === '↳') {
      cur.order = c[1].slice(1).trim();
      continue;
    }
    // כותרת הקטגוריה מזוהה בתא המספר הריק ולא בהדגשה
    if (!chap) { chap = { title: '', cats: [] }; chaps.push(chap); }
    if (c[0] === '') {
      cur = { title: c[1].replace(/\*\*/g, ''), order: '', rows: [] };
      cats.push(cur);
      chap.cats.push(cur);
      continue;
    }
    if (!/^\d+$/.test(c[0])) continue;
    var row = { n: Number(c[0]), name: c[1], std: c[2],
                apps: c.slice(3, -1), note: c[c.length - 1] };
    rows.push(row);
    if (!cur) { cur = { title: '—', order: '', rows: [] }; cats.push(cur); chap.cats.push(cur); }
    cur.rows.push(row);
  }
  return { chaps: chaps, cats: cats, rows: rows, apps: apps || [] };
}
// הציור נפרד מהפירוק — פתח/סגור הכל מצייר מחדש בלי למשוך שוב.
function _infHtml(d) {
  var h = '<div class="inf">';
  h += '<div class="inf-hd"><b>טבלת התשתית</b>' +

  h += '<div class="inf-card">' +

       '<span class="inf-tag"><span class="inf-dot bad"></span> לא מטופל</span></div>';
  // כותרת הפרק אינה מתקפלת — פתח/סגור הכל חל על הקטגוריות בלבד.
  d.chaps.forEach(function (p) {
    if (p.title) h += '<h4 class="inf-chap">' + esc(p.title) + '</h4>';
    p.cats.forEach(function (c) {

           '<col class="c-r"></colgroup><thead><tr><th>#</th><th>כותרת</th><th>התקן</th>' +
           d.apps.map(_infAppTh).join('') +
           '<th>הערה</th></tr></thead><tbody>';
      c.rows.forEach(function (r) {
        h += '<tr><td>' + r.n + '</td><td>' + _infMd(r.name) + '</td><td>' + _infMd(r.std) + '</td>' +
             r.apps.map(function (a) { return '<td class="inf-app">' + _infDot(a) + '</td>'; }).join('') +
             '<td>' + _infMd(r.note) + '</td></tr>';
      });
      h += '</tbody></table></div></details>';

  h += '</div>';
  h += '</div>';
  return h;
}

// ── בחירת מוסד ואתחול ──
// ערך פגום אחד ב-localStorage זורק לפני startApp ומשאיר מסך ריק — לכן נופלים לברירת המחדל וממשיכים לעלות.
function lsRead(key, fallback, kind) {
  var raw;
  try { raw = lsGet(key); } catch(e) { console.warn('[load] localStorage לא זמין:', e); return fallback; }
  if (raw == null || raw === "") return fallback;
  var val;
  try { val = JSON.parse(raw); } catch(e) {
    console.warn('[load] ערך פגום ב-' + key + ' — חוזרים לערך הנפילה-חזרה שנמסר', e);
    return fallback;
  }
  var ok = (kind === 'array') ? Array.isArray(val)
         : (kind === 'object') ? (val && typeof val === 'object' && !Array.isArray(val))
         : (val != null);
  if (!ok) { console.warn('[load] סוג לא צפוי ב-' + key + ' — חוזרים לערך הנפילה-חזרה שנמסר'); return fallback; }
  return val;
}
function loadLocalData() {
  try {
    CATS = lsRead("ya_cats"+LS, null, 'array') || [];
    SUBS = lsRead("ya_subs"+LS, null, 'object') || {};
    // מפתח בלי חותמת הוא 0 — אינו נופל, אך מפסיד לכל עדכון מתוארך.
    SUBS_META = lsRead("ya_subs_meta"+LS, null, 'object') || {};
    _catsResetSeen = String(lsRead(CATS_RESET_LS+LS, '') || '');
    _subsResetSeen = String(lsRead(SUBS_RESET_LS+LS, '') || '');
    ENTRIES = lsRead("ya_entries"+LS, null, 'array') || [];
    // רשומות זבל (null או לא-אובייקט) אינן מפילות את הרינדור
    ENTRIES = ENTRIES.filter(function(e){ return e && typeof e === 'object'; });
    // הגריעה רצה שוב על תוצאת המיזוג — גריעה מקומית בלבד מוחזרת מהענן תוך שניות.
    var _beforePrune = ENTRIES.length;
    ENTRIES = prunePastTombstones(ENTRIES);
    if (ENTRIES.length !== _beforePrune) {
      console.log('[load] נגרעו ' + (_beforePrune - ENTRIES.length) + ' tombstones מעבר ל-TOMBSTONE_TTL_MS');
    }
    // אין זרע מוטבע לארכיון — זרע שמוזרק בכל טעינה ומיזוג מנצח tombstone ומחזיר יום שנמחק.
    var arr = lsRead("ya_archive"+LS, null, 'array');
    ARCHIVE = arr ? arr.filter(function(s){ return s && typeof s === 'object'; }) : [];
  } catch(e) {
    console.error('[load] טעינת נתונים מקומיים נכשלה — עולים ריקים ומחכים לענן', e);
    if (!Array.isArray(CATS)) CATS = [];
    if (!SUBS || typeof SUBS !== 'object') SUBS = {};
    if (!SUBS_META || typeof SUBS_META !== 'object') SUBS_META = {};
    if (typeof _catsResetSeen !== 'string') _catsResetSeen = '';
    if (typeof _subsResetSeen !== 'string') _subsResetSeen = '';
    if (!Array.isArray(ENTRIES)) ENTRIES = [];
    if (!Array.isArray(ARCHIVE)) ARCHIVE = [];
  }
}

// again מסמן מעבר בין מוסדות — pendBoot מוסיף מאזיני רשת בכל קריאה, ושאר ה-boot שומרים על עצמם.
function selectYeshiva(y) {
  // האיפוס כאן ולא אצל הקורא — לפונקציה שני קוראים, וקורא ששוכח לאפס מנטרל את כל שערי ההקשר.
  // הכניסה החוזרת נגזרת ואינה נמסרת — פרמטר שנשכח היה מריץ pendBoot פעמיים.
  var ent = yaYeshiva(y);
  if (!ent) { console.error('[switch] ישיבה שאינה במפה:', y); toast(MSG_YESHIVA_UNKNOWN, null, 'bad'); return; }
  var reentry = !!YESHIVA;
  if (reentry) yaResetTenantState();
  var again = reentry;
  YESHIVA  = y;
  KV_TABLE = ent.table;
  LS       = yaSuffix(y);

  var logoEl = document.getElementById('appLogo');
  if (logoEl) {
    var logo = ent.logo;
    if (logo) { logoEl.src = logo; logoEl.alt = 'לוגו'; }
    else { logoEl.removeAttribute('src'); logoEl.alt = ''; }
  }
  var sub = document.getElementById('hdrSub');
  if (sub) sub.textContent = ent.full;
  // כפתור שיתוף זהה בשני המוסדות — היעד נבחר בגיליון השיתוף של המערכת.
  var slot = document.getElementById('outputBtnSlot');
  if (slot) slot.innerHTML =
    '<button class="share-btn btn-sm" ' +
    'data-act="share-report">📤 שיתוף הדוח</button>';

  // המדיניות נבנית רק עכשיו כי המפתחות תלויי-מוסד; והפינוי לפני loadLocalData — כדי שהמיזוג יכתוב לאחסון שיש בו מקום.
  try { lsRebuildPolicy(); lsBoot(); } catch (e) { console.warn('[ls] lsBoot', e); }
  // הטעינה לפני כל boot שיכול לדחוף ואחרי lsBoot — אחרת דחיפה רצה כש-LS כבר חדש והזיכרון עדיין ישן.
  loadLocalData();
  // pendReload — מפתח הסימונים נושא סיומת מוסד, וסימון של מוסד אחד אינו תקף לשני.
  try { pendReload(); if (!again) pendBoot(); } catch (e) { console.warn('[pend] pendBoot', e); }
  try { tombBoot(); } catch (e) { console.warn('[tomb] tombBoot', e); }
  try { eraKick(); } catch (e) { console.warn('[era] eraKick', e); }
  // כאן ולא מוקדם יותר — BK_CFG.sources נשענת על KV_TABLE, שהוא null עד שנבחר מוסד.
  // ואין להעביר למסלול סנכרון — גיבוי שתלוי בסנכרון נעצר בדיוק כשאין סנכרון.
  try { bkBoot(); } catch (e) { console.warn('[bk] bkBoot', e); }
  try { hwBoot(); } catch (e) { console.warn('[hw] hwBoot', e); }
  try { rtyBoot(); } catch (e) { console.warn('[rty] rtyBoot', e); }
  // כאן ולא מוקדם יותר — KV_TABLE הוא null עד שנבחר מוסד, ותקתוק לפני כן היה שואל טבלה שאינה קיימת.
  try { plBoot(); } catch (e) { console.warn('[pl] plBoot', e); }
  var ov = document.getElementById('yeshivaSelect');
  showEl(ov, false);
  shellBare(false);
  // מסך הבחירה כבר נסגר — כישלון כאן חייב להשאיר אפליקציה שמישה ולא מסך ריק
  try {
    startApp();
  } catch(e) {
    console.error('[boot] startApp נכשל', e);
    toast(MSG_BOOT_FAIL, null, 'bad');
  }
}

// html2canvas לקובץ, ומשם לגיליון השיתוף של המערכת; בדסקטופ — הורדת התמונה.
function shareReport(){
  var curKey = getCurrentDateKey();
  var todayEntries = liveOnly(ENTRIES).filter(function(e){ return e.gdate === curKey; });
  if(!todayEntries.length){ toast(MSG_NOTHING_TO_SHARE); return; }
  toast(MSG_IMG_PREP);
  _buildReportDiv(function(div){
    _renderReport(div).then(function(canvas){
      _hideReportDiv(div);
      if (_androidShareImage(canvas)) return;
      canvas.toBlob(function(blob){
        var file = new File([blob], 'yoman.jpg', {type:'image/jpeg'});
        if (navigator.canShare && navigator.canShare({files:[file]})) {
          navigator.share({files:[file]}).catch(function(err){
            if (err && err.name !== 'AbortError') _shareDownloadFallback(canvas);
          });
          return;
        }
        _shareDownloadFallback(canvas);
      },'image/jpeg',0.95);
    }).catch(function(e){ _reportError(div, e); });
  });
}

function saveEntry(id) {
  var e = ENTRIES.find(function(x){ return idEq(x.id, id) && isLive(x); });
  if(!e) return;
  e.task = document.getElementById('ei_task').value.trim() || e.task;
  e.sub = document.getElementById('ei_sub').value.trim();
  e.count = document.getElementById('ei_count').value.trim();
  e.notes = document.getElementById('ei_notes').value.trim();
  recTouch(e); // בלי זה העדכון מפסיד במיזוג מול העותק הישן שבענן
  pendMark(PK_ENTRY + e.id);
  saveEntries();
  autoArchiveDay(e.day, e.hdate, e.gdate); // שהעריכה תגיע גם לסנאפשוט של אותו יום
  return true;
}

function arcEditEntry(gdateKey, entryId) {
  var days = getAllArchiveDays();
  var d = days[gdateKey];
  if(!d) return;
  var e = d.entries.find(function(x){ return idEq(x.id, entryId); });
  if(!e) return;
  // ההשוואה בערך ולא בבורר — מפתח היום עברי, ו-cssQ מסנן אותו לספרות בלבד.
  var target = null;
  document.querySelectorAll('[data-act="arc-entry-edit"]').forEach(function (b) {
    if (b.getAttribute('data-key') === gdateKey && idEq(b.getAttribute('data-id'), entryId)) target = b.closest('.arc-entry-row');
  });
  if(!target) return;
  target.innerHTML =
    '<div data-editing class="aei-row ksave">' +
    '<input aria-label="משימה" id="aei_task" value="' + esc(e.task||'') + '" placeholder="משימה" class="aei-inp">' +
    '<input aria-label="תת-משימה" id="aei_sub" value="' + esc(e.sub||'') + '" placeholder="תת-משימה" class="aei-inp">' +
    '<input aria-label="כמות" id="aei_count" type="text" inputmode="numeric" autocomplete="off" value="' + esc(e.count||'') + '" placeholder="כמות" class="aei-count">' +
    '<input aria-label="הערות" id="aei_notes" value="' + esc(e.notes||'') + '" placeholder="הרחבה" class="aei-notes">' +
    '<button data-act="arc-entry-save" data-ksave data-key="' + esc(gdateKey) + '" data-id="' + esc(entryId) + '" class="ei-save">שמור</button>' +
    '<button data-act="arc-entry-edit-cancel" data-kesc class="ei-cancel">בטל</button>' +
    '</div>';
}

function arcSaveEntry(gdateKey, entryId) {
  // גם ENTRIES — רשומה של יום שטרם אורכב הייתה no-op שמציג נשמר.
  var ts = Date.now();
  function fld(id) { var el = document.getElementById(id); return el ? el.value.trim() : null; }
  var vals = { task: fld('aei_task'), sub: fld('aei_sub'), count: fld('aei_count'), notes: fld('aei_notes') };
  if (vals.task === null) { toast(MSG_EDIT_FORM_CLOSED, null, 'bad'); return; }
  function apply(e) {
    e.task = vals.task; e.sub = vals.sub; e.count = vals.count; e.notes = vals.notes;
    recTouch(e, ts);
  }
  var hits = 0, touchedArc = [];
  ARCHIVE.forEach(function(snap) {
    var hit = false;
    (snap.entries||[]).forEach(function(e) {
      if (e && idEq(e.id, entryId)) { apply(e); hit = true; hits++; }
    });
    if (hit) { recTouch(snap, ts); touchedArc.push(archiveKey(snap)); }
  });
  ENTRIES.forEach(function(e) {
    if (e && idEq(e.id, entryId)) { apply(e); hits++; }
  });
  if (!hits) {
    console.warn('[arc] arcSaveEntry — רשומה לא נמצאה:', entryId, gdateKey);
    renderArcDetail();
    toast(MSG_ROW_GONE, null, 'bad');
    return;
  }
  pendMark(PK_ENTRY + entryId);
  // הסימון במפתח PK_ARC + archiveKey ולא במפתח המפה (gdate גולמי) — זה המפתח שהמיזוג, הדחיפה ושער הפינוי קוראים;
  // סימון במפתח אחר אינו נראה להם, והסנאפשוט הערוך עלול להתפנות לפני שעלה.
  touchedArc.forEach(function(k) { if (k != null) pendMark(PK_ARC + k); });
  saveEntries();
  saveArchive();
  renderArcDetail();
  renderLog();
  toast(MSG_SAVED, null, 'good');
}

bootOk();
</script>
<div id="modal" class="veil">
  <div class="sheet ksave" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="sheet-hd">
      <h3 id="modal-title"></h3>
      <button class="x" data-act="modal-close" aria-label="סגירה">✕</button>
    </div>
    <div class="sheet-bd" id="modal-body"></div>
    <div class="sheet-ft" id="modal-foot"></div>
  </div>
</div>
<div id="ask" class="veil">
  <div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="ask-title">
    <div class="sheet-hd"><h3 id="ask-title"></h3></div>
    <div class="sheet-bd" id="ask-body"></div>
    <div class="sheet-ft">
      <button data-act="ask-no">ביטול</button>
      <button class="danger" data-act="ask-yes" id="ask-yes">אישור</button>
    </div>
  </div>
</div>
</body>
