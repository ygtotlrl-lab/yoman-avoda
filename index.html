<!DOCTYPE html>

<body>
<div id="yeshivaSelect">
  <div class="ys-pick-card">
    <svg class="ys-pick-mark" viewBox="0 0 268 264" aria-hidden="true" focusable="false">
      <rect x="72" y="0" width="196" height="48" rx="24" opacity="0.6"></rect>
      <rect x="0" y="72" width="268" height="48" rx="24" opacity="0.73"></rect>
      <rect x="28" y="144" width="240" height="48" rx="24" opacity="0.87"></rect>
      <rect x="114" y="216" width="154" height="48" rx="24" opacity="1"></rect>
    </svg>
    <h1 class="ys-pick-h1">יומן עבודה</h1>
    <div class="ys-pick-lead">בחר ישיבה</div>
    <div class="ys-pick-btns">
      <button class="ys-pick-btn" data-act="pick-yeshiva" data-yeshiva="rishon">ראשון לציון</button>
      <button class="ys-pick-btn" data-act="pick-yeshiva" data-yeshiva="ramataviv">רמת אביב</button>
    </div>
    <!--  ⛔ מציג הטבלה יושב כאן ⛔ ולא בתוך הישיבה — ⚠️ הטבלה היא של הארגון
          ואינה שייכת למוסד, ⭐ ומסך שנפתח מתוך מוסד נקרא כאילו הוא מתאר
          אותו. ⛔ והכפתור מובחן משני הכפתורים שמעליו — ⚠️ הם בחירה
          שממשיכה לאפליקציה, ⭐ וזה מסך קריאה שחוזר לכאן.  -->
    <div class="ys-pick-aside">
      <button class="ys-pick-alt" data-act="inf-open">📊 טבלת התשתית</button>
    </div>
  </div>
</div>

<div class="app">

  <div class="hdr">
    <div class="hdr-top">
      <div class="hdr-logo-wrap"><button class="hdr-logo-btn" data-act="open-yeshiva-picker" aria-label="החלפת ישיבה" title="החלפת ישיבה"><img id="appLogo" class="hdr-logo" src="logos/rishon.png" alt="לוגו" /></button></div>
      <div class="hdr-mid">
        <div class="hdr-bh">ב״ה | ימות המשיח</div>
        <div class="hdr-title-wrap"><div class="hdr-h1">יומן עבודה</div></div>
        <div class="hdr-sub" id="hdrSub">ישיבת תומכי תמימים ליובאוויטש ראשון לציון</div>
      </div>
    </div>
    <div class="hdr-div"></div>
    <div class="hdr-yechi">יחי אדוננו מורנו ורבינו מלך המשיח לעולם ועד</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-act="show-tab" data-tab="entry">📝 הזנה</button>
    <button class="tab-btn" data-act="show-tab" data-tab="log">📋 יומן</button>
    <button class="tab-btn" data-act="show-tab" data-tab="settings">⚙️ עריכה</button>
    <button class="tab-btn" data-act="show-tab" data-tab="archive">🗄 ארכיון</button>
  </div>

  <!-- ENTRY -->
  <div class="u-d-block panel" id="panel-entry">
    <div class="card">
      <div class="card-ttl">תאריך ויום</div>
      <div class="date-row">
        <span class="date-lbl">יום:</span>
        <div class="day-chips">
          <button class="day-chip" data-act="pick-day" data-day="יום ראשון">ראשון</button>
          <button class="day-chip" data-act="pick-day" data-day="יום שני">שני</button>
          <button class="day-chip" data-act="pick-day" data-day="יום שלישי">שלישי</button>
          <button class="day-chip" data-act="pick-day" data-day="יום רביעי">רביעי</button>
          <button class="day-chip" data-act="pick-day" data-day="יום חמישי">חמישי</button>
          <button class="day-chip" data-act="pick-day" data-day="ערב שבת">ערב שבת</button>
          <button class="day-chip" data-act="pick-day" data-day="מוצאי שבת">מוצ"ש</button>
        </div>
        <!-- ⛔ תאריך עברי נשאר טקסט חופשי — אין בורר תאריך עברי
             מקורי בדפדפן, ואין לו inputmode או pattern שמתארים אותו;
             ⚠️ הערך נגזר ממילא מ-gregDateInput דרך hebrewDate(). -->
        <input aria-label="תאריך עברי" class="heb-inp" id="hebDateInput" type="text" autocomplete="off" placeholder="תאריך עברי..." />
        <!-- ⛔ בלי inputmode בכוונה — הפורמט המתקבל הוא dd/mm/yyyy או
             yyyy-mm-dd, ומקלדת המספרים של iOS אינה מציעה «/» ולא «-»;
             ⚠️ ה-pattern הוא רמז הצורה, וההכרעה נשארת ב-onGregDateChange
             שנכשל-סגור על כל קלט שאינו תואם לאחת משתי התבניות. -->
        <input aria-label="תאריך לועזי" class="u-minw-130 heb-inp" id="gregDateInput" type="text" pattern="\d{1,2}/\d{1,2}/\d{4}|\d{4}-\d{2}-\d{2}" autocomplete="off" placeholder="תאריך לועזי..." data-inp="greg-date" />
      </div>
    </div>

    <div class="card">
      <div class="card-ttl">קטגוריה ומשימה</div>
      <div class="cat-grid" id="catGrid"></div>
      <div class="qsec">
        <div class="qlbl">משימה</div>
        <div class="qrow" id="taskBtns"><span class="hint">בחר קטגוריה...</span></div>
      </div>
      <div class="qsec">
        <div class="qlbl">תת-משימה</div>
        <div class="qrow" id="subBtns"><span class="hint">בחר משימה...</span></div>
      </div>
      <div class="ksave">
      <div class="inp-grid">
        <div class="fld"><label for="taskInput">משימה (ידנית)</label><input id="taskInput" type="text" placeholder="הקלד..." /></div>
        <div class="fld"><label for="subInput">תת-משימה / פרטים</label><input id="subInput" type="text" placeholder="פרטים..." /></div>
      </div>
      <div class="inp-grid">
        <div class="fld"><label for="notesInput">הרחבה / הערות</label><input id="notesInput" type="text" placeholder="הערות..." /></div>
        <div class="fld"><label for="countInput">כמות</label><input id="countInput" type="text" inputmode="numeric" autocomplete="off" placeholder="1" /></div>
      </div>
      <button class="btn-add" data-act="add-entry" data-ksave>+ הוסף לסדר היום</button>
      </div>

    </div>
  </div>

  <!-- LOG -->
  <div class="u-d-none panel" id="panel-log">
    <div class="card">
      <div class="log-hd">
        <div class="u-m-0 card-ttl">רשומות יומן</div>
        <div class="log-cnt" id="logCount">0</div>
      </div>
      <div id="logList"><div class="empty">📋<br>עוד אין רשומות</div></div>
      <div class="exp-row">
        <button class="btn-sm btn-red" data-act="clear-all">🗑 נקה</button>
        <span id="outputBtnSlot"></span>
      </div>
    </div>
  </div>

  <!-- SETTINGS -->
  <div class="u-d-none panel" id="panel-settings">
    <div class="card">
      <div class="card-ttl">עריכת קטגוריות ומשימות</div>
      <div id="settingsEditor"></div>
      <button class="btn-save" data-act="save-settings">💾 שמור שינויים</button>
    </div>
    <!-- אזור מצב — שני האלמנטים האחרונים במסך, בסדר הזה -->
  </div>

  <!-- ARCHIVE -->
  <div class="u-d-none panel" id="panel-archive">
    <div class="card">
      <!-- Breadcrumb -->
      <div id="arc-breadcrumb" class="u-d-flex u-ai-c u-g-3 u-mb-5 u-fwr-wrap u-minh-28"></div>
      <!-- Level: years -->
      <div id="arc-years" class="u-d-block"></div>
      <!-- Level: months -->
      <div id="arc-months" class="u-d-none"></div>
      <!-- Level: days -->
      <div id="arc-days" class="u-d-none"></div>
      <!-- Level: day detail / edit -->
      <div id="arc-detail" class="u-d-none"></div>
    </div>
  </div>

</div>

<div id="toasts" aria-live="polite"></div>
<div id="updater">
  <div class="in">
    <span>🔄 גרסה חדשה זמינה</span>
    <button data-act="sw-apply">עדכן עכשיו</button>
    <button class="x" data-act="sw-dismiss" aria-label="סגור">✕</button>
  </div>
</div>

 *  ⭐ הקבוע כאן הוא מה שמפריד בין הגוף הזהה לערך שנבדל. */
/* ═══ עמידות אחסון מקומי — מודול משותף ═════════════════════════════════
   ⛔ שינוי כאן — כל האפליקציות **וכל עותקי השער**, באותו
      סבב: אחרת החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ══════════════════════════════════════════════════════════════════════════ */

/*  ⛔ המכסה היא מספר שנמדד בדפדפן — ⚠️ Chromium מקבל 10 MiB במדידת
 *  `lsEntryBytes` (תווים × 2) ⛔ ונופל ב-`QuotaExceededError` מעליהם:
 *  ⭐ מד שמראה יותר ממאה אחוז בזמן שהכתיבה מצליחה — מודד שגוי.
 *  ⛔ והספים נגזרים ממנה באחוזים — ⚠️ סף שמוקלד בבתים נשאר במקומו
 *  ביום שהמכסה נמדדת מחדש. */
var LS_QUOTA_BYTES = 10 * 1024 * 1024;
var LS_WARN_PCT    = 0.60;              // התרעה
var LS_CRIT_PCT    = 0.80;              // התרעה בולטת
var LS_WARN_BYTES  = Math.floor(LS_QUOTA_BYTES * LS_WARN_PCT);
var LS_CRIT_BYTES  = Math.floor(LS_QUOTA_BYTES * LS_CRIT_PCT);
var LS_SWEEP_PCT   = 0.60;              // מעל זה — פינוי יזום בעלייה
var LS_SWEEP_TO    = 0.45;              // יעד הפינוי היזום
var LS_LOG_MAX     = 12;                // אורך יומן הפינוי הנשמר

// נוסח אחיד בכל האפליקציות. סמלים: ✅ הצלחה / ⚠️ אזהרה / ❌ שגיאה, בתחילה.
var MSG_LS_FULL   = '❌ האחסון במכשיר מלא — לא ניתן לשמור. התחברו לרשת כדי שהנתונים יסונכרנו והמקום יתפנה.';
var MSG_LS_BLOCK  = '❌ האחסון במכשיר חסום — לא ניתן לשמור במכשיר.';
var MSG_LS_WARN   = '⚠️ האחסון המקומי מתמלא — התחברו לרשת, והמקום יתפנה מעצמו';
var MSG_LS_CRIT   = '⚠️ האחסון המקומי כמעט מלא — התחברו לרשת כדי שהמקום יתפנה';
var MSG_LS_RESTORED = '✅ האחסון התפנה — הנתונים הישנים חוזרים בסנכרון הזה';
var MSG_LS_PRUNED = '⚠️ נתונים ישנים פונו מהמכשיר מחוסר מקום — הם שמורים בענן ויחזרו כשתהיה רשת';

/*  ⛔ כל האפליקציות שחולקות את ה-origin — ⚠️ הקידומת היא מה שמזהה מי תופס
 *  מה, ⛔ והרשימה נמדדת מול כל הריפו: ⭐ אפליקציה שנולדה אחרי הרשימה
 *  נספרת כ«אחר», ⚠️ ואיש אינו רואה. */
var LS_APPS = [
  { id: 'hanhala', name: 'הנהלה רוחנית', pre: ['hr_'] },
  { id: 'schar',   name: 'שכר לימוד',    pre: ['sl_'] },
  { id: 'yoman',   name: 'יומן עבודה',   pre: ['ya_'] },
  { id: 'gius',    name: 'גיוס',         pre: ['g_', 'gius'] },
  { id: 'kupa',    name: 'הקופה',        pre: ['k_'] }
];

function lsFmtBytes(n) {
  n = Number(n) || 0;
  if (n < 1024) return n + ' ב׳';
  if (n < 1024 * 1024) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB';
  return (n / (1024 * 1024)).toFixed(2) + ' MB';
}
function lsAppOf(key) {
  var k = String(key == null ? '' : key);
  for (var i = 0; i < LS_APPS.length; i++) {
    for (var j = 0; j < LS_APPS[i].pre.length; j++) {
      if (k.indexOf(LS_APPS[i].pre[j]) === 0) return LS_APPS[i];
    }
  }
  return { id: 'other', name: 'אחר', pre: [] };
}
// UTF-16: שני בתים לתו, גם למפתח וגם לערך. הערכה, לא מדידה מדויקת — אבל
// עקבית, וזה מה שנדרש כדי להשוות מול הסף.
function lsEntryBytes(key, val) {
  return (String(key == null ? '' : key).length + String(val == null ? '' : val).length) * 2;
}

// מדידת **כל** המפתחות בדומיין, לא רק של האפליקציה הנוכחית — זה כל העניין:
// המכסה משותפת, ולכן אפליקציה שמסתכלת רק על עצמה לא רואה את מה שחונק אותה.
function lsUsage() {
  var out = { total: 0, quota: LS_QUOTA_BYTES, free: 0, pct: 0, apps: [], keys: [], ok: true };
  var byApp = {}, i;
  for (i = 0; i < LS_APPS.length; i++) byApp[LS_APPS[i].id] = { id: LS_APPS[i].id, name: LS_APPS[i].name, bytes: 0, count: 0 };
  byApp.other = { id: 'other', name: 'אחר', bytes: 0, count: 0 };
  try {
    for (i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k == null) continue;
      var v = '';
      try { v = localStorage.getItem(k) || ''; } catch (e) { }
      var b = lsEntryBytes(k, v), a = lsAppOf(k);
      out.total += b;
      out.keys.push({ key: k, bytes: b, app: a.id });
      if (!byApp[a.id]) byApp[a.id] = { id: a.id, name: a.name, bytes: 0, count: 0 };
      byApp[a.id].bytes += b; byApp[a.id].count++;
    }
  } catch (e) { out.ok = false; }
  out.keys.sort(function (x, y) { return y.bytes - x.bytes; });
  Object.keys(byApp).forEach(function (id) { if (byApp[id].count) out.apps.push(byApp[id]); });
  out.apps.sort(function (x, y) { return y.bytes - x.bytes; });
  out.free = Math.max(0, out.quota - out.total);
  out.pct = out.quota ? out.total / out.quota : 0;
  return out;
}

/* ── יומן הפינוי ────────────────────────────────────────────────────────
   הפינוי שקט כלפי המשתמש, אבל **לא בלתי נראה** — בלי יומן אי אפשר לדעת
   מתי ומה פונה. נשמר קצר בכוונה (12 רשומות) כדי שהיומן עצמו לא יהפוך
   לצרכן מקום. הכתיבה כאן גולמית ולא דרך `lsSet` — אחרת כישלון ביומן היה
   מפעיל פינוי שכותב ליומן, וחוזר חלילה. */
function lsSetRaw(key, value) {
  try { localStorage.setItem(key, value); return true; } catch (e) { return false; }
}
function lsLogRead() {
  try { var v = JSON.parse(localStorage.getItem(LS_CFG.logKey) || '[]'); return Array.isArray(v) ? v : []; }
  catch (e) { return []; }
}
function lsLog(action, detail, bytes) {
  var e = { t: Date.now(), a: String(action), d: String(detail == null ? '' : detail), b: Number(bytes) || 0 };
  try { console.info('[ls] ' + e.a + (e.d ? ' · ' + e.d : '') + (e.b ? ' · ' + lsFmtBytes(e.b) : '')); } catch (e1) { }
  try {
    var arr = lsLogRead();
    arr.push(e);
    while (arr.length > LS_LOG_MAX) arr.shift();
    lsSetRaw(LS_CFG.logKey, JSON.stringify(arr));
  } catch (e2) { }
}

// שמות הזריקה משתנים בין דפדפנים; code 22 הוא הישן, 1014 הוא של פיירפוקס.
function lsIsQuotaErr(e) {
  if (!e) return false;
  var n = e.name || '';
  return n === 'QuotaExceededError' || n === 'NS_ERROR_DOM_QUOTA_REACHED' ||
         e.code === 22 || e.code === 1014;
}

/* ── באנר כישלון קבוע ───────────────────────────────────────────────────
   טוסט נעלם אחרי שלוש שניות; כישלון שמירה חייב להישאר על המסך עד שהמשתמש
   סוגר אותו, אחרת הוא בדיוק "הכישלון השקט" שאנחנו מונעים. */
function lsAlert(msg) {
  var el = document.getElementById('ls-alert');
  if (!el) {
    el = document.createElement('div');
    el.id = 'ls-alert';
    el.setAttribute('role', 'alert');
    el.style.cssText = 'position:fixed;z-index:2147483000;left:0;right:0;top:0;background:var(--alert);' +
      'color:var(--on-alert);direction:rtl;text-align:center;font:700 14px/1.6 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;' +
      'padding:12px 46px;box-shadow:0 2px 14px var(--sh-3)';
    var sp = document.createElement('span');
    sp.id = 'ls-alert-msg';
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = '✕';
    b.setAttribute('aria-label', 'סגור');
    b.style.cssText = 'position:absolute;right:10px;top:9px;background:transparent;border:0;color:var(--on-alert);' +
      'font:700 17px/1 sans-serif;cursor:pointer;padding:4px 8px';
    b.dataset.act = 'ls-alert-close';
    el.appendChild(sp); el.appendChild(b);
    (document.body || document.documentElement).appendChild(el);
  }
  var m = document.getElementById('ls-alert-msg');
  if (m) m.textContent = String(msg == null ? '' : msg);
  el.style.display = '';
}

/* ── כתיבה מוגנת ────────────────────────────────────────────────────────
   **כל כתיבה ל-localStorage באפליקציה עוברת דרך כאן.** אין קריאה ישירה
   ל-`localStorage.setItem` מחוץ למודול הזה (למעט `lsSetRaw` שבתוכו).
   מחזירה true/false — ומסלול קריטי שמתעלם מהערך המוחזר הוא באג. */
var _lsSweeping = false;
var _lsToastAt = 0;

/* ── שער "אין טוסט הצלחה אחרי כישלון שמירה" ─────────────────────────────
   נקודת אכיפה **אחת** במקום עשרות בדיקות פזורות שאפשר לשכוח באחת: `toast()`
   של כל אפליקציה פותחת ב-`if (!lsGuardToast(msg)) return;`, וכל הודעה
   שמתחילה ב-✅ נבלעת אם כתיבה מקומית נכשלה בשתי וחצי השניות האחרונות —
   כלומר בתוך אותה פעולת משתמש. הבאנר האדום כבר על המסך, והוא ההודעה
   הנכונה. **אין להסיר את השורה הזו מ-`toast`** — בלעדיה חוזר בדיוק המצב
   שהסבב הזה בא למנוע: כתיבה שנכשלה ומשתמש שמקבל "נשמר בהצלחה". */
var _lsLastFailAt = 0;
var LS_SUCCESS_MUTE_MS = 2500;
function lsSuccessBlocked() { return (Date.now() - _lsLastFailAt) < LS_SUCCESS_MUTE_MS; }
function lsGuardToast(msg) {
  return !(String(msg == null ? '' : msg).indexOf('✅') === 0 && lsSuccessBlocked());
}
function lsSet(key, value) {
  var v = (value == null ? '' : String(value));
  try { localStorage.setItem(key, v); return true; } catch (e) {
    // בתוך פינוי — כישלון הוא תוצאה, לא טריגר לפינוי נוסף (רקורסיה).
    if (_lsSweeping) return false;
    _lsLastFailAt = Date.now();
    if (lsIsQuotaErr(e)) {
      // מנגנון חירום: פינוי נוסף לפי **אותו סדר** בדיוק, וניסיון אחד נוסף.
      var need = lsEntryBytes(key, v) + 64 * 1024;
      var freed = lsSweepGuarded('חירום — כתיבה נכשלה במכסה: ' + key, need);
      if (freed > 0) {
        // הצליח בניסיון השני — לא כישלון. חלון ההשתקה נסגר כדי שטוסט
        // ההצלחה יעבור, שהרי הנתון באמת נשמר.
        try { localStorage.setItem(key, v); _lsLastFailAt = 0; lsLog('כתיבה חוזרת הצליחה', key, 0); return true; }
        catch (e2) { e = e2; }
      }
      lsLog('❌ כתיבה נכשלה (מכסה)', key, lsEntryBytes(key, v));
      lsAlert(MSG_LS_FULL);
      lsToastThrottled(MSG_LS_FULL);
    } else {
      lsLog('❌ כתיבה נכשלה (אחסון חסום)', key, 0);
      lsAlert(MSG_LS_BLOCK);
      lsToastThrottled(MSG_LS_BLOCK);
    }
    try { console.warn('[ls] setItem נכשל עבור ' + key + ':', e && e.message); } catch (e3) { }
    return false;
  }
}
// הבאנר אידמפוטנטי ולכן מוצג בכל כישלון; הטוסט מווסת כדי שסדרת כתיבות
// כושלת לא תהפוך למטר טוסטים שמסתיר את ההודעה עצמה.
function lsToastThrottled(msg) {
  var now = Date.now();
  if (now - _lsToastAt < 8000) return;
  _lsToastAt = now;
  try { lsToast(msg, 6000, 'bad'); } catch (e) { }
}
function lsGet(key, fallback) {
  try {
    var v = localStorage.getItem(key);
    return v == null ? (fallback === undefined ? null : fallback) : v;
  } catch (e) { return fallback === undefined ? null : fallback; }
}
function lsRemove(key) {
  try { localStorage.removeItem(key); return true; } catch (e) { return false; }
}

/* ── אופק הפינוי ────────────────────────────────────────────────────────
   פינוי הרשומות הישנות גורע רשומות ישנות מהעותק **שעל הדיסק** בלבד. כדי שהן לא
   יחזרו לדיסק בשמירה הבאה (מנוע המיזוג מחזיר כל רשומה מרוחקת שאין לה
   מקבילה מקומית — ולכן פינוי בלי אופק הוא חסר משמעות), נשמר לכל מפתח
   "אופק": חותמת הזמן של הרשומה החדשה ביותר שפונתה. `lsSetArray` מסננת
   מתחתיו בכל כתיבה. **הזיכרון והענן לא נוגעים** — רק הדיסק מצטמצם. */
function lsHorizon(key) {
  var v = parseInt(lsGet(LS_CFG.hzPrefix + key, '0'), 10);
  return isFinite(v) && v > 0 ? v : 0;
}
function lsHorizonKeys() {
  var out = [];
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf(LS_CFG.hzPrefix) === 0) out.push(k);
    }
  } catch (e) { }
  return out;
}
function lsClearHorizons() {
  var ks = lsHorizonKeys();
  ks.forEach(lsRemove);
  if (ks.length) lsLog('אופק הפינוי נוקה', ks.length + ' מפתחות', 0);
  return ks.length;
}
/*  ⛔ אופק הפינוי נוקה מהסנכרון — ⚠️ **מה נכנס**: ירידה מתחת לסף האזהרה,
 *  ⛔ **ומה מפיל**: השארת האופק על כנו — ⭐ הסימן שהפינוי משאיר אומר «מכאן
 *  ואילך יש לי, את הישן זרקתי», ⚠️ וכל עוד הוא עומד המשיכה אינה מחזירה את
 *  הישן: ⛔ סימן שרק המשתמש יכול לנקות נשאר לנצח ביום שבו הכפתור יורד. */
function lsHorizonRelease() {
  try {
    if (!lsHorizonKeys().length) return 0;
    if (lsUsage().total >= LS_WARN_BYTES) return 0;
    var n = lsClearHorizons();
    if (n) { try { lsToast(MSG_LS_RESTORED, 5000, 'good'); } catch (e1) { } }
    return n;
  } catch (e) { return 0; }
}
// כתיבת מערך מכובדת-אופק. `tsOf(rec)` מחזירה חותמת זמן במילישניות.
function lsSetArray(key, arr, tsOf) {
  var list = Array.isArray(arr) ? arr : [];
  var hz = lsHorizon(key), keep = list;
  if (hz > 0 && typeof tsOf === 'function') {
    keep = list.filter(function (r) {
      var t = Number(tsOf(r));
      return !(isFinite(t) && t > 0 && t <= hz);
    });
  }
  return lsSet(key, JSON.stringify(keep));
}

/* ── פינוי יזום ─────────────────────────────────────────────────────────
   סדר קפדני:
     א. מטמונים וערכים שניתן לשחזר מהענן בכל רגע.
     ב. ארכיון ורשומות ישנות **שכבר מסונכרנות** — הישן ביותר קודם.
     ג. ⛔ נתון שטרם הסתנכרן לענן לא מפונה בשום מצב, גם אם המקום נגמר
        לגמרי. במצב כזה עדיף להיכשל ברעש מאשר למחוק. */
function lsSweepGuarded(reason, needBytes) {
  if (_lsSweeping) return 0;
  _lsSweeping = true;
  try { return lsSweep(reason, needBytes); }
  finally { _lsSweeping = false; }
}
function lsSweep(reason, needBytes) {
  var need = Number(needBytes) || 0, freed = 0, i;
  lsLog('פינוי התחיל', reason, 0);

  // ⛔ כלל ג נאכף לפני **שתי** הרשימות: יש **משהו** בתור שטרם עלה
  // לענן ⇒ אי אפשר לדעת מה כבר בטוח שם, ולא מפנים דבר. ⚠️ פינוי המפתחות השלמים הוא
  // המסוכן מבין השניים דווקא — הוא מוחק **מפתח שלם**, ומפתח שנכתב
  // מקומית-תחילה ופונה לפני שנדחף אינו חוזר משום מקום. ⛔ ומחסום אחד
  // לשתי הרשימות ולא שניים: תנאי שנכפל הוא תנאי שאחד מעותקיו יתיישן.
  if (LS_CFG.pending && LS_CFG.pending()) {
    lsLog('פינוי דולג', 'יש נתונים שטרם סונכרנו — לא מפנים דבר', 0);
    return 0;
  }

  // ── מפתחות שלמים: מטמונים שניתן לשחזר מהענן ──
  // ⛔ העֵד נבדק **פר-פריט**, בתוך המערך — ⚠️ ולא בכניסה
  // לרשימה: פינוי המפתחות השלמים מוחק מפתח **שלם**, ומפתח שנכתב מקומית-תחילה ולא נדחף
  // אינו חוזר משום מקום. ⭐ ולכן כל פריט נושא `syncedThrough` משלו, בדיוק
  // כמו ב-oldRecords, ⛔ ומחסום `pending()` שלמעלה אינו מחליף אותו: «התור ריק»
  // הוא ראיה על **התור** ⛔ ולא על המפתח.
  var through = lsGlobalWitness();
  var sized = [];
  (LS_CFG.wholeKeys || []).forEach(function (spec) {
    if (!lsSpecWitness(spec, through)) return;
    var v = lsGet(spec.key, null);
    if (v != null) sized.push({ k: spec.key, b: lsEntryBytes(spec.key, v) });
  });
  sized.sort(function (a, b) { return b.b - a.b; });   // הגדול קודם — מפנה מהר
  var hit = [];
  for (i = 0; i < sized.length; i++) {

  }
  if (hit.length) lsLog('פינוי מפתחות שלמים', hit.join(', '), freed);
  if (need && freed >= need) return freed;

   שצריך להחריג מהגיבוי. */
var BK_CFG = {
  client: function () { return getSB(); },
  flagKey: function () { return 'ya_last_backup' + LS; },
  logQueueKey: function () { return 'ya_log_queue' + LS; },
  prefix: function () { return (YESHIVA || 'unknown') + '_'; },
  device: function () { try { return getDeviceId(); } catch (e) { return null; } },
  user: function () { return null; },
  // ⚠️ אין כאן סוד להחריג — אין טבלת משתמשים; הרשימה ריקה ומנגנון הסינון
  //    של המודול נשאר דרוך לסוד עתידי.
  secrets: [],
  sources: function () {
    if (!KV_TABLE) return [];
    /* ⭐ היומן והארכיון מגובים מטבלת השורות המאוחדת —
       הכתיבה הכפולה ל-kv כובתה, ערכי ה-kv שלהם קפאו, וגיבוי שלהם היה
       מגבה עבר. הדפוס הוא סריאליזציית שורות הטבלה
       ל-`sh_backup`, כולל השורות המדוגלות `archived`. שאר המפתחות
       נשארים מקורות `kv` — זה ביתם היחיד בענן. */
    var out = [{ kind: 'table', name: 'ya_entries', key: 'ya_entries_rows',
                 eq: ['yeshiva', YESHIVA], order: 'rec_key', ts: 'updated_at' }];
    /* ⛔ `name` הוא המפתח בטבלת ההגדרות ⛔ והוא בלי תחילית — ⚠️ הטבלה
       כבר נושאת אותה; ⭐ ו-`key` הוא מפתח הגיבוי ב-`sh_backup`, ⛔ שהיא
       משותפת לכל הפרויקט: ⚠️ ושם בלי תחילית שם מתנגש בין אפליקציות. */
    return out.concat([
      { kind: 'kv', table: KV_TABLE, name: 'cats',      key: 'ya_cats' },
      { kind: 'kv', table: KV_TABLE, name: 'subs',      key: 'ya_subs' },
      { kind: 'kv', table: KV_TABLE, name: 'subs_meta', key: 'ya_subs_meta' }
    ]);
  }
};

/* ═══ גיבוי יומי ויומן פעולות — מודול משותף ═══════════════════════════════
   ⛔ שינוי כאן — כל האפליקציות **וכל עותקי השער**, באותו
      סבב: אחרת החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ══════════════════════════════════════════════════════════════════════ */
var BK_TABLE = 'sh_backup';       // יומן הגיבויים — הכתיבה היא insert בלבד
var BK_LOG_TABLE = 'sh_sync_log';    // יומן הפעולות — insert בלבד
var BK_LOG_MAX = 50;              // תקרת התור המקומי של היומן
var BK_RETENTION_DAYS = 30;       // עותק יומי נשמר 30 יום; ישן מזה נגרע
var _bkRunning = false;           // נעילת ריצה (החליפה את הכתיבה-מראש)

function _bkVal(v) { return (typeof v === 'function') ? v() : v; }
function _bkCfg(name, dflt) {
  try {
    if (typeof BK_CFG === 'undefined' || BK_CFG[name] === undefined) return dflt;
    return _bkVal(BK_CFG[name]);
  } catch (e) { return dflt; }
}
function _bkClient() { try { return BK_CFG.client(); } catch (e) { return null; } }

// רשימת הסודות (`BK_CFG.secrets`) — מפתח או שדה שברשימה אינו נכתב לגיבוי
// לעולם; המנגנון נשאר דרוך גם כשהרשימה ריקה.
function _bkSecrets() {
  var s = _bkCfg('secrets', []);
  return Array.isArray(s) ? s : [];
}

function bkToday() { return new Date().toISOString().slice(0, 10); }

// חתימת תוכן לגיבוי הדיפרנציאלי — אורך + FNV-1a. אינה סוד ואינה אימות,
// רק "האם זה אותו ערך בדיוק".
function bkSig(s) {
  var str = String(s == null ? '' : s), h = 0x811c9dc5;
  for (var i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
  }
  return str.length + ':' + h.toString(16);
}

/* ── יומן הפעולות ──────────────────────────────────────────────────────── */
function _bkLogRow(action, key, count, details) {
  return {
    device_id: _bkCfg('device', null),
    user_name: _bkCfg('user', null),
    action: action,
    key: key || null,
    record_count: (count === undefined || count === null) ? null : count,
    details: details || null
  };
}
/*  ⛔ כשל כתיבה נרשם ואינו נבלע — ⚠️ הכתיבה נכשלת כפי שנכשלה,
 *  אבל היא מפסיקה להיות שקטה: ⭐ `catch` ריק סביב כתיבה הוא בדיוק המצב
 *  שבו נתון נעלם ואיש אינו יודע. ⛔ והרישום אינו משנה את הזרימה — ⚠️ תיעוד
 *  אבחון שמפיל שמירה גרוע מהיעדרו. */
function _bkWriteFail(where, e) {
  try { console.warn('[write-fail] ' + where, (e && e.message) ? e.message : e); } catch (e0) { }
}
function _bkLogQueue(row) {
  try {
    var qk = _bkVal(BK_CFG.logQueueKey);
    var q = JSON.parse(lsGet(qk, '[]') || '[]');
    if (!Array.isArray(q)) q = [];
    q.push(row);
    if (q.length > BK_LOG_MAX) q = q.slice(-BK_LOG_MAX);
    lsSet(qk, JSON.stringify(q));
  } catch (e) { _bkWriteFail('_bkLogQueue', e); }
}
// רישום fire-and-forget. ⛔ לעולם אינו חוסם ואינו מפיל את המסלול שקרא לו
// — תיעוד אבחון שמפיל כניסה או שמירה גרוע מהיעדרו.
function logAction(action, key, count, details) {
  var row = null;
  try {
    row = _bkLogRow(action, key, count, details);
    var c = _bkClient();
    if (!c) { _bkLogQueue(row); return; }
    c.from(BK_LOG_TABLE).insert(row).then(
      function (r) { if (r && r.error) _bkLogQueue(row); },
      function () { _bkLogQueue(row); }
    );
  } catch (e) { if (row) _bkLogQueue(row); }
}
// שליחת מה שהצטבר באופליין. נקראת כשיש ראיה שהרשת עובדת.
async function logFlush() {
  var qk, q;
  try { qk = _bkVal(BK_CFG.logQueueKey); q = JSON.parse(lsGet(qk, '[]') || '[]'); } catch (e) { return 0; }
  if (!Array.isArray(q) || !q.length) return 0;
  var c = _bkClient();
  if (!c) return 0;
  lsSet(qk, '[]');
  var failed = [], sent = 0;
  for (var i = 0; i < q.length; i++) {
    try {
      var r = await c.from(BK_LOG_TABLE).insert(q[i]);
      if (r && r.error) failed.push(q[i]); else sent++;
    } catch (e2) { failed.push(q[i]); }
  }
  if (failed.length) {
    try {
      var q2 = JSON.parse(lsGet(qk, '[]') || '[]');
      if (!Array.isArray(q2)) q2 = [];
      lsSet(qk, JSON.stringify(q2.concat(failed).slice(-BK_LOG_MAX)));
    } catch (e3) { _bkWriteFail('logFlush', e3); }
  }
  return sent;
}

/*  ⛔⛔ שלוש שכבות הגיבוי — ⭐ **עוגן** מלא אחת לשבוע, ⚠️ **דיפ**
 *  בכל שאר הימים (רק שורות שהחותמת שלהן חדשה מהעוגן), ⛔ **והפינוי הקיים**
 *  אוכף את התקרות. ⚠️ הנימוק המדוד: גיבוי מלא בכל לילה של טבלה בת עשרות
 *  אלפי שורות הוא מגה-בייטים ביום, ⭐ ועוגן שבועי ודיפים קטנים נותנים את
 *  אותה יכולת שחזור בשבריר. */
var BK_ANCHOR_MS = 7 * 24 * 60 * 60 * 1000;
var BK_ANCHOR_PREFIX = 'ANCHOR:';
var BK_DIFF_PREFIX = 'DIFF:';
/*  ⛔ חותמת המים של העוגן — ⚠️ נשמרת כמחרוזת, ⭐ ומושווית בשרת בטיפוס
 *  העמודה: ⛔ `bigint` ו-`timestamptz` שניהם עוברים ב-`gte` כמות שהם. */
function _bkMarkKey(bkey) { return 'bk_wm_' + bkey; }
function _bkSetMark(bkey, v) {
  if (v == null) return;
  lsSet(_bkMarkKey(bkey), String(v));
  lsSet('bk_anch_' + bkey, String(Date.now()));
}
/*  ⛔ המקסימום נגזר מהשורות ⛔ ואינו נשאל מהשרת — ⚠️ מספר מושווה מספרית
 *  ומחרוזת לקסיקוגרפית: ⭐ חותמת ISO ממוינת נכון כמחרוזת, ⛔ ו-`bigint`
 *  היה נשבר בהשוואת מחרוזות. */
function _bkMaxTs(rows, col) {
  var mx = null;
  for (var i = 0; i < rows.length; i++) {
    var v = rows[i] ? rows[i][col] : null;
    if (v == null) continue;
    if (mx === null) { mx = v; continue; }
    if (typeof v === 'number' ? v > mx : String(v) > String(mx)) mx = v;
  }
  return mx;
}
/*  ⛔ איזו שכבה רצה היום — ⚠️ עוגן כשאין חותמת מים, כשאין חותמת עוגן,
 *  או כשעברו שבעה ימים; ⭐ ובכל שאר הימים דיפ מעל חותמת המים. */
function _bkLayer(bkey, s) {
  var wm = lsGet(_bkMarkKey(bkey), '');
  var at = parseInt(lsGet('bk_anch_' + bkey, '0'), 10) || 0;
  if (!s || !s.ts || !wm || !at || (Date.now() - at) >= BK_ANCHOR_MS)
    return { diff: false, prefix: BK_ANCHOR_PREFIX, key: bkey, win: null };
  return { diff: true, prefix: BK_DIFF_PREFIX, key: bkey,
           win: { col: s.ts, from: wm } };
}
/*  ⛔⛔ הקריאה בעימוד, ⛔ ואימות מול מונה השרת — ⚠️ תשובה שנחתכה נראית
 *  בדיוק כמו תשובה שלמה, ⭐ והדרך היחידה לדעת היא לשאול את השרת כמה שורות
 *  יש: ⛔ אי-התאמה מחזירה `null` ⛔ ונכשלת בקול, ⚠️ ואינה שומרת חצי גיבוי. */
async function _bkReadRows(c, s, win) {
  var sel = s.cols || '*';
  var rows = await _rowsPaged(function () {
    var q = c.from(s.name).select(sel);
    if (s.eq) q = q.eq(s.eq[0], s.eq[1]);
    return q;
  }, s.order || null, win);
  if (!rows) return null;
  try {
    var cq = c.from(s.name).select(sel, { count: 'exact', head: true });
    if (s.eq) cq = cq.eq(s.eq[0], s.eq[1]);
    if (win && win.col) {
      if (win.from) cq = cq.gte(win.col, win.from);
      if (win.to) cq = cq.lte(win.col, win.to);
    }
    var cr = await withTimeout(cq);
    if (!cr || cr.error || typeof cr.count !== 'number') return null;
    if (cr.count !== rows.length) {
      console.error('[bk] הגיבוי נחתך — ' + s.name + ': נמדדו ' + rows.length +
                    ' שורות והשרת מדווח ' + cr.count);
      return null;
    }
  } catch (e) { return null; }
  return rows;
}
/* ── הגיבוי היומי ──────────────────────────────────────────────────────── */
// מחזירה true רק כשכל המקורות גובו (או דולגו כבלתי-משתנים) בהצלחה.
async function bkMaybeDaily() {
  if (_bkRunning) return false;
  var c = _bkClient();
  if (!c) return false;
  var flag = _bkCfg('flagKey', null);
  if (!flag) return false;
  var today = bkToday();
  if (lsGet(flag, '') === today) return false;
  var src = _bkCfg('sources', []) || [];
  if (!src.length) return false;
  _bkRunning = true;
  var ok = true, wrote = 0, same = 0, failed = [];
  try {
    var pre = _bkCfg('prefix', '') || '';
    var secrets = _bkSecrets(), dailyKeys = [];
    for (var i = 0; i < src.length; i++) {
      var s = src[i], val = null;
      // ⛔ מפתח שברשימת הסודות אינו נכתב לגיבוי לעולם —
      //    admin_pass שרד בגיבויים אחרי שנמחק מהמקור, ונוקה ידנית.
      if (s.kind === 'kv' && secrets.indexOf(s.name) !== -1) continue;
      // ⭐ `key` פר-מקור — מקור-טבלה שמפתחו היה מתנגש במקור
      //    ה-kv ההיסטורי באותו שם מקבל מפתח גיבוי משלו. הרשימה שנצברת
      //    כאן היא רשימת-ההיתר של הגריעה — בלי תלות בהצלחת המקור.
      var bkey = pre + (s.key || s.name);
      dailyKeys.push(bkey);
      /*  ⛔ שתי השכבות נכנסות לרשימת-ההיתר של הגריעה — ⚠️ מפתח
       *  שאינו שם אינו מתפנה לעולם, ⭐ ו-`ANCHOR:`/`DIFF:` הם מפתחות
       *  חדשים: ⛔ בלעדיהם הם היו נצברים בלי גבול. */
      if (s.kind !== 'kv') {
        dailyKeys.push(BK_ANCHOR_PREFIX + bkey);
        dailyKeys.push(BK_DIFF_PREFIX + bkey);
      }
      /* ⭐ דגל-יום פר-מקור — מקור שכבר גובה היום מדולג, גם
         כשהדגל הגלובלי לא נכתב. ⛔ בלעדיו מקור אחד שנכשל החזיק את כל
         השאר בלולאה: הדגל הגלובלי נכתב רק כשכולם הצליחו, ולכן כל עלייה
         גיבתה מחדש את מה שכבר גובה, שוב ושוב באותו יום.
         ⚠️ הדחיפה ל-`dailyKeys` קודמת לדילוג בכוונה: הרשימה היא
         רשימת-ההיתר של הגריעה, ומפתח שנופל ממנה אינו מתפנה לעולם. */
      var dayKey = 'bk_day_' + bkey;
      if (lsGet(dayKey, '') === today) { same++; continue; }
      if (s.kind === 'kv') {
        var res = await c.from(s.table).select('value').eq('key', s.name).maybeSingle();
        if (!res || res.error) { ok = false; failed.push(bkey); continue; }
        val = (res.data && res.data.value != null) ? String(res.data.value) : null;
      } else {
        /*  ⛔⛔ שכבת הגיבוי — עוגן שבועי מלא, ודיפרנציאלי בכל שאר הימים:
         *  ⚠️ הנימוק המדוד — הקריאה הייתה בקשה **אחת** בלי
         *  עימוד, ⛔ ו-Supabase מחזיר 1,000 שורות כברירת מחדל **בלי
         *  שגיאה**: ⭐ טבלה גדולה מהתקרה גובתה עד התקרה, ⛔ וכל השאר
         *  מעולם לא גובה — ⚠️ והכשל היה שקט לחלוטין. */
        var layer = _bkLayer(bkey, s);
        var rows = await _bkReadRows(c, s, layer.win);
        if (rows === null) { ok = false; failed.push(bkey); continue; }
        bkey = layer.prefix + bkey;
        // ⛔ שדה-סוד בשורות טבלה מסונן לפני הסריאליזציה —
        //    שורה שמפתחה (`secretField`, ברירת מחדל `key`) ברשימת הסודות
        //    אינה מגיעה לגיבוי, גם כשהיא עדיין קיימת במקור.
        if (secrets.length) rows = rows.filter(function (r) {
          return secrets.indexOf(r && r[s.secretField || 'key']) === -1;
        });
        /*  ⛔ דיפרנציאלי ריק אינו נכתב ⛔ ואינו כישלון — ⚠️ יום שלא השתנה
         *  בו דבר הוא המצב הרגיל, ⭐ ועותק ריק בכל לילה מציף את הפינוי. */
        if (layer.diff && !rows.length) { same++; continue; }
        val = JSON.stringify(rows);
        if (!layer.diff && s.ts) _bkSetMark(layer.key, _bkMaxTs(rows, s.ts));
      }
      // מקור שאין לו ערך בענן — אין מה לגבות, וזה אינו כישלון.
      if (val == null) continue;
      var sig = bkSig(val), sigKey = 'bk_sig_' + bkey;
      if (lsGet(sigKey, '') === sig) { same++; continue; }
      var ins = await c.from(BK_TABLE).insert({ key: bkey, value: val });
      if (!ins || ins.error) { ok = false; failed.push(bkey); continue; }
      lsSet(sigKey, sig);
      lsSet(dayKey, today);
      wrote++;
    }
    /* ⭐ הגריעה אינה מותנית עוד בהצלחת **כל** המקורות — היא רצה
       על רשימת-ההיתר המלאה בכל פעם שנכתב עותק חדש. ⛔ הכריכה הישנה היא
       ששיתקה אותה: מקור אחד שנכשל מנע גריעה של כל השאר, וזה שורש מצבור
       ה-503 השורות שנוקה ב-26.8. ⚠️ והיא עדיין רצה **אחרי** הכתיבה, כדי
       שלא ייגרע עותק ישן לפני שהחדש נכתב. */
    if (wrote) { try { await _bkRetention(c, dailyKeys); } catch (e2) { } }
    if (ok) {
      lsSet(flag, today);
      logAction('backup', null, wrote, { date: today, scope: pre || null, wrote: wrote, unchanged: same });
    } else {
      /* ⛔ בלי כתיבת הדגל הגלובלי — ההזדמנות הבאה באותו יום תנסה שוב:
         גיבוי שנכשל ודילג על יממה שלמה הוא בדיוק
         מה שהדגל שנכתב-מראש גרם. ⚠️ ומה שכן השתנה: המקורות
         שהצליחו נושאים דגל-יום משלהם ואינם נגבים שוב, ולכן הניסיון החוזר
         מכוון למי שנכשל בלבד. ⛔ וכשל חלקי מדווח ואינו נבלע — `failed`
         נושא את שמות המקורות, אחרת «נכשל» היה מספר בלי מען. */
      logAction('backup_fail', null, wrote, { date: today, scope: pre || null, wrote: wrote, unchanged: same, failed: failed });
      console.warn('[backup] מקורות שנכשלו: ' + (failed.join(', ') || '?') + ' — ייבחנו שוב בהזדמנות הבאה');
    }
  } catch (e) { ok = false; }
  _bkRunning = false;
  return ok;
}

/* ── מדיניות השמירה — גריעת עותקים יומיים ישנים מ-30 יום ──────────────── */
// ⛔ הגריעה מוגבלת ב-`in('key', keys)` לרשימת המפתחות היומיים של
//    האפליקציה הנוכחית בלבד — רשימת-היתר, לא קידומת:
//    גיבויי `PRE_*` וגיבויים של אפליקציה אחרת אינם מועמדים כלל.
// ⚠️ נכשלת סגור: `error` (כולל היעדר הרשאת DELETE) מוחזר כאפס
//    בשקט, בלי להפיל את הגיבוי ובלי רישום-סרק יומי ליומן הראיות.
async function _bkRetention(c, keys) {
  if (!c || !Array.isArray(keys) || !keys.length) return 0;

   *  חייבת להבחין ביניהם: ⛔ בלי ההבחנה כשל רשת נקרא «הענן ריק». */
  async function pullRes(key, label) {
    var r = await sbGetResult(key);
    /*  ⛔ ערך פגום כבר דיווח על עצמו בשמו — ⚠️ והוספתו כאן הייתה טוסט
     *  שני לאותו אירוע. */
    if (!r.ok) failed.push(label);
    return r;
  }
  async function pull(key, label) { return (await pullRes(key, label)).data; }
  try {
    // משתמש ב-sbGet, שמשתמש נכון בלקוח של Supabase
    // (בגרסה הקודמת היה באג: getSB() מחזירה אובייקט לקוח ולא מחרוזת מפתח)

    // CATS: מיזוג ברמת קטגוריה (מפתח = אות). קודם: הענן דרס תמיד, וקטגוריה
    // שנוספה במכשיר לא-מסונכרן נעלמה.
    var cloudCats = await pull('cats', 'קטגוריות');
    var cloudCatsReset = String(await pull(CATS_RESET_KEY, 'חותמת ניקוי קטגוריות') || '');
    /*  ⛔ ההקשר התחלף באמצע המחזור — ⚠️ הנתונים שבזיכרון שייכים למוסד
     *  הקודם, ⭐ והכתיבה שאחרי הייתה כותבת אותם תחת החדש. */
    if (ctxStale(_ep)) { console.warn('[sync] ההקשר התחלף באמצע — הסנכרון נעצר'); return; }
    if (cloudCats) {
      /*  ⛔ החותמת קודמת למיזוג — ⚠️ מכשיר שראה חותמת ישנה זורק את
       *  הרשימה המקומית ומושך מלא: ⭐ ואינו דוחף, ⛔ שהדחיפה הייתה
       *  מחזירה לענן בדיוק את מה שזה עתה נוקה בו.
       *  ⛔ **והיא נבדקת לפני האורך** — ⚠️ כאן, ובניגוד ל-`SUBS`, המיזוג
       *  מותנה ברשימה לא-ריקה: ⭐ רשימה שרוקנה בענן בכוונה מגיעה ריקה,
       *  ⛔ ותנאי אורך שקודם לחותמת היה מדלג עליה — ⚠️ והמכשיר המזוהם
       *  היה דוחף את שלו חזרה בסבב הבא. */
      if (cloudCatsReset > _catsResetSeen) {
        CATS = Array.isArray(cloudCats) ? cloudCats : [];
        _catsResetSeen = cloudCatsReset;
        lsSet(CATS_RESET_LS+LS, JSON.stringify(cloudCatsReset));
        lsSet('ya_cats'+LS, JSON.stringify(CATS));
        console.log('[sync] ניקוי קטגוריות ' + cloudCatsReset + ' — העותק המקומי נזרק ונמשך מלא');
      } else if (cloudCats.length) {
        CATS = mergeCats(CATS, cloudCats);
        lsSet('ya_cats'+LS, JSON.stringify(CATS));
        sbSet('cats', CATS).then(function(r){ if (ctxStale(_ep)) return; if (r && r.ok) _yaMarkPushed('cats'); });
      }
    }

    // SUBS: מיזוג פר-מפתח לפי SUBS_META
    var cloudSubs = await pull('subs', 'תתי-משימות');
    var cloudSubsMetaR = await pullRes('subs_meta', 'חותמות תתי-משימות');
    var cloudSubsReset = String(await pull(SUBS_RESET_KEY, 'חותמת ניקוי תתי-משימות') || '');
    /*  ⛔ ההקשר התחלף באמצע המחזור — ⚠️ הנתונים שבזיכרון שייכים למוסד
     *  הקודם, ⭐ והכתיבה שאחרי הייתה כותבת אותם תחת החדש. */
    if (ctxStale(_ep)) { console.warn('[sync] ההקשר התחלף באמצע — הסנכרון נעצר'); return; }
    /*  ⛔⛔ המיזוג רץ רק מול ראיה שמפת החותמות הגיעה — ⚠️ מפה
     *  שמשיכתה נכשלה אינה «הענן אינו מכיר»: ⭐ וכל הכרעה מול היעדר
     *  שלא נמדד היא הסקה ולא ראיה, ⛔ והדחיפה שאחריה מקבעת אותה בענן. */
    if (cloudSubs && yaMetaMap(cloudSubsMetaR)) {
      /*  ⛔ החותמת קודמת למיזוג — ⚠️ מכשיר שראה חותמת ישנה זורק את המפה
       *  המקומית ומושך מלא: ⭐ ואינו דוחף, ⛔ שהדחיפה הייתה מחזירה לענן
       *  בדיוק את מה שזה עתה נוקה בו. */
      if (cloudSubsReset > _subsResetSeen) {
        SUBS = (cloudSubs && typeof cloudSubs === 'object') ? cloudSubs : {};
        SUBS_META = yaMetaMap(cloudSubsMetaR) || {};
        _subsResetSeen = cloudSubsReset;
        lsSet(SUBS_RESET_LS+LS, JSON.stringify(cloudSubsReset));
        lsSet('ya_subs'+LS, JSON.stringify(SUBS));
        lsSet('ya_subs_meta'+LS, JSON.stringify(SUBS_META));
        console.log('[sync] ניקוי תתי-משימות ' + cloudSubsReset + ' — העותק המקומי נזרק ונמשך מלא');
      } else {
        var ms = mergeSubs(SUBS, SUBS_META, cloudSubs, cloudSubsMetaR);
        SUBS = ms.subs; SUBS_META = ms.meta;
        lsSet('ya_subs'+LS, JSON.stringify(SUBS));
        lsSet('ya_subs_meta'+LS, JSON.stringify(SUBS_META));
        sbSet('subs', SUBS);
        sbSet('subs_meta', SUBS_META);
      }
    } else if (cloudSubs) {
      /*  ⛔ הדחייה נאמרת ⛔ ואינה שקטה — ⚠️ המשיכה כבר נרשמה כשנכשלה,
       *  ⭐ והשורה הזו היא מה שאומר מדוע המיזוג לא רץ בכל זאת. */
      console.warn('[sync] מפת חותמות תתי-המשימות לא הגיעה — המיזוג נדחה, ואין ראיה שהענן חדש יותר');
    }

    // ENTRIES: מיזוג ברמת רשומה (updatedAt + tombstones). קודם: איחוד לפי id
    // בלבד — עדכון שנעשה במכשיר אחד לא ניצח את הגרסה הישנה של השני.
    /* ⛔ מהטבלה בלבד, ⛔ ובלי נפילה-חזרה לערך השלם — ⚠️ וכשל אינו נכנס
       לענף «הענן ריק»: ⭐ «אין ראיה» היא לא-לדעת, ⛔ ומשיכה שנכשלה שדוחפת
       את המקומי למעלה מכריעה על סמך חוסר-ידיעה. */
    var _rowsE = await yaRowsGet('ya_entries');
    /*  ⛔ ההקשר התחלף באמצע המחזור — ⚠️ הנתונים שבזיכרון שייכים למוסד
     *  הקודם, ⭐ והכתיבה שאחרי הייתה כותבת אותם תחת החדש. */
    if (ctxStale(_ep)) { console.warn('[sync] ההקשר התחלף באמצע — הסנכרון נעצר'); return; }
    if (!_rowsE.ok) failed.push('רשומות');
    else {
    var cloudEntries = _rowsE.data;
    if (cloudEntries && cloudEntries.length) {
      ENTRIES = mergeEntries(ENTRIES, cloudEntries);
      // גריעת ה-tombstones הישנים שהוזמנה בטעינה — פעם אחת, על התוצאה
      // הממוזגת, כדי שגם העותק הענני שנדחף מיד אחר כך יצטמצם.
      ENTRIES = tombPruneMerged(ENTRIES);
      // מיון לפי id בסדר יורד (החדש קודם)
      ENTRIES.sort(function(a,b){ return entryOrderTs(b) - entryOrderTs(a); });
      lsSetArray('ya_entries'+LS, ENTRIES, _yaRecTs);
      pushTable('ya_entries', ENTRIES);
      if (YA_KV_LEGACY_WRITE) sbSet('entries', ENTRIES);
    } else if (ENTRIES.length) {
      pushTable('ya_entries', ENTRIES);
      if (YA_KV_LEGACY_WRITE) sbSet('entries', ENTRIES); // הענן ריק — דוחפים את המקומי למעלה
    }
    }

    // ARCHIVE: מיזוג סנאפשוטים לפי gdate + מיזוג הרשומות שבתוך כל סנאפשוט.
    // קודם: "למי שיש יותר רשומות מנצח" — שני מכשירים שהוסיפו רשומות לאותו יום
    // איבדו את הצד הקטן יותר.
    var _rowsA = await yaRowsGet('ya_archive');
    /*  ⛔ ההקשר התחלף באמצע המחזור — ⚠️ הנתונים שבזיכרון שייכים למוסד
     *  הקודם, ⭐ והכתיבה שאחרי הייתה כותבת אותם תחת החדש. */
    if (ctxStale(_ep)) { console.warn('[sync] ההקשר התחלף באמצע — הסנכרון נעצר'); return; }
    if (!_rowsA.ok) failed.push('ארכיון');
    else {
    hwNoteCloud('ya_archive'+LS, _rowsA.data);   // ראיה עננית לשער הדיסק
    var cloudArchive = _rowsA.data;
    if (cloudArchive && cloudArchive.length) {
      ARCHIVE = mergeArchive(ARCHIVE, cloudArchive);
      lsSetArray('ya_archive'+LS, hwDiskFilter('ya_archive'+LS, ARCHIVE), _yaRecTs);
      // דוחף את הארכיון הממוזג בחזרה לענן כדי שכל המכשירים יישארו מסונכרנים
      pushTable('ya_archive', ARCHIVE);
      if (YA_KV_LEGACY_WRITE) sbSet('archive', ARCHIVE);
    } else if (ARCHIVE.length) {
      // הענן ריק אך במכשיר יש נתונים — דוחף לענן
      pushTable('ya_archive', ARCHIVE);
      if (YA_KV_LEGACY_WRITE) sbSet('archive', ARCHIVE);
    }
    }

    // ניקוי חד-פעמי של סנאפשוטים פגומים (אחרי שהארכיון מהענן כבר יושב ב-ARCHIVE)
    arcCleanupCorrupted();

    buildCatGrid();
    // מיישב את selCat אחרי ש-CATS הוחלף — ההפניה הישנה אינה במערך החדש
    if (selCat) {
      selCat = CATS.find(function(c){ return c.letter === selCat.letter && isLive(c); }) || null;
    }
    buildTaskBtns();
    buildSubBtns();
    renderLog();
    // הסימון לפני הרינדור — שורת המצב שבאזור המצב נבנית בתוך renderSettings.
    if (failed.length === 0) _yaMarkSynced();
    renderSettings();
    if (failed.length === 0 && !_yaPullLogged) { _yaPullLogged = true; yaSyncLog('pull', null, null); }
    if (failed.length === 0) {
      toast(MSG_SYNCED);
    } else if (failed.length >= 5) {
      toast(MSG_SYNC_FAIL_LOCAL, null, 'bad');
    } else {
      toast(MSG_SYNC_PARTIAL + failed.join(", "), null, 'bad');
    }
  } catch(e) {
    console.error("[syncFromCloud] error:", e);
    _yaNetWarned = true;
    toast(MSG_OFFLINE_LOCAL, null, 'bad');
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   שם החודש העברי — מפתח הקיבוץ של הארכיון
   ══════════════════════════════════════════════════════════════════════════
   ⛔ **שם החודש הוא מפתח הקיבוץ של הארכיון** (`extractYM`) — ⚠️ ולכן הוא
   נכתב בצורה אחת: ⭐ «מנחם אב», ו«אדר א׳»/«אדר ב׳» בגרש עברי — ⛔ ושינוי
   בו הוא המרה במסד ⛔ ולא מיפוי בקוד: ⚠️ מיפוי הוא מקור אמת שני שמתיישן.
   ══════════════════════════════════════════════════════════════════════════ */

// ── נרמול שמות חודשים עבריים ──
// בנתונים הקיימים מופיע "מרחשון" בעוד הקוד מייצר "חשון" — בלי איחוד נוצרים
// שני כפתורי חודש באותה שנה, כל אחד עם חצי מהימים. הנרמול הוא לקריאה/תצוגה
// בלבד: הרשומות ב-localStorage ובענן נשארות בדיוק כפי שהן.
function normHDate(h) {
  if (!h) return h || "";
  return String(h).replace(/מרחשוו?ן/g, "חשון").replace(/חשוון/g, "חשון");
}
/*  ⛔ שם החודש נכתב בצורה אחת — ⚠️ גרש עברי `׳`, ⛔ ולא אפוסטרוף ולא
 *  מרכאה: ⭐ שתי צורות הן שני דליים בארכיון, ⛔ ומיפוי ביניהן הוא מקור
 *  אמת שני שמתיישן — ⚠️ ואין להחזיר טבלת מיפוי «למקרה ש». */
function monthKeyOf(m) {
  return normHDate(m).trim().replace(/\s+/g, " ");
}

// ═══ סוף אזור שם החודש העברי ══════════════════════════════════════════════

/*  ⛔ הפלטה יושבת ב-CSS ⛔ ואינה חוזרת כאן — ⚠️ שתי רשימות לאותם שמונה
 *  גוונים הן שני מקורות אמת, ⭐ ומי ששינה גוון באחת השאיר את השנייה
 *  מתארת את מה שהיה: ⛔ כאן נשארות האותיות בסדרן, ⚠️ והמחלקה שנגזרת ממנה
 *  היא מה שמציב את `--cat`. */
const CAT_LETTERS = 'אבגדהוזח';
function catCls(letter) {
  var i = CAT_LETTERS.indexOf(letter);
  return 'u-cat-' + (i < 0 ? 0 : i + 1);
}

/*  ⛔ אין ערך קבוע שנכנס למיזוג עם הענן — ⚠️ **הנימוק המדוד**: שבע
 *  קטגוריות ו-17 מפתחות תת-משימה של ראשון לציון היו מוזרקים בכל טעינה,
 *  ⛔ והמיזוג החזיר אותם לענן: ⭐ רמת אביב קיבלה את הקטגוריות של ראשון,
 *  ⛔ וניקוי נתוני האתר במכשיר לא עזר — 69 · 26 חזרו ל-94 · 90 תוך דקות.
 *  ⛔ **ומצב ריק מוצג כריק** — ⚠️ הודעה אחת ⛔ ולא ערך מומצא. */
let CATS = [];
let SUBS = {};
let ENTRIES = [];

/*  ⛔ **נקודת הגזירה האחת של שם הקטגוריה** — ⚠️ הרשומה נושאת את האות
 *  בלבד, ⭐ והשם נקרא מ-`CATS` הנוכחי בכל תצוגה: ⛔ שם ששמור ברשומה
 *  מתיישן בשקט — ⚠️ קטגוריה ששמה שונה משאירה את הישן לנצח, ⭐ ורשומה
 *  שנוצרה במוסד אחד נשאה את שמו גם אחרי מעבר למוסד השני.
 *  ⛔ **ונפילה-חזרה לשם השמור כשהאות אינה בטבלה הנוכחית** — ⚠️ בארכיון
 *  יושבות רשומות תחת אות שנמחקה, ⭐ ובלעדיה שם היסטורי היה יורד לאות
 *  עירומה. */
function catNameOf(e) {
  var c = CATS.find(function (x) { return x.letter === e.cat; });
  return c ? c.name : (e.catName || e.cat);
}

let selCat = null;
let selTask = null;
let selSub = null;
let selDay = "";

// פונקציות השמירה מוגדרות למעלה, בשכבת Supabase

/* ══════════════════════════════════════════════════════════════════════════
   מסך היומן — טופס ההזנה, הרשימה והארכוב היומי
   ══════════════════════════════════════════════════════════════════════════ */
function getCurrentDateKey() {
  var g = document.getElementById("gregDateInput");
  var v = g ? g.value.trim() : "";
  // נפילה-חזרה: אם שדה התאריך טרם אותחל, משתמשים במפתח של היום כדי
  // שרשומות לא יישמרו לעולם עם gdate ריק (ששובר את הארכוב ואת סינון
  // היומן היומי). gregDateStr() היא JS טהור ואינה נשענת על הלוח העברי.
  return v || getTodayKey();
}

function getTodayKey() {
  return gregDateStr(new Date());
}

// לשוניות
function showTab(name, el) {
  document.querySelectorAll(".panel").forEach(function(p){ p.style.display="none"; });
  document.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.remove("active"); });
  document.getElementById("panel-"+name).style.display="block";
  el.classList.add("active");
  renderTab(name);
}
/*  ⛔ ניתוב הציור בנקודה אחת — ⚠️ מעבר לשונית ורענון שאחרי שמירה מציירים
 *  את אותו מסך, ⭐ ושני מרשמים לאותו ציור נבדלים ביום שבו נוספת לשונית. */
function renderTab(name) {
  if (name === "log") renderLog();
  if (name === "settings") renderSettings();
  if (name === "archive") renderArchive();
}
/*  ⛔ נקודת הרענון של הצינור — ⚠️ **מה נכנס**: ציור הלשונית הפתוחה,
 *  ⛔ **ומה מפיל**: מעבר לשונית — ⭐ רענון אינו ניווט, ⚠️ ושמירה שמנווטת
 *  מוציאה את המשתמש מהמקום שבו הוא עומד. */
function saveRefresh() {
  var on = document.querySelector(".tab-btn.active");
  var p = document.querySelector('.panel[style*="block"]');
  if (p && p.id) renderTab(String(p.id).replace(/^panel-/, ""));
  else if (on) renderTab("log");
}

// תאריך
function gregDateStr(jsDate) {
  var d = jsDate.getDate(), m = jsDate.getMonth()+1, y = jsDate.getFullYear();
  var GREG_MONTHS = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
  return d + " " + GREG_MONTHS[m-1] + " " + y;
}

function checkDayChange() {
  var lastDay = lsGet("ya_last_day"+LS) || "";
  var today = new Date().toDateString();
  if (lastDay && lastDay !== today && liveOnly(ENTRIES).length > 0) {
    // זוהה יום חדש — ארכוב מקומי בלבד.
    // ⛔ אין לדחוף לענן כאן — syncFromCloud() ירוץ מיד
    // אחרי וימזג כראוי; דחיפת ENTRIES ריק לענן הייתה מוחקת רשומות
    // שמכשיר אחר כבר הוסיף להיום.
    var prev = new Date(lastDay);
    var live = liveOnly(ENTRIES);
    // ⭐ שדות היום נגזרים מהרשומות עצמן קודם כול — הן נכתבו עם התאריך
    //    שהמשתמש באמת עבד בו, וזה בדיוק מה ש-`autoArchiveDay` מקבל במסלול הידני.
    //    השעון הוא נפילה-חזרה, לא מקור ראשון.
    var withG = live.find(function(e){ return e && e.gdate; });
    var withH = live.find(function(e){ return e && hasHebMonth(e.hdate); });
    var withD = live.find(function(e){ return e && e.day; });
    var gdate = (withG && withG.gdate) || gregDateStr(prev);
    // ⛔ נפילה-חזרה מפורשת ולא שדה ריק בשקט — `hebrewDate` מחזירה ""
    //    כשהלוח אינו זמין, ו-hdate ריק הוא בדיוק מה שהעיף סנאפשוטים
    //    לדלי «לא ידוע». בהיעדר שניהם נשמר לפחות `name` שממנו `snapHDate` גוזרת.
    var hdate = (withH && withH.hdate) || hebrewDate(prev) || "";
    var dayKey = (withD && withD.day) || DAY_VALUE_MAP[prev.getDay()] || "";
    // אותה חותמת לעותקים שבארכיון ול-tombstones — בשוויון הסנאפשוט מנצח,
    // ולכן ארכוב אינו מחיקה מהארכיון
    var ts = Date.now();
    var carried = JSON.parse(JSON.stringify(live));
    carried.forEach(function(e){ recTouch(e, ts); });
    // ⛔ אותו בונה בדיוק כמו המסלול הידני — `auto` הוא סימון מקור
    //    ותו לא, ואינו מחליף שדה. ר' הבלוק שמעל `arcPutSnapshot`.
    arcPutSnapshot(dayKey, hdate, gdate, carried, ts, { auto: true });
    lsSetArray("ya_archive"+LS, hwDiskFilter('ya_archive'+LS, ARCHIVE), _yaRecTs);
    // tombstones במקום ENTRIES = [] — אחרת הענן היה מחזיר את הרשומות לחיים
    ENTRIES.forEach(function(e){ if (isLive(e)) recDelete(e, ts); });
    lsSetArray("ya_entries"+LS, ENTRIES, _yaRecTs);
    toast(MSG_DAY_ARCHIVED);
  }
  lsSet("ya_last_day"+LS, today);
}

function initDate() {
  var now = new Date();
  var hd = hebrewDate(now);
  var gd = gregDateStr(now);
  document.getElementById("hebDateInput").value = hd;
  document.getElementById("gregDateInput").value = gd;
  autoSelectTodayChip();
}

// ממפה את getDay() של JS (0=ראשון) לתוויות הצ'יפים
var DAY_LABEL_MAP = ["ראשון","שני","שלישי","רביעי","חמישי","ערב שבת","מוצ\"ש"];
var DAY_VALUE_MAP = ["יום ראשון","יום שני","יום שלישי","יום רביעי","יום חמישי","ערב שבת","מוצאי שבת"];

function autoSelectTodayChip() {
  var dow = new Date().getDay(); // 0=ראשון
  var label = DAY_LABEL_MAP[dow] || "";
  var value = DAY_VALUE_MAP[dow] || "";
  selDay = value;
  document.querySelectorAll(".day-chip").forEach(function(b){
    b.classList.remove("active");
    if (b.textContent.trim() === label) b.classList.add("active");
  });
}

function pickDay(el, day) {
  selDay = day;
  document.querySelectorAll(".day-chip").forEach(function(b){ b.classList.remove("active"); });
  el.classList.add("active");
  // כשהמשתמש בוחר יום ידנית, מזיז בהתאם את התאריך העברי והלועזי
  syncDatesToDay(day);
  renderLog();
}

function syncDatesToDay(dayValue) {
  // מזהה איזה יום בשבוע נבחר
  var targetDow = DAY_VALUE_MAP.indexOf(dayValue);
  if (targetDow < 0) return;
  var now = new Date();
  var currDow = now.getDay();
  var diff = targetDow - currDow;
  // נשאר בתוך השבוע הנוכחי (עד ±3 ימים)
  if (diff > 3) diff -= 7;
  if (diff < -3) diff += 7;
  var target = new Date(now.getTime() + diff * 86400000);
  document.getElementById("hebDateInput").value = hebrewDate(target) || hebrewDate(now);
  document.getElementById("gregDateInput").value = gregDateStr(target);
}

function onGregDateChange() {
  var val = document.getElementById("gregDateInput").value.trim();
  // ניסיון פענוח dd/mm/yyyy או yyyy-mm-dd
  var parts, d;
  if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(val)) {
    parts = val.split("/");
    d = new Date(+parts[2], +parts[1]-1, +parts[0]);
  } else if (/^\d{4}-\d{2}-\d{2}$/.test(val)) {
    d = new Date(val);
  }
  if (d && !isNaN(d.getTime())) {
    var dow = d.getDay();
    var label = DAY_LABEL_MAP[dow] || "";
    var value = DAY_VALUE_MAP[dow] || "";
    selDay = value;
    document.querySelectorAll(".day-chip").forEach(function(b){
      b.classList.remove("active");
      if (b.textContent.trim() === label) b.classList.add("active");
    });
    document.getElementById("hebDateInput").value = hebrewDate(d) || document.getElementById("hebDateInput").value;
    renderLog();
  }
}

// רשת הקטגוריות
function buildCatGrid() {
  var g = document.getElementById("catGrid");
  g.innerHTML = "";
  var live = liveOnly(CATS);
  /*  ⛔ מצב ריק מוצג כריק — ⚠️ מוסד שאין לו קטגוריות בענן אינו מקבל ערך
   *  מומצא: ⭐ הודעה אחת, ⛔ ולא רשימה שתמוזג חזרה לענן. */
  if (!live.length) {
    g.innerHTML = '<span class="hint">⚠️ אין עדיין קטגוריות — הוסף את הראשונה</span>';
    return;
  }
  live.forEach(function(cat) {
    var btn = document.createElement("button");
    btn.className = "cat-btn " + catCls(cat.letter) +
      ((selCat && selCat.letter === cat.letter) ? " sel" : "");
    btn.innerHTML = "<span class=\"u-fs-2 u-fw-700\">" + esc(cat.name) + "</span>";
    btn.dataset.act = 'pick-cat';
    btn.dataset.letter = cat.letter;
    g.appendChild(btn);
  });
}

/*  ⛔ הקטגוריה נמצאת לפי האות שב-DOM — ⚠️ המזהה חי באלמנט והמטפל קורא
 *  אותו משם, ⭐ ולא בסגור שנתפר לכפתור: ⛔ סגור פר-כפתור הוא מאזין ישיר
 *  לכל דבר, ⚠️ והוא בדיוק מה שהמפה קיימת כדי למנוע. */
function pickCat(letter) {
  var hit = null;
  CATS.forEach(function (c) { if (c && String(c.letter) === String(letter)) hit = c; });
  if (!hit) { console.error('[cat] אין קטגוריה לאות: ' + letter); return; }
  selCat = hit; selTask = null; selSub = null;
  buildCatGrid(); buildTaskBtns(); buildSubBtns();
}

function buildTaskBtns() {
  var el = document.getElementById("taskBtns");
  el.innerHTML = "";
  if (!selCat) { el.innerHTML = '<span class="hint">בחר קטגוריה...</span>'; return; }
  selCat.tasks.forEach(function(t) {
    var b = document.createElement("button");
    b.className = "qbtn" + (selTask === t ? " active" : "");
    b.textContent = t;
    b.dataset.act = 'pick-task';
    b.dataset.task = t;
    el.appendChild(b);
  });
}

/*  ⛔ הכפתור מגיע כארגומנט ⛔ ולא מ-`event.currentTarget` — ⚠️ בהאצלה
 *  ה-`currentTarget` הוא `document`, ⭐ וההבזק היה נצבע על כל הדף. */
function pickTask(t, btn) {
  selTask = t; selSub = null;
  tapFlash(btn);
  document.getElementById("taskInput").value = t;
  buildTaskBtns(); buildSubBtns();
}

function buildSubBtns() {
  var el = document.getElementById("subBtns");
  el.innerHTML = "";
  var ci = selCat ? CATS.indexOf(selCat) : -1;
  var subs = (selTask && ci >= 0) ? (SUBS[subKey(ci, selTask)] || SUBS[selTask] || []) : [];
  if (!subs.length) {
    el.innerHTML = '<span class="hint">' + (selTask ? "אין תת-משימות" : "בחר משימה...") + '</span>';
    return;
  }
  subs.forEach(function(s) {
    var b = document.createElement("button");
    b.className = "qbtn" + (selSub === s ? " active" : "");
    b.textContent = s;
    b.dataset.act = 'pick-sub';
    b.dataset.sub = s;
    el.appendChild(b);
  });
}

function pickSub(s, btn) {
  selSub = s;
  tapFlash(btn);
  document.getElementById("subInput").value = s;
  buildSubBtns();
}

// אפקט הבזק למובייל: הדגשה קצרה ואז שחרור
function tapFlash(btn) {
  if (!btn) return;
  btn.classList.add("tapped");
  setTimeout(function(){ btn.classList.remove("tapped"); }, 600);
}


// ארכוב אוטומטי — נקרא אחרי כל addEntry / deleteEntry
/* ══════════════════════════════════════════════════════════════════════════
   בניית סנאפשוט ארכיון — מסלול אחד לידני ולאוטומטי
   ══════════════════════════════════════════════════════════════════════════
   ⭐ בעבר היו כאן **שני** מסלולי יצירה עם שדות שונים: `autoArchiveDay`
      (נקרא מהוספה/מחיקה/עריכה) מילא `hdate`, `gdate`, `day`, `date` ו-`name`,
      ואילו `checkDayChange` (מעבר יום) מילא `name` ו-`date` בלבד — בלי `gdate`,
      בלי `hdate` ובלי `day`. זה שורש שתי תקלות שנמדדו:
      • הסנאפשוט נפל לדלי «לא ידוע» בארכיון, כי אין ממה לגזור חודש ושנה.
      • `archiveKey` נפל ל-`i:<id>` במקום ל-`g:<gdate>`, ולכן אותו יום הופיע
        כשתי שורות מתחרות בענן (נמדד ברמת אביב: «11 אוגוסט 2026»).

   ⛔ אין להחזיר מסלול יצירה שני — רשומה אוטומטית חייבת להיות זהה
      בשדותיה לרשומה ידנית, ושדה שנשאר ריק בשקט הוא בדיוק מה שייצר את
      «לא ידוע». `tools/test_archive.mjs` נכשל על כל שדה שחסר.
   ⚠️ `arcPutSnapshot` **אינה** כותבת לענן — הקורא מחליט. זה מכוון:
      `checkDayChange` חייבת להישאר מקומית (ר' ההערה שם).
   ══════════════════════════════════════════════════════════════════════════ */
function arcPutSnapshot(dayKey, hdate, gdate, dayEntries, ts, extra) {
  if (!gdate) return null;   // בלי תאריך אין סנאפשוט — אחרת נוצר סנאפשוט זבל עם gdate ריק
  var existIdx = ARCHIVE.findIndex(function(a){ return a.gdate === gdate && isLive(a); });
  var exist = existIdx >= 0 ? ARCHIVE[existIdx] : null;
  // מיזוג ולא החלפה: הסנאפשוט הקיים הוא הצד ה"מרוחק" (מנצח בשוויון), הרשומות
  // החיות הן הצד המקומי. כך רשומה שכבר אורכבה לא נמחקת מהארכיון רק
  // מפני שהעותק החי שלה הפך ל-tombstone, אבל מחיקה אמיתית (updatedAt חדש יותר)
  // כן עוברת.
  var mergedEntries = mergeRecords(
    JSON.parse(JSON.stringify(dayEntries)),
    exist ? (exist.entries || []) : [],
    entryKey
  );
  var snapshot = {
    id: exist ? exist.id : ts,
    name: hdate || (exist ? exist.name : "") || "",
    hdate: hdate || (exist ? exist.hdate : "") || "",
    gdate: gdate,
    day: dayKey || (exist ? exist.day : "") || "",
    date: gdate,
    entries: mergedEntries,
    count: liveOnly(mergedEntries).length,
    updatedAt: ts
  };
  if (extra) Object.keys(extra).forEach(function(k){ snapshot[k] = extra[k]; });
  if (exist) ARCHIVE[existIdx] = snapshot; else ARCHIVE.unshift(snapshot);
  return snapshot;
}

function autoArchiveDay(dayKey, hdate, gdate) {
  // סינון לפי gdate (מחרוזת תאריך ייחודית) ⛔ ולא לפי שם היום —
  // שמות הימים חוזרים בכל שבוע, ורשומות מתאריכים שונים היו ממוזגות תחת היום הנוכחי.
  if (!gdate) return;
  // כולל tombstones — כך שמחיקה מהיומן מגיעה גם לסנאפשוט של אותו יום
  var dayEntries = ENTRIES.filter(function(e){ return e.gdate === gdate; });
  if (!dayEntries.length) return;
  if (arcPutSnapshot(dayKey, hdate, gdate, dayEntries, Date.now(), null)) saveArchive();
}

// הוספת רשומה
function addEntry() {
  var task = document.getElementById("taskInput").value.trim() || selTask || "";
  var sub  = document.getElementById("subInput").value.trim() || selSub || "";
  var notes = document.getElementById("notesInput").value.trim();
  var count = document.getElementById("countInput").value.trim();
  var hdate = document.getElementById("hebDateInput").value.trim();
  if (!selCat) { toast(MSG_PICK_CATEGORY, null, 'bad'); return; }
  if (!task)   { toast(MSG_NEED_TASK, null, 'bad'); return; }
  var now = new Date();
  var entry = {
    // ⭐ מזהה שנוצר במכשיר דרך המודול המשותף (שורת מזהי הרשומות במטריצה).
    //    עד כאן היה `now.getTime()`: שני מכשירים שהוסיפו רשומה באותה
    //    מילישנייה קיבלו **אותו מזהה**, והמיזוג ראה בהם רשומה אחת.
    id: newClientId(),
    // ⛔ `createdAt` נפרד מהמזהה — הסדר היה נגזר מה-`id`, ו-uuid
    //    אינו ניתן להשוואה מספרית. ר' `entryOrderTs`.
    createdAt: now.getTime(),
    day: selDay, hdate: hdate, gdate: document.getElementById("gregDateInput").value.trim(),
    cat: selCat.letter,
    task: task, sub: sub, notes: notes, count: count,
    updatedAt: now.getTime()   // חובה — בלעדיה הרשומה נחשבת "ותיקה" במיזוג
    // השעה הוסרה
  };
  ENTRIES.unshift(entry);
  // ⚠️ הרשומה נשמרה במכשיר בלבד — סימון ⏳ יורד רק כש-`sbSet` תחזיר `ok`.
  pendMark(PK_ENTRY + entry.id);
  saveEntries();
  autoArchiveDay(entry.day, entry.hdate, entry.gdate);
  clearForm();
  // השמירה המקומית הושלמה בנקודה זו; דחיפת הענן עוד לא התחילה —
  // schedulePush() מדווחת על התוצאה האמיתית כשהיא מסתיימת.
  toast(MSG_ADDED_SAVING);
  schedulePush();
}

function clearForm() {
  document.getElementById("taskInput").value = "";
  document.getElementById("subInput").value = "";
  document.getElementById("notesInput").value = "";
  document.getElementById("countInput").value = "";
  selTask = null; selSub = null;
  buildTaskBtns(); buildSubBtns();
}

// יומן
function renderLog() {
  var list = document.getElementById("logList");
  var cnt  = document.getElementById("logCount");
  // מציג רק רשומות של התאריך הנבחר
  var curKey = getCurrentDateKey();
  var filtered = liveOnly(ENTRIES).filter(function(e){ return e.gdate === curKey; });
  cnt.textContent = filtered.length;
  if (!filtered.length) {
    list.innerHTML = '<div class="empty">📋<br>אין רשומות לתאריך זה</div>';
    return;
  }
  filtered = yaSortEntries(filtered);
  list.innerHTML = filtered.map(function(e) {
    var dateStr = [e.day, e.hdate, e.gdate ? "("+e.gdate+")" : ""].filter(Boolean).join("  ");
    return '<div class="entry-row u-bdr-cat ' + catCls(e.cat) + '">'
      + '<div class="entry-badge u-bg-cat"></div>'
      + '<div class="entry-body">'
      + '<div class="e-main">' + esc(catNameOf(e)) + ' &larr; ' + esc(e.task) + (e.sub ? " &rarr; " + esc(e.sub) : "") + pendTag(PK_ENTRY + e.id) + '</div>'
      + (e.notes ? '<div class="e-sub">' + esc(e.notes) + '</div>' : '')
      + '<div class="e-meta">' + [dateStr, e.count ? "כמות: "+esc(e.count) : "", ].filter(Boolean).join(" | ") + '</div>'
      + '</div>'
      + '<button data-act="entry-edit" data-id="' + esc(e.id) + '" class="u-bg-none u-bd-none u-cur-p u-fs-3 u-p-1-2">✏️</button>'
      + '<button class="del-btn" data-act="entry-del" data-id="' + esc(e.id) + '">✕</button>'
      + '</div>';
  }).join("");
}

function delEntry(id) {
  // tombstone במקום הסרה פיזית: הסרה פיזית נראית למכשיר אחר כ"רשומה שאני לא
  // מכיר" — הוא היה מחזיר אותה לחיים בסנכרון הבא.
  var deleted = ENTRIES.find(function(e){ return idEq(e.id, id) && isLive(e); });
  if (!deleted) return;
  recDelete(deleted);
  pendMark(PK_ENTRY + deleted.id);   // מחיקה היא כתיבה — ממתינה לאישור
  saveEntries();
  autoArchiveDay(deleted.day, deleted.hdate, deleted.gdate);
  renderLog();
  schedulePush();
}

function clearAll() {
  ask(MSG_CLEAR_ALL_TITLE, MSG_CLEAR_ALL_BODY, MSG_DELETE).then(function (yes) {
    if (!yes) return;
    var curKey = getCurrentDateKey();
    var ts = Date.now();
    var sample = ENTRIES.find(function(e){ return e.gdate === curKey; });
    ENTRIES.forEach(function(e){ if (e.gdate === curKey && isLive(e)) recDelete(e, ts); });
    saveEntries(); renderLog();
    // מעבירים את ה-tombstones גם לסנאפשוט של אותו יום, אחרת הארכיון ימשיך להציג אותן
    if (sample) autoArchiveDay(sample.day, sample.hdate, curKey);
    toast(MSG_ROWS_DELETED);
    schedulePush();
  });
}
/* ═══ שכבת המודאל — מודול משותף ═══════════════════════════════════════════
   ⛔ שכבת המודאל ושלושת העוזרים ישבו **מחוץ** לכל בלוק חתום ⛔ ונסחפו:
      ⚠️ `esc` לשלוש צורות — והיא הגנת ה-HTML היחידה שיש; `openModal` לשלוש,
      ⛔ ובאחת מהן נעדרה נעילת הגלילה לגמרי; ו-`lsToast` לשתיים.
   ⛔ שינוי כאן — כל האפליקציות **וכל עותקי השער**, באותו סבב: ⚠️ אחרת
      החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ⛔ מיכל אחד ומסלול סגירה יחיד — ⚠️ מסלול נפרד לכל דיאלוג הוא בדיוק מה
      שנשבר בשקט; ⭐ והכותרת ב-`textContent` ⛔ ולא ב-HTML, מפני שהיא מגיעה
      גם משם שהמשתמש הקליד. ⛔ וגוף `ask` ב-`textContent` אף הוא — ⚠️ דיאלוג
      שדורש HTML עובר ב-`openModal`.
   ⛔ ו-`locked` על ה-`body` אינה קישוט — ⚠️ בלעדיה הדף שמאחורי המודאל נגלל
      מתחתיו, ⭐ והמשתמש מאבד את מקומו ברשימה שממנה פתח אותו; ⛔ וההסרה
      מותנית בכך שהדיאלוג השני סגור — ⚠️ אחרת סגירת אחד משחררת את השני.
   ⚠️ `askResolve` יחיד — ⛔ אין תמיכה בשני דיאלוגי אישור פתוחים בו-זמנית,
      וגם אין בכך צורך: `#ask` הוא אלמנט יחיד ב-DOM.
   ═══════════════════════════════════════════════════════════════════════ */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
/*  ⛔ מיכל שאינו ב-DOM ⟵ **זעקה**, ⛔ ולא יציאה בשקט — ⚠️ הנימוק המדוד:
 *  המיכל ישב באחת מהן **בתוך מסך אחד מתוך שבעה** ⛔ ונמחק יחד איתו,
 *  ⭐ ו-`openModal` יצאה ב-`return` בלי שגיאה ובלי הודעה: ⛔ הכפתור «לא
 *  עשה כלום», ⚠️ ושלושה סבבים חיפשו בדלגציה ובמטפל. ⛔ ו-`locked` מוסרת
 *  גם במסלול הכשל — ⚠️ מחלקה ששרדה פתיחה קודמת חוסמת את גלילת הדף,
 *  ⭐ והמשתמש קורא לזה «המסך איטי» ⛔ ולא «המודאל תקוע». */
function uiNoDialog(where, id) {
  try { console.error('[ui] ' + where + ': #' + id + ' אינו ב-DOM'); } catch (e) {}
  try { document.body.classList.remove('locked'); } catch (e) {}
  try { toast('שגיאה: הדיאלוג אינו זמין (#' + id + ')', null, 'bad'); } catch (e) {}
}
function openModal(title, body, foot) {
  var m = document.getElementById('modal');
  var ttl = document.getElementById('modal-title');
  var bd = document.getElementById('modal-body');
  var ft = document.getElementById('modal-foot');
  if (!m || !ttl || !bd || !ft) { uiNoDialog('openModal', 'modal'); return; }
  ttl.textContent = title || '';
  bd.innerHTML = body || '';
  ft.innerHTML = foot || '';
  m.classList.add('open');
  document.body.classList.add('locked');
}
function closeModal() {
  var m = document.getElementById('modal');
  if (!m) { uiNoDialog('closeModal', 'modal'); return; }
  m.classList.remove('open');
  var bd = document.getElementById('modal-body');
  var ft = document.getElementById('modal-foot');
  if (bd) bd.innerHTML = '';
  if (ft) ft.innerHTML = '';
  var a = document.getElementById('ask');
  if (!a || !a.classList.contains('open')) document.body.classList.remove('locked');
}
var askResolve = null;
/*  ⛔ דיאלוג אישור שמיכלו חסר נענה **«לא»** — ⚠️ הבטחה שלא נפתרת משאירה
 *  את הקורא תלוי לנצח, ⭐ ו-`true` היה מבצע את הפעולה ההרסנית בלי שאיש
 *  אישר: ⛔ נכשל-סגור, ⛔ ובקול. */
function ask(title, text, yesLabel) {
  var a = document.getElementById('ask');
  var ttl = document.getElementById('ask-title');
  var bd = document.getElementById('ask-body');
  var yes = document.getElementById('ask-yes');
  if (!a || !ttl || !bd || !yes) { uiNoDialog('ask', 'ask'); return Promise.resolve(false); }
  ttl.textContent = title || '';
  bd.textContent = text || '';
  yes.textContent = yesLabel || 'אישור';
  a.classList.add('open');
  document.body.classList.add('locked');
  return new Promise(function (res) { askResolve = res; });
}
function closeAsk(v) {
  var a = document.getElementById('ask');
  if (!a) uiNoDialog('closeAsk', 'ask');
  else a.classList.remove('open');
  var m = document.getElementById('modal');
  if (!m || !m.classList.contains('open')) document.body.classList.remove('locked');
  if (askResolve) { askResolve(v); askResolve = null; }
}
/*  ⛔ `div` לכל הודעה, ⛔ ולא אלמנט קבוע אחד — ⚠️ הנימוק המדוד: בשלוש
 *  מהן הטוסט היה אלמנט יחיד, ⭐ והודעה שנייה דרסה את הראשונה: ⛔ «נשמר»
 *  ו«שגיאת רשת» ברצף השאירו על המסך אחת בלבד, ⚠️ ומי שקרא את המסך לא ידע
 *  שהייתה שנייה. ⛔ `kind` הוא שם מחלקה ⛔ ולא משך — ⚠️ ומי שאין לו ערך
 *  מוסר `null`; ⭐ והמשך יושב ב-`TOAST_DEFAULT_MS`, ⛔ הערך היחיד שנבדל. */
function toast(msg, dur, kind) {
  // ⛔ אין טוסט הצלחה אחרי כישלון שמירה מקומית. אין להסיר.
  if (typeof lsGuardToast === 'function' && !lsGuardToast(msg)) return;
  var box = document.getElementById('toasts');
  /*  ⛔ מיכל הטוסטים חסר ⟵ קונסולה, ⛔ ולא שתיקה — ⚠️ זהו משפך ההודעות
   *  היחיד, ⭐ ובלעדיו **כל** הודעה שהאפליקציה מנסה להציג נעלמת: ⛔ דיווח
   *  דרך טוסט היה חוזר לכאן, ⚠️ ולכן הוא בקונסולה בלבד. */
  if (!box) { try { console.error('[ui] toast: #toasts אינו ב-DOM — ' + msg); } catch (e) {} return; }
  var el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(function () {
    el.style.transition = 'opacity var(--dur-4)'; el.style.opacity = '0';
    setTimeout(function () { el.remove(); }, 260);
  }, dur || TOAST_DEFAULT_MS);
}
/*  ⛔ משך הודעת האחסון ⛔ ואינו ברירת המחדל של הטוסט — ⚠️ היא מדווחת על
   כשל כתיבה, ⭐ והקורא חייב זמן לקרוא אותה. */
var LS_TOAST_MS = 5000;
function lsToast(msg, dur, kind) { try { toast(msg, dur || LS_TOAST_MS, kind); } catch (e) {} }
/*  ⛔ סגירת המודאל היא שני מסלולים שנקראים מהמאזין האחד — ⚠️ לחיצה על
 *  הרקע ו-`Escape`: ⭐ המנגנון זהה בכולן, ⛔ ומאזין נפרד לכל אחד היה
 *  מפזר את הסגירה על פני שלושה מקומות. */
function modalBackdrop(e) {
  if (!e.target) return false;
  if (e.target.id === 'modal') { closeModal(); return true; }
  if (e.target.id === 'ask') { closeAsk(false); return true; }
  return false;
}
function modalEsc(e) {
  if (e.key !== 'Escape') return false;
  var a = document.getElementById('ask'), m = document.getElementById('modal');
  if (a && a.classList.contains('open')) { closeAsk(false); return true; }
  if (m && m.classList.contains('open')) { closeModal(); return true; }
  return false;
}
/* ═══════════════ סוף מודול שכבת המודאל ═════════════════════════════════ */
/* ═══ Enter שומר בשדה עריכה — מודול משותף ═══════════════════════════════
   ⛔ שדה שנשמר בכפתור נשמר גם ב-`Enter` — ⚠️ **וההיקף הוא הטופס** (`.ksave`)
      ⛔ ולא השדה: ⭐ שדה שנוסף לטופס קיים מקבל את המקש בלי שאיש ייגע בו,
      ⚠️ ומטפל פר-שדה נשכח בשדה הבא שנוסף.
   ⛔ והכפתור מסומן — ⚠️ `data-ksave` לשמירה ו-`data-kesc` לביטול: ⭐ בטופס
      יושב יותר מכפתור אחד, ⛔ ובחירה לפי סדר הייתה מפעילה את הראשון.
   ⛔ והניתוב הוא **מפת הפעולות** — ⚠️ הכפתור נמצא בתוך ההיקף והפעולה שלו
      מופעלת: ⭐ מסלול שמירה שני מתיישן ברגע שהראשון משתנה.
   ⛔ ו-`textarea` אינו נכנס — ⚠️ `Enter` בו הוא שורה חדשה.
   ⛔ שינוי כאן — כל האפליקציות **וכל עותקי השער**, באותו סבב: ⚠️ אחרת
      החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה. */
function ksFire(scope, attr) {
  var b = scope.querySelector('[' + attr + ']');
  if (!b || b.disabled) return false;
  var act = b.getAttribute('data-act');
  var fn = DOM_ACTIONS[act];
  if (!fn) { console.error('[ks] כפתור ' + attr + ' בלי פעולה במפה: ' + act); return false; }
  fn(b);
  return true;
}
/*  ⛔ המודול אינו רושם מאזין משלו — ⚠️ הוא נקרא מהמאזין האחד שבאפליקציה:
 *  ⭐ שני מאזינים לאותו אירוע הם שני מקומות שבהם מקש נתפס, ⛔ וסדר
 *  ההרצה ביניהם אינו מוצהר. */
function ksKey(e) {
  if (e.key !== 'Enter' && e.key !== 'Escape') return false;
  var t = e.target;
  if (!t || t.tagName !== 'INPUT' || !t.closest) return false;
  var scope = t.closest('.ksave');
  if (!scope) return false;
  if (!ksFire(scope, e.key === 'Enter' ? 'data-ksave' : 'data-kesc')) return false;
  e.preventDefault();
  return true;
}
/* ═══════════════ סוף מודול Enter שומר בשדה עריכה ════════════════════════ */

/* ═══ ערך מפתח-ערך — מודול משותף ════════════════════════════════════════
   ⛔ «אין ערך» ו«ערך פגום» אינן אותה תשובה — ⚠️ שתיהן חזרו «נכשל», ⭐ והמשתמש
      חיפש רשת שלא נפלה.
   ⛔ ולכן `null` הוא ערך שאינו קיים ⛔ ואינו כשל, ⚠️ וערך שאינו JSON הוא כשל
      שנוקב בשם המפתח.
   ⛔ והנוסח אחד בכולן — ⚠️ הודעה שנבדלת בין האפליקציות היא ארבעה חיפושים
      לאותה תקלה.
   ⛔ שינוי כאן — כל האפליקציות **וכל עותקי השער**, באותו סבב: ⚠️ אחרת
      החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה. */
function kvParse(key, raw) {
  if (raw === null || raw === undefined || raw === '') return { ok: true, value: null, bad: false };
  try { return { ok: true, value: JSON.parse(raw), bad: false }; }
  catch (e) {
    /*  ⛔ ההודעה יוצאת מכאן ⛔ ולא מאתר הקריאה — ⚠️ כשל שאינו אומר מה קרה
     *  שקול לכשל שקט, ⭐ ונקודת יציאה אחת היא מה שמשאיר את הנוסח אחד. */
    console.error('[sync] ' + MSG_KV_BAD + ' [' + key + ']:', e);
    toast('⚠️ ' + kvBadLabel(key), null, 'bad');
    return { ok: false, value: null, bad: true };
  }
}
function kvBadLabel(name) { return name + ' (' + MSG_KV_BAD + ')'; }
/* ═══════════════ סוף מודול ערך מפתח-ערך ═════════════════════════════════ */
/*  ⛔ מסלול סגירה אחד לשלושת הדרכים — כפתור, לחיצה על הרקע
 *  ו-`Escape`; ⚠️ מסלול נפרד לכל אחת הוא בדיוק מה שנשבר בשקט. */

// שם המוסד הפעיל — מקור אמת יחיד לכל הפלטים (PDF / דוח תמונה / סיגנל).
// קודם היה מקודד קשיח "ראשון לציון", כך שרמת אביב הוציאה דוחות בשם
// הישיבה השנייה.
function instName() {
  var el = document.getElementById("instNameInput");
  var v = el && el.value ? el.value.trim() : '';
  if (v) return v;
  return (YESHIVA === 'ramataviv')
    ? 'ישיבת תומכי תמימים ליובאוויטש רמת אביב'
    : 'ישיבת תומכי תמימים ליובאוויטש ראשון לציון';
}


// ייצוא PDF
/* ══════════════════════════════════════════════════════════════════════════
   פלטים — PDF ותמונת הדוח
   ══════════════════════════════════════════════════════════════════════════ */
/*  ⛔ **הייצוא מצלם את הדוח ⛔ ואינו בונה HTML חדש** — ⚠️ המסלול הזה בנה
 *  מסמך שני עם צבעים משלו (`#333` · `#ffffff` · `#f0f0f0` · `#ddd`),
 *  ⭐ ואיבד את צבעי הקטגוריות שהמסך מראה: ⛔ שני מקורות לאותו דוח הם
 *  שתי הזדמנויות שאחד מהם ייסחף. */
function exportPDF() {
  var live = liveOnly(ENTRIES);
  if (!live.length) { toast(MSG_NO_ROWS); return; }
  /*  ⛔ הכותרת נגזרת **לפני** הרינדור הא-סינכרוני — ⚠️ מסלול הארכיון מחליף
   *  את `ENTRIES` ואת שדה התאריך ומשחזר אותם מיד אחרי הקריאה, ⭐ והרינדור
   *  מסתיים אחרי השחזור: ⛔ קריאה מאוחרת הייתה מקבלת את תאריך היום. */
  var today = document.getElementById("hebDateInput").value || hebrewDate(new Date());
  var todayGreg = document.getElementById("gregDateInput").value || gregDateStr(new Date());
  var fileTitle = "יומן עבודה " + today + " " + todayGreg;
  toast(MSG_PDF_PREP);
  _buildReportDiv(function (div) {
    _renderReport(div).then(function (canvas) {
      div.style.left = '-9999px';
      _printCanvas(canvas, fileTitle);
    }).catch(function (e) { _reportError(div, e); });
  }, live);
}
/*  ⛔ מעטפת הדפסה לצילום ⛔ ואינה מסמך הדוח — ⚠️ אין בה טבלה, כותרת או
 *  צבע: ⭐ כל מה שנראה בדף הוא הפיקסלים שנמדדו, ⛔ ולכן אין מה שייסחף. */
function _printCanvas(canvas, title) {
  var w = null;
  try { w = window.open("", "_blank", "width=900,height=700"); } catch (e) { w = null; }
  // חוסם חלונות קופצים מחזיר null — בלי הבדיקה הפונקציה נפלה בשקט
  // ("w is null") והמשתמש לא ידע למה לא קרה כלום.
  if (!w || !w.document) {
    toast(MSG_POPUP_BLOCKED, null, 'bad');
    return;
  }
  w.document.write('<!DOCTYPE html><html dir="rtl" lang="he"><head><meta charset="UTF-8">'
    + '<title>' + esc(title) + '</title><style>@page{size:A4 portrait;margin:10mm}'
    + 'html,body{margin:0;padding:0;background:var(--card)}img{width:100%;height:auto;display:block}'
    + '</style></head><body><img alt="' + esc(title) + '" src="' + canvas.toDataURL('image/png') + '">'
    + '<' + 'script>window.onload=function(){setTimeout(function(){window.print();},500);}<\/script>'
    + '</body></html>');
  w.document.close();
  setTimeout(function () { try { w.document.title = title; } catch (e) {} }, 80);
  toast(MSG_PDF_OPENED);
}

// ── רשת ביטחון לרינדור הדוח ──
// ‎#_rpDiv הוא פאנל לבן position:fixed שמוצג **לפני** הרינדור.
// אם הרינדור זורק (אופליין ⇐ html2canvas לא נטען ⇐ ReferenceError, או כשל
// canvas/CORS), הפאנל היה נשאר מעל האפליקציה עד רענון.
function _hideReportDiv(div){
  try { if (div) div.style.left = '-9999px'; } catch(e) {}
}
function _reportError(div, e){
  _hideReportDiv(div);
  console.error('[report] rendering failed:', e);
  toast(
    (typeof html2canvas === 'undefined')
      ? MSG_IMG_OFFLINE
      : MSG_IMG_FAIL
  , null, 'bad');
}
// מחזירה תמיד promise, ⛔ ולעולם אינה זורקת סינכרונית —
// זריקה סינכרונית כאן הייתה משאירה את פאנל הדוח על המסך עד רענון.
function _renderReport(div){
  if (typeof html2canvas !== 'function') {
    return Promise.reject(new Error('html2canvas not loaded'));
  }
  try {
    return Promise.resolve(
      html2canvas(div,{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false})
    );
  } catch(e) {
    return Promise.reject(e);
  }
}

/*  ⛔ `entries` אופציונלי ⛔ ואינו נקודת הפעלה שנייה — ⚠️ המשמיט מקבל את
 *  רשומות היום, ⭐ והייצוא מוסר את רשומות הארכיון: ⛔ סינון קשיח ליום
 *  הנוכחי היה מוציא דוח ריק לכל יום שאינו היום. */
/*  ⛔ צבעי הדוח ליטרלים בכוונה ⛔ ואינם אסימוני ערכה — ⚠️ הדיב
 *  הזה נצרב לתמונה ונשלח החוצה, ⭐ והתמונה חייבת להיראות אותו דבר לכל
 *  מי שמקבל אותה: ⛔ אסימון שמתחלף עם מצב כהה היה שולח שני דוחות שונים
 *  לאותו יום, ⚠️ לפי הערכה של מי שלחץ. */
/*  ⛔ הדוח נצרב לתמונה ⛔ ולכן צבעיו ליטרלים — ⚠️ אסימון ערכה היה משנה
 *  את התמונה לפי המצב של מי שלחץ, ⭐ ושני מקבלים היו רואים שני דוחות.
 *  ⛔ **וכל ליטרל כאן הוא ערכו הבהיר של אסימון**, ⚠️ ומוצלב מולו בשער:
 *  `#1A2540` ⟵ `--text` · `#4A5A7A` ⟵ `--text-2` · `#8A9ABB` ⟵ `--text-3` ·
 *  `#D0DAF0` ⟵ `--border` · `#E4EBF5` ⟵ `--card-2` · `#F0F4FA` ⟵ `--bg` ·
 *  `#FFFFFF` ⟵ `--card`. ⭐ **וששת התווים מלאים** ⛔ ואינם קיצור בן שלושה:
 *  ⚠️ ההצלבה משווה טקסט, ⛔ ו-`#fff` אינו `#FFFFFF`.
 *  ⚠️ **ובמצב כהה הדוח יוצא בהיר אף הוא** — ⭐ זו התמונה שנשלחת, ⛔ והיא
 *  אינה נגזרת מהמצב של מי שצילם אותה. */
function _buildReportDiv(cb, entries){
  var div=document.getElementById('_rpDiv');
  if(!div){div=document.createElement('div');div.id='_rpDiv';document.body.appendChild(div);}
  div.style.cssText='position:fixed;top:0;left:0;background:#FFFFFF;padding:20px;width:900px;direction:rtl;font-family:Heebo,Arial,sans-serif;z-index:9999;';
  var today=document.getElementById("hebDateInput")?document.getElementById("hebDateInput").value:hebrewDate(new Date());
  var todayGreg=document.getElementById("gregDateInput")?document.getElementById("gregDateInput").value:gregDateStr(new Date());
  var dayLabel=document.getElementById("dayNameEl")?document.getElementById("dayNameEl").textContent:'';
  var instTitle=instName();
  var logoEl=document.getElementById('appLogo')||document.querySelector('.hdr-logo');
  var logoUrl=logoEl?logoEl.src:'';
  var curKey = getCurrentDateKey();
  var src = Array.isArray(entries) ? entries
          : liveOnly(ENTRIES).filter(function(e){ return e.gdate === curKey; });
  var sortedPDF = yaSortEntries(src);
  var byCAT={};sortedPDF.forEach(function(e){if(!byCAT[e.cat])byCAT[e.cat]={name:catNameOf(e),list:[]};byCAT[e.cat].list.push(e);});
  var catLetters=CATS.map(function(c){return c.letter;}).filter(function(l){return !!byCAT[l];});
  var rows='';
  var globalTaskIdx = 0;
  catLetters.forEach(function(letter){
    var data=byCAT[letter];
    var tgs=[];data.list.forEach(function(e){var last=tgs[tgs.length-1];if(last&&last.task===(e.task||''))last.items.push(e);else tgs.push({task:e.task||'',items:[e]});});
    var cri=0;
    tgs.forEach(function(tg,ti){
      var bg=(globalTaskIdx%2===0)?'#FFFFFF':'#F0F4FA'; globalTaskIdx++;
      tg.items.forEach(function(e,ii){
        rows+='<tr>';
