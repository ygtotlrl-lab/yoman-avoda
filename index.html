// ── Yeshiva selection (multi-tenant) ──
// קריאה מוגנת מ-localStorage. ערך פגום אחד (JSON חתוך, סוג לא צפוי) היה זורק
// לפני startApp() — והאפליקציה לא עלתה בכלל, מסך ריק. עכשיו: נופלים בחזרה
// לברירת המחדל, מדווחים לקונסול, וממשיכים לעלות.
function lsRead(key, fallback, kind) {
  var raw;
  try { raw = lsGet(key); } catch(e) { console.warn('[load] localStorage לא זמין:', e); return fallback; }
  if (raw == null || raw === "") return fallback;
  var val;
  try { val = JSON.parse(raw); } catch(e) {
    console.warn('[load] ערך פגום ב-' + key + ' — נטען ברירת מחדל', e);
    return fallback;
  }
  var ok = (kind === 'array') ? Array.isArray(val)
         : (kind === 'object') ? (val && typeof val === 'object' && !Array.isArray(val))
         : (val != null);
  if (!ok) { console.warn('[load] סוג לא צפוי ב-' + key + ' — נטען ברירת מחדל'); return fallback; }
  return val;
}
function loadLocalData() {
  try {
    CATS = lsRead("tb_cats"+LS, null, 'array') || JSON.parse(JSON.stringify(DEFAULT_CATS));
    SUBS = lsRead("tb_subs"+LS, null, 'object') || JSON.parse(JSON.stringify(DEFAULT_SUBS));
    // חותמות פר-מפתח של SUBS. אין קובץ? כל המפתחות "ותיקים" (0) — בדיוק כמו
    // רשומה בלי updatedAt: לא נופלים, אבל מפסידים לכל עדכון מתוארך.
    SUBS_META = lsRead("tb_subs_meta"+LS, null, 'object') || {};
    ENTRIES = lsRead("tb_entries"+LS, null, 'array') || [];
    // רשומות זבל (null / לא-אובייקט) לא מפילות את הרינדור
    ENTRIES = ENTRIES.filter(function(e){ return e && typeof e === 'object'; });
    // גריעת tombstones מעבר ל-`TOMBSTONE_TTL_MS` — בטעינה בלבד, פעם אחת לעלייה.
    // הדגל נצרך במיזוג הראשון שאחרי הטעינה (ראה _tombPrunePending), כי אחרת
    // העותק הענני היה מחזיר את כולם מיד.
    var _beforePrune = ENTRIES.length;
    ENTRIES = prunePastTombstones(ENTRIES);
    if (ENTRIES.length !== _beforePrune) {
      console.log('[load] נגרעו ' + (_beforePrune - ENTRIES.length) + ' tombstones מעבר ל-TOMBSTONE_TTL_MS');
    }
    _tombPrunePending = true;
    /*  ⛔ הארכיון נטען מהדיסק בלבד ⛔ ואין זרע מוטבע (סבב 89) — ⚠️ הנימוק
     *  המדוד: `ARCHIVE_SEED` החזיק 90 סנאפשוטים בקוד עצמו, ⭐ והוזרק
     *  מחדש **בכל טעינה ובכל מיזוג** לכל `gdate` שלא נמצא: ⛔ ולכן יום
     *  שנמחק חזר בטעינה הבאה — ⚠️ ה-tombstone נוצח על ידי קבוע.
     *  ⛔ ונמדד מול המסד לפני ההסרה: כל 90 המפתחות קיימים בענן, ⭐ ומספר
     *  הרשומות הפנימיות זהה בכולם — ⚠️ אפס חסרים ואפס דלים יותר. */
    var arr = lsRead("tb_archive"+LS, null, 'array');
    ARCHIVE = arr ? arr.filter(function(s){ return s && typeof s === 'object'; }) : [];
  } catch(e) {
    // גם כישלון בלתי צפוי לא ימנע מהאפליקציה לעלות
    console.error('[load] טעינת נתונים מקומיים נכשלה — עולים עם ברירות מחדל', e);
    if (!Array.isArray(CATS) || !CATS.length) CATS = JSON.parse(JSON.stringify(DEFAULT_CATS));
    if (!SUBS || typeof SUBS !== 'object') SUBS = JSON.parse(JSON.stringify(DEFAULT_SUBS));
    if (!SUBS_META || typeof SUBS_META !== 'object') SUBS_META = {};
    if (!Array.isArray(ENTRIES)) ENTRIES = [];
    if (!Array.isArray(ARCHIVE)) ARCHIVE = [];
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   הגירה חד-פעמית: מפתחות שריד מלפני הרב-דיירות
   ══════════════════════════════════════════════════════════════════════════
   **הבעיה שנמדדה** (אוגוסט 2026, בדפדפן אמיתי): הדומיין תפס 4.31MB מתוך
   ~5MB (86%), ויומן עבודה לבדה 3.52MB. הסיבה — ארבעה מפתחות **כפולים**:

       tb_archive = 157 פריטים   ·   tb_archive_rishon = 167
       tb_entries = 310 פריטים   ·   tb_entries_rishon = 451

   המפתחות **בלי הסיומת** הם שריד: `LS` מתחיל כמחרוזת ריקה והופך ל-`'_rishon'`
   רק אחרי בחירת הישיבה, ולכן קוד שקדם לרב-דיירות כתב אליהם. מאז אף אחד לא
   קורא ולא כותב אליהם — הם פשוט תופסים ~1.5MB מהמכסה **המשותפת לארבע
   האפליקציות**. זו הצרכנית הגדולה בדומיין, ולכן זה לא נזק תיאורטי.

   ⛔ **מחיקה עיוורת אסורה** (סבב 13) — 157 פריטים בשריד מול 167 בסיומת אינם בהכרח
   תת-קבוצה: ייתכן פריט שנכתב לשריד ומעולם לא הגיע ליעד. לכן ההגירה בנויה
   כשרשרת שערים, ומחיקה היא **הצעד האחרון** ורק אחרי אימות:

     1. **מיזוג אמיתי, לא השוואת אורכים.** משתמשים במנוע המיזוג הקיים
        (`mergeEntries`/`mergeArchive`) כשהצד עם הסיומת הוא ה"מרוחק" — ולכן
        הוא מנצח בשוויון, ו**tombstone שלו גובר על רשומת שריד חסרת חותמת**.
        זה מה שמונע מרשומה שנמחקה מאז לקום לתחייה.
     2. **אימות פריט-פריט.** כל פריט שריד חייב להיות מיוצג בתוצאה. פריט
        אחד שאינו — ההגירה **מתבטלת כולה** לאותו מפתח, והשריד נשאר.
     3. **כותבים לפני שמוחקים**, ורק כתיבה שהחזירה `true` מתירה מחיקה
        (כלל ברזל 2 — אין כישלון שקט).
     4. **אידמפוטנטי:** אין שריד ⇒ הפונקציה יוצאת מיד. הרצה שנייה היא no-op.

   ⛔ **רק ראשון לציון.** המפתחות חסרי הסיומת קדמו לרב-דיירות, כלומר כל
   תוכנם שייך לראשון לציון. מיזוג שלהם לתוך רמת אביב היה **דליפה בין
   מוסדות** — בדיוק מה שסיומת ה-`LS` באה למנוע.

   **הפינוי אינו בלתי נראה:** כל הגירה, וכל **דילוג** על הגירה, נרשמים ביומן
   הפינוי (`LS_CFG.logKey`) ומוצגים בהגדרות ← מידע טכני ›.
   ══════════════════════════════════════════════════════════════════════════ */
var TB_LEGACY_SPECS = [
  { legacy: 'tb_entries', suffix: '_rishon', label: 'רשומות היומן',
    keyOf: function (r) { return entryKey(r); },
    merge: function (l, r) { return mergeEntries(l, r); } },
  { legacy: 'tb_archive', suffix: '_rishon', label: 'ארכיון ימים',
    keyOf: function (r) { return archiveKey(r); },
    merge: function (l, r) { return mergeArchive(l, r); } }
];
function migrateLegacyLsKeys() {
  var report = { ran: false, cleared: [], merged: 0, freed: 0, skipped: [] };
  if (YESHIVA !== 'rishon') return report;   // ⛔ ראשון לציון בלבד (סבב 13) — דליפה בין מוסדות
  report.ran = true;

  TB_LEGACY_SPECS.forEach(function (sp) {
    var raw = null;
    try { raw = lsGet(sp.legacy); } catch (e) { raw = null; }
    if (raw == null) return;                 // אין שריד — אידמפוטנטי
    var bytes = (sp.legacy.length + raw.length) * 2;

    var legacy = null;
    try { legacy = JSON.parse(raw); } catch (e) { legacy = null; }
    if (!Array.isArray(legacy)) {
      // ערך פגום: אי אפשר לאמת שלא נאבד ממנו כלום, ולכן לא נוגעים בו.
      lsLog('שריד לא תקין — לא נמחק', sp.legacy, 0);
      report.skipped.push(sp.legacy); return;
    }

    var target = sp.legacy + sp.suffix;
    var cur = lsRead(target, [], 'array') || [];
    var merged = sp.merge(legacy, cur);      // השריד = מקומי, היעד = "מרוחק"

    // ── שער האימות: כל פריט שריד חייב להיות מיוצג בתוצאה ──
    var inMerged = {}, inTarget = {};
    merged.forEach(function (r) { var k = sp.keyOf(r); if (k != null) inMerged[String(k)] = 1; });
    cur.forEach(function (r) { var k = sp.keyOf(r); if (k != null) inTarget[String(k)] = 1; });
    var added = 0, lost = 0, unkeyed = 0;
    legacy.forEach(function (r) {
      if (!r || typeof r !== 'object') return;          // זבל — לא פריט נתונים
      var k = sp.keyOf(r);
      if (k == null) { unkeyed++; return; }             // אובייקט בלי מזהה: לא ניתן לאימות
      k = String(k);
      if (!inMerged[k]) lost++;
      else if (!inTarget[k]) added++;
    });
    if (lost || unkeyed) {
      lsLog('הגירת שריד בוטלה', sp.legacy + ' — ' + (lost + unkeyed) + ' פריטים לא אומתו', 0);
      report.skipped.push(sp.legacy); return;
    }

    // ── כותבים לפני שמוחקים, ורק כתיבה שהצליחה מתירה מחיקה ──
    if (added && !lsSetArray(target, merged, _tbRecTs)) {
      lsLog('הגירת שריד נדחתה', sp.legacy + ' — הכתיבה ל-' + target + ' נכשלה', 0);
      report.skipped.push(sp.legacy); return;
    }

    lsRemove(sp.legacy);
    report.cleared.push(sp.legacy);
    report.merged += added;
    report.freed += bytes;
    lsLog('שריד נוקה', sp.label + ': ' + added + ' פריטים מוזגו ל-' + target, bytes);
  });

  if (report.cleared.length) {
    console.log('[legacy] נוקו ' + report.cleared.length + ' מפתחות שריד (' +
      lsFmtBytes(report.freed) + ' פונו), ' + report.merged + ' פריטים מוזגו פנימה');
  }
  return report;
}

/*  ⛔ שמות שני המוסדות במקום אחד — ⚠️ הם מופיעים בבורר, בכותרת המשנה
 *  ובאישור, ⭐ ושלושה מקומות שכל אחד מחזיק את השם הם שלוש הזדמנויות
 *  לכתוב אותו אחרת. */
var YESHIVOT = [
  { id: 'rishon',    name: 'ראשון לציון' },
  { id: 'ramataviv', name: 'רמת אביב' },
];
/* ══════════════════════════════════════════════════════════════════════════
   החלפת מוסד — הבורר, איפוס המצב, והעלייה מחדש
   ══════════════════════════════════════════════════════════════════════════ */
function ysNameOf(y) {
  for (var i = 0; i < YESHIVOT.length; i++) if (idEq(YESHIVOT[i].id, y)) return YESHIVOT[i].name;
  return '';
}

/*  ⛔ המצב שאינו נטען מחדש מהדיסק (סבב 81) — ⚠️ `loadLocalData` מחליפה את
 *  הרשומות, שהמפתחות שלהן נושאים סיומת מוסד; ⛔ אבל עֵד הדחיפה ואות
 *  הפולינג הם **זיכרון בלבד** ואין להם סיומת:
 *  ⭐ אות פולינג שנשאר משל המוסד הקודם גורם למשיכה הראשונה של החדש
 *  לחשוב שאין מה למשוך, ⛔ ועֵד דחיפה שנשאר מתיר פינוי של רשומה שמעולם
 *  לא עלתה מהמוסד הנוכחי. ⚠️ שניהם מתאפסים לערך שנקרא «אין ראיה»,
 *  ⛔ ולא לערך שנראה כמו ידיעה. */
/*  ⛔⛔ המצב הפר-מוסדי מאופס **כולו**, ⛔ ולא משתני הסנכרון בלבד — ⚠️ הנימוק
 *  המדוד: עד כאן `ENTRIES` · `CATS` · `SUBS` · `SUBS_META` · `ARCHIVE`
 *  נשארו בזיכרון אחרי ההחלפה, ⛔ בעוד ש-`YESHIVA` · `KV_TABLE` · `LS` כבר
 *  הצביעו על המוסד החדש: ⭐ וכל דחיפה שרצה בחלון הזה כתבה את נתוני המוסד
 *  הקודם תחת החדש. ⛔ **וזה לא תיאורטי** — ⚠️ 185 מ-187 ארכיוני רמת אביב
 *  היו של ראשון, ו-`tb_subs` נדרס לגמרי.
 *  ⛔ ואיפוס למערך ריק אינו מחיקה בענן — ⚠️ הדחיפה מעלה שורות «מלוכלכות»
 *  בלבד, ⭐ ומערך ריק הוא «אין מה לדחוף» ⛔ ולא «נמחק הכול».
 *  ⛔ ומפת החותמות המרוחקות מתאפסת אף היא — ⚠️ היא נמדדה מול המוסד הקודם,
 *  ⭐ והשוואה מולה הייתה מכריעה מה לדחוף על סמך טבלה אחרת. */
function ysResetTenantState() {
  _tbEpoch++;
  /*  ⛔ דחיפה מושהית שנקבעה במוסד הקודם מבוטלת (סבב 88) — ⚠️ היא נקבעה
   *  על נתונים שכבר אינם בזיכרון, ⭐ ומה שהיא תמצא בו כשתתעורר שייך
   *  למוסד אחר: ⛔ ובכל מקרה שער ההקשר עוצר אותה, ⚠️ וביטול התקתוק
   *  חוסך את הנסיעה לרשת. */
  if (_syncPushTimer) { clearTimeout(_syncPushTimer); _syncPushTimer = null; }
  _tbPushedAt = {};
  _lastKnownTimestamp = 0;
  _plFullAt = 0;
  _pendMap = null;
  _tombPrunePending = false;
  _tbRemote = { tb_entries: null, tb_archive: null };
  _pendDrawHold = {};
  _hwCloudSeen = {};
  _tbLastSyncAt = 0;
  _tbNetWarned = false;
  _tbPullLogged = false;
  ENTRIES = [];
  ARCHIVE = [];
  CATS = [];
  SUBS = {};
  SUBS_META = {};
  arcSelYear = null;
  arcSelMonth = null;
  arcSelDayKey = null;
}

/*  ⛔ הבורר עובר ב-`openModal` הקיים — ⚠️ מיכל אחד ומסלול סגירה יחיד. */
function ysPickYeshiva() {
  var body = '<div style="display:flex;flex-direction:column;gap:10px">';
  for (var i = 0; i < YESHIVOT.length; i++) {
    var cur = idEq(YESHIVOT[i].id, YESHIVA);
    body += '<button class="btn-sm" data-act="switch-yeshiva" data-yeshiva="' + YESHIVOT[i].id + '"' +
            ' style="background:var(--primary);color:#fff;padding:14px;font-size:16px;font-weight:800' +
            (cur ? ';opacity:.55' : '') + '">' + esc(YESHIVOT[i].name) +
            (cur ? ' ✓' : '') + '</button>';
  }
  body += '</div>';
  openModal('החלפת ישיבה', body, '');
}

/*  ⛔ המעבר מאפס את המצב **לפני** הטעינה מחדש (סבב 81) — ⚠️ סדר הפוך
 *  היה מאפס אחרי ש-`selectYeshiva` כבר משכה, ⭐ ואז אות הפולינג של
 *  המוסד החדש נמחק מיד אחרי שנקרא. */
/*  ⛔ **אין אישור שני** (סבב 82) — ⚠️ הבחירה במוסד בבורר **היא** האישור:
 *  ⭐ שני דיאלוגים לפעולה אחת מלמדים ללחוץ «כן» בלי לקרוא, ⛔ ואז גם
 *  האישור שכן חשוב נלחץ בלי לקרוא. */
function ysConfirmSwitch(y) {
  if (!ysNameOf(y)) return;
  closeModal();
  if (idEq(y, YESHIVA)) { toast('כבר במוסד ' + ysNameOf(y)); return; }
  ysResetTenantState();
  selectYeshiva(y, true);
  /*  ⛔ הארכיון חוזר לשורש דרך נקודת הניווט היחידה — ⚠️ שנת הקידוח
   *  של המוסד הקודם אינה קיימת בהכרח בחדש, ⭐ ומסך שנשאר בעומק היה
   *  מציג ריק בלי שהמשתמש יודע למה. */
  try { arcGoYears(); } catch (e) { console.warn('[arc] arcGoYears', e); }
  toast('הוחלף ל' + ysNameOf(y));
}

/*  ⛔ `again` מסמן מעבר בין מוסדות ⛔ ולא עלייה (סבב 81) — ⚠️ כל
 *  ה-`boot` כאן שומרים על עצמם מהפעלה כפולה חוץ מ-`pendBoot`, שמוסיף
 *  מאזיני רשת בכל קריאה: ⭐ המצב הפר-מוסדי מתרענן ב-`pendReload`,
 *  ⛔ והחיווט נעשה פעם אחת. ⚠️ ואין כאן נקודת הפעלה שנייה — ⭐ זו אותה
 *  פונקציה בדיוק, ⛔ ולא מעטפת שמשכפלת את גופה. */
function selectYeshiva(y, again) {
  YESHIVA  = y;
  KV_TABLE = (y === 'ramataviv') ? 'kv_ramataviv' : 'kv_rishon';
  LS       = '_' + y;

  // לוגו הכותרת — לוכד פעם אחת את הלוגו הנוכחי של ראשון, ואז מחליף פר-מוסד
  var logoEl = document.getElementById('appLogo');
  if (logoEl) {
    if (!RISHON_LOGO) RISHON_LOGO = logoEl.getAttribute('src');
    logoEl.src = (y === 'ramataviv') ? RAMATAVIV_LOGO : RISHON_LOGO;
  }
  // כותרת משנה
  var sub = document.getElementById('hdrSub');
  if (sub) sub.textContent = (y === 'ramataviv')
    ? 'ישיבת תומכי תמימים ליובאוויטש רמת אביב'
    : 'ישיבת תומכי תמימים ליובאוויטש ראשון לציון';
  // ⛔ כפתור שיתוף **לשני המוסדות** (סבב 72) — ⚠️ מסבב 58 ועד כאן הוא הוצג
  //    לרמת אביב בלבד: כפתור ראשון לציון היה «שלח לוואטסאפ», והוא ירד יחד
  //    עם יכולת הוואטסאפ במקום להיגזר ממנה. ⛔ ההסרה הפילה קורא.
  //    ⭐ היעד נבחר בגיליון השיתוף של המערכת, ⛔ ולכן אין כאן שם של יעד:
  //    כפתור אחד, זהה בשני המוסדות, ואותה פונקציה מאחוריו.
  var slot = document.getElementById('outputBtnSlot');
  if (slot) slot.innerHTML =
    '<button class="btn-sm" style="background:#3A76F0;color:white" ' +
    'data-act="share-report">📤 שיתוף הדוח</button>';

  // עמידות אחסון (סבב 11): המפתחות תלויי-מוסד, ולכן המדיניות נבנית רק
  // עכשיו — ומיד אחריה המדידה והפינוי היזום, **לפני** loadLocalData, כדי
  // שהטעינה והמיזוג שאחריה כבר יכתבו לאחסון שיש בו מקום.
  // ⚠️ ההגירה רצה **בין** בניית המדיניות למדידה: היא מפנה ~1.5MB, ולכן
  // `lsBoot` שאחריה רואה את הניצולת האמיתית ולא מפנה ארכיון שאין צורך
  // לפנות. היא חייבת לרוץ גם **לפני** `loadLocalData`, כדי שהטעינה תראה
  // את המערך הממוזג ולא את זה שלפני ההגירה.
  try { lsRebuildPolicy(); migrateLegacyLsKeys(); lsBoot(); } catch (e) { console.warn('[ls] lsBoot', e); }
  /*  ⛔⛔ הטעינה **לפני** כל `boot` שיכול לדחוף (סבב 87ג) — ⚠️ עד כאן היא
   *  ישבה אחרי `plBoot`, ⛔ וביניהן רצו הריקון החוזר והמשיכה: ⭐ בחלון הזה
   *  `LS` כבר הצביע על המוסד החדש והזיכרון עדיין החזיק את הישן.
   *  ⛔ אין להזיז אותה שוב מטה — ⚠️ זה בדיוק הבאג. ⭐ והיא נשארת **אחרי**
   *  `lsBoot`, ⛔ שההגירה והפינוי חייבים לרוץ לפניה. */
  loadLocalData();
  // סימוני "ממתין לסנכרון" (סבב 12). **pendReload ולא pendBoot בלבד** —
  // מפתח הסימונים נושא סיומת מוסד, וסימון של ראשון לציון אינו תקף לרמת אביב.
  try { pendReload(); if (!again) pendBoot(); } catch (e) { console.warn('[pend] pendBoot', e); }
  // גיבוי יומי ויומן פעולות (סבב 30) — נקודת ההפעלה היחידה של המודול.
  // ⚠️ כאן ולא מוקדם יותר, וזה פרטי ליומן: `BK_CFG.sources` נשענת על
  //    `KV_TABLE`, שהוא `null` עד שנבחר מוסד. ⛔ אין להזיז את הקריאה
  //    למסלול סנכרון (סבב 30, השלמה) — ר' ההערה ב-`_tbMarkSynced`.
  try { bkBoot(); } catch (e) { console.warn('[bk] bkBoot', e); }
  try { hwBoot(); } catch (e) { console.warn('[hw] hwBoot', e); }
  // ניסיון חוזר בסנכרון (סבב 44) — נקודת ההפעלה היחידה של המודול.
  try { rtyBoot(); } catch (e) { console.warn('[rty] rtyBoot', e); }
  // מנגנון המשיכה (סבב 51) — נקודת ההפעלה היחידה של המודול. ⚠️ כאן ולא
  //    מוקדם יותר, מאותה סיבה כמו `bkBoot`: `KV_TABLE` הוא `null` עד
  //    שנבחר מוסד, ותקתוק לפני כן היה שואל טבלה שאינה קיימת.
  try { plBoot(); } catch (e) { console.warn('[pl] plBoot', e); }
  var ov = document.getElementById('yeshivaSelect');
  if (ov) ov.style.display = 'none';
  // מסך הבחירה כבר נסגר — כישלון כאן חייב להשאיר אפליקציה שמישה ולא מסך ריק
  try {
    startApp();
  } catch(e) {
    console.error('[startApp] נכשל', e);
    toast("⚠️ שגיאה בעליית האפליקציה — נסה לרענן");
  }
}

// ── פלט ל-Signal: תמונה של הדוח היומי ──
// בניית div הדוח ⇐ html2canvas ⇐ קובץ ⇐ גיליון השיתוף של המערכת
// (המשתמש בוחר Signal). תמונת הדוח משתמשת אוטומטית בלוגו ובשם של המוסד
// הנבחר (דרך #appLogo.src ו-instName הפר-מוסדי של _buildReportDiv).
// נפילה-חזרה בדסקטופ: הורדת התמונה.
function shareReport(){
  var curKey = getCurrentDateKey();
  var todayEntries = liveOnly(ENTRIES).filter(function(e){ return e.gdate === curKey; });
  if(!todayEntries.length){ toast("אין רשומות לשיתוף להיום"); return; }
  toast("מכין תמונה...");
  _buildReportDiv(function(div){
    _renderReport(div).then(function(canvas){
      div.style.left='-9999px';
      // גשר ה-WebView המקורי של אנדרואיד ⇐ גיליון השיתוף של המערכת (המשתמש בוחר Signal)
      if (_androidShareImage(canvas)) return;
      canvas.toBlob(function(blob){
        var file = new File([blob], 'yoman.jpg', {type:'image/jpeg'});
        if (navigator.canShare && navigator.canShare({files:[file]})) {
          navigator.share({files:[file]}).catch(function(err){
            if (err && err.name !== 'AbortError') _shareDownloadFallback(canvas);
          });
          return;
        }
        // דסקטופ או סביבה שאינה נתמכת: הורדת התמונה (אין קישור עומק ל-Signal)
        _shareDownloadFallback(canvas);
      },'image/jpeg',0.95);
    }).catch(function(e){ _reportError(div, e); });
  });
}


function editEntry(id) {
  var e = ENTRIES.find(function(x){ return idEq(x.id, id) && isLive(x); });
  if(!e) return;
  // ⛔ `idArg` חובה (סבב 64) — מזהה טקסט, ⛔ והציטוט נשבר בשקט בלעדיו.
  // ⛔ האיתור עבר ל-`data-id` יחד עם ההעברה (סבב 67) — בורר שחיפש את
  // מחרוזת ה-`onclick` היה מפסיק למצוא דבר ברגע שהמאפיין ירד, והעריכה
  // הייתה מתה בשקט. ר' כלל ברזל 27.
  var sel = '[data-id="' + cssQ(id) + '"]';
  var row = document.querySelector('[data-act="entry-del"]' + sel);
  if(!row) { row = document.querySelector('[data-act="entry-edit"]' + sel); }
  if(!row) return;
  var container = row.closest('.entry-row');
  if(!container) return;
  var div = document.createElement('div');
  div.style.cssText = 'display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px;background:#fffbe6;border-radius:6px;';
  div.innerHTML =
    '<input aria-label="משימה" id="ei_task" placeholder="משימה" style="flex:2;padding:4px 8px;border:1px solid #ccc;border-radius:4px;font-family:Heebo,sans-serif;">' +
    '<input aria-label="תת-משימה" id="ei_sub" placeholder="תת-משימה" style="flex:2;padding:4px 8px;border:1px solid #ccc;border-radius:4px;font-family:Heebo,sans-serif;">' +
    '<input aria-label="כמות" id="ei_count" type="text" inputmode="numeric" autocomplete="off" placeholder="כמות" style="width:60px;padding:4px 8px;border:1px solid #ccc;border-radius:4px;font-family:Heebo,sans-serif;">' +
    '<input aria-label="הערות" id="ei_notes" placeholder="הרחבה" style="flex:3;padding:4px 8px;border:1px solid #ccc;border-radius:4px;font-family:Heebo,sans-serif;">' +
    '<button data-act="entry-save" data-id="' + esc(id) + '" style="padding:4px 10px;background:#1A2B5E;color:white;border:none;border-radius:4px;cursor:pointer;font-family:Heebo,sans-serif;">שמור</button>' +
    '<button data-act="entry-edit-cancel" style="padding:4px 10px;background:#aaa;color:white;border:none;border-radius:4px;cursor:pointer;font-family:Heebo,sans-serif;">ביטול</button>';
  container.innerHTML = '';
  container.appendChild(div);
  // קובע את הערכים ישירות ב-JS — מונע לחלוטין בעיות בריחת HTML
  document.getElementById('ei_task').value = e.task || '';
  document.getElementById('ei_sub').value = e.sub || '';
  document.getElementById('ei_count').value = e.count || '';
  document.getElementById('ei_notes').value = e.notes || '';
}

function saveEntry(id) {
  var e = ENTRIES.find(function(x){ return idEq(x.id, id) && isLive(x); });
  if(!e) return;
  e.task = document.getElementById('ei_task').value.trim() || e.task;
  e.sub = document.getElementById('ei_sub').value.trim();
  e.count = document.getElementById('ei_count').value.trim();
  e.notes = document.getElementById('ei_notes').value.trim();
  recTouch(e);   // בלי זה העדכון מפסיד במיזוג מול העותק הישן שבענן
  pendMark(PK_ENTRY + e.id);
  saveEntries();
  autoArchiveDay(e.day, e.hdate, e.gdate);   // שהעריכה תגיע גם לסנאפשוט של אותו יום
  renderLog();
  scheduleSyncPush();
  toast(MSG_SAVED);
}

function arcEditEntry(gdateKey, entryId) {
  var days = getAllArchiveDays();
  var d = days[gdateKey];
  if(!d) return;
  var e = d.entries.find(function(x){ return idEq(x.id, entryId); });
  if(!e) return;
  // מאתר את אלמנט השורה ומחליף אותו בטופס עריכה במקום
  var rows = document.querySelectorAll('.arc-entry-row');
  var target = null;
  var qk = jsQ(gdateKey);
  rows.forEach(function(r){
    // ⛔ `idArg` חובה (סבב 64) — מזהה טקסט, ⛔ והציטוט נשבר בשקט בלעדיו.
    if(r.innerHTML.indexOf('arcDeleteEntry(\'' + qk + '\',' + idArg(entryId) + ')') > -1 ||
       r.innerHTML.indexOf('arcEditEntry(\'' + qk + '\',' + idArg(entryId) + ')') > -1) {
      target = r;
    }
  });
  if(!target) return;
  target.innerHTML =
    '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:4px;background:#fffbe6;border-radius:6px;width:100%;">' +
    '<input aria-label="משימה" id="aei_task" value="' + esc(e.task||'') + '" placeholder="משימה" style="flex:2;padding:4px 8px;border:1px solid #ccc;border-radius:4px;min-width:80px;font-family:Heebo,sans-serif;font-size:12px;">' +
    '<input aria-label="תת-משימה" id="aei_sub" value="' + esc(e.sub||'') + '" placeholder="תת-משימה" style="flex:2;padding:4px 8px;border:1px solid #ccc;border-radius:4px;min-width:80px;font-family:Heebo,sans-serif;font-size:12px;">' +
    '<input aria-label="כמות" id="aei_count" type="text" inputmode="numeric" autocomplete="off" value="' + (e.count||'') + '" placeholder="כמות" style="width:55px;padding:4px 8px;border:1px solid #ccc;border-radius:4px;font-family:Heebo,sans-serif;font-size:12px;">' +
    '<input aria-label="הערות" id="aei_notes" value="' + esc(e.notes||'') + '" placeholder="הרחבה" style="flex:3;padding:4px 8px;border:1px solid #ccc;border-radius:4px;min-width:80px;font-family:Heebo,sans-serif;font-size:12px;">' +
    '<button data-act="arc-entry-save" data-key="' + esc(gdateKey) + '" data-id="' + esc(entryId) + '" style="padding:4px 10px;background:#1A2B5E;color:white;border:none;border-radius:4px;cursor:pointer;font-family:Heebo,sans-serif;">שמור</button>' +
    '<button data-act="arc-entry-edit-cancel" style="padding:4px 10px;background:#aaa;color:white;border:none;border-radius:4px;cursor:pointer;font-family:Heebo,sans-serif;">בטל</button>' +
    '</div>';
}

function arcSaveEntry(gdateKey, entryId) {
  // מטפל בשני המקורות — ARCHIVE וגם ENTRIES — בדיוק כמו arcDeleteEntry.
  // רשומה שקיימת רק ב-ENTRIES (יום שעדיין לא אורכב) הייתה no-op שהציג "נשמר!".
  var ts = Date.now();
  function fld(id) { var el = document.getElementById(id); return el ? el.value.trim() : null; }
  var vals = { task: fld('aei_task'), sub: fld('aei_sub'), count: fld('aei_count'), notes: fld('aei_notes') };
  if (vals.task === null) { toast('⚠️ טופס העריכה נסגר — נסה שוב'); return; }
  function apply(e) {
    e.task = vals.task; e.sub = vals.sub; e.count = vals.count; e.notes = vals.notes;
    recTouch(e, ts);
  }
  var hits = 0, touchedArc = [];
  ARCHIVE.forEach(function(snap) {
    var hit = false;
    (snap.entries||[]).forEach(function(e) {
      if (e && idEq(e.id, entryId)) { apply(e); hit = true; hits++; }
    });
    if (hit) { recTouch(snap, ts); touchedArc.push(archiveKey(snap)); }
  });
  ENTRIES.forEach(function(e) {
    if (e && idEq(e.id, entryId)) { apply(e); hits++; }
  });
  if (!hits) {
    // אין מה לשמור — לא לשקר למשתמש
    console.warn('[arcSaveEntry] רשומה לא נמצאה:', entryId, gdateKey);
    renderArcDetail();
    toast('⚠️ הרשומה לא נמצאה — לא נשמר');
    return;
  }
  pendMark(PK_ENTRY + entryId);
  // ⛔ מפתח הסימון של סנאפשוט הוא `archiveKey` ולא מפתח המפה של
  //    `getAllArchiveDays` (סבב 37) — המפה ממופתחת ב-gdate **גולמי**
  //    (`"3/09/2025"`), ואילו שלוש נקודות הקריאה — `tbDirtyRows`,
  //    `HW_CFG.specs[].isPending` ו-`mergeArchive` — קוראות
  //    `PK_ARC + archiveKey(r)`, כלומר `arc:g:3/09/2025`. עד סבב 37 נכתב
  //    כאן `arc:3/09/2025`, ולכן **אף אחת מהשלוש לא ראתה את הסימון**:
  //    עריכת רשומה בארכיון לא נחשבה «לדחיפה», ושער הפינוי של החלון החם
  //    היה רשאי לפנות סנאפשוט שהעריכה שלו טרם עלתה.
  touchedArc.forEach(function(k) { if (k != null) pendMark(PK_ARC + k); });
  saveEntries();
  saveArchive();
  renderArcDetail();
  renderLog();
  toast(MSG_SAVED);
}

// תמיכה במקש Enter בלשוניות ההזנה והעריכה
document.addEventListener('keydown', function(e) {
  if (e.key !== 'Enter') return;
  var id = e.target.id || '';
  // שדות לשונית ההזנה: taskInput, subInput, countInput, notesInput
  if (id === 'taskInput' || id === 'subInput' || id === 'countInput' || id === 'notesInput') {
    e.preventDefault();
    if (typeof addEntry === 'function') addEntry();
    return;
  }
  // שדות המשימה החדשה בלשונית העריכה: snewtask-ci
  if (id.startsWith('snewtask-')) {
    e.preventDefault();
    var ci = parseInt(id.replace('snewtask-', ''));
    if (typeof addTask === 'function') addTask(ci);
    return;
  }
  // שדות תת-המשימה החדשה בלשונית העריכה: snewsub-ci-ti
  if (id.startsWith('snewsub-')) {
    e.preventDefault();
    var parts = id.replace('snewsub-', '').split('-');
    var ci = parseInt(parts[0]), ti = parseInt(parts[1]);
    if (typeof addSub === 'function') addSub(ci, ti);
    return;
  }
});
</script>
