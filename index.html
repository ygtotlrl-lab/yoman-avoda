/* ══════════════════════════════════════════════════════════════════════════
   שיתוף — סיגנל והגשר המקורי של המעטפת
   ══════════════════════════════════════════════════════════════════════════ */
// ⭐ גוף הדחיפה, בלי ההשהיה — חולץ כדי שמודול הניסיון
//    החוזר יקרא לאותה דחיפה בדיוק. ⛔ אין לשכפל את הגוף הזה
//    למסלול שני — שתי דחיפות שונות לאותם נתונים הן שתי
//    הזדמנויות שאחת מהן תיסחף.
async function yaSyncPushNow() {
    // ⚠️ t0 לפני שהצילום נקרא — רשומה שתסומן אחרי הרגע הזה אינה במה שנדחף
    //    עכשיו, והורדת הסימון ממנה הייתה מאבדת אותה בשקט.
    var _t0 = Date.now();
    /*  ⛔ ההקשר נלכד בכניסה — ⚠️ המסלול הזה נקרא גם מהתקתוק
     *  המושהה וגם ממודול הניסיון החוזר, ⭐ ושניהם יכולים להתעורר בדיוק
     *  בזמן ההחלפה. */
    var _ep = ctxEpoch();
    // ⭐ הדחיפה כאן היא שורות — קודם המסלול הזה דחף את
    //    בלוקי ה-kv בלבד, אסימטריה מול saveEntries/saveArchive שנסגרה
    //    יחד עם כיבוי הכתיבה הכפולה.
    var rEntries = await pushTable("ya_entries", ENTRIES);
    if (ctxStale(_ep)) return;
    var rArchive = await pushTable("ya_archive", ARCHIVE);
    if (ctxStale(_ep)) return;
    if (YA_KV_LEGACY_WRITE) { await sbSet("entries", ENTRIES); await sbSet("archive", ARCHIVE); }
    if (ctxStale(_ep)) return;
    // ⛔ אישור ה-⏳ פר-קטגוריה, כאן ולא רק ב-saveEntries/saveArchive —
    //    זהו מסלול הריקון האוטומטי (מודול הניסיון החוזר, אירוע `online`,
    //    ו-`schedulePush`), ובלי האישור הסימון שרד דחיפה שהצליחה: המונה
    //    נשאר על המסך עד שפעולה חדשה גררה אותו, `_rtyPending()` נשאר אמת,
    //    והניסיון החוזר הצליח שוב ושוב — ועם כל הצלחה חזר «✅ נשמר בענן».
    //    ⚠️ פר-קטגוריה ולא גורף: דחיפה שהצליחה באחת אינה ראיה לשנייה.
    if (rEntries.ok) pendConfirmPush(PK_ENTRY, _t0);
    if (rArchive.ok) pendConfirmPush(PK_ARC, _t0);
    if (!rEntries.ok || !rArchive.ok) {
      // ⛔ אין לחתום את `last_changed` על נתון שלא הגיע —
      // מכשירים אחרים היו מושכים את העותק הענני הישן מעל רשומות חדשות שלהם.
      toast(MSG_LOCAL_ONLY, null, 'bad');
      return;
    }
    // Write timestamp AFTER data is saved — so other devices always get fresh data
    // ⭐ דרך `PL_CFG.stamp` ולא ב-`sbSet` ישיר: זו אותה כתיבה
    //    בדיוק, ⛔ ומסלול שני לחותמת היה יוצא מסנכרון מול
    //    המודול ביום שבו מקום האחסון שלה ישתנה. כאן, בשונה מ-`plTouch()`,
    //    הקורא זקוק לתוצאה עצמה כדי להזהיר את המשתמש.
    var stampTs = Date.now();
    var rTs = await PL_CFG.stamp(stampTs);
    if (ctxStale(_ep)) return;
    if (!rTs.ok) { toast(MSG_CLOUD_NO_FANOUT, null, 'bad'); return; }
    PL_CFG.note(stampTs);
    toast(MSG_SAVED_CLOUD);
}

// Native share bridge: in the WebView APK the shell decodes the image to a cache file
// (FileProvider) and fires ACTION_SEND through the system share sheet.
// Returns true if the native bridge handled it; false in a plain browser (use Web Share / fallback).
//
// ⛔ אין כאן פרמטר יעד — הבורר של המערכת הוא שבוחר, ⛔ ונעילה על
//    יעד אחד מסירה מהמשתמש את הבחירה שהמערכת נותנת בחינם.
// ⚠️ הגשר הוא חוזה בין הדף ל-Java, ולכן החתימה ירדה בשני הצדדים
//    באותו קומיט; ⛔ הסרה בצד אחד בלבד שוברת את השיתוף.
//
// ⚠️ שני גשרים, ולא במקרה. מאז שהמעטפת טוענת את האתר **מהרשת** ולא מנכסים
// מוטבעים, גשר מקורי הוא הרשאה שניתנת לדף שמגיע מהרשת — ולכן הוא חייב להיות
// מוגבל לדומיין שלנו:
//   • `AndroidShareBridge.postMessage` — `WebViewCompat.addWebMessageListener`,
//     שבו **WebView עצמו** בודק את רשימת המקורות המותרים, פר-frame, לפני
//     שההודעה נמסרת. זה המסלול המועדף ולכן הוא נוסה ראשון.
//   • `AndroidShare.shareImage` — הגשר הישן (`addJavascriptInterface`), למכשירים
//     עם WebView ישן מ-88. שם ההגבלה נאכפת בצד הג'אווה: המעטפת מחברת אותו רק
//     כשהיא על הדומיין שלנו, ובכל קריאה מאמתת מחדש את מקור הדף.
// **אין להסיר את סדר הניסיון הזה** — נפילה-חזרה לגשר הישן כשהחדש קיים היא
// ויתור על האכיפה שהפלטפורמה נותנת בחינם.
function _androidShareImage(canvas){
  try {
    var br = window.AndroidShareBridge;
    if (br && typeof br.postMessage === 'function') {
      br.postMessage(JSON.stringify({
        data: canvas.toDataURL('image/jpeg',0.95).split(',')[1],
        mime: 'image/jpeg'
      }));
      return true;
    }
    if (window.AndroidShare && typeof window.AndroidShare.shareImage === 'function') {
      var b64 = canvas.toDataURL('image/jpeg',0.95).split(',')[1];
      window.AndroidShare.shareImage(b64, 'image/jpeg');
      return true;
    }
  } catch(e) { /* נופל להתנהגות ברירת המחדל של הדפדפן */ }
  return false;
}

// ⛔ נפילה-חזרה של הורדה בלבד — בלי קישור-עומק ליעד ספציפי:
//    קישור כזה הוא מסלול שיתוף שני, מקביל לבורר של המערכת, שאיש אינו
//    קורא לו ואינו נבדק — והוא נשבר בשקט ביום שהיעד משנה סכימה.
function _shareDownloadFallback(canvas){
  var dataUrl = canvas.toDataURL('image/jpeg',0.95);
  var a=document.createElement('a');
  a.href=dataUrl;
  a.download='yoman.jpg';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
// הגדרות
/* ══════════════════════════════════════════════════════════════════════════
   מסך ההגדרות — קטגוריות, משימות ותתי-משימות (כולל גרירה)
   ══════════════════════════════════════════════════════════════════════════ */
// ── הסדר נגזר מה-DOM הסופי ──
/*  ⛔ הסדר נקרא מהעץ אחרי הגרירה ⛔ ולא מצמד «מאיפה לאן» — ⚠️ הצמד מתאר
 *  צעד אחד, ⭐ והעץ מתאר את התוצאה: ⛔ גרירה שעברה כמה שורות בדרך הייתה
 *  נכתבת כקפיצה אחת שאינה מה שנראה על המסך.
 *  ⛔ **ומה נכנס**: המדדים המקוריים בסדר שבו הם יושבים עכשיו; ⚠️ **ומה
 *  מפיל**: מדד שאינו מספר — ⭐ הוא פשוט אינו נכנס לסדר. */
function domOrder(list, kind, attr) {
  var out = [];
  for (var i = 0; i < list.children.length; i++) {
    var x = list.children[i];
    if (x.dataset && x.dataset.drag === kind) out.push(+x.dataset[attr]);
  }
  return out;
}
/*  ⛔ הסידור משמר את המקומות שלא צוירו — ⚠️ קטגוריה מחוקה אינה ברשימה,
 *  ⭐ ומיקומה במערך נשאר שלה: ⛔ סידור שמתעלם ממנה היה מזיז אותה. */
function reorderKeep(arr, order) {
  var slots = order.slice().sort(function (a, b) { return a - b; });
  var out = arr.slice();
  for (var i = 0; i < order.length; i++) out[slots[i]] = arr[order[i]];
  return out;
}
function applyCatOrder(list, kind) {
  CATS = reorderKeep(CATS, domOrder(list, kind, 'idx'));
  saveCats();
  renderSettings();
  buildCatGrid();
}
function applyTaskOrder(list, kind) {
  var order = domOrder(list, kind, 'ti');
  var ci = +list.querySelector('[data-drag="' + kind + '"]').dataset.ci;
  CATS[ci].tasks = reorderKeep(CATS[ci].tasks, order);
  recTouch(CATS[ci]);   // סדר המשימות הוא חלק מרשומת הקטגוריה
  saveCats();
  renderSettings();
}
function applySubOrder(list, kind) {
  var one = list.querySelector('[data-drag="' + kind + '"]');
  var ci = +one.dataset.ci, ti = +one.dataset.ti;
  var taskName = CATS[ci].tasks[ti];
  var sk = subKey(ci, taskName);
  if (!SUBS[sk]) { SUBS[sk] = SUBS[taskName] || []; }
  SUBS[sk] = reorderKeep(SUBS[sk], domOrder(list, kind, 'si'));
  touchSubKey(sk);
  saveSubs();
  renderSettings();
}

function editSubInline(ci, ti, si, oldVal, taskName) {
  var lbl = document.getElementById("sub-lbl-"+ci+"-"+ti+"-"+si);
  if (!lbl) return;
  var inp = document.createElement("input");
  inp.value = oldVal;
  inp.style.cssText = "border:1px solid var(--primary-ink);border-radius:6px;padding:2px 6px;font-family:Heebo;font-size:12px;width:90px;";
  lbl.replaceWith(inp);
  inp.focus();
  inp.select();
  function save() {
    var newVal = inp.value.trim();
    if (newVal && newVal !== oldVal) {
      var sk = subKey(ci, taskName);
      if (!SUBS[sk]) SUBS[sk] = SUBS[taskName] || [];
      SUBS[sk][si] = newVal;
      touchSubKey(sk);
      saveSubs();
    }
    renderSettings();
  }
  inp.onblur = save;
  inp.onkeydown = function(e){ if(e.key==="Enter") { inp.blur(); } if(e.key==="Escape") { inp.value=oldVal; inp.blur(); } };
}
function removeSub(ci, taskName, si) {
  var sk = subKey(ci, taskName);
  if (!SUBS[sk]) { if (!SUBS[taskName]) return; SUBS[sk] = SUBS[taskName]; }
  SUBS[sk].splice(si, 1);
  touchSubKey(sk);   // המחיקה מתועדת בחותמת של הרשימה — אחרת היא נעלמת במיזוג
  saveSubs();
  renderSettings();
}

function addSub(ci, ti) {
  var taskName = CATS[ci].tasks[ti];
  var inp = document.getElementById("snewsub-" + ci + "-" + ti);
  if (!inp) return;
  var val = inp.value.trim();
  if (!val) return;
  var sk = subKey(ci, taskName);
  if (!SUBS[sk]) SUBS[sk] = SUBS[taskName] ? [...SUBS[taskName]] : [];
  /*  ⛔ ואותו דבר בתת-המשימה — ⚠️ הרשימה היא רשימת ערכים,
   *  ⭐ והערך הוא הזהות: ⛔ פריט שנכתב פעמיים נמחק פעם אחת. */
  if (uniqHas(SUBS[sk], val)) { toast(MSG_SUBTASK_EXISTS, 4000, 'bad'); return; }
  SUBS[sk].push(val);
  touchSubKey(sk);
  inp.value = "";
  saveSubs();
  renderSettings();
}

function editTaskInline(ci, ti) {
  var lbl = document.getElementById("task-lbl-"+ci+"-"+ti);
  if (!lbl) return;
  var oldVal = CATS[ci].tasks[ti];
  var inp = document.createElement("input");
  inp.value = oldVal;
  inp.style.cssText = "border:1px solid var(--primary-ink);border-radius:6px;padding:2px 8px;font-family:Heebo;font-size:13px;width:120px;font-weight:600;";
  lbl.replaceWith(inp);
  inp.focus(); inp.select();
  function save() {
    var newVal = inp.value.trim();
    if (newVal && newVal !== oldVal) {
      // מהגר את SUBS — בודק גם את פורמט המפתח הישן (taskName) וגם את החדש (ci::taskName)
      var oldSk = subKey(ci, oldVal);   // המפתח הישן, בצורה "ci::שם"
      var newSk = subKey(ci, newVal);   // המפתח החדש, באותה צורה
      if (SUBS[oldSk]) {
        // מפתח בפורמט החדש קיים ⇐ מהגרים אותו
        SUBS[newSk] = SUBS[oldSk];
        delSubKey(oldSk);
      } else if (SUBS[oldVal]) {
        // מפתח בפורמט הישן (שם המשימה בלבד) ⇐ מהגרים ומנקים
        SUBS[newSk] = SUBS[oldVal];
        delSubKey(oldVal);
      }
      CATS[ci].tasks[ti] = newVal;
      delTaskMeta(CATS[ci], oldVal); touchTask(CATS[ci], newVal);
      recTouch(CATS[ci]); touchSubKey(newSk);
      saveCats(); saveSubs();
    }
    renderSettings(); buildCatGrid(); buildTaskBtns();
  }
  inp.onblur = save;
  inp.onkeydown = function(e){ if(e.key==="Enter") inp.blur(); if(e.key==="Escape"){ inp.value=oldVal; inp.blur(); } };
}

/* ⛔⛔ אזור ההגדרות — הערת הגנה משותפת לכל האפליקציות
   ⛔ **אין להוסיף שער סיסמה נפרד מעל מסך ההגדרות.** ההרשאה נגזרת
   מהמשתמש המחובר בלבד, ואין שכבה שנייה מעליה.

   **הרקע — וזו אינה זהירות תיאורטית.** באחת האפליקציות היה שער כזה בדיוק
   (`admin_pass` ב-`sl_settings`), והוא הוסר משתי סיבות שכל
   אחת מהן מספיקה לבדה:
   1. הוא יצר **שכבת הרשאה כפולה** שלא הייתה קיימת באף אחת
      מהאחרות — מנגנון שני עם מסך משלו, מסלול שינוי משלו ותחזוקה
      משלו, לאותו אדם.
   2. **בהתקנה טרייה הוא נפל חזרה למחרוזת `'admin'`** — כלומר השער
      נפתח לכל מי שהקליד «admin». מה שעמד בין ההתקנה לשער
      הפתוח היה שורת זריעה בקובץ הסכימה; הגנה שתלויה בכך
      שמישהו הריץ קובץ אינה הגנה.

   ⛔ **ואין לזרוע ערך ברירת מחדל לסיסמה או לתפקיד בשום מקום** — לא
   בסכימה, לא במיגרציה, לא בקוד ולא בקובץ בדיקה. ברירת מחדל
   לסיסמה היא חשבון שסיסמתו ידועה לכל העולם;
   ברירת מחדל לתפקיד היא הרשאה שניתנת למי שאיש לא החליט
   להעניק לו אותה. תפקיד נכתב **במפורש** ביצירת המשתמש.

   ⚠️ **הערה זו זהה בית-לבית בכל האפליקציות** פרט לשורת «כאן:» שבסופה.
   לקח אבטחתי שנלמד באפליקציה אחת נרשם בכולן — גם כשהמנגנון עצמו
   רלוונטי רק לאחת. הערה שיושבת במקום אחד אינה
   מגינה על הארגון.

   כאן: `renderSettings` — ⚠️ **ליומן אין טבלת משתמשים, אין מסך כניסה
   ואין תפקידים כלל** — הכניסה היא בחירת מוסד, ולכן אין כאן הרשאה
   לגזור ואין סוד לשמור. ההערה נרשמת כדי שגם כאן לא יומצא שער
   בעתיד — שער סיסמה כאן היה **שכבה שלמה יש מאין**, לא יישור לאחיות.
   ═════════════════════════════════════════════════════════════════════ */
function renderSettings() {
  var ed = document.getElementById("settingsEditor");
  ed.innerHTML = "";
  CATS.forEach(function(cat, ci) {
    if (!isLive(cat)) return;   // ci חייב להישאר האינדקס הגולמי — עליו בנויים מפתחות SUBS

function removeTask(ci, ti) {
  // משימה היא מחרוזת בלי מזהה — היא נוסעת עם רשומת הקטגוריה, ולכן ההסרה
  // מתועדת כעדכון של הקטגוריה (updatedAt) ומנצחת במיזוג במקום להיעלם.
  var gone = CATS[ci].tasks[ti];
  CATS[ci].tasks.splice(ti, 1);
  delTaskMeta(CATS[ci], gone);
  recTouch(CATS[ci]);
  /*  ⛔ ותתי-המשימות שלה יורדות בסימון — ⚠️ מפתח שנשאר בלי המשימה שלו
   *  חוזר תחת משימה אחרת שתקבל את אותו מספר קטגוריה ואותו שם. */
  delSubKey(subKey(ci, gone));
  saveCats(); saveSubs();
  renderSettings();
}
function addTask(ci) {
  var inp = document.getElementById("snewtask-" + ci);
  var val = inp.value.trim();
  if (!val) return;
  /*  ⛔ פריט שכבר ברשימה אינו נוסף שוב — ⚠️ **וההשוואה על הערך** ⛔ ולא
   *  על מזהה: ⭐ שתי משימות באותו שם הן משימה אחת, ⛔ והשם הוא מפתח
   *  החותמה ומפתח תתי-המשימות — ⚠️ ושתי שורות באותו שם חולקות אותם:
   *  ⛔ המחיקה מסירה אחת מהן והשנייה נשארת עם סימון מחיקה. */
  if (uniqHas(CATS[ci].tasks, val)) { toast(MSG_TASK_EXISTS, 4000, 'bad'); return; }
  CATS[ci].tasks.push(val);
  touchTask(CATS[ci], val);
  recTouch(CATS[ci]);
  inp.value = "";
  saveCats();
  renderSettings();
}
function saveCatName(ci) {
  var inp = document.getElementById("sname-" + ci);
  if (inp && inp.value.trim()) {
    CATS[ci].name = inp.value.trim();
    recTouch(CATS[ci]);
    saveCats();

}
function saveSettings() {
  CATS.forEach(function(cat, ci) {
    var inp = document.getElementById("sname-" + ci);
    if (inp) {
      var newName = inp.value.trim();
      if (newName && newName !== cat.name) {
        if (SUBS[cat.name]) { SUBS[newName] = SUBS[cat.name]; delSubKey(cat.name); touchSubKey(newName); }
        CATS[ci].name = newName;
        recTouch(CATS[ci]);
      }
    }
  });
  saveCats(); saveSubs(); buildCatGrid();
  return true;
}

// TOAST — חתימה משותפת לשלושת הפרויקטים: toast(msg, dur).
// dur באלפיות שנייה, אופציונלי; ברירת המחדל היא `TOAST_DEFAULT_MS`. קודם הפרמטר
// השני פשוט נבלע — ארבעה קוראים העבירו משך והוא לא כובד.
/*  ⛔ מספר שיש לו משמעות מקבל שם —
 *  ⚠️ הערך במקרה זהה ל-`LS_SUCCESS_MUTE_MS`, ⛔ אך הוא מושג אחר
 *  לגמרי (משך תצוגה מול חלון השתקה), ⛔ ואין לאחד ביניהם. */
var TOAST_DEFAULT_MS = 2500;


// ארכיון
// מתמלא פר-מוסד ע"י loadLocalData() אחרי הבחירה, ⛔ מהדיסק בלבד — הזרע
// המוטבע ירד, וההיסטוריה מגיעה מהענן
var ARCHIVE = [];

// saveArchive מוגדרת למעלה, בשכבת Supabase


/* ══════════════════════════════════════════════════════════════════════════
   הארכיון — ניווט שנה ← חודש ← יום, ועריכה במקום
   ══════════════════════════════════════════════════════════════════════════ */
// ═══ מצב הארכיון ═══
var arcSelYear = null;
var arcSelMonth = null;
var arcSelDayKey = null;  // מחרוזת gdate
var arcEditMode = false;

// סדר החודשים לניווט בארכיון. "מרחשון" הוסר — monthKeyOf ממפה אותו ל"חשון",
// אחרת אותה שנה מקבלת שני כפתורי חשוון. "אדר" (שנה פשוטה) ו"אדר א׳"/"אדר ב׳"
// (שנה מעוברת) חיים זה לצד זה: בכל שנה נתונה מופיע רק אחד מהמצבים.
var HMO = ["תשרי","חשון","כסלו","טבת","שבט","אדר","אדר א׳","אדר ב׳","ניסן","אייר","סיון","תמוז","מנחם אב","אלול"];
// דלי "לא ידוע" — יום שאי אפשר לפענח את תאריכו העברי. קודם הוא נשמט לגמרי
// מרשימת השנים והרשומות שבו היו בלתי נגישות; עכשיו הן נשארות בהישג יד.
var HUNKNOWN = "לא ידוע";
// מפתח יום מוטמע בתוך מחרוזת JS בתוך אטריביוט onclick — חייב בריחה
function jsQ(s) { return String(s == null ? "" : s).replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/"/g, "&quot;"); }

function extractYM(hdate) {
  function unknown() { return {year: HUNKNOWN, month: HUNKNOWN, order: 99}; }
  if (!hdate) return unknown();
  // חייב להכיל סימן של שנה עברית
  if (!/ה׳תש/.test(hdate)) return unknown();
  var parts = normHDate(hdate).trim().split(" ");
  var year = "", month = "";
  for (var i = parts.length-1; i >= 0; i--) {
    if (parts[i].indexOf("׳") >= 0 && /ה׳תש/.test(parts[i])) { year = parts[i]; parts.splice(i,1); break; }
  }
  // שומר רק חלקים שהם מילים עבריות (בלי ספרות ובלי לטינית)
  var hebrewParts = parts.filter(function(p) { return p && !/[0-9a-zA-Z]/.test(p); });
  month = monthKeyOf(hebrewParts.slice(1).join(" "));
  // מאמת שהחודש נמצא ברשימה המוכרת
  if (!year || HMO.indexOf(month) < 0) return unknown();
  return {year: year, month: month, order: HMO.indexOf(month)};
}

/* ══════════════════════════════════════════════════════════════════════════
   שחזור התאריך העברי — hdate ואם אין, מתוך שם היום
   ══════════════════════════════════════════════════════════════════════════
   הקיבוץ בארכיון נשען על `extractYM(hdate)`. סנאפשוט בלי `hdate` נפל ל-HUNKNOWN
   («לא ידוע») — גם כשהתאריך העברי המלא יושב בשדה `name`. נמדד בשני המוסדות:
   13 סנאפשוטים (6 בראשון לציון, 7 ברמת אביב) עם `name` בצורת
   «יום כ״ט אב ה׳תשפ״ו (אוטומטי)» ובלי `hdate` כלל — כולם נערמו תחת «לא ידוע».

   סדר הנפילה-חזרה: `hdate` תקין ⇐ חילוץ מתוך `name` ⇐ ורק אז HUNKNOWN.

   ⛔ `snapHDate` טהורה ואינה נוגעת בסנאפשוט — זהו תיקון **תצוגה**,
      והמפתחות הישנים ב-`kv` הם נתיב החזרה. כתיבה כאן הייתה משנה נתונים
      קיימים בלי שהמנהל ביקש, ומקדמת את `updatedAt` של 13 סנאפשוטים בבת אחת.
   ⛔ החיתוך הוא אחרי אסימון השנה, ואז השלת אסימונים מ**שמאל** —
      `extractYM` קוראת את החודש כ-`hebrewParts.slice(1)`, ולכן כל תחילית
      («יום», «יום רביעי», «מוצאי שבת») וכל זנב אחרי השנה («(אוטומטי)»,
      «| 11 אפריל 2026») מזיזים אותה לאסימון הלא נכון. השלה גנרית מכסה את כל
      הצורות בלי רשימת תחיליות שתתיישן.
   ══════════════════════════════════════════════════════════════════════════ */
function hebFromText(txt) {
  var t = normHDate(String(txt == null ? "" : txt))
            .replace(/\([^)]*\)/g, " ").replace(/\|/g, " ")
            .replace(/\s+/g, " ").trim();
  if (!t) return "";
  var p = t.split(" ");
  for (var j = 0; j < p.length; j++) {
    if (/ה׳תש/.test(p[j])) { p = p.slice(0, j + 1); break; }   // hdate תקין נגמר בשנה
  }
  for (var i = 0; i < p.length; i++) {
    var cand = p.slice(i).join(" ");
    if (extractYM(cand).year !== HUNKNOWN) return cand;
  }
  return "";
}
// התאריך העברי של סנאפשוט/רשומה לצורך תצוגה וקיבוץ, עם נפילה-חזרה ל-`name`.
function snapHDate(rec) {
  var h = normHDate((rec && rec.hdate) || "");
  if (extractYM(h).year !== HUNKNOWN) return h;
  var t = hebFromText(rec && rec.name);
  if (t) return t;
  /*  ⛔ ונפילה-חזרה שלישית: **תאריך לועזי שיושב בשדה העברי** —
   *  ⚠️ הנימוק המדוד: ארבעה סנאפשוטים נושאים `hdate` בצורת «30 בנוב׳ 2025
   *  ה׳תשפ״ו» — ⭐ לועזי במלואו, עם שנה עברית בזנב, ⛔ ו-`gdate` ריק בכולם:
   *  ⚠️ `extractYM` מחפשת שם חודש עברי ואינה מוצאת אף אחד, ⛔ ו-138 רשומות
   *  נערמו תחת «שנה לא ידוע». ⭐ והחודש העברי **גזיר** מהלועזי שבמחרוזת,
   *  ⛔ ואין כאן מנוע שני — `hebrewDate` היא אותה נקודה שכל הצרכנים יושבים
   *  עליה. ⛔ וכמו שתי הנפילות שמעליה, זהו תיקון **תצוגה** בלבד: ⚠️ הפונקציה
   *  טהורה ואינה כותבת לסנאפשוט, ⭐ שכתיבה כאן הייתה משנה נתוני מסד בלי
   *  שהמנהל ביקש ⛔ ומקדמת את `updatedAt` שלהם בבת אחת. */
  var g = parseGregLike(h) || parseGregLike((rec && rec.name) || "") ||
          parseGregLike((rec && rec.gdate) || "");
  if (g) {
    // ⛔ עוגן בצהריים מקומיים — מעבר לשעון חורף מפיל חצות ליום הקודם
    var hd = hebrewDate(new Date(g.y, g.m - 1, g.d, 12, 0, 0));
    if (hd && extractYM(hd).year !== HUNKNOWN) return hd;
  }
  return h;
}

// מחזיר את כל הימים (מסנאפשוטים של ARCHIVE + רשומות חיות שאינן של היום)
function getAllArchiveDays() {
  var days = {};

  // From ARCHIVE snapshots — סנאפשוט שנמחק (tombstone) ורשומות מחוקות בתוכו לא מוצגים
  liveOnly(ARCHIVE).forEach(function(snap) {
    var k = String(snap.gdate || snap.id);
    // key — המפתח האמיתי במפה. סנאפשוט ישן בלי gdate ממופתח לפי id, ובלי לשמור
    // אותו הכפתור בארכיון היה שולח arcGoDetail('') ופותח את היום הלא נכון.
    if (!days[k]) days[k] = {key:k, gdate:snap.gdate||"", hdate:snapHDate(snap), day:snap.day||"",
      name:normHDate(snap.name||""), entries:[], seen:{}, snapId:snap.id};
    // merge entries from snapshot if not already there
    // ⛔ הבדיקה מול `seen` נדרשת גם כאן ולא רק בלולאת ENTRIES — כששני
    //    סנאפשוטים ממופתחים לאותו יום, הרשומה המשותפת נדחפה פעמיים ונספרה
    //    פעמיים בכפתור היום. נמדד ברמת אביב: «11 אוגוסט 2026» הציג 6 רשומות
    //    במקום 5. ה-`seen` כבר נכתב כאן מאז ומעולם — רק אף אחד לא קרא אותו.
    (snap.entries||[]).forEach(function(e){
      if (e && e.id != null) {
        if (days[k].seen[String(e.id)]) return;                   // כבר נכנסה מסנאפשוט אחר
        days[k].seen[String(e.id)] = true;                        // כולל tombstones
      }
      if (isLive(e)) days[k].entries.push(e);
    });
  });

  // From live ENTRIES (including today — so current day is visible in archive).
  // הסנאפשוט הוא המקור הקובע לרשומה שכבר נכנסה אליו: אחרי "סיום יום" העותק החי
  // הוא tombstone, והרשומה עדיין שייכת לארכיון.
  ENTRIES.forEach(function(e) {
    var k = String(e.gdate || "");
    if (!days[k]) {
      if (!isLive(e)) return;   // אין יום כזה בארכיון ורשומה מחוקה — אין מה להציג
      days[k] = {key:k, gdate:e.gdate||"", hdate:snapHDate(e), day:e.day||"",
        name:normHDate([e.day,e.hdate,e.gdate?"| "+e.gdate:""].filter(Boolean).join(" ")), entries:[], seen:{}, snapId:null};
    }
    if (days[k].seen[String(e.id)]) return;             // כבר טופל ע"י הסנאפשוט
    days[k].seen[String(e.id)] = true;
    if (isLive(e)) days[k].entries.push(e);
  });

  return days;
}

function getYearsWithData() {
  var days = getAllArchiveDays();
  var years = {};
  Object.values(days).forEach(function(d) {
    var ym = extractYM(d.hdate);
    if (ym.year) years[ym.year] = true;
  });
  return years;
}

function monthsWithData(year) {
  var days = getAllArchiveDays();
  var months = {};
  Object.values(days).forEach(function(d) {
    var ym = extractYM(d.hdate);
    if (ym.year === year) months[ym.month] = true;
  });
  return months;
}

function getDaysInMonth(year, month) {
  var days = getAllArchiveDays();
  var result = [];
  Object.values(days).forEach(function(d) {
    if (!d.entries.length) return;   // יום שכל רשומותיו נמחקו — לא מציגים כפתום ריק
    var ym = extractYM(d.hdate);
    if (ym.year === year && ym.month === month) result.push(d);
  });
  // מיון לפי מספר היום העברי בתוך החודש
  var HEB_ORD = {"א":1,"ב":2,"ג":3,"ד":4,"ה":5,"ו":6,"ז":7,"ח":8,"ט":9,"י":10,"יא":11,"יב":12,"יג":13,"יד":14,"טו":15,"טז":16,"יז":17,"יח":18,"יט":19,"כ":20,"כא":21,"כב":22,"כג":23,"כד":24,"כה":25,"כו":26,"כז":27,"כח":28,"כט":29,"ל":30};
  function hdayNum(hdate) {
    var d = (hdate||"").split(" ")[0].replace(/[׳״]/g,"");
    return HEB_ORD[d] || 999;
  }
  result.sort(function(a,b){ return hdayNum(a.hdate) - hdayNum(b.hdate); });
  return result;
}

// ── זיהוי השנה והחודש העבריים הנוכחיים ──
function getNowHebYM() {
  var hd = hebrewDate(new Date());
  return extractYM(hd);
}

// ── שביל הניווט ──
function renderArcBreadcrumb() {
  var bc = document.getElementById("arc-breadcrumb");
  if (!bc) return;
  var parts = [];
  parts.push('<span class="arc-crumb" data-act="arc-go-years">שנים</span>');

  }
  if (arcSelMonth) {

    parts.push('<span class="arc-crumb" data-act="arc-nav-days" data-year="'+esc(arcSelYear)+'" data-month="'+esc(arcSelMonth)+'">' + arcSelMonth + '</span>');
  }
  if (arcSelDayKey) {
    var days = getAllArchiveDays();
    var d = days[arcSelDayKey];
    var label = d ? (d.hdate||d.gdate||arcSelDayKey) : arcSelDayKey;
    // מציג רק את חלק היום והחודש (שני הטוקנים הראשונים של hdate)
    var dayParts = label.split(" ");
    var shortLabel = dayParts.slice(0,2).join(" ");
    parts.push('<span class="arc-crumb-sep">›</span>');
    parts.push('<span class="arc-crumb active">' + shortLabel + '</span>');
  }
  bc.innerHTML = parts.join("");
}

// ── רמה 1: שנים ──
function arcGoYears() {
  arcSelYear = null; arcSelMonth = null; arcSelDayKey = null;

function renderArcYears() {
  var el = document.getElementById("arc-years");
  var nowYM = getNowHebYM();
  var allYears = {};
  // בונה את רשימת השנים **רק** משנים שיש להן רשומות במוסד הזה.
  // ⛔ אין לזרוע מטווח קבוע — כך הוצגו בעבר שנים ריקות מדומות.
  var withData = getYearsWithData();
  Object.keys(withData).forEach(function(y){ allYears[y] = true; });
  // תמיד כולל את השנה העברית הנוכחית (ייתכן שריקה — וזו תצוגת ברירת המחדל התקינה).
  if (nowYM.year) allYears[nowYM.year] = true;

  // Sort years: older first, "לא ידוע" always last
  var yearList = Object.keys(allYears).sort(function(a,b){
    if (a === HUNKNOWN) return 1;
    if (b === HUNKNOWN) return -1;
    return a > b ? 1 : -1;
  });

  var html = '<div class="arc-pick-label">בחר שנה:</div><div class="arc-grid">';
  yearList.forEach(function(y) {
    var isNow = (y === nowYM.year);
    var hasDat = !!withData[y];
    html += '<button class="arc-btn'+(isNow?" active":"")
          + '" data-act="arc-nav-months" data-year="'+esc(y)+'">' + y + '</button>';
  });
  html += '</div>';
  el.innerHTML = html;
}

function renderArcMonths(year) {

  var monthSet = {};

  // Sort by HMO order; חודש לא מזוהה (indexOf === -1) בסוף ולא בהתחלה

function arcDeleteEntry(gdateKey, entryId) {
  // tombstone בכל מקום שבו הרשומה מופיעה — בסנאפשוטים ובחי — עם אותה חותמת
  var ts = Date.now();
  ARCHIVE.forEach(function(snap) {
    var hit = false;
    (snap.entries||[]).forEach(function(e){ if (idEq(e.id, entryId) && isLive(e)) { recDelete(e, ts); hit = true; } });
    if (hit) { snap.count = liveOnly(snap.entries).length; recTouch(snap, ts); }
  });
  saveArchive();
  ENTRIES.forEach(function(e){ if (idEq(e.id, entryId) && isLive(e)) recDelete(e, ts); });
  saveEntries();
  renderArcDetail();
  renderArcBreadcrumb();
}

function arcAddEntry(gdateKey) {
  var days = getAllArchiveDays();
  var d = days[arcSelDayKey];
  if (!d) return;
  var catSel = document.getElementById("arc-add-cat");
  var taskSel = document.getElementById("arc-add-task");
  var notesSel = document.getElementById("arc-add-notes");
  if (!catSel || !taskSel) return;
  var letter = catSel.value;
  if (!CATS.some(function(c){ return c.letter === letter; })) return;
  // ⭐ אותו דפוס בדיוק כמו ב-`addEntry`: מזהה מהמודול המשותף,
  //    וחותמת יצירה נפרדת לסדר.
  var _now = Date.now();
  var newEntry = {
    id: newClientId(),
    createdAt: _now,
    day: d.day, hdate: d.hdate, gdate: d.gdate,
    cat: letter,
    task: taskSel.value, sub: "", notes: notesSel ? notesSel.value.trim() : "", count: "",
    updatedAt: _now
  };
  // Add to ARCHIVE snapshot if exists.
  // יום בלי gdate ממופתח לפי snapId — התאמה לפי gdate ריק הייתה בוחרת סנאפשוט שגוי.
  var snap = ARCHIVE.find(function(s){
    return isLive(s) && (d.gdate ? s.gdate === d.gdate : (d.snapId != null && idEq(s.id, d.snapId)));
  });
  if (snap) {
    snap.entries = snap.entries || [];
    snap.entries.unshift(newEntry);
    snap.count = liveOnly(snap.entries).length;
    recTouch(snap);
    saveArchive();
  } else {
    // הוספה ל-ENTRIES החיים
    ENTRIES.unshift(newEntry);
    saveEntries();
  }
  renderArcDetail();
}

function renderArchive() {
  // מאתחל את תצוגת הארכיון ברמת השנה, עם השנה הנוכחית כברירת מחדל
  var nowYM = getNowHebYM();
  arcSelYear = nowYM.year || null;
  arcSelMonth = null;
  arcSelDayKey = null;
  arcEditMode = false;

  // מציג את פאנל השנים ומסתיר את השאר
  document.getElementById("arc-years").style.display = "block";
  document.getElementById("arc-months").style.display = "none";
  document.getElementById("arc-days").style.display = "none";
  document.getElementById("arc-detail").style.display = "none";

  renderArcYears();
  renderArcBreadcrumb();

  // ירידה אוטומטית לשנה הנוכחית
  if (arcSelYear) {
    arcGoMonths(arcSelYear);
    // ירידה אוטומטית לחודש הנוכחי
    if (nowYM.month) {
      arcGoDays(arcSelYear, nowYM.month);
    }
  }
}


function exportArchivePDF(id) {
  var snap = ARCHIVE.find(function(s){ return idEq(s.id, id); });
  if (!snap) return;
  var savedEntries = ENTRIES;
  ENTRIES = liveOnly(snap.entries);
  var savedDay = selDay;
  selDay = snap.name;
  var origHeb = document.getElementById("hebDateInput").value;
  document.getElementById("hebDateInput").value = snap.name;
  exportPDF();
  ENTRIES = savedEntries;
  selDay = savedDay;
  document.getElementById("hebDateInput").value = origHeb;
}


/*  ⛔ בסיס אחד לכל משיכה גולמית מהריפו — ⚠️ צרכן אחד לו, מציג טבלת התשתית:
 *  ⭐ כתובת שנייה הייתה מקור אמת שני. */
var GITHUB_USER = "ygtotlrl-lab";
var GITHUB_REPO = "yoman-avoda";
var RAW_BASE = "https://raw.githubusercontent.com/" + GITHUB_USER + "/" + GITHUB_REPO + "/main/";

// סנכרון חכם: בדיקת חותמת כל 3 שניות (זול), ומשיכת נתונים רק כשהיא השתנתה
var _lastKnownTimestamp = 0;
// מועד הסנכרון המוצלח האחרון — לשורת המצב שבאזור המצב בהגדרות.
// נכתב על כל שיחה מוצלחת עם הענן, ולכן הוא נכון גם בדפדפן שרק קורא.
// ⛔ אינו עֵד דחיפה ואינו משמש לפינוי — לזה יש `_yaPushedAt` פר-מפתח.
var _yaLastSyncAt = 0, _yaNetWarned = false;
function _yaMarkSynced() {
  _yaLastSyncAt = Date.now();
  // הכישלון עצמו נשאר שקט כאן (הפולינג הוא כל 3 שניות — טוסט על כל מחזור
  // היה רעש), אבל **החזרה** כן נאמרת: היא הרגע שבו מה שהמתין מתחיל לעלות.
  if (_yaNetWarned) { _yaNetWarned = false; toast(MSG_SYNC_BACK); }
  // ⛔ הגיבוי והיומן **אינם** נתלים כאן — הניסוח הראשון
  //    תלה אותם בשיחה מוצלחת עם הענן, כלומר בפעילות סנכרון. זו בדיוק
  //    הצורה שהשביתה גיבוי ל-25 יום בלי שאיש ידע: מנגנון
  //    בטיחות שרץ רק כשמשהו אחר רץ. נקודת ההפעלה היא `bkBoot()`
  //    ב-`selectYeshiva`, לצד `lsBoot()` ו-`pendBoot()`.
}
// ⛔ אין להחזיר לכאן את בדיקת החותמת — ⚠️ היא יושבת במודול
//    המשותף (`PL_CFG` + `plTick`), ⭐ ומה שכאן הוא **המשיכה עצמה**:
//    ⛔ מסלול שני שמכריע מתי למשוך יוצא מסנכרון מול המודול, ⚠️ וזה
//    בדיוק «מקור אמת שני».
async function yaPullFromCloud() {
  /*  ⛔⛔ שער ההקשר של **מסלול הפולינג** — ⚠️ הנימוק המדוד: שער סגר את
   *  `syncFromCloud` ושער את מסלול הדחיפה, ⛔ והמשיכה הזו — שרצה
   *  **כל שלוש שניות** מ-`plTick` — נשארה בלי שער: ⭐ נמדד בדפדפן
   *  שהחלפת מוסד בזמן משיכה בטיסה כתבה רשומת ראשון למפתח
   *  `ya_entries_ramataviv`, ⛔ ומילאה את מפת החותמות בחותמות ראשון
   *  אחרי ש-`yaResetTenantState` כבר איפסה אותה.
   *  ⚠️ וזה מה שדווח מהשטח: הקטגוריות והארכיון מתערבבים בין המוסדות. */
  var _ep = ctxEpoch(), _ls = LS;
  try {
    console.log("[sync] pulling data...");

    // מיזוג ברמת רשומה במקום החלפה מלאה. ההחלפה היא שגרמה לאובדן: מכשיר
    // שדחף blob ישן עם חותמת חדשה יותר מחק כאן עבודה שמכשיר אחר הרגע הקליד.
    /* ⛔ הקריאה מהטבלה בלבד, ⛔ ובלי נפילה-חזרה לערך השלם — ⚠️ השקילות
       נמדדה מול המסד בשני המוסדות, והבלוק חדל להיות רשת ביטחון והפך
       למקור אמת שני. ⛔ וכשל מחזיר «אין ראיה» ⛔ ולא «הענן ריק» — ⚠️ מיזוג
       מול מערך ריק מוחק את מה שלא הספיק לעלות. */
    var _rowsE = await yaRowsGet('ya_entries');
    if (ctxStale(_ep)) { console.warn('[sync] ההקשר התחלף באמצע — המשיכה נעצרה'); return; }
    if (_rowsE.ok) {
      var cloudEntries = _rowsE.data;
      if (Array.isArray(cloudEntries)) {
        ENTRIES = mergeEntries(ENTRIES, cloudEntries);
        ENTRIES.sort(function(a,b){ return entryOrderTs(b) - entryOrderTs(a); });
        lsSetArray("ya_entries"+_ls, ENTRIES, _yaRecTs);
        renderLog();
        console.log("[sync] merged, entries=" + liveOnly(ENTRIES).length +
                    " (+" + (ENTRIES.length - liveOnly(ENTRIES).length) + " tombstones)");
      }
    }
    var _rowsA = await yaRowsGet('ya_archive');
    if (ctxStale(_ep)) { console.warn('[sync] ההקשר התחלף באמצע — המשיכה נעצרה'); return; }
    if (_rowsA.ok) {
      hwNoteCloud('ya_archive'+_ls, _rowsA.data);   // ראיה עננית לשער הדיסק
      var cloudArchive = _rowsA.data;
      if (Array.isArray(cloudArchive)) {
        ARCHIVE = mergeArchive(ARCHIVE, cloudArchive);
        lsSetArray("ya_archive"+_ls, hwDiskFilter('ya_archive'+_ls, ARCHIVE), _yaRecTs);
        // הארכיון מוצג רק כשלוחצים על הלשונית — רענון רק אם הוא פתוח כרגע
        var arcPanel = document.getElementById("panel-archive");
        if (arcPanel && arcPanel.style.display !== "none" && arcSelDayKey) renderArcDetail();
      }
    }
  } catch(e) { _yaNetWarned = true; console.error("[sync] error:", e); }
}

/* ══════════════════════════════════════════════════════════════════════════
   מציג טבלת התשתית — משיכה מ-GitHub ופירוק
   ══════════════════════════════════════════════════════════════════════════
   ⛔ הקובץ נמשך בזמן אמת ⛔ ואינו מוטבע — ⚠️ עותק בקוד מתיישן בסבב הבא,
      ⭐ והמסך הזה נועד להראות את **המצב עכשיו**.

   ⚠️ ואין כאן בדיקת הרשאה — ⭐ ביומן משתמש אחד, ⛔ ואין שכבת כניסה. */
var YA_INF_MD = RAW_BASE + 'CLAUDE.md';

/*  ⛔ פירוק שורת טבלה — ⚠️ הפרדה על `|` משאירה תא ריק בשני הקצוות,
 *  ⭐ ושניהם נגזרים ⛔ ואינם נחתכים בקבוע. */
function _infCells(line) {
  var p = line.split('|');
  if (p.length && p[0].trim() === '') p.shift();
  if (p.length && p[p.length - 1].trim() === '') p.pop();
  return p.map(function (x) { return x.trim(); });
}
/*  ⛔ סימון ה-Markdown מוצג ולא נשפך כטקסט — ⚠️ `**` ו-`` ` `` הם תחביר
 *  המקור, ⭐ והם מומרים **אחרי** הבריחה: ⛔ המרה לפניה הייתה מחזירה HTML
 *  מהקובץ אל תוך הדף. */
function _infMd(t) {
  return esc(t).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
               .replace(/`([^`]+)`/g, '<code>$1</code>');
}
/*  ⛔ הסימון נגזר מהתא ⛔ ואינו נבדק מול רשימה סגורה — ⚠️ תא שאינו אחד
 *  משלושת הסימנים מוצג כפי שהוא, ⭐ ולא נבלע בשקט. */
function _infDot(cell) {
  if (cell === '✅') return '<span class="inf-dot ok" title="תקין"></span>';
  if (cell === '⭕') return '<span class="inf-dot gap" title="חסר-מנומק"></span>';
  if (cell === '❌') return '<span class="inf-dot bad" title="לא מטופל"></span>';
  return esc(cell);
}
/*  ⛔ פירוק ה-Markdown לשני החלקים — ⚠️ הטבלה ומימדי הסריקה: ⭐ שניהם
 *  נגזרים מאותו טקסט, ⛔ ואין ביניהם מקור שני.
 *  ⛔ **ואין כאן יותר סיכום כללים** — ⚠️ אין כללים: ⭐ הטבלה
 *  היא ההוראה, ⛔ ופרק שני שמנה סעיפים היה מונה משהו שאינו קיים. */
function _infParse(md) {
  var lines = md.split('\n');
  var cats = [], cur = null, rows = [];
  for (var i = 0; i < lines.length; i++) {
    var l = lines[i];
    if (l.charAt(0) !== '|') continue;
    var c = _infCells(l);
    if (c.length < 8) continue;
    if (c[0] === '#') continue;
    if (c[0] === '' && /^\*\*/.test(c[1])) {
      cur = { title: c[1].replace(/\*\*/g, ''), order: '', rows: [] };
      cats.push(cur);
      continue;
    }
    /*  ⛔ שורת סדר-הפנים נקלטת לקטגוריה שמעליה ⛔ ואינה נבלעת — ⚠️ היא
     *  אינה שורת נתונים ואינה כותרת, ⭐ ובלי הענף הזה היא נקראה ונזרקה:
     *  ⛔ הקורא היה רואה כותרת בלי הסדר שהיא מצהירה. */
    if (c[0] === '' && cur && c[1].charAt(0) === '↳') {
      cur.order = c[1].slice(1).trim();
      continue;
    }
    if (!/^\d+$/.test(c[0])) continue;
    var row = { n: Number(c[0]), name: c[1], std: c[2],
                apps: [c[3], c[4], c[5], c[6]], note: c[7] };
    rows.push(row);
    if (!cur) { cur = { title: '—', rows: [] }; cats.push(cur); }
    cur.rows.push(row);
  }
  return { cats: cats, rows: rows };
}
var YA_INF_APPS = ['יומן', 'הנהלה', 'שכר', 'גיוס'];
/*  ⛔ הציור נפרד מהפירוק — ⚠️ «פתח/סגור הכל» מצייר מחדש בלי למשוך שוב,
 *  ⭐ והמשיכה נשמרת בזיכרון. */
function _infHtml(d) {
  var h = '<div class="inf">';
  h += '<div class="inf-hd"><b>טבלת התשתית</b>' +
       '<span>' + d.rows.length + ' שורות · נמשך מ-GitHub בזמן אמת</span></div>';

  h += '<div class="inf-card"><h4>הטבלה</h4>' +
       '<div class="inf-bar"><button data-act="inf-all" data-open="1">פתח הכל</button>' +
       '<button data-act="inf-all" data-open="0">סגור הכל</button>' +
       '<span class="inf-tag"><span class="inf-dot ok"></span> תקין</span>' +
       '<span class="inf-tag"><span class="inf-dot gap"></span> חסר-מנומק</span>' +
       '<span class="inf-tag"><span class="inf-dot bad"></span> לא מטופל</span></div>';
  d.cats.forEach(function (c) {
    h += '<details class="inf-cat"' + (window._infOpen ? ' open' : '') + '>' +
         '<summary>' + esc(c.title) + ' — ' + c.rows.length + '</summary>' +
         (c.order ? '<div class="inf-ord">↳ ' + _infMd(c.order) + '</div>' : '') +
         '<div class="inf-wrap"><table class="inf-tbl">' +
         '<colgroup><col class="c-n"><col class="c-t"><col class="c-s">' +
         '<col class="c-a"><col class="c-a"><col class="c-a"><col class="c-a">' +
         '<col class="c-r"></colgroup><thead><tr><th>#</th><th>כותרת</th><th>התקן</th>' +
         YA_INF_APPS.map(function (a) { return '<th>' + a + '</th>'; }).join('') +
         '<th>הערה</th></tr></thead><tbody>';
    c.rows.forEach(function (r) {
      h += '<tr><td>' + r.n + '</td><td>' + _infMd(r.name) + '</td><td>' + _infMd(r.std) + '</td>' +
           r.apps.map(function (a) { return '<td>' + _infDot(a) + '</td>'; }).join('') +
           '<td>' + _infMd(r.note) + '</td></tr>';
    });
    h += '</tbody></table></div></details>';
  });
  h += '</div>';
  h += '</div>';
  return h;
}
window._infData = null;
window._infOpen = false;
/*  ⛔ שתי המשיכות במקביל ⛔ ולא בזו אחר זו — ⚠️ אין ביניהן תלות,
 *  ⭐ וההמתנה היא של האיטית מבין השתיים ⛔ ולא של סכומן. */
async function yaInfraOpen() {
  window._infOpen = false;
  openModal(MSG_INFRA_TABLE,
    '<div class="inf"><div class="inf-hd"><b>טבלת התשתית</b>' +
    '<span>מושך מ-GitHub…</span></div></div>', '');
  var md = null;
  try {
    /*  ⛔ משיכה אחת — ⚠️ המשיכה השנייה הביאה את מפת הזיווג של
     *  סעיפי הכללים, ⭐ ואין יותר כללים לזווג. */
    var res = await withTimeout(fetch(YA_INF_MD, { cache: 'no-store' }));
    if (!res || !res.ok) throw new Error('HTTP ' + (res ? res.status : '—'));
    md = await res.text();

      '<div class="inf-bar"><button data-act="inf-open">↻ נסה שוב</button></div></div>';

function _infPaint() {

function yaInfraToggleAll(open) {

// אתחול — רץ רק אחרי שנבחר מוסד (נקרא מ-selectYeshiva)
function startApp() {
  checkDayChange();

  buildSubBtns();
  renderLog();
  // סנכרון מהענן — ממתין לטעינת Supabase, ומנסה שוב אם צריך
  function trySync(attempt) {

      syncFromCloud();

/* ══════════════════════════════════════════════════════════════════════════
   בחירת מוסד ואתחול האפליקציה
   ══════════════════════════════════════════════════════════════════════════ */
// ── Yeshiva selection (multi-tenant) ──
// קריאה מוגנת מ-localStorage. ערך פגום אחד (JSON חתוך, סוג לא צפוי) היה זורק
// לפני startApp() — והאפליקציה לא עלתה בכלל, מסך ריק. עכשיו: נופלים בחזרה
// לברירת המחדל, מדווחים לקונסול, וממשיכים לעלות.
function lsRead(key, fallback, kind) {
  var raw;
  try { raw = lsGet(key); } catch(e) { console.warn('[load] localStorage לא זמין:', e); return fallback; }
  if (raw == null || raw === "") return fallback;
  var val;
  try { val = JSON.parse(raw); } catch(e) {
    console.warn('[load] ערך פגום ב-' + key + ' — חוזרים לערך הנפילה-חזרה שנמסר', e);
    return fallback;
  }
  var ok = (kind === 'array') ? Array.isArray(val)
         : (kind === 'object') ? (val && typeof val === 'object' && !Array.isArray(val))
         : (val != null);
  if (!ok) { console.warn('[load] סוג לא צפוי ב-' + key + ' — חוזרים לערך הנפילה-חזרה שנמסר'); return fallback; }
  return val;
}
function loadLocalData() {
  try {
    CATS = lsRead("ya_cats"+LS, null, 'array') || [];
    SUBS = lsRead("ya_subs"+LS, null, 'object') || {};
    // חותמות פר-מפתח של SUBS. אין קובץ? כל המפתחות "ותיקים" (0) — בדיוק כמו
    // רשומה בלי updatedAt: לא נופלים, אבל מפסידים לכל עדכון מתוארך.
    SUBS_META = lsRead("ya_subs_meta"+LS, null, 'object') || {};
    _catsResetSeen = String(lsRead(CATS_RESET_LS+LS, '') || '');
    _subsResetSeen = String(lsRead(SUBS_RESET_LS+LS, '') || '');
    ENTRIES = lsRead("ya_entries"+LS, null, 'array') || [];
    // רשומות זבל (null / לא-אובייקט) לא מפילות את הרינדור
    ENTRIES = ENTRIES.filter(function(e){ return e && typeof e === 'object'; });
    // גריעת tombstones מעבר ל-`TOMBSTONE_TTL_MS` — בטעינה בלבד, פעם אחת לעלייה.
    // ⛔ והגריעה רצה שוב על **תוצאת המיזוג** — ⚠️ גריעה מקומית בלבד
    // מוחזרת מהענן תוך שניות.
    var _beforePrune = ENTRIES.length;
    ENTRIES = prunePastTombstones(ENTRIES);
    if (ENTRIES.length !== _beforePrune) {
      console.log('[load] נגרעו ' + (_beforePrune - ENTRIES.length) + ' tombstones מעבר ל-TOMBSTONE_TTL_MS');
    }
    /*  ⛔ הארכיון נטען מהדיסק בלבד ⛔ ואין זרע מוטבע — ⚠️ הנימוק
     *  המדוד: `ARCHIVE_SEED` החזיק 90 סנאפשוטים בקוד עצמו, ⭐ והוזרק
     *  מחדש **בכל טעינה ובכל מיזוג** לכל `gdate` שלא נמצא: ⛔ ולכן יום
     *  שנמחק חזר בטעינה הבאה — ⚠️ ה-tombstone נוצח על ידי קבוע.
     *  ⛔ ונמדד מול המסד לפני ההסרה: כל 90 המפתחות קיימים בענן, ⭐ ומספר
     *  הרשומות הפנימיות זהה בכולם — ⚠️ אפס חסרים ואפס דלים יותר. */
    var arr = lsRead("ya_archive"+LS, null, 'array');
    ARCHIVE = arr ? arr.filter(function(s){ return s && typeof s === 'object'; }) : [];
  } catch(e) {
    // גם כישלון בלתי צפוי לא ימנע מהאפליקציה לעלות
    console.error('[load] טעינת נתונים מקומיים נכשלה — עולים ריקים ומחכים לענן', e);
    if (!Array.isArray(CATS)) CATS = [];
    if (!SUBS || typeof SUBS !== 'object') SUBS = {};
    if (!SUBS_META || typeof SUBS_META !== 'object') SUBS_META = {};
    if (typeof _catsResetSeen !== 'string') _catsResetSeen = '';
    if (typeof _subsResetSeen !== 'string') _subsResetSeen = '';
    if (!Array.isArray(ENTRIES)) ENTRIES = [];
    if (!Array.isArray(ARCHIVE)) ARCHIVE = [];
  }
}

/*  ⛔ שמות שני המוסדות במקום אחד — ⚠️ הם מופיעים בבורר, בכותרת המשנה
 *  ובאישור, ⭐ ושלושה מקומות שכל אחד מחזיק את השם הם שלוש הזדמנויות

var YESHIVOT = [
  { id: 'rishon',    name: 'ראשון לציון' },

/* ══════════════════════════════════════════════════════════════════════════
   החלפת מוסד — הבורר, איפוס המצב, והעלייה מחדש
   ══════════════════════════════════════════════════════════════════════════ */
function yaNameOf(y) {
  for (var i = 0; i < YESHIVOT.length; i++) if (idEq(YESHIVOT[i].id, y)) return YESHIVOT[i].name;
  return '';
}

/*  ⛔ המצב שאינו נטען מחדש מהדיסק — ⚠️ `loadLocalData` מחליפה את
 *  הרשומות, שהמפתחות שלהן נושאים סיומת מוסד; ⛔ אבל עֵד הדחיפה ואות
 *  הפולינג הם **זיכרון בלבד** ואין להם סיומת:
 *  ⭐ אות פולינג שנשאר משל המוסד הקודם גורם למשיכה הראשונה של החדש
 *  לחשוב שאין מה למשוך, ⛔ ועֵד דחיפה שנשאר מתיר פינוי של רשומה שמעולם
 *  לא עלתה מהמוסד הנוכחי. ⚠️ שניהם מתאפסים לערך שנקרא «אין ראיה»,
 *  ⛔ ולא לערך שנראה כמו ידיעה. */
/*  ⛔⛔ המצב הפר-מוסדי מאופס **כולו**, ⛔ ולא משתני הסנכרון בלבד — ⚠️ הנימוק
 *  המדוד: עד כאן `ENTRIES` · `CATS` · `SUBS` · `SUBS_META` · `ARCHIVE`
 *  נשארו בזיכרון אחרי ההחלפה, ⛔ בעוד ש-`YESHIVA` · `KV_TABLE` · `LS` כבר
 *  הצביעו על המוסד החדש: ⭐ וכל דחיפה שרצה בחלון הזה כתבה את נתוני המוסד
 *  הקודם תחת החדש. ⛔ **וזה לא תיאורטי** — ⚠️ 185 מ-187 ארכיוני רמת אביב
 *  היו של ראשון, ו-`ya_subs` נדרס לגמרי.

 *  בלבד, ⭐ ומערך ריק הוא «אין מה לדחוף» ⛔ ולא «נמחק הכול».
 *  ⛔ ומפת החותמות המרוחקות מתאפסת אף היא — ⚠️ היא נמדדה מול המוסד הקודם,

function yaResetTenantState() {

/*  ⛔ הבורר עובר ב-`openModal` הקיים — ⚠️ מיכל אחד ומסלול סגירה יחיד. */

/*  ⛔ המעבר מאפס את המצב **לפני** הטעינה מחדש — ⚠️ סדר הפוך
 *  היה מאפס אחרי ש-`selectYeshiva` כבר משכה, ⭐ ואז אות הפולינג של

/*  ⛔ **אין אישור שני** — ⚠️ הבחירה במוסד בבורר **היא** האישור:
 *  ⭐ שני דיאלוגים לפעולה אחת מלמדים ללחוץ «כן» בלי לקרוא, ⛔ ואז גם

function yaConfirmSwitch(y) {

   *  של המוסד הקודם אינה קיימת בהכרח בחדש, ⭐ ומסך שנשאר בעומק היה
   *  מציג ריק בלי שהמשתמש יודע למה. */
  try { arcGoYears(); } catch (e) { console.warn('[arc] arcGoYears', e); }

/*  ⛔ `again` מסמן מעבר בין מוסדות ⛔ ולא עלייה — ⚠️ כל

 *  מאזיני רשת בכל קריאה: ⭐ המצב הפר-מוסדי מתרענן ב-`pendReload`,
 *  ⛔ והחיווט נעשה פעם אחת. ⚠️ ואין כאן נקודת הפעלה שנייה — ⭐ זו אותה
 *  פונקציה בדיוק, ⛔ ולא מעטפת שמשכפלת את גופה. */
function selectYeshiva(y) {
  /*  ⛔⛔ האיפוס יושב **בנקודת הניתוב האחת** ⛔ ולא באחריות הקורא — ⚠️ **הנימוק
   *  המדוד**: לפונקציה היו שני קוראים — הבורר שבתוך האפליקציה, שאיפס לפניה,
   *  ⛔ ומסך הבחירה שבעלייה, שקרא לה חשופה: ⭐ ובמסלול השני `ctxEpoch` לא
   *  התקדם, ⛔ וכל שערי ההקשר היו מנוטרלים — ⚠️ מחזור שנפתח במוסד אחד המשיך
   *  לכתוב תחת השני, ⭐ ורשומת קטגוריה זרה נחתה עם חותמת חדשה יותר ודרסה את
   *  רשימת המשימות. ⛔ **ואין להחזיר את האיפוס לקורא** — ⚠️ קורא שלישי ישכח
   *  אותו בדיוק כפי שהשני שכח.
   *  ⛔ **וכניסה חוזרת נגזרת ואינה נמסרת** — ⚠️ הפרמטר `again` נמסר בקורא
   *  אחד ולא בשני, ⭐ ולכן `pendBoot` רץ פעם שנייה במסלול השני ⛔ והוסיף
   *  מאזיני רשת כפולים. */
  var reentry = !!YESHIVA;
  if (reentry) yaResetTenantState();
  var again = reentry;
  YESHIVA  = y;
  KV_TABLE = (y === 'ramataviv') ? 'ya_settings_ramataviv' : 'ya_settings_rishon';
  LS       = '_' + y;

  // לוגו הכותרת — נתיב פר-מוסד לקובץ שב-`logos/`
  var logoEl = document.getElementById('appLogo');
  if (logoEl) {
    logoEl.src = (y === 'ramataviv') ? RAMATAVIV_LOGO : RISHON_LOGO;
  }
  // כותרת משנה
  var sub = document.getElementById('hdrSub');
  if (sub) sub.textContent = (y === 'ramataviv')
    ? 'ישיבת תומכי תמימים ליובאוויטש רמת אביב'
    : 'ישיבת תומכי תמימים ליובאוויטש ראשון לציון';
  // ⛔ כפתור שיתוף **לשני המוסדות** — ⚠️ ועד כאן הוא הוצג
  //    לרמת אביב בלבד: כפתור ראשון לציון היה «שלח לוואטסאפ», והוא ירד יחד
  //    עם יכולת הוואטסאפ במקום להיגזר ממנה. ⛔ ההסרה הפילה קורא.
  //    ⭐ היעד נבחר בגיליון השיתוף של המערכת, ⛔ ולכן אין כאן שם של יעד:
  //    כפתור אחד, זהה בשני המוסדות, ואותה פונקציה מאחוריו.
  var slot = document.getElementById('outputBtnSlot');
  if (slot) slot.innerHTML =
    '<button class="u-bg-primary-fill u-c-on-primary btn-sm" ' +
    'data-act="share-report">📤 שיתוף הדוח</button>';

  // עמידות אחסון: המפתחות תלויי-מוסד, ולכן המדיניות נבנית רק עכשיו —
  // ומיד אחריה המדידה והפינוי היזום, **לפני** loadLocalData, כדי שהטעינה
  // והמיזוג שאחריה כבר יכתבו לאחסון שיש בו מקום.
  try { lsRebuildPolicy(); lsBoot(); } catch (e) { console.warn('[ls] lsBoot', e); }
  /*  ⛔⛔ הטעינה **לפני** כל `boot` שיכול לדחוף — ⚠️ עד כאן היא
   *  ישבה אחרי `plBoot`, ⛔ וביניהן רצו הריקון החוזר והמשיכה: ⭐ בחלון הזה
   *  `LS` כבר הצביע על המוסד החדש והזיכרון עדיין החזיק את הישן.
   *  ⛔ אין להזיז אותה שוב מטה — ⚠️ זה בדיוק הבאג. ⭐ והיא נשארת **אחרי**
   *  `lsBoot`, ⛔ שההגירה והפינוי חייבים לרוץ לפניה. */
  loadLocalData();
  // סימוני "ממתין לסנכרון". **pendReload ולא pendBoot בלבד** —
  // מפתח הסימונים נושא סיומת מוסד, וסימון של ראשון לציון אינו תקף לרמת אביב.
  try { pendReload(); if (!again) pendBoot(); } catch (e) { console.warn('[pend] pendBoot', e); }
  try { tombBoot(); } catch (e) { console.warn('[tomb] tombBoot', e); }
  /*  ⛔ בדיקת העידן — ⚠️ נקודת ההפעלה היחידה, פעם אחת לעלייה: ⭐ היא
   *  דוחפת תחילה, ⛔ ואינה זורקת דבר אם אחד משלושת התנאים אינו מתקיים. */
  try { eraKick(); } catch (e) { console.warn('[era] eraKick', e); }
  // גיבוי יומי ויומן פעולות — נקודת ההפעלה היחידה של המודול.
  // ⚠️ כאן ולא מוקדם יותר, וזה פרטי ליומן: `BK_CFG.sources` נשענת על
  //    `KV_TABLE`, שהוא `null` עד שנבחר מוסד. ⛔ אין להזיז את הקריאה
  //    למסלול סנכרון — ר' ההערה ב-`_yaMarkSynced`.
  try { bkBoot(); } catch (e) { console.warn('[bk] bkBoot', e); }
  try { hwBoot(); } catch (e) { console.warn('[hw] hwBoot', e); }
  // ניסיון חוזר בסנכרון — נקודת ההפעלה היחידה של המודול.
  try { rtyBoot(); } catch (e) { console.warn('[rty] rtyBoot', e); }
  // מנגנון המשיכה — נקודת ההפעלה היחידה של המודול. ⚠️ כאן ולא
  //    מוקדם יותר, מאותה סיבה כמו `bkBoot`: `KV_TABLE` הוא `null` עד
  //    שנבחר מוסד, ותקתוק לפני כן היה שואל טבלה שאינה קיימת.
  try { plBoot(); } catch (e) { console.warn('[pl] plBoot', e); }
  var ov = document.getElementById('yeshivaSelect');
  if (ov) ov.style.display = 'none';
  // מסך הבחירה כבר נסגר — כישלון כאן חייב להשאיר אפליקציה שמישה ולא מסך ריק
  try {
    startApp();
  } catch(e) {
    console.error('[startApp] נכשל', e);
    toast(MSG_BOOT_FAIL, null, 'bad');
  }
}

// ── פלט ל-Signal: תמונה של הדוח היומי ──
// בניית div הדוח ⇐ html2canvas ⇐ קובץ ⇐ גיליון השיתוף של המערכת
// (המשתמש בוחר Signal). תמונת הדוח משתמשת אוטומטית בלוגו ובשם של המוסד
// הנבחר (דרך #appLogo.src ו-instName הפר-מוסדי של _buildReportDiv).
// נפילה-חזרה בדסקטופ: הורדת התמונה.
function shareReport(){
  var curKey = getCurrentDateKey();
  var todayEntries = liveOnly(ENTRIES).filter(function(e){ return e.gdate === curKey; });
  if(!todayEntries.length){ toast(MSG_NOTHING_TO_SHARE); return; }
  toast(MSG_IMG_PREP);
  _buildReportDiv(function(div){
    _renderReport(div).then(function(canvas){
      div.style.left='-9999px';
      // גשר ה-WebView המקורי של אנדרואיד ⇐ גיליון השיתוף של המערכת (המשתמש בוחר Signal)
      if (_androidShareImage(canvas)) return;
      canvas.toBlob(function(blob){
        var file = new File([blob], 'yoman.jpg', {type:'image/jpeg'});
        if (navigator.canShare && navigator.canShare({files:[file]})) {
          navigator.share({files:[file]}).catch(function(err){
            if (err && err.name !== 'AbortError') _shareDownloadFallback(canvas);
          });
          return;
        }
        // דסקטופ או סביבה שאינה נתמכת: הורדת התמונה (אין קישור עומק ל-Signal)
        _shareDownloadFallback(canvas);
      },'image/jpeg',0.95);
    }).catch(function(e){ _reportError(div, e); });
  });
}


function editEntry(id) {
  var e = ENTRIES.find(function(x){ return idEq(x.id, id) && isLive(x); });
  if(!e) return;
  // ⛔ `idArg` חובה — מזהה טקסט, ⛔ והציטוט נשבר בשקט בלעדיו.
  // ⛔ האיתור עבר ל-`data-id` יחד עם ההעברה — בורר שחיפש את
  // מחרוזת ה-`onclick` היה מפסיק למצוא דבר ברגע שהמאפיין ירד, והעריכה
  // הייתה מתה בשקט.
  var sel = '[data-id="' + cssQ(id) + '"]';
  var row = document.querySelector('[data-act="entry-del"]' + sel);
  if(!row) { row = document.querySelector('[data-act="entry-edit"]' + sel); }
  if(!row) return;
  var container = row.closest('.entry-row');
  if(!container) return;
  var div = document.createElement('div');
  div.innerHTML =
    '<div class="u-d-flex u-g-3 u-ai-c u-fwr-wrap u-p-3 u-bg-warn-soft u-r-2 ksave">' +
    '<input aria-label="משימה" id="ei_task" placeholder="משימה" class="u-fx-2 u-p-2-4 u-bd-1-solid-border u-r-1 u-ff-heebo-sans-serif">' +
    '<input aria-label="תת-משימה" id="ei_sub" placeholder="תת-משימה" class="u-fx-2 u-p-2-4 u-bd-1-solid-border u-r-1 u-ff-heebo-sans-serif">' +
    '<input aria-label="כמות" id="ei_count" type="text" inputmode="numeric" autocomplete="off" placeholder="כמות" class="u-w-60 u-p-2-4 u-bd-1-solid-border u-r-1 u-ff-heebo-sans-serif">' +
    '<input aria-label="הערות" id="ei_notes" placeholder="הרחבה" class="u-fx-3 u-p-2-4 u-bd-1-solid-border u-r-1 u-ff-heebo-sans-serif">' +
    '<button data-act="entry-save" data-ksave data-id="' + esc(id) + '" class="u-p-2-5 u-bg-primary-fill u-c-on-primary u-bd-none u-r-1 u-cur-p u-ff-heebo-sans-serif">שמור</button>' +
    '<button data-act="entry-edit-cancel" data-kesc class="u-p-2-5 u-bg-card-2 u-c-text2 u-bd-none u-r-1 u-cur-p u-ff-heebo-sans-serif">ביטול</button>' +
    '</div>';
  container.innerHTML = '';
  container.appendChild(div);
  // קובע את הערכים ישירות ב-JS — מונע לחלוטין בעיות בריחת HTML
  document.getElementById('ei_task').value = e.task || '';
  document.getElementById('ei_sub').value = e.sub || '';
  document.getElementById('ei_count').value = e.count || '';
  document.getElementById('ei_notes').value = e.notes || '';
}

function saveEntry(id) {
  var e = ENTRIES.find(function(x){ return idEq(x.id, id) && isLive(x); });
  if(!e) return;
  e.task = document.getElementById('ei_task').value.trim() || e.task;
  e.sub = document.getElementById('ei_sub').value.trim();
  e.count = document.getElementById('ei_count').value.trim();
  e.notes = document.getElementById('ei_notes').value.trim();
  recTouch(e);   // בלי זה העדכון מפסיד במיזוג מול העותק הישן שבענן
  pendMark(PK_ENTRY + e.id);
  saveEntries();
  autoArchiveDay(e.day, e.hdate, e.gdate);   // שהעריכה תגיע גם לסנאפשוט של אותו יום
  return true;
}

function arcEditEntry(gdateKey, entryId) {
  var days = getAllArchiveDays();
  var d = days[gdateKey];
  if(!d) return;
  var e = d.entries.find(function(x){ return idEq(x.id, entryId); });
  if(!e) return;
  // מאתר את אלמנט השורה ומחליף אותו בטופס עריכה במקום
  var rows = document.querySelectorAll('.arc-entry-row');
  var target = null;
  var qk = jsQ(gdateKey);
  rows.forEach(function(r){
    // ⛔ `idArg` חובה — מזהה טקסט, ⛔ והציטוט נשבר בשקט בלעדיו.
    if(r.innerHTML.indexOf('arcDeleteEntry(\'' + qk + '\',' + idArg(entryId) + ')') > -1 ||
       r.innerHTML.indexOf('arcEditEntry(\'' + qk + '\',' + idArg(entryId) + ')') > -1) {
      target = r;
    }
  });
  if(!target) return;
  target.innerHTML =
    '<div class="u-d-flex u-g-3 u-ai-c u-fwr-wrap u-p-2 u-bg-warn-soft u-r-2 u-w-100p ksave">' +
    '<input aria-label="משימה" id="aei_task" value="' + esc(e.task||'') + '" placeholder="משימה" class="u-fx-2 u-p-2-4 u-bd-1-solid-border u-r-1 u-minw-80 u-ff-heebo-sans-serif u-fs-2">' +
    '<input aria-label="תת-משימה" id="aei_sub" value="' + esc(e.sub||'') + '" placeholder="תת-משימה" class="u-fx-2 u-p-2-4 u-bd-1-solid-border u-r-1 u-minw-80 u-ff-heebo-sans-serif u-fs-2">' +
    '<input aria-label="כמות" id="aei_count" type="text" inputmode="numeric" autocomplete="off" value="' + (e.count||'') + '" placeholder="כמות" class="u-w-55 u-p-2-4 u-bd-1-solid-border u-r-1 u-ff-heebo-sans-serif u-fs-2">' +
    '<input aria-label="הערות" id="aei_notes" value="' + esc(e.notes||'') + '" placeholder="הרחבה" class="u-fx-3 u-p-2-4 u-bd-1-solid-border u-r-1 u-minw-80 u-ff-heebo-sans-serif u-fs-2">' +
    '<button data-act="arc-entry-save" data-ksave data-key="' + esc(gdateKey) + '" data-id="' + esc(entryId) + '" class="u-p-2-5 u-bg-primary-fill u-c-on-primary u-bd-none u-r-1 u-cur-p u-ff-heebo-sans-serif">שמור</button>' +
    '<button data-act="arc-entry-edit-cancel" data-kesc class="u-p-2-5 u-bg-card-2 u-c-text2 u-bd-none u-r-1 u-cur-p u-ff-heebo-sans-serif">בטל</button>' +
    '</div>';
}

function arcSaveEntry(gdateKey, entryId) {
  // מטפל בשני המקורות — ARCHIVE וגם ENTRIES — בדיוק כמו arcDeleteEntry.
  // רשומה שקיימת רק ב-ENTRIES (יום שעדיין לא אורכב) הייתה no-op שהציג "נשמר!".
  var ts = Date.now();
  function fld(id) { var el = document.getElementById(id); return el ? el.value.trim() : null; }
  var vals = { task: fld('aei_task'), sub: fld('aei_sub'), count: fld('aei_count'), notes: fld('aei_notes') };
  if (vals.task === null) { toast(MSG_EDIT_FORM_CLOSED, null, 'bad'); return; }
  function apply(e) {
    e.task = vals.task; e.sub = vals.sub; e.count = vals.count; e.notes = vals.notes;
    recTouch(e, ts);
  }
  var hits = 0, touchedArc = [];
  ARCHIVE.forEach(function(snap) {
    var hit = false;
    (snap.entries||[]).forEach(function(e) {
      if (e && idEq(e.id, entryId)) { apply(e); hit = true; hits++; }
    });
    if (hit) { recTouch(snap, ts); touchedArc.push(archiveKey(snap)); }
  });
  ENTRIES.forEach(function(e) {
    if (e && idEq(e.id, entryId)) { apply(e); hits++; }
  });
  if (!hits) {
    // אין מה לשמור — לא לשקר למשתמש
    console.warn('[arcSaveEntry] רשומה לא נמצאה:', entryId, gdateKey);
    renderArcDetail();
    toast(MSG_ROW_GONE, null, 'bad');
    return;
  }
  pendMark(PK_ENTRY + entryId);
  // ⛔ מפתח הסימון של סנאפשוט הוא `archiveKey` ולא מפתח המפה של
  //    `getAllArchiveDays` — המפה ממופתחת ב-gdate **גולמי**
  //    (`"3/09/2025"`), ואילו שלוש נקודות הקריאה — `yaDirtyRows`,
  //    `HW_CFG.specs[].isPending` ו-`mergeArchive` — קוראות
  //    `PK_ARC + archiveKey(r)`, כלומר `arc:g:3/09/2025`. בעבר נכתב
  //    כאן `arc:3/09/2025`, ולכן **אף אחת מהשלוש לא ראתה את הסימון**:
  //    עריכת רשומה בארכיון לא נחשבה «לדחיפה», ושער הפינוי של החלון החם
  //    היה רשאי לפנות סנאפשוט שהעריכה שלו טרם עלתה.
  touchedArc.forEach(function(k) { if (k != null) pendMark(PK_ARC + k); });
  saveEntries();
  saveArchive();
  renderArcDetail();
  renderLog();
  toast(MSG_SAVED);
}

</script>
