var _heColl = null;
try { _heColl = new Intl.Collator('he'); } catch (e) { _heColl = null; }
var HE = _heColl || { compare: function (a, b) { return String(a).localeCompare(String(b), 'he'); } };

// ── עֵד הסנכרון ──────────────────────────────────────────────────────────

// "ראיתי את מצב הענן"), וגם ב-saveEntries/saveArchive בלי לבדוק את תוצאת
// ה-sbSet. לכן פינוי שהיה נשען עליו היה יכול למחוק מהדיסק רשומה שמעולם לא
// הגיעה לענן. `_yaPushedAt[key]` נכתב **רק** אחרי `sbSet` שהחזירה ok, ולכן
// כל רשומה שגילה קטן ממנו הייתה בתוך המערך שנדחף בהצלחה.
var _yaPushedAt = {};

// בצהריים מקומיים, כמו כל חישוב תאריך בפרויקטים האלה.

// שום תוקף לגבי הנתונים של השני. המוסד השני יפונה כשייבחר.
/*  ⚠️ `_yaRecTs` גוזרת מ-`gdate` כשאין חותמת עריכה, ⛔ וחותמת עריכה חדשה
 *  דוחה את הפינוי — רשומה שנערכה עכשיו אינה ישנה. */

  LS_CFG.oldRecords = [
    { key: 'ya_archive' + LS, label: 'ארכיון ימים', ts: _yaRecTs,
      syncedThrough: function () { return _yaPushedThrough('ya_archive'); },
      idOf: archiveKey, verify: _yaVerify('ya_archive') },
    { key: 'ya_entries' + LS, label: 'רשומות היומן', ts: _yaRecTs,
      syncedThrough: function () { return _yaPushedThrough('ya_entries'); },
      idOf: entryKey, verify: _yaVerify('ya_entries') }

/* ── עדות סנכרון חלופית ─────────────────────────────────────────────────

   בטבלת המוסד) והשוואה פר-רשומה מול המפתח והחותמת.

   `ok:false` ⇒ לא מפנים דבר. */

    //    ⛔ ואין נפילה-חזרה לערך השלם — ⚠️ עֵד שנשען עליו היה מפנה מהדיסק
    //    רשומה שהטבלה אינה מכירה, ⭐ והראיה שעליה נשען הפינוי היא הטבלה.
    return yaRowsGet(kvKey).then(function (rr) {

    if (ctxStale(_ep)) return { ok: false, error: "ההקשר התחלף", ctxStale: true };
    if (res.error) {
      console.error('[sync] sbSet error', key, res.error.message, res.error);
      return { ok: false, error: res.error.message || MSG_SERVER_ERR };
    }
    console.log('[sync] sbSet ok', key);
    return { ok: true, error: null };
  } catch(e) {
    console.error('[sync] sbSet exception', key, e);
    return { ok: false, error: (e && e.message) || String(e) };
  }
}

// אותה קריאה, עם התוצאה משומרת: {ok, data, error}.
// מפתח חסר (PGRST116 מ-single()) הוא תוצאה ריקה, לא כישלון.
async function sbGetResult(key) {
  var tbl = KV_TABLE;   // ⛔ נלכדת בכניסה — ⚠️ החלפת מוסד באמצע ההמתנה משנה את הגלובלי
  try {
    var sb = getSB();
    var res = await withTimeout(sb.from(tbl).select("value").eq("key", key).single());
    if (res.error) {
      var missing = res.error.code === "PGRST116";
      if (!missing) console.error("sbGet error [" + key + "]:", res.error.message, res.error);
      return { ok: missing, data: null, error: missing ? null : (res.error.message || MSG_SERVER_ERR) };
    }
    if (!res.data) return { ok: true, data: null, error: null };
    var pr = kvParse(key, res.data.value);
    return { ok: pr.ok, data: pr.value, bad: pr.bad, error: pr.bad ? MSG_KV_BAD : null };
  } catch(e) {
    console.error("sbGet exception [" + key + "]:", e);
    return { ok: false, data: null, error: (e && e.message) || String(e) };
  }
}

// מעטפת ערך-בלבד — חוזה שלא השתנה, לרבים מאתרי הקריאה שרוצים רק את הנתון.
async function sbGet(key) {
  var r = await sbGetResult(key);
  return r.data;
}

// ============================================================
// ===== RECORD-LEVEL MERGE ENGINE =====
// ============================================================
// העיקרון (זהה למנוע המיזוג של האחיות): היעדר רשומה אצל מכשיר
// אינו מחיקה. מחיקה היא אך ורק tombstone מפורש — deleted:true + updatedAt.
// מכשיר לעולם לא מוחק רשומה שהוא פשוט לא מכיר.
//
// רשומה בלי updatedAt: recTs() מחזיר עבורה 0 — כלומר היא "ותיקה" ומפסידה
// לכל רשומה מתוארכת — ⛔ אבל היא לעולם לא נופלת מהמיזוג רק בגלל שהצד השני
// לא מכיר אותה: ⭐ האיחוד של מקומי + ענן הוא בלי אובדן נתונים.
/* ══════════════════════════════════════════════════════════════════════════
   מנוע המיזוג ברמת רשומה — חותמות ו-tombstones
   ══════════════════════════════════════════════════════════════════════════
   ⛔ **היעדר רשומה אצל צד אחד אינו מחיקה** — זה הכלל היחיד
   שחשוב כאן, והוא מה שמנע את אובדן הנתונים שקדם לסבב. מחיקה היא
   `deleted:true` + `updatedAt`, והענן מנצח בשוויון (דטרמיניסטי).
   ══════════════════════════════════════════════════════════════════════════ */
function recTs(r) {
  return (r && typeof r === 'object' && typeof r.updatedAt === 'number') ? r.updatedAt : 0;
}
function recTouch(r, ts) {
  if (r && typeof r === 'object') r.updatedAt = (typeof ts === 'number') ? ts : Date.now();
  return r;
}
// מחיקה לוגית — במקום splice/filter פיזיים שנעלמים במיזוג
function recDelete(r, ts) {
  if (r && typeof r === 'object') { r.deleted = true; r.updatedAt = (typeof ts === 'number') ? ts : Date.now(); }
  return r;
}
function isLive(r) { return !!r && !r.deleted; }
function liveOnly(arr) { return (Array.isArray(arr) ? arr : []).filter(isLive); }

// מיזוג ברמת רשומה. remote (הענן) קובע את סדר הבסיס ומנצח בשוויון — דטרמיניסטי.
// mergePair (אופציונלי) — מיזוג מותאם כששני הצדדים מכירים את אותו מפתח.
//
// ⛔ **רשומה מקומית מסומנת ⏳ מנצחת ללא תלות בחותמת — אין להסיר
//    את `isPending` מכאן.** בענן החותמת נכתבת ע"י המכשיר שדחף, ולכן ברגע
//    שמכשיר א' דוחף, השורה בענן נושאת חותמת **מאוחרת יותר** מעריכה חדשה
//    יותר שיושבת אצל מכשיר ב' וטרם עלתה — ומכשיר ב' היה מאמץ את גרסת א',
//    כלומר מוחק את העריכה שלו **בשקט**. הצד השני של אותו כלל — «רשומה
//    מסומנת נחשבת תמיד לדחיפה» — יושב ב-`yaDirtyRows`.
//    המחיר המודע: מכשיר שהיה מנותק זמן רב ידרוס בעלייתו עריכה מרוחקת חדשה
//    יותר. זו העדפה מכוונת — הרשומה מסומנת ⏳ כל אותו זמן ומתריעה אחרי
//    24 שעות, בעוד שעריכה שנמחקת בשקט אינה משאירה עקבות.
// חיבור יומן העבודה לליבה המשותפת. ⛔ החתימה לא השתנתה —
// עשרות אתרי קריאה מסתמכים עליה.
// ⚠️ `dedupe: true` **נדרש כאן ואינו ברירת מחדל שקטה**: שתי קריאות
//    `autoArchiveDay` על אותו יום מייצרות שני סנאפשוטים לאותו `gdate`
//    באותו מערך, ובלי איחוד הם היו שורדים שניהם ומכפילים את הארכיון.
// `remoteDupe: 'ts'` — בכפילות בתוך המערך המרוחק מנצחת החותמת הגבוהה,
//    ובשוויון המאוחר. ⚠️ שני הצדדים שם מרוחקים, ולכן הגנת ה-⏳ אינה חלה.
function mergeRecords(local, remote, getKey, mergePair, isPending) {
  return mergeCore(local, remote, {
    getKey: getKey, ts: recTs, mergePair: mergePair, isPending: isPending,
    keepUnversionedLocal: true, dedupe: true, remoteDupe: 'ts'
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   סדר רשומות היומן
   ══════════════════════════════════════════════════════════════════════════
   ⚠️ השוואת מזהה — `idEq` — יושבת ב**מודול
   מזהי הרשומות המשותף**, ולא כאן. מה שנשאר כאן הוא
   סדר הרשומות, שהוא פרטי ליומן.
   ══════════════════════════════════════════════════════════════════════════ */
// מפתח הסדר של רשומת יומן. ⚠️ **`createdAt` ולא `id`** — מזהה אינו
// מפתח סדר, ו-uuid אינו ניתן להשוואה מספרית. ⭐ ו-`updatedAt` הוא
// הנפילה-חזרה היחידה.
function entryOrderTs(e) {
  if (!e) return 0;
  var c = Number(e.createdAt);
  if (isFinite(c) && c > 0) return c;
  var u = Number(e.updatedAt);
  return (isFinite(u) && u > 0) ? u : 0;
}
function entryKey(e) { return (e && e.id != null) ? e.id : null; }
// ⚠️ שני הפרדיקטים האלה הם **אותם מפתחות בדיוק** שבהם משתמשים `yaDirtyRows`
//    (בחירת מה לדחוף) ו-`HW_CFG.specs[].isPending` (שער הפינוי) — קידומת
//    הסימון + מפתח מנוע המיזוג. שלוש הנקודות חייבות לקרוא את אותו מפתח.
function pendEntry(k) { return pendHas(PK_ENTRY + k); }
function pendArc(k) { return pendHas(PK_ARC + k); }
function mergeEntries(local, remote) { return mergeRecords(local, remote, entryKey, null, pendEntry); }

// סנאפשוט ארכיון מזוהה לפי היום שלו (gdate) בלבד — ⚠️ שני מכשירים שארכבו
// את אותו יום מייצרים id שונה, ⭐ ו-gdate הוא מה שמונע כפילות: ⛔ סנאפשוט
// בלי gdate אין לו מפתח, ומנוע המיזוג אינו מקבל אותו.
function archiveKey(s) {
  return (s && s.gdate) ? 'g:' + s.gdate : null;
}
// מיזוג ארכיון: מטא-דאטה של הסנאפשוט ב-LWW, אבל הרשומות שבתוכו ממוזגות
// אחת-אחת — אחרת שני מכשירים שהוסיפו רשומות לאותו יום היו דורסים זה את זה.
function mergeArchive(local, remote) {
  return mergeRecords(local, remote, archiveKey, function(loc, rem, k, pend) {
    var base = (pend || recTs(loc) > recTs(rem)) ? loc : rem;   // שוויון → הענן; ⏳ → המקומי
    var out = {};
    Object.keys(base).forEach(function(kk){ out[kk] = base[kk]; });
    out.entries = mergeRecords(loc.entries, rem.entries, entryKey, null, pendEntry);
    out.count = liveOnly(out.entries).length;
    return out;
  }, pendArc);
}

// קטגוריות: רשומה = קטגוריה (מפתח = אות).
// ⛔⛔ **ו-`tasks` הוא נקודת מיזוג בפני עצמה** — ⚠️ **הנימוק המדוד**: המשימות
//    נסעו עם הרשומה, ⛔ ומיזוג ברמת רשומה מחליף את **המערך כולו**: ⭐ מקור
//    אחר עם חותמת חדשה יותר מחק רשימת משימות שלמה שלא נגעו בה, ⚠️ ושתי
//    קטגוריות נשאו את המשימות של מוסד אחר מילה במילה.
// ⛔ **ולכן לכל משימה חותמת משלה ב-`tasksMeta`** — ⚠️ אותו קידוד של מפת
//    תתי-המשימות: ⭐ מספר לפריט חי, ⛔ ו-`{deleted, updatedAt}` למחיקה —
//    ⚠️ שהיעדר נקרא «אין לי» ולא «נמחק».
// ⛔ **והסדר נוסע עם הרשומה** ⛔ ולא עם הפריט — ⚠️ אין למשימה חותמת סדר,
//    ⭐ ולכן שינוי סדר מוכרע ב-`updatedAt` של הקטגוריה כמו כל שדה אחר.
function catKey(c) { return (c && c.letter != null) ? c.letter : null; }
function catMeta(c) { return (c && c.tasksMeta && typeof c.tasksMeta === 'object') ? c.tasksMeta : {}; }
/*  ⛔ מיזוג רשימת המשימות פר-פריט — ⚠️ צד שאינו מכיר את המשימה כלל אינו
 *  מכריע עליה, ⭐ אחרת משימה שנוספה אופליין הייתה יורדת במשיכה הראשונה:
 *  ⛔ ובשוויון חותמות מנצח הענן, ⚠️ שההכרעה דטרמיניסטית. */
function mergeTasks(locList, locMeta, remList, remMeta) {
  var L = Array.isArray(locList) ? locList : [], R = Array.isArray(remList) ? remList : [];
  var Lm = locMeta || {}, Rm = remMeta || {};
  var lHas = {}, rHas = {}, meta = {};
  L.forEach(function (t) { lHas[t] = 1; });
  R.forEach(function (t) { rHas[t] = 1; });
  // ⛔ הענן הוא בסיס הסדר, והמקומי נוסף אחריו — ⚠️ כמו במיזוג הרשומות
  var order = uniqList(R.concat(L));
  var out = [];
  order.forEach(function (t) {
    var lKnows = !!lHas[t] || (t in Lm), rKnows = !!rHas[t] || (t in Rm);
    var useLocal = !rKnows ? true : !lKnows ? false : metaTs(Lm[t]) > metaTs(Rm[t]);
    var mv = useLocal ? Lm[t] : Rm[t];
    if (metaDeleted(mv)) { meta[t] = mv; return; }
    if (!(useLocal ? lHas[t] : rHas[t])) return;   // חותמת בלי פריט — אין מה להחזיק
    out.push(t);
    if (mv !== undefined) meta[t] = mv;
  });
  // ⛔ סימוני מחיקה שאין להם פריט בשום צד נשארים — כך המחיקה מתפשטת הלאה
  Object.keys(Lm).forEach(function (t) { if (!(t in meta) && metaDeleted(Lm[t])) meta[t] = Lm[t]; });
  Object.keys(Rm).forEach(function (t) {
    if (metaDeleted(Rm[t]) && (!(t in meta) || metaTs(Rm[t]) > metaTs(meta[t]))) meta[t] = Rm[t];
  });
  return { tasks: out, meta: meta };
}
function mergeCats(local, remote) {
  return mergeRecords(local, remote, catKey, function (loc, rem, k, pend) {
    var base = (pend || recTs(loc) > recTs(rem)) ? loc : rem;   // שוויון → הענן
    var out = {};
    Object.keys(base).forEach(function (kk) { out[kk] = base[kk]; });
    var m = mergeTasks(loc.tasks, catMeta(loc), rem.tasks, catMeta(rem));
    out.tasks = m.tasks;
    out.tasksMeta = m.meta;
    return out;
  });
}

// תתי-משימות: SUBS הוא מפה {מפתח: [מחרוזות]}, ו-SUBS_META מחזיקה חותמת
// לכל מפתח. ⛔ **ושתי מחיקות שונות חיות כאן, ואין לערבב ביניהן:**
//  ⭐ **מחיקת פריט בתוך הרשימה** — הרשימה כולה היא הרשומה, ⛔ ולה חותמת
//    אחת: הפריט יורד מהמערך, החותמת מתקדמת, והמיזוג מכריע לפיה.
//  ⛔ **ומחיקת המפתח עצמו** — משימה שלמה על כל תתיה — ⚠️ היא **סימון**
//    ב-`SUBS_META` ⛔ ולא היעדר: ⭐ היעדר נקרא «אין לי» ולא «נמחק».
//    ⚠️ **וזה לא תיאורטי** — ⛔ האיחוד העיוור החזיר מפתחות שנוקו בענן,
//    ⭐ והמפתחות מקודדים לפי **מספר** הקטגוריה: ⛔ מפתח שדלף נחת תחת
//    קטגוריה אחרת לגמרי.
// ⛔ **וצד שאינו מכיר את המפתח כלל אינו מכריע עליו** — ⚠️ אחרת מפתח
//    שנוצר במכשיר אופליין היה יורד במשיכה הראשונה.
function mergeSubs(localSubs, localMeta, remoteSubs, remoteMetaRes) {
  var Ls = (localSubs && typeof localSubs === 'object') ? localSubs : {};
  var Rs = (remoteSubs && typeof remoteSubs === 'object') ? remoteSubs : {};
  var Lm = (localMeta && typeof localMeta === 'object') ? localMeta : {};
  var Rm = yaMetaMap(remoteMetaRes) || {};
  var subs = {}, meta = {}, keys = {};
  [Ls, Rs, Lm, Rm].forEach(function(m){
    Object.keys(m).forEach(function(k){ keys[k] = 1; });
  });
  Object.keys(keys).forEach(function(k){
    var lKnows = (k in Ls) || (k in Lm);
    var rKnows = (k in Rs) || (k in Rm);
    // ⛔ צד שאינו מכיר את המפתח אינו מכריע עליו — «אין לי» אינו «נמחק»;
    // ⚠️ ובשוויון חותמות מנצח הענן, שההכרעה דטרמיניסטית
    var useLocal = !rKnows ? true : !lKnows ? false : metaTs(Lm[k]) > yaMetaTs(remoteMetaRes, k);
    var mv = useLocal ? Lm[k] : Rm[k];
    // ⛔ הסימון נשאר במפת החותמות ⛔ והמפתח יורד — כך המחיקה מתפשטת הלאה
    if (metaDeleted(mv)) { meta[k] = mv; return; }
    var list = useLocal ? Ls[k] : Rs[k];
    if (list === undefined) return;   // חותמת בלי רשימה — אין מה להחזיק
    subs[k] = uniqList(list);
    meta[k] = (mv === undefined) ? 0 : mv;
  });
  return { subs: subs, meta: meta };
}

/* ══════════════════════════════════════════════════════════════════════════
   שכבת השורות בענן — ya_entries
   ══════════════════════════════════════════════════════════════════════════
   ⭐ **כל רשומה היא שורה** ⛔ ולא ערך יחיד למפתח `kv` — ⚠️ ערך יחיד נדרס
   כולו בכל עריכה, המיזוג עליו בענן הוא ברמת קובץ, ⛔ ואין בו פינוי
   סלקטיבי.

   ⭐ **היומן והארכיון בטבלה אחת**, ⚠️ ומה שמפריד ביניהם הוא **עמודת
   `archived`** — «העברה לארכיון» היא עדכון דגל ⛔ ולא העברה בין מקומות.
   השליפה מסננת עליו (`.eq('archived', …)`), ⭐ ושולפת רק את מה שמוצג.

   ⚠️ **הסנאפשוט הוא יחידת הארכיון** — שורה ליום ⛔ ולא שורה לרשומה שבתוכו:
      ⭐ הוא היחידה שמנוע המיזוג מכיר (`archiveKey`), יש לו מטא-דאטה
      ו-tombstone משלו, ובתוכו כבר רץ מיזוג פר-רשומה. ⛔ פירוקו לרשומות
      הוא מנוע מיזוג אחר, ⚠️ ולא תופעת לוואי.
   ⚠️ **והצד המקומי נפרד:** localStorage מחזיק שני מפתחות
      (`ya_entries`+LS / `ya_archive`+LS) ושני מערכים, ⭐ ולכן מודול האחסון,
      מודול ה-⏳ ומדיניות הפינוי אינם תלויים בייצוג שבענן.

   ⛔ `client_id` נגזר ממפתח המיזוג ואינו uuid חדש — לרשומה כאן
      כבר יש זהות שנוצרה במכשיר (`id`/`gdate`), ומזהה שני ועצמאי היה מאפשר
      לאותה רשומה לוגית להתקיים פעמיים.
   ⛔ אין לכתוב ל-`ya_archive` כטבלה — ⚠️ כתיבה לשם נכשלת בכל
      קריאה: ⭐ `ya_archive` הוא **מפתח localStorage** בלבד, ⛔ ואינו שם של
      טבלה.
   ══════════════════════════════════════════════════════════════════════════ */
var YA_ROWS = true;
var YA_ARC_UNIFIED = true;
/* ⭐ הרשומות והארכיון חיים בטבלת השורות בלבד — ⚠️ `cats`/`subs`/`subs_meta`
   נשארים ב-`kv`: ⛔ אין להם תחליף-שורות, והוא ביתם היחיד בענן. */
var YA_ROW_TABLES = { ya_entries: 'ya_entries', ya_archive: 'ya_archive' };

function yaTableOf(kvKey) {

}

    // SUBS: מיזוג פר-מפתח לפי SUBS_META
    var cloudSubs = await pull('subs', 'תתי-משימות');
    var cloudSubsMetaR = await pullRes('subs_meta', 'חותמות תתי-משימות');
    var cloudSubsReset = String(await pull(SUBS_RESET_KEY, 'חותמת ניקוי תתי-משימות') || '');
    /*  ⛔ ההקשר התחלף באמצע המחזור — ⚠️ הנתונים שבזיכרון שייכים למוסד
     *  הקודם, ⭐ והכתיבה שאחרי הייתה כותבת אותם תחת החדש. */
    if (ctxStale(_ep)) { console.warn('[sync] ההקשר התחלף באמצע — הסנכרון נעצר'); return; }
    /*  ⛔⛔ המיזוג רץ רק מול ראיה שמפת החותמות הגיעה — ⚠️ מפה
     *  שמשיכתה נכשלה אינה «הענן אינו מכיר»: ⭐ וכל הכרעה מול היעדר
     *  שלא נמדד היא הסקה ולא ראיה, ⛔ והדחיפה שאחריה מקבעת אותה בענן. */
    if (cloudSubs && yaMetaMap(cloudSubsMetaR)) {
      /*  ⛔ החותמת קודמת למיזוג — ⚠️ מכשיר שראה חותמת ישנה זורק את המפה
       *  המקומית ומושך מלא: ⭐ ואינו דוחף, ⛔ שהדחיפה הייתה מחזירה לענן
       *  בדיוק את מה שזה עתה נוקה בו. */
      if (cloudSubsReset > _subsResetSeen) {
        SUBS = (cloudSubs && typeof cloudSubs === 'object') ? cloudSubs : {};
        SUBS_META = yaMetaMap(cloudSubsMetaR) || {};
        _subsResetSeen = cloudSubsReset;
        lsSet(SUBS_RESET_LS+LS, JSON.stringify(cloudSubsReset));
        lsSet('ya_subs'+LS, JSON.stringify(SUBS));
        lsSet('ya_subs_meta'+LS, JSON.stringify(SUBS_META));
        console.log('[sync] ניקוי תתי-משימות ' + cloudSubsReset + ' — העותק המקומי נזרק ונמשך מלא');
      } else {
        var ms = mergeSubs(SUBS, SUBS_META, cloudSubs, cloudSubsMetaR);
        SUBS = ms.subs; SUBS_META = ms.meta;
        lsSet('ya_subs'+LS, JSON.stringify(SUBS));
        lsSet('ya_subs_meta'+LS, JSON.stringify(SUBS_META));
        sbSet('subs', SUBS);
        sbSet('subs_meta', SUBS_META);
      }
    } else if (cloudSubs) {
      /*  ⛔ הדחייה נאמרת ⛔ ואינה שקטה — ⚠️ המשיכה כבר נרשמה כשנכשלה,
       *  ⭐ והשורה הזו היא מה שאומר מדוע המיזוג לא רץ בכל זאת. */
      console.warn('[sync] מפת חותמות תתי-המשימות לא הגיעה — המיזוג נדחה, ואין ראיה שהענן חדש יותר');
    }

    // ENTRIES: מיזוג ברמת רשומה (updatedAt + tombstones) ⛔ ולא איחוד לפי id
    // בלבד — ⚠️ שם עדכון שנעשה במכשיר אחד אינו גובר על הגרסה הישנה של השני.
    /* ⛔ מהטבלה בלבד, ⛔ ובלי נפילה-חזרה לערך השלם — ⚠️ וכשל אינו נכנס
       לענף «הענן ריק»: ⭐ «אין ראיה» היא לא-לדעת, ⛔ ומשיכה שנכשלה שדוחפת
       את המקומי לענן מכריעה על סמך חוסר-ידיעה. */
    var _rowsE = await yaRowsGet('ya_entries');
    /*  ⛔ ההקשר התחלף באמצע המחזור — ⚠️ הנתונים שבזיכרון שייכים למוסד
     *  הקודם, ⭐ והכתיבה שאחרי הייתה כותבת אותם תחת החדש. */
    if (ctxStale(_ep)) { console.warn('[sync] ההקשר התחלף באמצע — הסנכרון נעצר'); return; }
    if (!_rowsE.ok) failed.push('רשומות');
    else {
    var cloudEntries = _rowsE.data;
    if (cloudEntries && cloudEntries.length) {
      ENTRIES = mergeEntries(ENTRIES, cloudEntries);
      // גריעת ה-tombstones הישנים שהוזמנה בטעינה — פעם אחת, על התוצאה
      // הממוזגת, כדי שגם העותק הענני שנדחף מיד אחר כך יצטמצם.
      ENTRIES = tombPruneMerged(ENTRIES);
      // מיון לפי id בסדר יורד (החדש קודם)
      ENTRIES.sort(function(a,b){ return entryOrderTs(b) - entryOrderTs(a); });
      lsSetArray('ya_entries'+LS, ENTRIES, _yaRecTs);
      pushTable('ya_entries', ENTRIES);
    } else if (ENTRIES.length) {
      pushTable('ya_entries', ENTRIES);   // הענן ריק — דוחפים את המקומי לענן
    }
    }

    // ARCHIVE: מיזוג סנאפשוטים לפי gdate + מיזוג הרשומות שבתוך כל סנאפשוט.
    // ⛔ ולא "למי שיש יותר רשומות מנצח" — ⚠️ שני מכשירים שהוסיפו רשומות
    // לאותו יום היו מאבדים את הצד הקטן יותר.
    var _rowsA = await yaRowsGet('ya_archive');
    /*  ⛔ ההקשר התחלף באמצע המחזור — ⚠️ הנתונים שבזיכרון שייכים למוסד
     *  הקודם, ⭐ והכתיבה שאחרי הייתה כותבת אותם תחת החדש. */
    if (ctxStale(_ep)) { console.warn('[sync] ההקשר התחלף באמצע — הסנכרון נעצר'); return; }
    if (!_rowsA.ok) failed.push('ארכיון');
    else {
    hwNoteCloud('ya_archive'+LS, _rowsA.data);   // ראיה עננית לשער הדיסק
    var cloudArchive = _rowsA.data;
    if (cloudArchive && cloudArchive.length) {
      ARCHIVE = mergeArchive(ARCHIVE, cloudArchive);
      lsSetArray('ya_archive'+LS, hwDiskFilter('ya_archive'+LS, ARCHIVE), _yaRecTs);
      // דוחף את הארכיון הממוזג בחזרה לענן כדי שכל המכשירים יישארו מסונכרנים
      pushTable('ya_archive', ARCHIVE);
    } else if (ARCHIVE.length) {
      // הענן ריק אך במכשיר יש נתונים — דוחף לענן
      pushTable('ya_archive', ARCHIVE);
    }
    }

    // ניקוי חד-פעמי של סנאפשוטים פגומים (אחרי שהארכיון מהענן כבר יושב ב-ARCHIVE)
    arcCleanupCorrupted();

    // מיישב את selCat אחרי ש-CATS הוחלף — ההפניה הישנה אינה במערך החדש
    if (selCat) {
      selCat = CATS.find(function(c){ return c.letter === selCat.letter && isLive(c); }) || null;
    }
    // הסימון לפני הרינדור — שורת המצב שבאזור המצב נבנית בתוך renderSettings.
    if (failed.length === 0) _yaMarkSynced();
    pullRender(yaPullDraw);
    if (failed.length === 0 && !_yaPullLogged) { _yaPullLogged = true; yaSyncLog('pull', null, null); }
    if (failed.length === 0) {
      toast(MSG_SYNCED, null, 'good');
    } else if (failed.length >= 5) {
      toast(MSG_SYNC_FAIL_LOCAL, null, 'bad');
    } else {
      toast(MSG_SYNC_PARTIAL + failed.join(", "), null, 'bad');
    }
  } catch(e) {
    console.error("[syncFromCloud] error:", e);
    _yaNetWarned = true;
    toast(MSG_OFFLINE_LOCAL, null, 'bad');
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   שם החודש העברי — מפתח הקיבוץ של הארכיון
   ══════════════════════════════════════════════════════════════════════════
   ⛔ **שם החודש הוא מפתח הקיבוץ של הארכיון** (`extractYM`) — ⚠️ ולכן הוא
   נכתב בצורה אחת: ⭐ «מנחם אב», ו«אדר א׳»/«אדר ב׳» בגרש עברי — ⛔ ושינוי
   בו הוא המרה במסד ⛔ ולא מיפוי בקוד: ⚠️ מיפוי הוא מקור אמת שני שמתיישן.
   ══════════════════════════════════════════════════════════════════════════ */

// ── נרמול שמות חודשים עבריים ──
// בנתונים הקיימים מופיע "מרחשון" בעוד הקוד מייצר "חשון" — בלי איחוד נוצרים
// שני כפתורי חודש באותה שנה, כל אחד עם חצי מהימים. הנרמול הוא לקריאה/תצוגה
// בלבד: הרשומות ב-localStorage ובענן נשארות בדיוק כפי שהן.
function normHDate(h) {
  if (!h) return h || "";
  return String(h).replace(/מרחשוו?ן/g, "חשון").replace(/חשוון/g, "חשון");
}
/*  ⛔ שם החודש נכתב בצורה אחת — ⚠️ גרש עברי `׳`, ⛔ ולא אפוסטרוף ולא
 *  מרכאה: ⭐ שתי צורות הן שני דליים בארכיון, ⛔ ומיפוי ביניהן הוא מקור
 *  אמת שני שמתיישן — ⚠️ ואין להחזיר טבלת מיפוי «למקרה ש». */
function monthKeyOf(m) {
  return normHDate(m).trim().replace(/\s+/g, " ");
}

// ═══ סוף אזור שם החודש העברי ══════════════════════════════════════════════

/*  ⛔ הפלטה יושבת ב-CSS ⛔ ואינה חוזרת כאן — ⚠️ שתי רשימות לאותם שמונה
 *  גוונים הן שני מקורות אמת, ⭐ ומי ששינה גוון באחת השאיר את השנייה
 *  מתארת את מה שהיה: ⛔ כאן נשארות האותיות בסדרן, ⚠️ והמחלקה שנגזרת ממנה
 *  היא מה שמציב את `--cat`. */
const CAT_LETTERS = 'אבגדהוזח';
function catCls(letter) {
  var i = CAT_LETTERS.indexOf(letter);
  return 'cat-' + (i < 0 ? 0 : i + 1);
}

/*  ⛔ אין ערך קבוע שנכנס למיזוג עם הענן — ⚠️ **הנימוק המדוד**: שבע
 *  קטגוריות ו-17 מפתחות תת-משימה של ראשון לציון היו מוזרקים בכל טעינה,
 *  ⛔ והמיזוג החזיר אותם לענן: ⭐ רמת אביב קיבלה את הקטגוריות של ראשון,
 *  ⛔ וניקוי נתוני האתר במכשיר לא עזר — 69 · 26 חזרו ל-94 · 90 תוך דקות.
 *  ⛔ **ומצב ריק מוצג כריק** — ⚠️ הודעה אחת ⛔ ולא ערך מומצא. */
let CATS = [];
let SUBS = {};
let ENTRIES = [];

/*  ⛔ **נקודת הגזירה האחת של שם הקטגוריה** — ⚠️ הרשומה נושאת את האות
 *  בלבד, ⭐ והשם נקרא מ-`CATS` הנוכחי בכל תצוגה: ⛔ שם ששמור ברשומה
 *  מתיישן בשקט — ⚠️ קטגוריה ששמה שונה משאירה את הישן לנצח, ⭐ ורשומה
 *  שנוצרה במוסד אחד נשאה את שמו גם אחרי מעבר למוסד השני.
 *  ⛔ **ונפילה-חזרה לשם השמור כשהאות אינה בטבלה הנוכחית** — ⚠️ בארכיון
 *  יושבות רשומות תחת אות שנמחקה, ⭐ ובלעדיה שם היסטורי היה יורד לאות
 *  עירומה. */
function catNameOf(e) {
  var c = CATS.find(function (x) { return x.letter === e.cat; });
  return c ? c.name : (e.catName || e.cat);
}

let selCat = null;
let selTask = null;
let selSub = null;
let selDay = "";

/* ══════════════════════════════════════════════════════════════════════════
   מסך היומן — טופס ההזנה, הרשימה והארכוב היומי
   ══════════════════════════════════════════════════════════════════════════ */
function getCurrentDateKey() {
  var g = document.getElementById("gregDateInput");
  var p = parseGregLike(g ? g.value : "");
  // ⛔ הקלט נשמר בפורמט השמור בלבד — ⚠️ קלט שנשמר כמות שהוא היה יום שני
  //    בארכיון. ⭐ נפילה-חזרה למפתח של היום: רשומה אינה נשמרת לעולם
  //    עם gdate ריק (ששובר את הארכוב ואת סינון היומן היומי).
  return p ? gregKeyFromParts(p) : getTodayKey();
}

function getTodayKey() {
  return gregDateStr(new Date());
}

// ⛔ רמה אחת גלויה בארכיון — ⚠️ ארבעת המיכלים מוסתרים ומוצג אחד, ⭐ בנקודה אחת.
function arcShowLevel(level) {
  ["years", "months", "days", "detail"].forEach(function (x) {
    showEl(document.getElementById("arc-" + x), x === level);
  });
}
// לשוניות
/*  ⛔ הסתרה והצגה במחלקה ⛔ ולא ב-`.style.display` — ⚠️ מצב קבוע יושב
 *  בגיליון: ⭐ סגנון מוטבע גובר על כל מחלקה, ⛔ ומי שמשנה את הגיליון
 *  אינו רואה אותו. */
function showEl(el, on) { if (el) el.classList.toggle("is-hidden", !on); }
function showTab(name, el) {
  document.querySelectorAll(".panel").forEach(function(p){ showEl(p, false); });
  document.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.remove("active"); });
  showEl(document.getElementById("panel-"+name), true);
  el.classList.add("active");
  renderTab(name);
}
/*  ⛔ ניתוב הציור בנקודה אחת — ⚠️ מעבר לשונית ורענון שאחרי שמירה מציירים
 *  את אותו מסך, ⭐ ושני מרשמים לאותו ציור נבדלים ביום שבו נוספת לשונית. */
function renderTab(name) {
  if (name === "log") renderLog();
  if (name === "settings") renderSettings();
  if (name === "archive") renderArchive();
}
/*  ⛔ נקודת הרענון של הצינור — ⚠️ **מה נכנס**: ציור הלשונית הפתוחה,
 *  ⛔ **ומה מפיל**: מעבר לשונית — ⭐ רענון אינו ניווט, ⚠️ ושמירה שמנווטת
 *  מוציאה את המשתמש מהמקום שבו הוא עומד. */
function saveRefresh() {
  var on = document.querySelector(".tab-btn.active");
  var p = document.querySelector('.panel:not(.is-hidden)');
  if (p && p.id) renderTab(String(p.id).replace(/^panel-/, ""));
  else if (on) renderTab("log");
}

// תאריך
function gregDateStr(jsDate) {
  var d = jsDate.getDate(), m = jsDate.getMonth()+1, y = jsDate.getFullYear();
  return d + " " + GREG_MONTHS_HE[m-1] + " " + y;
}

function checkDayChange() {
  var lastDay = lsGet("ya_last_day"+LS) || "";
  var today = new Date().toDateString();
  if (lastDay && lastDay !== today && liveOnly(ENTRIES).length > 0) {
    // זוהה יום חדש — ארכוב מקומי בלבד.
    // ⛔ אין לדחוף לענן כאן — syncFromCloud() ירוץ מיד
    // אחרי וימזג כראוי; דחיפת ENTRIES ריק לענן הייתה מוחקת רשומות
    // שמכשיר אחר כבר הוסיף להיום.
    var prev = new Date(lastDay);
    var live = liveOnly(ENTRIES);
    // ⭐ שדות היום נגזרים מהרשומות עצמן קודם כול — הן נכתבו עם התאריך
    //    שהמשתמש באמת עבד בו, וזה בדיוק מה ש-`autoArchiveDay` מקבל במסלול הידני.
    //    השעון הוא נפילה-חזרה, לא מקור ראשון.
    var withG = live.find(function(e){ return e && e.gdate; });
    var withH = live.find(function(e){ return e && hasHebMonth(e.hdate); });
    var withD = live.find(function(e){ return e && e.day; });
    var gdate = (withG && withG.gdate) || gregDateStr(prev);
    // ⛔ נפילה-חזרה מפורשת ולא שדה ריק בשקט — `hebrewDate` מחזירה ""
    //    כשהלוח אינו זמין, ו-hdate ריק הוא בדיוק מה שהעיף סנאפשוטים
    //    לדלי «לא ידוע». בהיעדר שניהם נשמר לפחות `name` שממנו `snapHDate` גוזרת.
    var hdate = (withH && withH.hdate) || hebrewDate(prev) || "";
    var dayKey = (withD && withD.day) || DAY_VALUE_MAP[prev.getDay()] || "";
    // אותה חותמת לעותקים שבארכיון ול-tombstones — בשוויון הסנאפשוט מנצח,
    // ולכן ארכוב אינו מחיקה מהארכיון
    var ts = Date.now();
    var carried = JSON.parse(JSON.stringify(live));
    carried.forEach(function(e){ recTouch(e, ts); });
    // ⛔ אותו בונה בדיוק כמו המסלול הידני — `auto` הוא סימון מקור
    //    ותו לא, ואינו מחליף שדה: ⚠️ שני בונים הם שני סנאפשוטים שונים לאותו יום.
    arcPutSnapshot(dayKey, hdate, gdate, carried, ts, { auto: true });
    lsSetArray("ya_archive"+LS, hwDiskFilter('ya_archive'+LS, ARCHIVE), _yaRecTs);
    // tombstones במקום ENTRIES = [] — אחרת הענן היה מחזיר את הרשומות לחיים
    ENTRIES.forEach(function(e){ if (isLive(e)) recDelete(e, ts); });
    lsSetArray("ya_entries"+LS, ENTRIES, _yaRecTs);
    toast(MSG_DAY_ARCHIVED, null, 'good');
  }
  lsSet("ya_last_day"+LS, today);
}

function initDate() {
  var now = new Date();
  var hd = hebrewDate(now);
  var gd = gregDateStr(now);
  document.getElementById("hebDateInput").value = hd;
  document.getElementById("gregDateInput").value = gd;
  autoSelectTodayChip();
}

// ממפה את getDay() של JS (0=ראשון) לתוויות הצ'יפים
var DAY_LABEL_MAP = ["ראשון","שני","שלישי","רביעי","חמישי","ערב שבת","מוצ\"ש"];
var DAY_VALUE_MAP = ["יום ראשון","יום שני","יום שלישי","יום רביעי","יום חמישי","ערב שבת","מוצאי שבת"];

function autoSelectTodayChip() {
  var dow = new Date().getDay(); // 0=ראשון
  var label = DAY_LABEL_MAP[dow] || "";
  var value = DAY_VALUE_MAP[dow] || "";
  selDay = value;
  document.querySelectorAll(".day-chip").forEach(function(b){
    b.classList.remove("active");
    if (b.textContent.trim() === label) b.classList.add("active");
  });
}

function pickDay(el, day) {
  selDay = day;
  document.querySelectorAll(".day-chip").forEach(function(b){ b.classList.remove("active"); });
  el.classList.add("active");
  // כשהמשתמש בוחר יום ידנית, מזיז בהתאם את התאריך העברי והלועזי
  syncDatesToDay(day);
  renderLog();
}

function syncDatesToDay(dayValue) {
  // מזהה איזה יום בשבוע נבחר
  var targetDow = DAY_VALUE_MAP.indexOf(dayValue);
  if (targetDow < 0) return;
  var now = new Date();
  var currDow = now.getDay();
  var diff = targetDow - currDow;
  // נשאר בתוך השבוע הנוכחי (עד ±3 ימים)
  if (diff > 3) diff -= 7;
  if (diff < -3) diff += 7;
  var target = new Date(now.getTime() + diff * 86400000);
  document.getElementById("hebDateInput").value = hebrewDate(target) || hebrewDate(now);
  document.getElementById("gregDateInput").value = gregDateStr(target);
}

function onGregDateChange() {
  var inp = document.getElementById("gregDateInput");
  var p = parseGregLike(inp.value);
  if (p) {
    var d = dayNoon(p.y, p.m - 1, p.d);
    var dow = d.getDay();
    var label = DAY_LABEL_MAP[dow] || "";
    var value = DAY_VALUE_MAP[dow] || "";
    selDay = value;
    document.querySelectorAll(".day-chip").forEach(function(b){
      b.classList.remove("active");
      if (b.textContent.trim() === label) b.classList.add("active");
    });
    document.getElementById("hebDateInput").value = hebrewDate(d) || document.getElementById("hebDateInput").value;
    renderLog();
  }
}

// רשת הקטגוריות
function buildCatGrid() {
  var g = document.getElementById("catGrid");
  g.innerHTML = "";
  var live = liveOnly(CATS);
  /*  ⛔ מצב ריק מוצג כריק — ⚠️ מוסד שאין לו קטגוריות בענן אינו מקבל ערך
   *  מומצא: ⭐ הודעה אחת, ⛔ ולא רשימה שתמוזג חזרה לענן. */
  if (!live.length) {
    g.innerHTML = '<span class="hint">' + esc(MSG_NO_CATS) + '</span>';
    return;
  }
  live.forEach(function(cat) {
    var btn = document.createElement("button");
    btn.className = "cat-btn " + catCls(cat.letter) +
      ((selCat && selCat.letter === cat.letter) ? " sel" : "");
    btn.innerHTML = "<span class=\"cat-btn-name\">" + esc(cat.name) + "</span>";
    btn.dataset.act = 'pick-cat';
    btn.dataset.letter = cat.letter;
    g.appendChild(btn);
  });
}

/*  ⛔ הקטגוריה נמצאת לפי האות שב-DOM — ⚠️ המזהה חי באלמנט והמטפל קורא
 *  אותו משם, ⭐ ולא בסגור שנתפר לכפתור: ⛔ סגור פר-כפתור הוא מאזין ישיר
 *  לכל דבר, ⚠️ והוא בדיוק מה שהמפה קיימת כדי למנוע. */
function pickCat(letter) {
  var hit = null;
  CATS.forEach(function (c) { if (c && String(c.letter) === String(letter)) hit = c; });
  if (!hit) { console.error('[cat] אין קטגוריה לאות: ' + letter); return; }
  selCat = hit; selTask = null; selSub = null;
  buildCatGrid(); buildTaskBtns(); buildSubBtns();
}

function buildTaskBtns() {
  var el = document.getElementById("taskBtns");
  el.innerHTML = "";
  if (!selCat) { el.innerHTML = '<span class="hint">בחר קטגוריה...</span>'; return; }
  selCat.tasks.forEach(function(t) {
    var b = document.createElement("button");
    b.className = "qbtn" + (selTask === t ? " active" : "");
    b.textContent = t;
    b.dataset.act = 'pick-task';
    b.dataset.task = t;
    el.appendChild(b);
  });
}

/*  ⛔ הכפתור מגיע כארגומנט ⛔ ולא מ-`event.currentTarget` — ⚠️ בהאצלה
 *  ה-`currentTarget` הוא `document`, ⭐ וההבזק היה נצבע על כל הדף. */
function pickTask(t, btn) {
  selTask = t; selSub = null;
  tapFlash(btn);
  document.getElementById("taskInput").value = t;
  buildTaskBtns(); buildSubBtns();
}

function buildSubBtns() {
  var el = document.getElementById("subBtns");
  el.innerHTML = "";
  var ci = selCat ? CATS.indexOf(selCat) : -1;
  var subs = (selTask && ci >= 0) ? (SUBS[subKey(ci, selTask)] || SUBS[selTask] || []) : [];
  if (!subs.length) {
    el.innerHTML = '<span class="hint">' + (selTask ? "אין תת-משימות" : "בחר משימה...") + '</span>';
    return;
  }
  subs.forEach(function(s) {
    var b = document.createElement("button");
    b.className = "qbtn" + (selSub === s ? " active" : "");
    b.textContent = s;
    b.dataset.act = 'pick-sub';
    b.dataset.sub = s;
    el.appendChild(b);
  });
}

function pickSub(s, btn) {
  selSub = s;
  tapFlash(btn);
  document.getElementById("subInput").value = s;
  buildSubBtns();
}

// אפקט הבזק למובייל: הדגשה קצרה ואז שחרור
function tapFlash(btn) {
  if (!btn) return;
  btn.classList.add("tapped");
  setTimeout(function(){ btn.classList.remove("tapped"); }, 600);
}


// ארכוב אוטומטי — נקרא אחרי כל addEntry / deleteEntry
/* ══════════════════════════════════════════════════════════════════════════
   בניית סנאפשוט ארכיון — מסלול אחד לידני ולאוטומטי
   ══════════════════════════════════════════════════════════════════════════
   ⭐ **מסלול יצירה אחד** לשני הקוראים — `autoArchiveDay` (הוספה/מחיקה/
      עריכה) ו-`checkDayChange` (מעבר יום): ⚠️ סנאפשוט בלי `gdate`, `hdate`
      ו-`day` נופל לדלי «לא ידוע» בארכיון, ⛔ ובלי `gdate` אין לו
      `archiveKey` כלל — ⚠️ ומנוע המיזוג אינו מקבל אותו.

   ⛔ אין להחזיר מסלול יצירה שני — רשומה אוטומטית חייבת להיות זהה
      בשדותיה לרשומה ידנית, ושדה שנשאר ריק בשקט הוא בדיוק מה שייצר את
      «לא ידוע».
   ⚠️ `arcPutSnapshot` **אינה** כותבת לענן — הקורא מחליט. זה מכוון:
      `checkDayChange` חייבת להישאר מקומית — ⚠️ דחיפה לפני המיזוג שאחריה
      הייתה מוחקת רשומות שמכשיר אחר כבר הוסיף להיום.
   ══════════════════════════════════════════════════════════════════════════ */
function arcPutSnapshot(dayKey, hdate, gdate, dayEntries, ts, extra) {
  if (!gdate) return null;   // בלי תאריך אין סנאפשוט — אחרת נוצר סנאפשוט זבל עם gdate ריק
  var existIdx = ARCHIVE.findIndex(function(a){ return a.gdate === gdate && isLive(a); });
  var exist = existIdx >= 0 ? ARCHIVE[existIdx] : null;
  // מיזוג ולא החלפה: הסנאפשוט הקיים הוא הצד ה"מרוחק" (מנצח בשוויון), הרשומות
  // החיות הן הצד המקומי. כך רשומה שכבר אורכבה לא נמחקת מהארכיון רק
  // מפני שהעותק החי שלה הפך ל-tombstone, אבל מחיקה אמיתית (updatedAt חדש יותר)
  // כן עוברת.
  var mergedEntries = mergeRecords(
    JSON.parse(JSON.stringify(dayEntries)),
    exist ? (exist.entries || []) : [],
    entryKey
  );
  var snapshot = {
    id: exist ? exist.id : ts,
    name: hdate || (exist ? exist.name : "") || "",
    hdate: hdate || (exist ? exist.hdate : "") || "",
    gdate: gdate,
    day: dayKey || (exist ? exist.day : "") || "",
    date: gdate,
    entries: mergedEntries,
    count: liveOnly(mergedEntries).length,
    updatedAt: ts
  };
  if (extra) Object.keys(extra).forEach(function(k){ snapshot[k] = extra[k]; });
  if (exist) ARCHIVE[existIdx] = snapshot; else ARCHIVE.unshift(snapshot);
  return snapshot;
}

function autoArchiveDay(dayKey, hdate, gdate) {
  // סינון לפי gdate (מחרוזת תאריך ייחודית) ⛔ ולא לפי שם היום —
  // שמות הימים חוזרים בכל שבוע, ורשומות מתאריכים שונים היו ממוזגות תחת היום הנוכחי.
  if (!gdate) return;
  // כולל tombstones — כך שמחיקה מהיומן מגיעה גם לסנאפשוט של אותו יום
  var dayEntries = ENTRIES.filter(function(e){ return e.gdate === gdate; });
  if (!dayEntries.length) return;
  if (arcPutSnapshot(dayKey, hdate, gdate, dayEntries, Date.now(), null)) saveArchive();
}

// הוספת רשומה
function addEntry() {
  var task = document.getElementById("taskInput").value.trim() || selTask || "";
  var sub  = document.getElementById("subInput").value.trim() || selSub || "";
  var notes = document.getElementById("notesInput").value.trim();
  var count = document.getElementById("countInput").value.trim();
  var hdate = document.getElementById("hebDateInput").value.trim();
  if (!selCat) { toast(MSG_PICK_CATEGORY, null, 'bad'); return; }
  if (!task)   { toast(MSG_NEED_TASK, null, 'bad'); return; }
  var now = new Date();
  var entry = {
    // ⛔ מזהה שנוצר במכשיר ב-`newClientId` ⛔ ולא מהשעון — ⚠️ שני מכשירים
    //    שמוסיפים רשומה באותה מילישנייה היו מקבלים **אותו מזהה**, והמיזוג
    //    היה רואה בהם רשומה אחת.
    id: newClientId(),
    // ⛔ `createdAt` נפרד מהמזהה — הסדר היה נגזר מה-`id`, ו-uuid
    //    אינו ניתן להשוואה מספרית.
    createdAt: now.getTime(),
    day: selDay, hdate: hdate, gdate: getCurrentDateKey(),
    cat: selCat.letter,
    task: task, sub: sub, notes: notes, count: count,
    updatedAt: now.getTime()   // חובה — בלעדיה הרשומה נחשבת "ותיקה" במיזוג
  };
  ENTRIES.unshift(entry);
  // ⚠️ הרשומה נשמרה במכשיר בלבד — סימון ⏳ יורד רק כש-`sbSet` תחזיר `ok`.
  pendMark(PK_ENTRY + entry.id);
  saveEntries();
  autoArchiveDay(entry.day, entry.hdate, entry.gdate);
  clearForm();
  /*  ⛔ אין טוסט כאן — ⚠️ הדחיפה שאחרי מודיעה את התוצאה, ⭐ ושני טוסטים
   *  על אותה שמירה אומרים «הצלחה» פעמיים. */
  schedulePush();
}

function clearForm() {
  document.getElementById("taskInput").value = "";
  document.getElementById("subInput").value = "";
  document.getElementById("notesInput").value = "";
  document.getElementById("countInput").value = "";
  selTask = null; selSub = null;
  buildTaskBtns(); buildSubBtns();
}

// יומן
function renderLog() {
  var list = document.getElementById("logList");
  var cnt  = document.getElementById("logCount");
  // מציג רק רשומות של התאריך הנבחר
  var curKey = getCurrentDateKey();
  var filtered = liveOnly(ENTRIES).filter(function(e){ return e.gdate === curKey; });
  cnt.textContent = filtered.length;
  if (!filtered.length) {
    list.innerHTML = '<div class="empty">📋<br>אין רשומות לתאריך זה</div>';
    return;
  }
  filtered = yaSortEntries(filtered);
  list.innerHTML = filtered.map(function(e) {
    var dateStr = [e.day, e.hdate, e.gdate ? "("+e.gdate+")" : ""].filter(Boolean).join("  ");
    return '<div class="entry-row cat-edge ' + catCls(e.cat) + '">'
      + '<div class="entry-badge cat-fill"></div>'
      + '<div class="entry-body">'
      + '<div class="e-main">' + esc(catNameOf(e)) + ' &larr; ' + esc(e.task) + (e.sub ? " &rarr; " + esc(e.sub) : "") + pendTag(PK_ENTRY + e.id) + '</div>'
      + (e.notes ? '<div class="e-sub">' + esc(e.notes) + '</div>' : '')
      + '<div class="e-meta">' + [dateStr, e.count ? "כמות: "+esc(e.count) : "", ].filter(Boolean).join(" | ") + '</div>'
      + '</div>'
      + '<button data-act="entry-edit" data-id="' + esc(e.id) + '" class="entry-edit">✏️</button>'
      + '<button class="del-btn" data-act="entry-del" data-id="' + esc(e.id) + '">✕</button>'
      + '</div>';
  }).join("");
}

function delEntry(id) {
  // tombstone במקום הסרה פיזית: הסרה פיזית נראית למכשיר אחר כ"רשומה שאני לא
  // מכיר" — הוא היה מחזיר אותה לחיים בסנכרון הבא.
  var deleted = ENTRIES.find(function(e){ return idEq(e.id, id) && isLive(e); });
  if (!deleted) return;
  recDelete(deleted);
  pendMark(PK_ENTRY + deleted.id);   // מחיקה היא כתיבה — ממתינה לאישור
  saveEntries();
  autoArchiveDay(deleted.day, deleted.hdate, deleted.gdate);
  renderLog();
  schedulePush();
}

function clearAll() {
  ask(MSG_CLEAR_ALL_TITLE, MSG_CLEAR_ALL_BODY, MSG_DELETE).then(function (yes) {
    if (!yes) return;
    var curKey = getCurrentDateKey();
    var ts = Date.now();
    var sample = ENTRIES.find(function(e){ return e.gdate === curKey; });
    ENTRIES.forEach(function(e){ if (e.gdate === curKey && isLive(e)) recDelete(e, ts); });
    saveEntries(); renderLog();
    // מעבירים את ה-tombstones גם לסנאפשוט של אותו יום, אחרת הארכיון ימשיך להציג אותן
    if (sample) autoArchiveDay(sample.day, sample.hdate, curKey);
    schedulePush();
  });
}
/*  ⛔ מסלול סגירה אחד לשלושת הדרכים — כפתור, לחיצה על הרקע
 *  ו-`Escape`; ⚠️ מסלול נפרד לכל אחת הוא בדיוק מה שנשבר בשקט. */

// שם המוסד הפעיל — מקור אמת יחיד לכל הפלטים (PDF / דוח תמונה / סיגנל).
// קודם היה מקודד קשיח "ראשון לציון", כך שרמת אביב הוציאה דוחות בשם
// הישיבה השנייה.
function instName() {
  var el = document.getElementById("instNameInput");
  var v = el && el.value ? el.value.trim() : '';
  if (v) return v;
  var y = yaYeshiva(YESHIVA);
  return y ? y.full : '';
}


// ייצוא PDF
/* ══════════════════════════════════════════════════════════════════════════
   פלטים — PDF ותמונת הדוח
   ══════════════════════════════════════════════════════════════════════════ */
/*  ⛔ **הייצוא מצלם את הדוח ⛔ ואינו בונה HTML חדש** — ⚠️ המסלול הזה בנה
 *  מסמך שני עם צבעים משלו (`#333` · `#ffffff` · `#f0f0f0` · `#ddd`),
 *  ⭐ ואיבד את צבעי הקטגוריות שהמסך מראה: ⛔ שני מקורות לאותו דוח הם
 *  שתי הזדמנויות שאחד מהם ייסחף. */
function exportPDF() {
  var live = liveOnly(ENTRIES);
  if (!live.length) { toast(MSG_NO_ROWS); return; }
  /*  ⛔ הכותרת נגזרת **לפני** הרינדור הא-סינכרוני — ⚠️ מסלול הארכיון מחליף
   *  את `ENTRIES` ואת שדה התאריך ומשחזר אותם מיד אחרי הקריאה, ⭐ והרינדור
   *  מסתיים אחרי השחזור: ⛔ קריאה מאוחרת הייתה מקבלת את תאריך היום. */
  var today = document.getElementById("hebDateInput").value || hebrewDate(new Date());
  var todayGreg = getCurrentDateKey();
  var fileTitle = "יומן עבודה " + today + " " + todayGreg;
  toast(MSG_PDF_PREP);
  _buildReportDiv(function (div) {
    _renderReport(div).then(function (canvas) {
      _hideReportDiv(div);
      _printCanvas(canvas, fileTitle);
    }).catch(function (e) { _reportError(div, e); });
  }, live);
}
/*  ⛔ מעטפת הדפסה לצילום ⛔ ואינה מסמך הדוח — ⚠️ אין בה טבלה, כותרת או
 *  צבע: ⭐ כל מה שנראה בדף הוא הפיקסלים שנמדדו, ⛔ ולכן אין מה שייסחף. */
function _printCanvas(canvas, title) {
  var w = null;
  try { w = window.open("", "_blank", "width=900,height=700"); } catch (e) { w = null; }
  // חוסם חלונות קופצים מחזיר null — בלי הבדיקה הפונקציה נפלה בשקט
  // ("w is null") והמשתמש לא ידע למה לא קרה כלום.
  if (!w || !w.document) {
    toast(MSG_POPUP_BLOCKED, null, 'bad');
    return;
  }
  w.document.write('<!DOCTYPE html><html dir="rtl" lang="he"><head><meta charset="UTF-8">'
    + '<title>' + esc(title) + '</title><style>@page{size:A4 portrait;margin:10mm}'
    + 'html,body{margin:0;padding:0;background:var(--card)}img{width:100%;height:auto;display:block}'
    + '</style></head><body><img alt="' + esc(title) + '" src="' + canvas.toDataURL('image/png') + '">'
    + '<' + 'script>window.onload=function(){setTimeout(function(){window.print();},500);}<\/script>'
    + '</body></html>');
  w.document.close();
  setTimeout(function () { try { w.document.title = title; } catch (e) {} }, 80);
}

// ── רשת ביטחון לרינדור הדוח ──
// ‎#_rpDiv הוא פאנל לבן position:fixed שמוצג **לפני** הרינדור.
// אם הרינדור זורק (אופליין ⇐ html2canvas לא נטען ⇐ ReferenceError, או כשל
// canvas/CORS), הפאנל היה נשאר מעל האפליקציה עד רענון.
function _hideReportDiv(div){
  showEl(div, false);
}
function _reportError(div, e){
  _hideReportDiv(div);
  console.error('[report] rendering failed:', e);
  toast(
    (typeof html2canvas === 'undefined')
      ? MSG_IMG_OFFLINE
      : MSG_IMG_FAIL
  , null, 'bad');
}
// מחזירה תמיד promise, ⛔ ולעולם אינה זורקת סינכרונית —
// זריקה סינכרונית כאן הייתה משאירה את פאנל הדוח על המסך עד רענון.
function _renderReport(div){
  if (typeof html2canvas !== 'function') {
    return Promise.reject(new Error('html2canvas not loaded'));
  }
  try {
    return Promise.resolve(
      html2canvas(div,{scale:2,useCORS:true,backgroundColor:getComputedStyle(div).backgroundColor,logging:false})
    );
  } catch(e) {
    return Promise.reject(e);
  }
}

/*  ⛔ `entries` אופציונלי ⛔ ואינו נקודת הפעלה שנייה — ⚠️ המשמיט מקבל את
 *  רשומות היום, ⭐ והייצוא מוסר את רשומות הארכיון: ⛔ סינון קשיח ליום
 *  הנוכחי היה מוציא דוח ריק לכל יום שאינו היום. */
/*  ⛔ הדוח נצרב לתמונה ⛔ ולכן אינו נגזר מהמצב של מי שלחץ — ⚠️ שורשו נושא
 *  `.rp`, ⭐ והערכה הבהירה חלה עליו גם במצב כהה: ⛔ ולכן כל צבע כאן הוא
 *  `var(--…)` ⛔ ואפס ליטרל — ⚠️ ליטרל היה עותק שני של הערכה, ⭐ ומי שמשנה
 *  גוון בגיליון לא היה רואה אותו כאן. ⚠️ `html2canvas` קורא את הסגנון
 *  המחושב, ⭐ ולכן המשתנה נפתר לפני הצריבה. */
function _buildReportDiv(cb, entries){
  var div=document.getElementById('_rpDiv');
  if(!div){div=document.createElement('div');div.id='_rpDiv';document.body.appendChild(div);}
  /*  ⚠️ המיכל נושא את סגנונו מוטבע ⛔ ואינו מחלקה — ⭐ הוא שורש הפלט שנצרב
   *  לתמונה, ⚠️ וכל ילדיו מוטבעים מאותו נימוק: ⛔ מחלקה כאן הייתה מפצלת
   *  את הדוח בין הגיליון לבונה. ⭐ וההצגה וההסתרה — `showEl`, במחלקה. */
  div.className='rp';div.style.cssText='position:fixed;top:0;left:0;background:var(--card);padding:20px;width:900px;direction:rtl;font-family:Heebo,Arial,sans-serif;z-index:9999;';
  var today=document.getElementById("hebDateInput")?document.getElementById("hebDateInput").value:hebrewDate(new Date());
  var todayGreg=getCurrentDateKey();
  var dayLabel=document.getElementById("dayNameEl")?document.getElementById("dayNameEl").textContent:'';

/* ══════════════════════════════════════════════════════════════════════════
   שיתוף — סיגנל והגשר המקורי של המעטפת
   ══════════════════════════════════════════════════════════════════════════ */
// ⭐ גוף הדחיפה, בלי ההשהיה — חולץ כדי שמודול הניסיון
//    החוזר יקרא לאותה דחיפה בדיוק. ⛔ אין לשכפל את הגוף הזה
//    למסלול שני — שתי דחיפות שונות לאותם נתונים הן שתי
//    הזדמנויות שאחת מהן תיסחף.
async function yaSyncPushNow() {
    // ⚠️ t0 לפני שהצילום נקרא — רשומה שתסומן אחרי הרגע הזה אינה במה שנדחף
    //    עכשיו, והורדת הסימון ממנה הייתה מאבדת אותה בשקט.
    var _t0 = Date.now();
    /*  ⛔ ההקשר נלכד בכניסה — ⚠️ המסלול הזה נקרא גם מהתקתוק
     *  המושהה וגם ממודול הניסיון החוזר, ⭐ ושניהם יכולים להתעורר בדיוק
     *  בזמן ההחלפה. */
    var _ep = ctxEpoch();
    // ⭐ הדחיפה היא שורות ⛔ ולא ערך שלם — ⚠️ שתי כתיבות לאותה רשומה הן שני מקורות אמת.
    var rEntries = await pushTable("ya_entries", ENTRIES);
    if (ctxStale(_ep)) return;
    var rArchive = await pushTable("ya_archive", ARCHIVE);
    if (ctxStale(_ep)) return;
    // ⛔ אישור ה-⏳ פר-קטגוריה, כאן ולא רק ב-saveEntries/saveArchive —
    //    זהו מסלול הריקון האוטומטי (מודול הניסיון החוזר, אירוע `online`,
    //    ו-`schedulePush`), ובלי האישור הסימון שרד דחיפה שהצליחה: המונה
    //    נשאר על המסך עד שפעולה חדשה גררה אותו, `_rtyPending()` נשאר אמת,
    //    והניסיון החוזר הצליח שוב ושוב — ועם כל הצלחה חזר «✅ נשמר בענן».
    //    ⚠️ פר-קטגוריה ולא גורף: דחיפה שהצליחה באחת אינה ראיה לשנייה.
    if (rEntries.ok) pendConfirmPush(PK_ENTRY, _t0);
    if (rArchive.ok) pendConfirmPush(PK_ARC, _t0);
    if (!rEntries.ok || !rArchive.ok) {
      // ⛔ אין לחתום את `last_changed` על נתון שלא הגיע —
      // מכשירים אחרים היו מושכים את העותק הענני הישן מעל רשומות חדשות שלהם.
      /*  ⚠️ בלי רשת השמירה הצליחה במכשיר ⛔ ואינה שגיאה — ⭐ הנתון בתור
       *  ויעלה בחזרת הרשת; ⛔ כשל עם רשת הוא שגיאה. */
      if (!navigator.onLine) toast(MSG_SAVED_LOCAL, null, 'good');
      else toast(MSG_LOCAL_ONLY, null, 'bad');
      return;
    }
    // Write timestamp AFTER data is saved — so other devices always get fresh data
    // ⭐ דרך `PL_CFG.stamp` ולא ב-`sbSet` ישיר: זו אותה כתיבה
    //    בדיוק, ⛔ ומסלול שני לחותמת היה יוצא מסנכרון מול
    //    המודול ביום שבו מקום האחסון שלה ישתנה. כאן, בשונה מ-`plTouch()`,
    //    הקורא זקוק לתוצאה עצמה כדי להזהיר את המשתמש.
    var stampTs = Date.now();
    var rTs = await PL_CFG.stamp(stampTs);
    if (ctxStale(_ep)) return;
    if (!rTs.ok) { toast(MSG_CLOUD_NO_FANOUT, null, 'bad'); return; }
    PL_CFG.note(stampTs);
    toast(MSG_SAVED_CLOUD, null, 'good');
}

// Native share bridge: in the WebView APK the shell decodes the image to a cache file
// (FileProvider) and fires ACTION_SEND through the system share sheet.
// Returns true if the native bridge handled it; false in a plain browser (use Web Share / fallback).
//
// ⛔ אין כאן פרמטר יעד — הבורר של המערכת הוא שבוחר, ⛔ ונעילה על
//    יעד אחד מסירה מהמשתמש את הבחירה שהמערכת נותנת בחינם.
// ⚠️ הגשר הוא חוזה בין הדף ל-Java, ולכן החתימה ירדה בשני הצדדים
//    באותו קומיט; ⛔ הסרה בצד אחד בלבד שוברת את השיתוף.
//
// ⚠️ שני גשרים, ולא במקרה. המעטפת טוענת את האתר **מהרשת** ולא מנכסים
// מוטבעים, ⭐ ולכן גשר מקורי הוא הרשאה שניתנת לדף שמגיע מהרשת — ולכן הוא חייב להיות
// מוגבל לדומיין שלנו:
//   • `AndroidShareBridge.postMessage` — `WebViewCompat.addWebMessageListener`,
//     שבו **WebView עצמו** בודק את רשימת המקורות המותרים, פר-frame, לפני
//     שההודעה נמסרת. זה המסלול המועדף ולכן הוא נוסה ראשון.
//   • `AndroidShare.shareImage` — הגשר הישן (`addJavascriptInterface`), למכשירים
//     עם WebView ישן מ-88. שם ההגבלה נאכפת בצד הג'אווה: המעטפת מחברת אותו רק
//     כשהיא על הדומיין שלנו, ובכל קריאה מאמתת מחדש את מקור הדף.
// **אין להסיר את סדר הניסיון הזה** — נפילה-חזרה לגשר הישן כשהחדש קיים היא
// ויתור על האכיפה שהפלטפורמה נותנת בחינם.
function _androidShareImage(canvas){
  try {
    var br = window.AndroidShareBridge;
    if (br && typeof br.postMessage === 'function') {
      br.postMessage(JSON.stringify({
        data: canvas.toDataURL('image/jpeg',0.95).split(',')[1],
        mime: 'image/jpeg'
      }));
      return true;
    }
    if (window.AndroidShare && typeof window.AndroidShare.shareImage === 'function') {
      var b64 = canvas.toDataURL('image/jpeg',0.95).split(',')[1];
      window.AndroidShare.shareImage(b64, 'image/jpeg');
      return true;
    }
  } catch(e) { /* נופל להתנהגות ברירת המחדל של הדפדפן */ }
  return false;
}

// ⛔ נפילה-חזרה של הורדה בלבד — בלי קישור-עומק ליעד ספציפי:
//    קישור כזה הוא מסלול שיתוף שני, מקביל לבורר של המערכת, שאיש אינו
//    קורא לו ואינו נבדק — והוא נשבר בשקט ביום שהיעד משנה סכימה.
function _shareDownloadFallback(canvas){
  var dataUrl = canvas.toDataURL('image/jpeg',0.95);
  var a=document.createElement('a');
  a.href=dataUrl;
  a.download='yoman.jpg';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
// הגדרות
/* ══════════════════════════════════════════════════════════════════════════
   מסך ההגדרות — קטגוריות, משימות ותתי-משימות (כולל גרירה)
   ══════════════════════════════════════════════════════════════════════════ */
// ── הסדר נגזר מה-DOM הסופי ──
/*  ⛔ הסדר נקרא מהעץ אחרי הגרירה ⛔ ולא מצמד «מאיפה לאן» — ⚠️ הצמד מתאר
 *  צעד אחד, ⭐ והעץ מתאר את התוצאה: ⛔ גרירה שעברה כמה שורות בדרך הייתה
 *  נכתבת כקפיצה אחת שאינה מה שנראה על המסך.
 *  ⛔ **ומה נכנס**: המדדים המקוריים בסדר שבו הם יושבים עכשיו; ⚠️ **ומה
 *  מפיל**: מדד שאינו מספר — ⭐ הוא פשוט אינו נכנס לסדר. */
function domOrder(list, kind, attr) {
  var out = [];
  for (var i = 0; i < list.children.length; i++) {
    var x = list.children[i];
    if (x.dataset && x.dataset.drag === kind) out.push(+x.dataset[attr]);
  }
  return out;
}
/*  ⛔ הסידור משמר את המקומות שלא צוירו — ⚠️ קטגוריה מחוקה אינה ברשימה,
 *  ⭐ ומיקומה במערך נשאר שלה: ⛔ סידור שמתעלם ממנה היה מזיז אותה. */
function reorderKeep(arr, order) {
  var slots = order.slice().sort(function (a, b) { return a - b; });
  var out = arr.slice();
  for (var i = 0; i < order.length; i++) out[slots[i]] = arr[order[i]];
  return out;
}
function applyCatOrder(list, kind) {
  CATS = reorderKeep(CATS, domOrder(list, kind, 'idx'));
  saveCats();
  renderSettings();
  buildCatGrid();
}
function applyTaskOrder(list, kind) {
  var order = domOrder(list, kind, 'ti');
  var ci = +list.querySelector('[data-drag="' + kind + '"]').dataset.ci;
  CATS[ci].tasks = reorderKeep(CATS[ci].tasks, order);
  recTouch(CATS[ci]);   // סדר המשימות הוא חלק מרשומת הקטגוריה
  saveCats();
  renderSettings();
}
function applySubOrder(list, kind) {
  var one = list.querySelector('[data-drag="' + kind + '"]');
  var ci = +one.dataset.ci, ti = +one.dataset.ti;
  var taskName = CATS[ci].tasks[ti];
  var sk = subKey(ci, taskName);
  if (!SUBS[sk]) { SUBS[sk] = SUBS[taskName] || []; }
  SUBS[sk] = reorderKeep(SUBS[sk], domOrder(list, kind, 'si'));
  touchSubKey(sk);
  saveSubs();
  renderSettings();
}

function editSubInline(ci, ti, si, oldVal, taskName) {
  var lbl = document.getElementById("sub-lbl-"+ci+"-"+ti+"-"+si);
  if (!lbl) return;
  var inp = document.createElement("input");
  inp.value = oldVal;
  inp.className = "inl-inp";
  lbl.replaceWith(inp);
  inp.focus();
  inp.select();
  function save() {
    var newVal = inp.value.trim();
    if (newVal && newVal !== oldVal) {
      var sk = subKey(ci, taskName);
      if (!SUBS[sk]) SUBS[sk] = SUBS[taskName] || [];
      SUBS[sk][si] = newVal;
      touchSubKey(sk);
      saveSubs();
    }
    renderSettings();
  }
  inp.onblur = save;
  inp.onkeydown = function(e){ if(e.key==="Enter") { inp.blur(); } if(e.key==="Escape") { inp.value=oldVal; inp.blur(); } };
}
function removeSub(ci, taskName, si) {
  var sk = subKey(ci, taskName);
  if (!SUBS[sk]) { if (!SUBS[taskName]) return; SUBS[sk] = SUBS[taskName]; }
  SUBS[sk].splice(si, 1);
  touchSubKey(sk);   // המחיקה מתועדת בחותמת של הרשימה — אחרת היא נעלמת במיזוג
  saveSubs();
  renderSettings();
}

function addSub(ci, ti) {
  var taskName = CATS[ci].tasks[ti];
  var inp = document.getElementById("snewsub-" + ci + "-" + ti);
  if (!inp) return;
  var val = inp.value.trim();
  if (!val) return;
  var sk = subKey(ci, taskName);
  if (!SUBS[sk]) SUBS[sk] = SUBS[taskName] ? [...SUBS[taskName]] : [];
  /*  ⛔ ואותו דבר בתת-המשימה — ⚠️ הרשימה היא רשימת ערכים,
   *  ⭐ והערך הוא הזהות: ⛔ פריט שנכתב פעמיים נמחק פעם אחת. */
  if (uniqHas(SUBS[sk], val)) { toast(MSG_SUBTASK_EXISTS, 4000, 'bad'); return; }
  SUBS[sk].push(val);
  touchSubKey(sk);
  inp.value = "";
  saveSubs();
  renderSettings();
}

function editTaskInline(ci, ti) {
  var lbl = document.getElementById("task-lbl-"+ci+"-"+ti);
  if (!lbl) return;
  var oldVal = CATS[ci].tasks[ti];
  var inp = document.createElement("input");
  inp.value = oldVal;
  inp.className = "inl-inp inl-inp-task";
  lbl.replaceWith(inp);
  inp.focus(); inp.select();
  function save() {
    var newVal = inp.value.trim();
    if (newVal && newVal !== oldVal) {
      // מהגר את SUBS — בודק גם את פורמט המפתח הישן (taskName) וגם את החדש (ci::taskName)
      var oldSk = subKey(ci, oldVal);   // המפתח הישן, בצורה "ci::שם"
      var newSk = subKey(ci, newVal);   // המפתח החדש, באותה צורה
      if (SUBS[oldSk]) {
        // מפתח בפורמט החדש קיים ⇐ מהגרים אותו
        SUBS[newSk] = SUBS[oldSk];
        delSubKey(oldSk);
      } else if (SUBS[oldVal]) {
        // מפתח בפורמט הישן (שם המשימה בלבד) ⇐ מהגרים ומנקים
        SUBS[newSk] = SUBS[oldVal];
        delSubKey(oldVal);
      }
      CATS[ci].tasks[ti] = newVal;
      delTaskMeta(CATS[ci], oldVal); touchTask(CATS[ci], newVal);
      recTouch(CATS[ci]); touchSubKey(newSk);
      saveCats(); saveSubs();
    }
    renderSettings(); buildCatGrid(); buildTaskBtns();
  }
  inp.onblur = save;
  inp.onkeydown = function(e){ if(e.key==="Enter") inp.blur(); if(e.key==="Escape"){ inp.value=oldVal; inp.blur(); } };
}

/* ⛔⛔ אזור ההגדרות — הערת הגנה משותפת לכל האפליקציות
   ⛔ **אין להוסיף שער סיסמה נפרד מעל מסך ההגדרות.** ההרשאה נגזרת
   מהמשתמש המחובר בלבד, ואין שכבה שנייה מעליה.

   **הנימוק — שתי סיבות, וכל אחת מהן מספיקה לבדה:**
   1. שער כזה הוא **שכבת הרשאה כפולה** — מנגנון שני עם מסך משלו,
      מסלול שינוי משלו ותחזוקה משלו, לאותו אדם.
   2. **בהתקנה טרייה שער כזה נופל חזרה לערך ברירת מחדל** — ⚠️ ונפתח
      לכל מי שמקליד אותו: ⛔ הגנה שתלויה בכך שמישהו הריץ שורת זריעה
      בקובץ הסכימה אינה הגנה.

   ⛔ **ואין לזרוע ערך ברירת מחדל לסיסמה או לתפקיד בשום מקום** — לא
   בסכימה, לא במיגרציה, לא בקוד ולא בקובץ בדיקה. ברירת מחדל
   לסיסמה היא חשבון שסיסמתו ידועה לכל העולם;
   ברירת מחדל לתפקיד היא הרשאה שניתנת למי שאיש לא החליט
   להעניק לו אותה. תפקיד נכתב **במפורש** ביצירת המשתמש.

   ⚠️ **הערה זו נרשמת גם במקום שבו המנגנון אינו חל** — ⭐ לקח אבטחתי
   שנרשם רק במקום שבו נלמד אינו מגן על המקום שבו ייכתב הקוד הבא.

   כאן: `renderSettings` — ⚠️ **ליומן אין טבלת משתמשים, אין מסך כניסה
   ואין תפקידים כלל** — הכניסה היא בחירת מוסד, ולכן אין כאן הרשאה
   לגזור ואין סוד לשמור. ההערה נרשמת כדי שגם כאן לא יומצא שער
   בעתיד — שער סיסמה כאן היה **שכבה שלמה יש מאין**.
   ═════════════════════════════════════════════════════════════════════ */
function renderSettings() {
  var ed = document.getElementById("settingsEditor");
  ed.innerHTML = "";
  CATS.forEach(function(cat, ci) {

      + '</div>';
    var tasksHtml = '<div class="set-lbl">משימות (גרור לשינוי סדר):</div>'
      + cat.tasks.map(function(t, ti){

          var subsHtml = '';
          if(subs.length > 0) {

                    + 'data-drag="sub" data-ci="'+ci+'" data-ti="'+ti+'" data-si="'+si+'">'

            + '<button class="sub-add-btn btn-mini" data-act="cat-sub-add" data-ksave data-ci="'+ci+'" data-ti="'+ti+'">+ הוסף</button>'
            + '</div>';
          return '<div class="task-block" '
            + 'data-drag="task" data-ci="'+ci+'" data-ti="'+ti+'">'
            + '<div class="task-block-hdr">'
            + '<span class="task-drag-icon grip">⠿</span>'
            + '<span class="task-name" id="task-lbl-'+ci+'-'+ti+'">'+esc(t)+'</span>'
            + '<button data-act="cat-task-edit" data-ci="'+ci+'" data-ti="'+ti+'" class="set-edit">✏️</button>'

        }).join('')
      + '<div class="task-add-row set-add-row ksave">'
      + '<input aria-label="משימה חדשה" class="set-add-inp" id="snewtask-' + ci + '" placeholder="הוסף משימה..." />'
      + '<button class="btn-mini" data-act="cat-task-add" data-ksave data-ci="' + ci + '">+ הוסף</button>'

}

function removeTask(ci, ti) {
  // משימה היא מחרוזת בלי מזהה — היא נוסעת עם רשומת הקטגוריה, ולכן ההסרה
  // מתועדת כעדכון של הקטגוריה (updatedAt) ומנצחת במיזוג במקום להיעלם.
  var gone = CATS[ci].tasks[ti];
  CATS[ci].tasks.splice(ti, 1);
  delTaskMeta(CATS[ci], gone);
  recTouch(CATS[ci]);
  /*  ⛔ ותתי-המשימות שלה יורדות בסימון — ⚠️ מפתח שנשאר בלי המשימה שלו
   *  חוזר תחת משימה אחרת שתקבל את אותו מספר קטגוריה ואותו שם. */
  delSubKey(subKey(ci, gone));
  saveCats(); saveSubs();
  renderSettings();
}
function addTask(ci) {
  var inp = document.getElementById("snewtask-" + ci);
  var val = inp.value.trim();
  if (!val) return;
  /*  ⛔ פריט שכבר ברשימה אינו נוסף שוב — ⚠️ **וההשוואה על הערך** ⛔ ולא
   *  על מזהה: ⭐ שתי משימות באותו שם הן משימה אחת, ⛔ והשם הוא מפתח
   *  החותמה ומפתח תתי-המשימות — ⚠️ ושתי שורות באותו שם חולקות אותם:
   *  ⛔ המחיקה מסירה אחת מהן והשנייה נשארת עם סימון מחיקה. */
  if (uniqHas(CATS[ci].tasks, val)) { toast(MSG_TASK_EXISTS, 4000, 'bad'); return; }
  CATS[ci].tasks.push(val);
  touchTask(CATS[ci], val);
  recTouch(CATS[ci]);
  inp.value = "";
  saveCats();
  renderSettings();
}
function saveCatName(ci) {
  var inp = document.getElementById("sname-" + ci);
  if (inp && inp.value.trim()) {
    CATS[ci].name = inp.value.trim();
    recTouch(CATS[ci]);
    saveCats();
  }
}
function saveSettings() {
  CATS.forEach(function(cat, ci) {
    var inp = document.getElementById("sname-" + ci);
    if (inp) {
      var newName = inp.value.trim();
      if (newName && newName !== cat.name) {
        if (SUBS[cat.name]) { SUBS[newName] = SUBS[cat.name]; delSubKey(cat.name); touchSubKey(newName); }
        CATS[ci].name = newName;
        recTouch(CATS[ci]);
      }
    }
  });
  saveCats(); saveSubs(); buildCatGrid();
  return true;
}

// TOAST — חתימה משותפת לשלושת הפרויקטים: toast(msg, dur).
// dur באלפיות שנייה, אופציונלי; ברירת המחדל היא `TOAST_DEFAULT_MS`. קודם הפרמטר
// השני פשוט נבלע — ארבעה קוראים העבירו משך והוא לא כובד.
/*  ⛔ מספר שיש לו משמעות מקבל שם —
 *  ⚠️ הערך במקרה זהה ל-`LS_SUCCESS_MUTE_MS`, ⛔ אך הוא מושג אחר
 *  לגמרי (משך תצוגה מול חלון השתקה), ⛔ ואין לאחד ביניהם. */
var TOAST_DEFAULT_MS = 2500;


// ארכיון
// מתמלא פר-מוסד ע"י loadLocalData() אחרי הבחירה, ⛔ מהדיסק בלבד — הזרע
// המוטבע ירד, וההיסטוריה מגיעה מהענן
var ARCHIVE = [];


/* ══════════════════════════════════════════════════════════════════════════
   הארכיון — ניווט שנה ← חודש ← יום, ועריכה במקום
   ══════════════════════════════════════════════════════════════════════════ */
// ═══ מצב הארכיון ═══
var arcSelYear = null;
var arcSelMonth = null;
var arcSelDayKey = null;  // מחרוזת gdate
var arcEditMode = false;

// סדר החודשים לניווט בארכיון. ⛔ אין בו "מרחשון" — monthKeyOf ממפה אותו ל"חשון",
// אחרת אותה שנה מקבלת שני כפתורי חשוון. "אדר" (שנה פשוטה) ו"אדר א׳"/"אדר ב׳"
// (שנה מעוברת) חיים זה לצד זה: בכל שנה נתונה מופיע רק אחד מהמצבים.
var HMO = ["תשרי","חשון","כסלו","טבת","שבט","אדר","אדר א׳","אדר ב׳","ניסן","אייר","סיון","תמוז","מנחם אב","אלול"];
// דלי "לא ידוע" — יום שאי אפשר לפענח את תאריכו העברי. ⛔ הוא אינו נשמט
// מרשימת השנים — ⚠️ אחרת הרשומות שבו בלתי נגישות.
var HUNKNOWN = "לא ידוע";

function extractYM(hdate) {
  function unknown() { return {year: HUNKNOWN, month: HUNKNOWN, order: 99}; }
  if (!hdate) return unknown();
  // חייב להכיל סימן של שנה עברית
  if (!/ה׳תש/.test(hdate)) return unknown();
  var parts = normHDate(hdate).trim().split(" ");
  var year = "", month = "";
  for (var i = parts.length-1; i >= 0; i--) {
    if (parts[i].indexOf("׳") >= 0 && /ה׳תש/.test(parts[i])) { year = parts[i]; parts.splice(i,1); break; }
  }
  // שומר רק חלקים שהם מילים עבריות (בלי ספרות ובלי לטינית)
  var hebrewParts = parts.filter(function(p) { return p && !/[0-9a-zA-Z]/.test(p); });
  month = monthKeyOf(hebrewParts.slice(1).join(" "));
  // מאמת שהחודש נמצא ברשימה המוכרת
  if (!year || HMO.indexOf(month) < 0) return unknown();
  return {year: year, month: month, order: HMO.indexOf(month)};
}

/* ══════════════════════════════════════════════════════════════════════════
   שחזור התאריך העברי — hdate ואם אין, מתוך שם היום
   ══════════════════════════════════════════════════════════════════════════
   הקיבוץ בארכיון נשען על `extractYM(hdate)`. סנאפשוט בלי `hdate` נפל ל-HUNKNOWN
   («לא ידוע») — גם כשהתאריך העברי המלא יושב בשדה `name`. נמדד בשני המוסדות:
   13 סנאפשוטים (6 בראשון לציון, 7 ברמת אביב) עם `name` בצורת
   «יום כ״ט אב ה׳תשפ״ו (אוטומטי)» ובלי `hdate` כלל — כולם נערמו תחת «לא ידוע».

   סדר הנפילה-חזרה: `hdate` תקין ⇐ חילוץ מתוך `name` ⇐ ורק אז HUNKNOWN.

   ⛔ `snapHDate` טהורה ואינה נוגעת בסנאפשוט — זהו תיקון **תצוגה**,
      והמפתחות הישנים ב-`kv` הם נתיב החזרה. כתיבה כאן הייתה משנה נתונים
      קיימים בלי שהמנהל ביקש, ומקדמת את `updatedAt` של 13 סנאפשוטים בבת אחת.
   ⛔ החיתוך הוא אחרי אסימון השנה, ואז השלת אסימונים מ**שמאל** —
      `extractYM` קוראת את החודש כ-`hebrewParts.slice(1)`, ולכן כל תחילית
      («יום», «יום רביעי», «מוצאי שבת») וכל זנב אחרי השנה («(אוטומטי)»,
      «| 11 אפריל 2026») מזיזים אותה לאסימון הלא נכון. השלה גנרית מכסה את כל
      הצורות בלי רשימת תחיליות שתתיישן.
   ══════════════════════════════════════════════════════════════════════════ */
function hebFromText(txt) {
  var t = normHDate(String(txt == null ? "" : txt))
            .replace(/\([^)]*\)/g, " ").replace(/\|/g, " ")
            .replace(/\s+/g, " ").trim();
  if (!t) return "";
  var p = t.split(" ");
  for (var j = 0; j < p.length; j++) {
    if (/ה׳תש/.test(p[j])) { p = p.slice(0, j + 1); break; }   // hdate תקין נגמר בשנה
  }
  for (var i = 0; i < p.length; i++) {
    var cand = p.slice(i).join(" ");
    if (extractYM(cand).year !== HUNKNOWN) return cand;
  }
  return "";
}
// התאריך העברי של סנאפשוט/רשומה לצורך תצוגה וקיבוץ, עם נפילה-חזרה ל-`name`.
function snapHDate(rec) {
  var h = normHDate((rec && rec.hdate) || "");
  if (extractYM(h).year !== HUNKNOWN) return h;
  var t = hebFromText(rec && rec.name);
  if (t) return t;
  /*  ⛔ ונפילה-חזרה שלישית: **החודש העברי נגזר מ-`gdate`** — ⭐ דרך
   *  `hebrewDate`, אותה נקודה שכל הצרכנים יושבים עליה. ⛔ וכמו שתי הנפילות
   *  שמעליה, זהו תיקון **תצוגה** בלבד: ⚠️ הפונקציה טהורה ואינה כותבת
   *  לסנאפשוט, ⭐ שכתיבה כאן הייתה משנה נתוני מסד בלי שהמנהל ביקש. */
  var g = gdateParse(rec && rec.gdate);
  if (g) {
    // ⛔ עוגן בצהריים מקומיים — מעבר לשעון חורף מפיל חצות ליום הקודם
    var hd = hebrewDate(dayNoon(g.y, g.m - 1, g.d));
    if (hd && extractYM(hd).year !== HUNKNOWN) return hd;
  }
  return h;
}

// מחזיר את כל הימים (מסנאפשוטים של ARCHIVE + רשומות חיות שאינן של היום)
function getAllArchiveDays() {
  var days = {};

  // From ARCHIVE snapshots — סנאפשוט שנמחק (tombstone) ורשומות מחוקות בתוכו לא מוצגים
  liveOnly(ARCHIVE).forEach(function(snap) {
    var k = String(snap.gdate || snap.id);
    // key — המפתח האמיתי במפה. סנאפשוט ישן בלי gdate ממופתח לפי id, ובלי לשמור
    // אותו הכפתור בארכיון היה שולח arcGoDetail('') ופותח את היום הלא נכון.
    if (!days[k]) days[k] = {key:k, gdate:snap.gdate||"", hdate:snapHDate(snap), day:snap.day||"",
      name:normHDate(snap.name||""), entries:[], seen:{}, snapId:snap.id};
    // merge entries from snapshot if not already there
    // ⛔ הבדיקה מול `seen` נדרשת גם כאן ולא רק בלולאת ENTRIES — כששני
    //    סנאפשוטים ממופתחים לאותו יום, ⚠️ בלעדיה הרשומה המשותפת נדחפת
    //    פעמיים ונספרת פעמיים בכפתור היום.
    (snap.entries||[]).forEach(function(e){
      if (e && e.id != null) {
        if (days[k].seen[String(e.id)]) return;                   // כבר נכנסה מסנאפשוט אחר
        days[k].seen[String(e.id)] = true;                        // כולל tombstones
      }
      if (isLive(e)) days[k].entries.push(e);
    });
  });

  // From live ENTRIES (including today — so current day is visible in archive).
  // הסנאפשוט הוא המקור הקובע לרשומה שכבר נכנסה אליו: אחרי "סיום יום" העותק החי
  // הוא tombstone, והרשומה עדיין שייכת לארכיון.
  ENTRIES.forEach(function(e) {
    var k = String(e.gdate || "");
    if (!days[k]) {
      if (!isLive(e)) return;   // אין יום כזה בארכיון ורשומה מחוקה — אין מה להציג
      days[k] = {key:k, gdate:e.gdate||"", hdate:snapHDate(e), day:e.day||"",
        name:normHDate([e.day,e.hdate,e.gdate?"| "+e.gdate:""].filter(Boolean).join(" ")), entries:[], seen:{}, snapId:null};
    }
    if (days[k].seen[String(e.id)]) return;             // כבר טופל ע"י הסנאפשוט
    days[k].seen[String(e.id)] = true;
    if (isLive(e)) days[k].entries.push(e);
  });

  return days;
}

function getYearsWithData() {
  var days = getAllArchiveDays();
  var years = {};
  Object.values(days).forEach(function(d) {
    var ym = extractYM(d.hdate);
    if (ym.year) years[ym.year] = true;
  });
  return years;
}

function monthsWithData(year) {
  var days = getAllArchiveDays();
  var months = {};
  Object.values(days).forEach(function(d) {
    var ym = extractYM(d.hdate);
    if (ym.year === year) months[ym.month] = true;
  });
  return months;
}

function getDaysInMonth(year, month) {
  var days = getAllArchiveDays();
  var result = [];
  Object.values(days).forEach(function(d) {
    if (!d.entries.length) return;   // יום שכל רשומותיו נמחקו — לא מציגים כפתום ריק
    var ym = extractYM(d.hdate);
    if (ym.year === year && ym.month === month) result.push(d);
  });
  // מיון לפי מספר היום העברי בתוך החודש
  var HEB_ORD = {"א":1,"ב":2,"ג":3,"ד":4,"ה":5,"ו":6,"ז":7,"ח":8,"ט":9,"י":10,"יא":11,"יב":12,"יג":13,"יד":14,"טו":15,"טז":16,"יז":17,"יח":18,"יט":19,"כ":20,"כא":21,"כב":22,"כג":23,"כד":24,"כה":25,"כו":26,"כז":27,"כח":28,"כט":29,"ל":30};
  function hdayNum(hdate) {
    var d = (hdate||"").split(" ")[0].replace(/[׳״]/g,"");
    return HEB_ORD[d] || 999;
  }
  result.sort(function(a,b){ return hdayNum(a.hdate) - hdayNum(b.hdate); });
  return result;
}

// ── זיהוי השנה והחודש העבריים הנוכחיים ──
function getNowHebYM() {
  var hd = hebrewDate(new Date());
  return extractYM(hd);
}

// ── שביל הניווט ──
function renderArcBreadcrumb() {
  var bc = document.getElementById("arc-breadcrumb");
  if (!bc) return;
  var parts = [];
  parts.push('<span class="arc-crumb" data-act="arc-go-years">שנים</span>');
  if (arcSelYear) {
    parts.push('<span class="arc-crumb-sep">›</span>');
    parts.push('<span class="arc-crumb" data-act="arc-nav-months" data-year="'+esc(arcSelYear)+'">' + esc(arcSelYear) + '</span>');
  }
  if (arcSelMonth) {
    parts.push('<span class="arc-crumb-sep">›</span>');
    parts.push('<span class="arc-crumb" data-act="arc-nav-days" data-year="'+esc(arcSelYear)+'" data-month="'+esc(arcSelMonth)+'">' + esc(arcSelMonth) + '</span>');
  }
  if (arcSelDayKey) {
    var days = getAllArchiveDays();
    var d = days[arcSelDayKey];
    var label = d ? (d.hdate||d.gdate||arcSelDayKey) : arcSelDayKey;
    // מציג רק את חלק היום והחודש (שני הטוקנים הראשונים של hdate)
    var dayParts = label.split(" ");
    var shortLabel = dayParts.slice(0,2).join(" ");
    parts.push('<span class="arc-crumb-sep">›</span>');
    parts.push('<span class="arc-crumb active">' + esc(shortLabel) + '</span>');
  }
  bc.innerHTML = parts.join("");
}

// ── רמה 1: שנים ──
function arcGoYears() {
  arcSelYear = null; arcSelMonth = null; arcSelDayKey = null;
  arcShowLevel("years");
  renderArcYears();
  renderArcBreadcrumb();
}

function renderArcYears() {
  var el = document.getElementById("arc-years");
  var nowYM = getNowHebYM();
  var allYears = {};
  // בונה את רשימת השנים **רק** משנים שיש להן רשומות במוסד הזה.
  // ⛔ אין לזרוע מטווח קבוע — ⚠️ טווח קבוע מציג שנים ריקות מדומות.
  var withData = getYearsWithData();
  Object.keys(withData).forEach(function(y){ allYears[y] = true; });
  // תמיד כולל את השנה העברית הנוכחית (ייתכן שריקה — וזו תצוגת ברירת המחדל התקינה).
  if (nowYM.year) allYears[nowYM.year] = true;

  // Sort years: older first, "לא ידוע" always last
  var yearList = Object.keys(allYears).sort(function(a,b){
    if (a === HUNKNOWN) return 1;
    if (b === HUNKNOWN) return -1;
    return a > b ? 1 : -1;
  });

  var html = '<div class="arc-pick-label">בחר שנה:</div><div class="arc-grid">';

function arcDeleteEntry(gdateKey, entryId) {
  // tombstone בכל מקום שבו הרשומה מופיעה — בסנאפשוטים ובחי — עם אותה חותמת
  var ts = Date.now();
  ARCHIVE.forEach(function(snap) {
    var hit = false;
    (snap.entries||[]).forEach(function(e){ if (idEq(e.id, entryId) && isLive(e)) { recDelete(e, ts); hit = true; } });
    if (hit) { snap.count = liveOnly(snap.entries).length; recTouch(snap, ts); }
  });
  saveArchive();
  ENTRIES.forEach(function(e){ if (idEq(e.id, entryId) && isLive(e)) recDelete(e, ts); });
  saveEntries();
  renderArcDetail();
  renderArcBreadcrumb();
}

function arcAddEntry(gdateKey) {
  var days = getAllArchiveDays();
  var d = days[arcSelDayKey];
  if (!d) return;
  var catSel = document.getElementById("arc-add-cat");
  var taskSel = document.getElementById("arc-add-task");
  var notesSel = document.getElementById("arc-add-notes");
  if (!catSel || !taskSel) return;
  var letter = catSel.value;
  if (!CATS.some(function(c){ return c.letter === letter; })) return;
  // ⭐ מזהה מהמודול המשותף, וחותמת יצירה נפרדת לסדר — ⚠️ uuid אינו
  //    ניתן להשוואה מספרית.
  var _now = Date.now();
  var newEntry = {
    id: newClientId(),
    createdAt: _now,
    day: d.day, hdate: d.hdate, gdate: d.gdate,
    cat: letter,
    task: taskSel.value, sub: "", notes: notesSel ? notesSel.value.trim() : "", count: "",
    updatedAt: _now
  };
  // Add to ARCHIVE snapshot if exists.
  // יום בלי gdate ממופתח לפי snapId — התאמה לפי gdate ריק הייתה בוחרת סנאפשוט שגוי.
  var snap = ARCHIVE.find(function(s){
    return isLive(s) && (d.gdate ? s.gdate === d.gdate : (d.snapId != null && idEq(s.id, d.snapId)));
  });
  if (snap) {
    snap.entries = snap.entries || [];
    snap.entries.unshift(newEntry);
    snap.count = liveOnly(snap.entries).length;
    recTouch(snap);
    saveArchive();
  } else {
    // הוספה ל-ENTRIES החיים
    ENTRIES.unshift(newEntry);
    saveEntries();
  }
  renderArcDetail();
}

function renderArchive() {
  // מאתחל את תצוגת הארכיון ברמת השנה, עם השנה הנוכחית כברירת מחדל
  var nowYM = getNowHebYM();
  arcSelYear = nowYM.year || null;
  arcSelMonth = null;
  arcSelDayKey = null;
  arcEditMode = false;

  // מציג את פאנל השנים ומסתיר את השאר
  arcShowLevel("years");

  renderArcYears();
  renderArcBreadcrumb();

  // ירידה אוטומטית לשנה הנוכחית
  if (arcSelYear) {
    arcGoMonths(arcSelYear);
    // ירידה אוטומטית לחודש הנוכחי
    if (nowYM.month) {
      arcGoDays(arcSelYear, nowYM.month);
    }
  }
}


function exportArchivePDF(id) {
  var snap = ARCHIVE.find(function(s){ return idEq(s.id, id); });

  var savedEntries = ENTRIES;

/*  ⛔ בסיס אחד לכל משיכה גולמית מהריפו — ⚠️ צרכן אחד לו, מציג טבלת התשתית:

var GITHUB_USER = "ygtotlrl-lab";
var GITHUB_REPO = "yoman-avoda";

// סנכרון חכם: בדיקת חותמת כל 3 שניות (זול), ומשיכת נתונים רק כשהיא השתנתה
var _lastKnownTimestamp = 0;
// מועד הסנכרון המוצלח האחרון — לשורת המצב שבאזור המצב בהגדרות.

function _yaMarkSynced() {

  // היה רעש), אבל **החזרה** כן נאמרת: היא הרגע שבו מה שהמתין מתחיל לעלות.
  if (_yaNetWarned) { _yaNetWarned = false; toast(MSG_SYNC_BACK, null, 'good'); }
  // ⛔ הגיבוי והיומן **אינם** נתלים כאן — ⚠️ שיחה מוצלחת עם הענן היא
  //    פעילות סנכרון, ⭐ ומנגנון בטיחות שרץ רק כשמשהו אחר רץ נעצר בשקט
  //    בדיוק כשאין סנכרון. נקודת ההפעלה שלהם היא `bkBoot()` בעלייה.
}
// ⛔ אין להחזיר לכאן את בדיקת החותמת — ⚠️ היא יושבת במודול
//    המשותף (`PL_CFG` + `plTick`), ⭐ ומה שכאן הוא **המשיכה עצמה**:
//    ⛔ מסלול שני שמכריע מתי למשוך יוצא מסנכרון מול המודול, ⚠️ וזה
//    בדיוק «מקור אמת שני».
async function yaPullFromCloud() {
  /*  ⛔⛔ שער ההקשר של **מסלול הפולינג** — ⚠️ הנימוק המדוד: שער סגר את
   *  `syncFromCloud` ושער את מסלול הדחיפה, ⛔ והמשיכה הזו — שרצה
   *  **כל שלוש שניות** מ-`plTick` — נשארה בלי שער: ⭐ נמדד בדפדפן
   *  שהחלפת מוסד בזמן משיכה בטיסה כתבה רשומת ראשון למפתח
   *  `ya_entries_ramataviv`, ⛔ ומילאה את מפת החותמות בחותמות ראשון
   *  אחרי ש-`yaResetTenantState` כבר איפסה אותה.
   *  ⚠️ וזה מה שדווח מהשטח: הקטגוריות והארכיון מתערבבים בין המוסדות. */
  var _ep = ctxEpoch(), _ls = LS;
  try {
    console.log("[sync] pulling data...");

    // מיזוג ברמת רשומה במקום החלפה מלאה. ההחלפה היא שגרמה לאובדן: מכשיר
    // שדחף blob ישן עם חותמת חדשה יותר מחק כאן עבודה שמכשיר אחר הרגע הקליד.
    /* ⛔ הקריאה מהטבלה בלבד, ⛔ ובלי נפילה-חזרה לערך השלם — ⚠️ השקילות
       נמדדה מול המסד בשני המוסדות, והבלוק חדל להיות רשת ביטחון והפך
       למקור אמת שני. ⛔ וכשל מחזיר «אין ראיה» ⛔ ולא «הענן ריק» — ⚠️ מיזוג
       מול מערך ריק מוחק את מה שלא הספיק לעלות. */
    var _rowsE = await yaRowsGet('ya_entries');
    if (ctxStale(_ep)) { console.warn('[sync] ההקשר התחלף באמצע — המשיכה נעצרה'); return; }
    if (_rowsE.ok) {
      var cloudEntries = _rowsE.data;
      if (Array.isArray(cloudEntries)) {
        ENTRIES = mergeEntries(ENTRIES, cloudEntries);
        ENTRIES.sort(function(a,b){ return entryOrderTs(b) - entryOrderTs(a); });
        lsSetArray("ya_entries"+_ls, ENTRIES, _yaRecTs);
        pullRender(renderLog);
        console.log("[sync] merged, entries=" + liveOnly(ENTRIES).length +
                    " (+" + (ENTRIES.length - liveOnly(ENTRIES).length) + " tombstones)");
      }
    }
    var _rowsA = await yaRowsGet('ya_archive');
    if (ctxStale(_ep)) { console.warn('[sync] ההקשר התחלף באמצע — המשיכה נעצרה'); return; }
    if (_rowsA.ok) {
      hwNoteCloud('ya_archive'+_ls, _rowsA.data);   // ראיה עננית לשער הדיסק
      var cloudArchive = _rowsA.data;
      if (Array.isArray(cloudArchive)) {
        ARCHIVE = mergeArchive(ARCHIVE, cloudArchive);
        lsSetArray("ya_archive"+_ls, hwDiskFilter('ya_archive'+_ls, ARCHIVE), _yaRecTs);
        // הארכיון מוצג רק כשלוחצים על הלשונית — רענון רק אם הוא פתוח כרגע
        var arcPanel = document.getElementById("panel-archive");
        if (arcPanel && !arcPanel.classList.contains("is-hidden") && arcSelDayKey) pullRender(renderArcDetail);
      }
    }
  } catch(e) { _yaNetWarned = true; console.error("[sync] error:", e); }
}

    : '<span class="inf-ico-l" aria-hidden="true">' + esc(String(a).charAt(0)) + '</span>';
  return '<th class="inf-app" title="' + esc(a) + '" aria-label="' + esc(a) + '">' + cellHtml + '</th>';
}
function _infDot(cell) {
  if (cell === '✅') return '<span class="inf-dot ok" title="תקין"></span>';
  if (cell === '⭕') return '<span class="inf-dot gap" title="חסר-מנומק"></span>';
  if (cell === '❌') return '<span class="inf-dot bad" title="לא מטופל"></span>';
  return esc(cell);
}
/*  ⛔ פירוק ה-Markdown לשני החלקים — ⚠️ הטבלה ומימדי הסריקה: ⭐ שניהם
 *  נגזרים מאותו טקסט, ⛔ ואין ביניהם מקור שני.
 *  ⛔ **ואין כאן יותר סיכום כללים** — ⚠️ אין כללים: ⭐ הטבלה
 *  היא ההוראה, ⛔ ופרק שני שמנה סעיפים היה מונה משהו שאינו קיים. */
function _infParse(md) {
  var lines = md.split('\n');
  var cats = [], cur = null, rows = [], apps = null, width = 0;
  for (var i = 0; i < lines.length; i++) {
    var l = lines[i];
    if (l.charAt(0) !== '|') continue;
    var c = _infCells(l);
    /*  ⛔ האפליקציות נגזרות משורת הכותרת — ⚠️ העמודות שבין «מה זה»
     *  ל«הערה»: ⭐ רשימה מוקלדת הייתה מציגה את הקופה תחת «הערה», ⛔ ואפליקציה
     *  שנוספת לטבלה לא הייתה מופיעה כלל. */
    if (c[0] === '#') { apps = c.slice(3, -1); width = c.length; continue; }
    if (!width || c.length !== width) continue;
    /*  ⛔ שורת סדר-הפנים נקלטת לקטגוריה שמעליה ⛔ ואינה נבלעת — ⚠️ היא
     *  אינה שורת נתונים ואינה כותרת, ⭐ ובלי הענף הזה היא נקראה ונזרקה:
     *  ⛔ הקורא היה רואה כותרת בלי הסדר שהיא מצהירה. */
    if (c[0] === '' && cur && c[1].charAt(0) === '↳') {
      cur.order = c[1].slice(1).trim();
      continue;
    }
    /*  ⛔ כותרת הקטגוריה מזוהה בתא המספר הריק ⛔ ולא בהדגשה — ⚠️ הטבלה
     *  נכתבת כטקסט נקי, ⭐ ושורת הסדר כבר נקלטה מעליה. */
    if (c[0] === '') {
      cur = { title: c[1].replace(/\*\*/g, ''), order: '', rows: [] };
      cats.push(cur);
      continue;
    }
    if (!/^\d+$/.test(c[0])) continue;
    var row = { n: Number(c[0]), name: c[1], std: c[2],
                apps: c.slice(3, -1), note: c[c.length - 1] };
    rows.push(row);
    if (!cur) { cur = { title: '—', rows: [] }; cats.push(cur); }
    cur.rows.push(row);
  }
  return { cats: cats, rows: rows, apps: apps || [] };
}
/*  ⛔ הציור נפרד מהפירוק — ⚠️ «פתח/סגור הכל» מצייר מחדש בלי למשוך שוב,
 *  ⭐ והמשיכה נשמרת בזיכרון. */
function _infHtml(d) {
  var h = '<div class="inf">';
  h += '<div class="inf-hd"><b>טבלת התשתית</b>' +
       '<span>' + d.rows.length + ' שורות · נמשך מ-GitHub בזמן אמת</span></div>';

  h += '<div class="inf-card"><h4>הטבלה</h4>' +
       '<div class="inf-bar"><button data-act="inf-all" data-open="1">פתח הכל</button>' +
       '<button data-act="inf-all" data-open="0">סגור הכל</button>' +
       '<span class="inf-tag"><span class="inf-dot ok"></span> תקין</span>' +
       '<span class="inf-tag"><span class="inf-dot gap"></span> חסר-מנומק</span>' +
       '<span class="inf-tag"><span class="inf-dot bad"></span> לא מטופל</span></div>';
  d.cats.forEach(function (c) {
    h += '<details class="inf-cat"' + (window._infOpen ? ' open' : '') + '>' +
         '<summary>' + esc(c.title) + ' — ' + c.rows.length + '</summary>' +
         (c.order ? '<div class="inf-ord">↳ ' + _infMd(c.order) + '</div>' : '') +
         '<div class="inf-wrap"><table class="inf-tbl">' +
         '<colgroup><col class="c-n"><col class="c-t"><col class="c-s">' +
         d.apps.map(function () { return '<col class="c-a">'; }).join('') +
         '<col class="c-r"></colgroup><thead><tr><th>#</th><th>כותרת</th><th>התקן</th>' +
         d.apps.map(_infAppTh).join('') +
         '<th>הערה</th></tr></thead><tbody>';
    c.rows.forEach(function (r) {
      h += '<tr><td>' + r.n + '</td><td>' + _infMd(r.name) + '</td><td>' + _infMd(r.std) + '</td>' +
           r.apps.map(function (a) { return '<td class="inf-app">' + _infDot(a) + '</td>'; }).join('') +
           '<td>' + _infMd(r.note) + '</td></tr>';
    });
    h += '</tbody></table></div></details>';
  });
  h += '</div>';
  h += '</div>';
  return h;
}
window._infData = null;
window._infOpen = false;
async function yaInfraOpen() {
