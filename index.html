<title>יומן עבודה</title>
<!-- מזהה גרסה מפורש — חובה לקדם בכל שינוי קוד (יחד עם CACHE_NAME ב-sw.js).
     יושב כאן בראש הקובץ כדי שבדיקת העדכון תקרא רק את ה-KB הראשונים ולא ~950KB. -->
<meta name="app-version" content="73-2026-09-03-90b">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E6FBF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="יומן עבודה">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<script>
// ═══ באנר עדכון יחיד ═══
// היו שני באנרים במקביל: זה (תחתון, קטן) מ-updatefound של ה-service worker,
// והעליון ברוחב מלא (id="updateBanner") מבדיקת הגרסה השעתית מול raw GitHub —
// ושניהם הופיעו יחד. עכשיו יש ממשק אחד, window.showAppUpdateBanner(version),
// ושני מנגנוני הזיהוי מפעילים אותו. שניהם נשמרו: בדיקת ה-raw חיונית ל-APK.
(function() {
  var userAccepted = false;
  var reloaded = false;
  var swReg = null;                       // נקבע כשה-service worker נרשם (אם בכלל)
  var DISMISS_KEY = 'tb_dismissed_version';

  function doReload() {
    if (reloaded) return;
    reloaded = true;
    location.reload();
  }

  // version — הגרסה המרוחקת מבדיקת ה-raw; חסר כשהזיהוי הגיע מה-service worker
  // (ואז אין גרסה שאפשר לזכור ב-tb_dismissed_version).
  window.showAppUpdateBanner = function(version) {
    var exist = document.getElementById('sw-update-banner');
    if (exist) {
      // עותק אחד בלבד. אם הבאנר כבר מוצג ורק עכשיו נודעה הגרסה — לזכור אותה,
      // כדי שה-✕ ישתיק את הבדיקה השעתית על הגרסה הזו.
      if (version) exist._updVersion = version;
      return;
    }
    if (!document.body) return;
    var bar = document.createElement('div');
    bar.id = 'sw-update-banner';
    bar._updVersion = version || null;
    bar.setAttribute('dir', 'rtl');
    bar.style.cssText = 'position:fixed;bottom:70px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#1E6FBF,#0D4A8A);color:#fff;padding:10px 16px;border-radius:26px;box-shadow:0 6px 24px rgba(0,0,0,.28);z-index:10001;font-family:Heebo,sans-serif;font-size:13px;font-weight:700;max-width:92vw';
    var txt = document.createElement('span');
    txt.textContent = '🔄 גרסה חדשה זמינה';
    var btn = document.createElement('button');
    btn.textContent = 'עדכן עכשיו';
    btn.style.cssText = 'background:#fff;color:#1E6FBF;border:none;border-radius:20px;padding:7px 16px;font-family:Heebo,sans-serif;font-size:12px;font-weight:700;cursor:pointer';
    btn.onclick = function() {
      userAccepted = true;
      btn.disabled = true;
      btn.textContent = 'מעדכן...';
      // א. יש worker ממתין — לבקש ממנו להשתלט, ואז לטעון מחדש
      if (swReg && swReg.waiting) {
        swReg.waiting.postMessage({type: 'SKIP_WAITING'});
        setTimeout(doReload, 1500);
        return;
      }
      // ב. הזיהוי הגיע מבדיקת הגרסה — לבקש עדכון SW ולטעון מחדש בכל מקרה.
      // ה-SW הוא network-first, ולכן הטעינה מביאה את הקובץ החדש גם בלי SW חדש.
      if (swReg && typeof swReg.update === 'function') {
        setTimeout(doReload, 3000);       // גיבוי קשיח — לא להישאר תקוע על "מעדכן..."
        try {
          swReg.update().then(function() {
            if (swReg.waiting) swReg.waiting.postMessage({type: 'SKIP_WAITING'});
            setTimeout(doReload, 800);
          }, doReload);
          return;
        } catch (e) { /* נופלים ל-doReload שלמטה */ }
      }
      doReload();
    };
    var close = document.createElement('button');
    close.textContent = '✕';
    close.setAttribute('aria-label', 'סגור');
    close.style.cssText = 'background:none;border:none;color:rgba(255,255,255,.7);font-size:15px;cursor:pointer;padding:0 2px;font-family:Heebo,sans-serif;line-height:1';
    close.onclick = function() {
      // dismiss — לזכור את הגרסה שנדחתה כדי לא להציק עליה שוב
      if (bar._updVersion) {
        if (window.lsSet) window.lsSet(DISMISS_KEY, bar._updVersion);
      }
      if (bar.parentNode) bar.parentNode.removeChild(bar);
    };
    bar.appendChild(txt); bar.appendChild(btn); bar.appendChild(close);
    document.body.appendChild(bar);
  };

  if (!('serviceWorker' in navigator)) return;   // בדיקת ה-raw עדיין עובדת

  window.addEventListener('load', function() {
    // מטפל ה-install של ה-service worker קורא ל-skipWaiting() מעצמו, ולכן
    // controllerchange נורה בכל עדכון גם בלי הסכמת המשתמש — והשומר שלמטה
    // הוא מה שמונע רענון אוטומטי באמצע העבודה.
    navigator.serviceWorker.addEventListener('controllerchange', function() {
      if (!userAccepted || reloaded) return;
      reloaded = true;
      location.reload();
    });

    navigator.serviceWorker.register('./sw.js').then(function(reg) {
      console.log('SW registered:', reg.scope);
      swReg = reg;

      if (reg.waiting && navigator.serviceWorker.controller) { window.showAppUpdateBanner(); }

      reg.addEventListener('updatefound', function() {
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function() {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            window.showAppUpdateBanner();
          }
        });
      });

      function checkForSwUpdate() {
        try { reg.update().catch(function() {}); } catch (e) {}
      }
      checkForSwUpdate();
      setInterval(checkForSwUpdate, 30 * 60 * 1000);
    }).catch(function(err) {
      console.log('SW registration failed:', err);
    });
  });
})();


</script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

:root {
  /*  ⛔ מרחק הטוסט מתחתית המסך — ⚠️ הערך היחיד שנבדל בשכבת הטוסט:
   *  אין סרגל תחתון קבוע. */
  --toast-bottom:26px;

  --primary:#1E6FBF; --primaryl:#3A8FDF; --primaryd:#0D4A8A;
  --accent:#F0A500; --accentl:#FFB930; --accentd:#C07800;
  --bg:#F0F4FA; --bgsec:#E4EBF5; --bgcard:#FFFFFF;
  --text:#1A2540; --textmid:#4A5A7A; --textlite:#8A9ABB;
  --border:#D0DAF0; --success:#1A9A5A; --shadow:rgba(30,60,120,0.10);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Heebo',sans-serif;background:var(--bg);min-height:100vh;color:var(--text);}
.app{max-width:960px;margin:0 auto;padding:14px;}

/* כותרת עליונה */
/* ⛔ גובה הכרטיס קבוע ⛔ ואינו נגזר מהתוכן — ⚠️ מעטפת אנדרואיד מגדילה
   טקסט («font boosting»), ⭐ וכרטיס שגובהו נגזר מהתוכן יוצא שם בגובה אחר
   מזה שנמדד בדפדפן: ⛔ הגובה הקבוע הוא מה שהופך את הכותרת לצפויה. */
.hdr{background:linear-gradient(135deg,var(--primary) 0%,#1558a0 100%);border-radius:20px;padding:0;margin-bottom:20px;
  border:none;box-shadow:0 6px 28px rgba(21,88,160,0.35);display:flex;flex-direction:column;height:180px;overflow:hidden;}
/* ⛔ הלוגו ממורכז לגוש הטקסט ⛔ ולא לגובה הכרטיס — ⚠️ שורת «יחי» יושבת
   מתחת לשורה הזו, ⭐ ולוגו שממורכז לכרטיס כולו צף מעל הטקסט שלצידו. */
.hdr-top{flex:1;display:flex;align-items:center;min-height:0;}
.hdr-logo-wrap{padding:0 18px;display:flex;align-items:center;justify-content:center;}
/* ⛔ הסטה של 2% למעלה ⛔ ואינה מספר פיקסלים — ⚠️ איזון אופטי: העין תופסת
   מרכז מעט גבוה מהחישוב, ⭐ והאחוז נגזר מגובה הלוגו ונע איתו. */
.hdr-logo{width:88px;height:88px;object-fit:contain;border-radius:8px;background:white;padding:3px;
  transform:translateY(-2%);}
/* ⛔ הלוגו יושב בתוך כפתור אמיתי ⛔ ולא נושא `role="button"` — ⚠️ מסלול
   הפעלה אחד לעכבר ולמקלדת, ⭐ ובלי מאזין `keydown` שני לצד הדלגציה. */
.hdr-logo-btn{background:none;border:none;padding:0;cursor:pointer;display:block;line-height:0;}
.hdr-logo-btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:10px;}

/* מסך בחירת הישיבה — ⛔ צבעיו הם צבעי האייקון ⛔ ואינם ערכים שנבחרו כאן:
   ⚠️ מקור האמת הוא בלוק `APP` שב-`gen-icons.mjs` — `bg.start` · `bg.end`
   · `ink` · והזווית שנגזרת מ-`bg.p1`/`bg.p2`, ⭐ ומוטיב הפסים הוא
   `mark.shapes` אות באות. ⛔ מי שמשנה ערך כאן בלי לשנות שם מייצר מקור
   שני לאותו צבע, והשער משווה את חמשת הערכים. ⚠️ ואין כאן `--primary`
   ו-`--bg` של פנים האפליקציה: ⛔ הם הכחול הבהיר, ⭐ והם אינם גוון האייקון. */
#yeshivaSelect{position:fixed;inset:0;z-index:10000;
  background:linear-gradient(141deg,#2A4E8C 0%,#0E2145 100%);
  color:#F7F4EB;display:flex;align-items:center;justify-content:center;
  font-family:'Heebo',sans-serif;direction:rtl;padding:24px;overflow:auto;}
.ys-pick-card{width:100%;max-width:420px;text-align:center;}
.ys-pick-mark{width:112px;height:110px;display:block;margin:0 auto 18px;fill:#F7F4EB;}
/* ⛔ ה-`padding` הוא בדיוק המקום ששתי השורות שירדו תפסו — ⚠️ נמדד בדפדפן:
   11+6 מעל ו-10+15.4 מתחת; ⭐ ולכן הכותרת נשארת באותה נקודה בדיוק, ⛔ ואין
   להחליפו ב-`margin` — הוא היה נבלע במרווח של «בחר ישיבה» שמתחתיו */
.ys-pick-h1{font-family:'Frank Ruhl Libre',serif;font-size:34px;font-weight:900;
  letter-spacing:1px;line-height:1;margin:0;padding:17px 0 25.4px;}
.ys-pick-lead{font-size:13px;font-weight:700;opacity:0.7;margin:26px 0 12px;}
.ys-pick-btns{display:flex;flex-direction:column;gap:12px;}
/* ⚠️ הכפתור שקוף על הגרדיאנט ⛔ ואינו לבן מלא — ⭐ מסגרת בדיו היא אותו
   מוטיב של הפסים, ⛔ ומשטח לבן היה מכניס גוון שלישי למסך. */
.ys-pick-btn{padding:17px;font-family:'Heebo',sans-serif;font-size:18px;font-weight:800;
  color:#F7F4EB;background:rgba(247,244,235,0.08);border:2px solid rgba(247,244,235,0.45);
  border-radius:14px;cursor:pointer;transition:background 0.18s,border-color 0.18s;}
.ys-pick-btn:hover{background:rgba(247,244,235,0.18);border-color:#F7F4EB;}
.ys-pick-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
/* ⛔ המרווח הוא מה שמפריד בין בחירה לקריאה — ⚠️ כפתור שלישי צמוד נקרא
   כישיבה שלישית, ⭐ והקו מעליו הוא הגבול. */
.ys-pick-aside{margin-top:26px;padding-top:18px;border-top:1px solid rgba(247,244,235,0.18);}
/* ⚠️ מובחן משני הכפתורים שמעליו בגודל ובעובי המסגרת ⛔ ולא בצבע — ⭐ גוון
   שלישי על הגרדיאנט היה שובר את המוטיב. */
.ys-pick-alt{padding:11px 18px;font-family:'Heebo',sans-serif;font-size:14px;font-weight:700;
  color:#F7F4EB;background:transparent;border:1px dashed rgba(247,244,235,0.4);
  border-radius:11px;cursor:pointer;transition:background 0.18s,border-color 0.18s;}
.ys-pick-alt:hover{background:rgba(247,244,235,0.10);border-color:rgba(247,244,235,0.75);}
.ys-pick-alt:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
.hdr-mid{flex:1;min-width:0;text-align:center;padding:0 12px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.hdr-bh{font-size:10px;color:rgba(255,255,255,0.6);letter-spacing:4px;margin-bottom:4px;}
.hdr-title-wrap{position:relative;display:inline-block;padding-bottom:8px;}
.hdr-h1{font-family:'Frank Ruhl Libre',serif;font-size:28px;font-weight:900;color:#FFFFFF;letter-spacing:1px;line-height:1;}

.hdr-title-wrap::after{content:none;}
/* ⛔ הכתובית בשורה אחת ⛔ ואינה נשברת — ⚠️ שם המוסד שנשבר לשתיים מזיז
   את גוש הטקסט שהלוגו ממורכז אליו, ⭐ ומקצר את הכרטיס במסך צר בלבד. */
.hdr-sub{font-size:10px;color:rgba(255,255,255,0.6);margin-top:8px;letter-spacing:0.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
/* ⛔ הקו מפריד את «יחי» מגוש הכותרת ⛔ ואינו קישוט — ⚠️ הרכיב שישב כאן
   הוסר והשאיר חלל שנראה כטעות, ⭐ והקו הוא מה שהופך אותו לגבול. */
.hdr-div{height:1px;background:rgba(255,255,255,0.22);margin:0 22px;}
.hdr-yechi{padding:9px 20px 12px;font-size:11px;font-weight:800;color:rgba(255,255,255,0.9);
  letter-spacing:0.3px;line-height:1.4;text-align:center;}
/* ⛔ במסך צר הכתובית מתכווצת ⛔ ואינה נחתכת — ⚠️ נמדד שב-320px חסרו לה
   39px, ⭐ ושם מוסד שנחתך בשלוש נקודות גרוע משם מוסד קטן בפיקסל. */
@media (max-width:359px){ .hdr-sub{font-size:8px;letter-spacing:0;} .hdr-logo-wrap{padding:0 12px;} }
/* ⛔ במסך רחב יש **מרכז אחד** לכרטיס ⛔ ולא שניים — ⚠️ הכותרת מרוכזת עד
   כאן לחלל שנשאר אחרי הלוגו ושורת «יחי» לכרטיס כולו, ⭐ ושני מרכזים במרחק
   של עשרות פיקסלים נקראים כטעות. ⛔ הלוגו יוצא מהזרימה ונצמד לפינה, ⛔ ולא
   מוקטן: ⚠️ הוא נשאר ממורכז לגוש הטקסט ולא לכרטיס.
   ⛔ **ובמובייל אין לגעת** — ⚠️ שם הלוגו תופס אחוז גדול מהרוחב, ⭐ ומרכוז
   לכרטיס היה מציב את הכותרת מתחתיו. ⛔ והסף נמדד: ב-700px רוחב הטקסט
   ורוחב הלוגו אינם נוגעים. */
@media (min-width:700px){
  .hdr-top{position:relative;}
  .hdr-logo-wrap{position:absolute;top:0;bottom:0;right:0;}
  .hdr-mid{padding:0 18px;}
}

/* ניווט לעומק בארכיון */
.arc-btn{background:var(--bgcard);border:2px solid var(--border);border-radius:12px;padding:10px 14px;
  font-family:'Heebo',sans-serif;font-size:13px;font-weight:700;color:var(--text);cursor:pointer;
  transition:all 0.18s;box-shadow:0 2px 6px var(--shadow);text-align:center;min-width:70px;}
.arc-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--bgsec);}
.arc-btn.active{background:var(--primary);color:white;border-color:var(--primary);box-shadow:0 4px 12px rgba(30,111,191,0.3);}

.arc-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
.arc-crumb{font-size:12px;color:var(--textmid);cursor:pointer;padding:3px 8px;border-radius:6px;
  background:var(--bgsec);border:1px solid var(--border);transition:all 0.15s;}
.arc-crumb:hover{background:var(--primary);color:white;border-color:var(--primary);}
.arc-crumb-sep{color:#bbb;font-size:12px;}
.arc-day-card{background:var(--bgsec);border-radius:12px;padding:14px;margin-bottom:10px;border:1.5px solid var(--border);}
.arc-day-card.editing{border-color:var(--accent);background:#fffdf5;}
.arc-entry-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--border);font-size:12px;}
.arc-entry-del{background:none;border:none;color:#ddd;cursor:pointer;font-size:14px;padding:0 4px;line-height:1;flex-shrink:0;}
.arc-entry-del:hover{color:#cc3333;}

/* לשוניות */
.tabs{display:flex;gap:6px;margin-bottom:12px;}
.tab-btn{flex:1;background:var(--bgcard);color:var(--textmid);border:2px solid var(--border);
  border-radius:11px;padding:10px;font-family:'Heebo',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;box-shadow:0 2px 6px var(--shadow);}
.tab-btn:hover{background:var(--bgsec);color:var(--primary);border-color:var(--primary);}
.tab-btn.active{background:var(--primary);color:white;border-color:var(--primary);box-shadow:0 4px 12px rgba(30,111,191,0.3);}

/* כרטיס */
.card{background:var(--bgcard);border-radius:16px;padding:18px;margin-bottom:12px;
  box-shadow:0 2px 12px var(--shadow);border:1.5px solid var(--border);}
.card-ttl{font-family:'Frank Ruhl Libre',serif;font-size:15px;font-weight:700;color:var(--primary);margin-bottom:12px;display:flex;align-items:center;gap:7px;}
.card-ttl::before{content:"▸";color:var(--accent);font-size:13px;}

/* תאריך */
.date-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.date-lbl{font-size:11px;font-weight:700;color:var(--textmid);white-space:nowrap;}
.day-chips{display:flex;gap:4px;flex-wrap:wrap;}
.day-chip{background:var(--bgsec);color:var(--textmid);border:1.5px solid var(--border);border-radius:7px;padding:5px 10px;font-size:11px;
  font-family:'Heebo',sans-serif;font-weight:700;cursor:pointer;transition:all 0.2s;white-space:nowrap;}
.day-chip:hover{background:var(--primaryl);color:white;border-color:var(--primaryl);}
.day-chip.active{background:var(--primary);color:white;border-color:var(--primary);box-shadow:0 2px 8px rgba(30,111,191,0.3);}
.heb-inp{border:1.5px solid var(--border);border-radius:9px;padding:6px 11px;font-family:'Frank Ruhl Libre',serif;font-size:14px;
  font-weight:700;background:white;direction:rtl;min-width:155px;flex:1;color:var(--text);}
.heb-inp:focus{outline:none;border-color:var(--primary);}

/* רשת הקטגוריות */

/* ══════════════════════════════════════════════════════════════════════════
   מציג טבלת התשתית — פרטי ליומן
   ══════════════════════════════════════════════════════════════════════════
   ⛔ אין לו שורה בטבלת התשתית — ⚠️ הוא אינו יכולת תשתיתית אלא מסך תצוגה
   של האפליקציה הזו, ⭐ ולוגיקה עסקית אינה נכנסת לטבלה.
   ⛔ והתוכן נמשך בזמן אמת ⛔ ואינו מוטבע — ⚠️ עותק בקוד היה מקור אמת שני,
   ⭐ ומי שקורא אותו רואה את הטבלה של הסבב שבו הוא נכתב. */
#modal:has(.inf) .sheet{max-width:min(1180px,96vw)}
.inf{font-family:'Heebo',sans-serif;color:var(--text)}
.inf-hd{background:linear-gradient(135deg,var(--primary) 0%,#1558a0 100%);color:#fff;
  border-radius:14px;padding:14px 16px;margin-bottom:14px}
.inf-hd b{font-size:15px;font-weight:800;display:block}
.inf-hd span{font-size:12px;opacity:.85}
.inf-card{background:#fff;border:1px solid var(--border);border-radius:14px;
  box-shadow:0 2px 10px var(--shadow);padding:12px 14px;margin-bottom:14px}
.inf-card>h4{font-size:14px;font-weight:800;margin-bottom:10px;color:var(--primaryd)}
.inf-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.inf-bar button{font:inherit;font-size:12px;font-weight:700;padding:5px 12px;border-radius:8px;
  border:1px solid var(--border);background:var(--bgsec);color:var(--text);cursor:pointer}
.inf-cat{border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden}
.inf-cat>summary{cursor:pointer;list-style:none;padding:8px 12px;background:var(--bgsec);
  font-weight:800;font-size:13px;color:var(--primaryd)}
.inf-cat>summary::-webkit-details-marker{display:none}
.inf-wrap{overflow-x:auto}
.inf-tbl{width:100%;min-width:860px;table-layout:fixed;border-collapse:collapse;font-size:12px}
.inf-tbl th,.inf-tbl td{border-top:1px solid var(--border);padding:6px 8px;
  vertical-align:top;text-align:right;line-height:1.6;overflow-wrap:anywhere}
.inf-tbl th{background:var(--bgsec);font-weight:800;font-size:11.5px;color:var(--textmid)}
.inf-tbl col.c-n{width:44px}.inf-tbl col.c-t{width:170px}.inf-tbl col.c-s{width:auto}
.inf-tbl col.c-a{width:56px}.inf-tbl col.c-r{width:210px}
.inf-dot{display:inline-block;width:11px;height:11px;border-radius:50%}
.inf-dot.ok{background:#1A9A5A}.inf-dot.gap{background:#F0A500}.inf-dot.bad{background:#D33}

.inf-li{border-top:1px solid var(--border);padding:7px 2px;font-size:12px;line-height:1.7}
.inf-li:first-child{border-top:0}
.inf-li b{color:var(--primaryd)}
.inf-tag{display:inline-block;background:var(--bgsec);border-radius:6px;padding:1px 7px;
  font-size:11px;font-weight:700;margin-inline-start:4px}
.inf-err{background:#fff4f4;border:1px solid #e7b4b4;border-radius:12px;padding:14px;
  font-size:13px;color:#8a2b2b;line-height:1.8}

/* ═══ שכבת הטוסט — CSS משותף (סבב 87ב) ════════════════════════════════════
   זהה בית-לבית בארבע האפליקציות. ⛔ הכללים אינם נשענים על משתני-הצבע של
   אף אפליקציה — ⚠️ הם נבדלים ביניהן, ⭐ ולכן הצבעים כתובים במפורש.
   ⛔ מיכל אחד ובתוכו `div` לכל הודעה — ⚠️ הנימוק המדוד: בשלוש מהן היה
      אלמנט **קבוע** אחד, ⛔ והודעה שנייה דרסה את הראשונה: ⭐ «נשמר»
      ו«שגיאת רשת» ברצף השאירו על המסך אחת בלבד.
   ⛔ ו-`--toast-bottom` הוא הערך היחיד שנבדל — ⚠️ לשתיים מהן יש סרגל
      תחתון קבוע, ⭐ ולטוסט שיושב מתחתיו אין מי שיראה אותו. */
#toasts{position:fixed;inset-inline:0;bottom:calc(var(--toast-bottom) + env(safe-area-inset-bottom));z-index:999;display:grid;gap:8px;justify-items:center;pointer-events:none;padding:0 14px}
.toast{background:#1a1a1a;color:#fff;border-radius:99px;padding:10px 20px;font-size:.86rem;font-weight:600;line-height:1.45;box-shadow:0 6px 20px rgba(0,0,0,.22);max-width:92vw;text-align:center;animation:toastUp .2s ease-out}
.toast.bad{background:#b91c1c;color:#fff}
.toast.good{background:#15803d;color:#fff}
@keyframes toastUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* ═══ סוף CSS שכבת הטוסט ════════════════════════════════════════════════ */
/* ═══ אזור מצב — CSS משותף (סבב 15/17) ══════════════════════════════════
   זהה בית-לבית בארבע האפליקציות. שני הרכיבים שיושבים בתחתית כל מסך
   הגדרות: בלוק "☁️ סנכרון" ורכיב "מידע טכני ›". הכללים לא נשענים על
   משתני-הצבע של אף אפליקציה (הם נבדלים ביניהן) אלא יורשים צבע וגופן. */

.sync-line{font-size:13px;line-height:1.8;margin-top:10px;padding-top:8px;border-top:1px solid rgba(0,0,0,.08)}

.sync-line button[disabled]{opacity:.5;cursor:default}

  </div>

  <!-- ENTRY -->
  <div class="panel" id="panel-entry" style="display:block">
    <div class="card">
      <div class="card-ttl">תאריך ויום</div>
      <div class="date-row">
        <span class="date-lbl">יום:</span>
        <div class="day-chips">
          <button class="day-chip" data-act="pick-day" data-day="יום ראשון">ראשון</button>
          <button class="day-chip" data-act="pick-day" data-day="יום שני">שני</button>
          <button class="day-chip" data-act="pick-day" data-day="יום שלישי">שלישי</button>
          <button class="day-chip" data-act="pick-day" data-day="יום רביעי">רביעי</button>
          <button class="day-chip" data-act="pick-day" data-day="יום חמישי">חמישי</button>
          <button class="day-chip" data-act="pick-day" data-day="ערב שבת">ערב שבת</button>
          <button class="day-chip" data-act="pick-day" data-day="מוצאי שבת">מוצ"ש</button>
        </div>
        <!-- ⛔ תאריך עברי נשאר טקסט חופשי (סבב 67) — אין בורר תאריך עברי
             מקורי בדפדפן, ואין לו inputmode או pattern שמתארים אותו;
             ⚠️ הערך נגזר ממילא מ-gregDateInput דרך hebrewDate(). -->
        <input aria-label="תאריך עברי" class="heb-inp" id="hebDateInput" type="text" autocomplete="off" placeholder="תאריך עברי..." />
        <!-- ⛔ בלי inputmode בכוונה (סבב 67) — הפורמט המתקבל הוא dd/mm/yyyy או
             yyyy-mm-dd, ומקלדת המספרים של iOS אינה מציעה «/» ולא «-»;
             ⚠️ ה-pattern הוא רמז הצורה, וההכרעה נשארת ב-onGregDateChange
             שנכשל-סגור על כל קלט שאינו תואם לאחת משתי התבניות. -->
        <input aria-label="תאריך לועזי" class="heb-inp" id="gregDateInput" type="text" pattern="\d{1,2}/\d{1,2}/\d{4}|\d{4}-\d{2}-\d{2}" autocomplete="off" placeholder="תאריך לועזי..." style="min-width:130px;" oninput="onGregDateChange()" />
      </div>
    </div>

    <div class="card">
      <div class="card-ttl">קטגוריה ומשימה</div>
      <div class="cat-grid" id="catGrid"></div>
      <div class="qsec">
        <div class="qlbl">משימה</div>
        <div class="qrow" id="taskBtns"><span class="hint">בחר קטגוריה...</span></div>
      </div>
      <div class="qsec">
        <div class="qlbl">תת-משימה</div>
        <div class="qrow" id="subBtns"><span class="hint">בחר משימה...</span></div>
      </div>
      <div class="inp-grid">
        <div class="fld"><label for="taskInput">משימה (ידנית)</label><input id="taskInput" type="text" placeholder="הקלד..." /></div>
        <div class="fld"><label for="subInput">תת-משימה / פרטים</label><input id="subInput" type="text" placeholder="פרטים..." /></div>
      </div>
      <div class="inp-grid">
        <div class="fld"><label for="notesInput">הרחבה / הערות</label><input id="notesInput" type="text" placeholder="הערות..." /></div>
        <div class="fld"><label for="countInput">כמות</label><input id="countInput" type="text" inputmode="numeric" autocomplete="off" placeholder="1" /></div>
      </div>
      <button class="btn-add" id="btn-add-entry"
        ontouchstart="this.classList.add('btn-flash')"
        ontouchend="addEntry(); var s=this; setTimeout(function(){s.classList.remove('btn-flash');},500); event.preventDefault();"
        data-act="add-entry">+ הוסף לסדר היום</button>

    </div>
  </div>

  <!-- LOG -->
  <div class="panel" id="panel-log" style="display:none">
    <div class="card">
      <div class="log-hd">
        <div class="card-ttl" style="margin:0">רשומות יומן</div>

      </div>
      <div id="logList"><div class="empty">📋<br>עוד אין רשומות</div></div>
      <div class="exp-row">
        <button class="btn-sm btn-red" data-act="clear-all">🗑 נקה</button>
        <span id="outputBtnSlot"></span>
      </div>
    </div>
  </div>

  <!-- SETTINGS -->
  <div class="panel" id="panel-settings" style="display:none">
    <div class="card">
      <div class="card-ttl">עריכת קטגוריות ומשימות</div>
      <div id="settingsEditor"></div>
      <button class="btn-save" data-act="save-settings">💾 שמור שינויים</button>
    </div>
    <!-- אזור מצב (סבב 17) — שני האלמנטים האחרונים במסך, בסדר הזה -->
    <div id="sync-status-box"></div>
    <div id="tech-info-box"></div>
  </div>

  <!-- ARCHIVE -->
  <div class="panel" id="panel-archive" style="display:none">
    <div class="card">

      <div id="arc-breadcrumb" style="display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap;min-height:28px;"></div>

      <!-- Level: months -->
      <div id="arc-months" style="display:none"></div>
      <!-- Level: days -->
      <div id="arc-days" style="display:none"></div>
      <!-- Level: day detail / edit -->
      <div id="arc-detail" style="display:none"></div>
    </div>
  </div>

</div>

   מתי ומה פונה. נשמר קצר בכוונה (12 רשומות) כדי שהיומן עצמו לא יהפוך
   לצרכן מקום. הכתיבה כאן גולמית ולא דרך `lsSet` — אחרת כישלון ביומן היה

// שמות הזריקה משתנים בין דפדפנים; code 22 הוא הישן, 1014 הוא של פיירפוקס.

/* ── באנר כישלון קבוע ───────────────────────────────────────────────────
   טוסט נעלם אחרי שלוש שניות; כישלון שמירה חייב להישאר על המסך עד שהמשתמש

    el.setAttribute('role', 'alert');
    el.style.cssText = 'position:fixed;z-index:2147483000;left:0;right:0;top:0;background:#b3261e;' +
      'color:#fff;direction:rtl;text-align:center;font:700 14px/1.6 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;' +
      'padding:12px 46px;box-shadow:0 2px 14px rgba(0,0,0,.35)';

    var b = document.createElement('button');

    b.style.cssText = 'position:absolute;right:10px;top:9px;background:transparent;border:0;color:#fff;' +
      'font:700 17px/1 sans-serif;cursor:pointer;padding:4px 8px';

/* ── כתיבה מוגנת ────────────────────────────────────────────────────────
   **כל כתיבה ל-localStorage באפליקציה עוברת דרך כאן.** אין קריאה ישירה
   ל-`localStorage.setItem` מחוץ למודול הזה (למעט `lsSetRaw` שבתוכו).
   מחזירה true/false — ומסלול קריטי שמתעלם מהערך המוחזר הוא באג. */

/* "אף כישלון שקט" — מונה כישלונות גלובלי.
   מסלול קריטי (רישום נוכחות, שמירת תשלום, הוספת רשומה, רישום תנועה) עוטף את
   הפעולה כך:  `var t = lsFails(); ...await save()...; if (!lsOkSince(t)) return;`
   ורק אז מציג "נשמר". כך גם כתיבה שנכשלה עמוק בתוך שרשרת async מונעת את טוסט

   נקודת אכיפה **אחת** במקום עשרות בדיקות פזורות שאפשר לשכוח באחת: `toast()`
   של כל אפליקציה פותחת ב-`if (!lsGuardToast(msg)) return;`, וכל הודעה
   שמתחילה ב-✅ נבלעת אם כתיבה מקומית נכשלה בשתי וחצי השניות האחרונות —
   כלומר בתוך אותה פעולת משתמש. הבאנר האדום כבר על המסך, והוא ההודעה
   הנכונה. **אין להסיר את השורה הזו מ-`toast`** — בלעדיה חוזר בדיוק המצב
   שהסבב הזה בא למנוע: כתיבה שנכשלה ומשתמש שמקבל "נשמר בהצלחה". */
var _lsLastFailAt = 0;

  return !(String(msg == null ? '' : msg).indexOf('✅') === 0 && lsSuccessBlocked());
}
function lsSet(key, value) {

    // בתוך פינוי — כישלון הוא תוצאה, לא טריגר לפינוי נוסף (רקורסיה).
    if (_lsSweeping) return false;
    _lsFailCount++;
    _lsLastFailAt = Date.now();
    if (lsIsQuotaErr(e)) {
      // מנגנון חירום: פינוי נוסף לפי **אותו סדר** בדיוק, וניסיון אחד נוסף.
      var need = lsEntryBytes(key, v) + 64 * 1024;
      var freed = lsSweepGuarded('חירום — כתיבה נכשלה במכסה: ' + key, need);
      if (freed > 0) {
        // הצליח בניסיון השני — לא כישלון. המונה מוחזר כדי שהמסלול הקריטי
        // יציג "נשמר", שהרי הנתון באמת נשמר.
        try { localStorage.setItem(key, v); _lsFailCount--; _lsLastFailAt = 0; lsLog('כתיבה חוזרת הצליחה', key, 0); return true; }
        catch (e2) { e = e2; }
      }
      lsLog('❌ כתיבה נכשלה (מכסה)', key, lsEntryBytes(key, v));
      lsAlert(MSG_LS_FULL);
      lsToastThrottled(MSG_LS_FULL);
    } else {
      lsLog('❌ כתיבה נכשלה (אחסון חסום)', key, 0);
      lsAlert(MSG_LS_BLOCK);
      lsToastThrottled(MSG_LS_BLOCK);

// הבאנר אידמפוטנטי ולכן מוצג בכל כישלון; הטוסט מווסת כדי שסדרת כתיבות
// כושלת לא תהפוך למטר טוסטים שמסתיר את ההודעה עצמה.

    var v = localStorage.getItem(key);

/* ── אופק הפינוי ────────────────────────────────────────────────────────
   פינוי שלב ב׳ גורע רשומות ישנות מהעותק **שעל הדיסק** בלבד. כדי שהן לא
   יחזרו לדיסק בשמירה הבאה (מנוע המיזוג מחזיר כל רשומה מרוחקת שאין לה
   מקבילה מקומית — ולכן פינוי בלי אופק הוא חסר משמעות), נשמר לכל מפתח
   "אופק": חותמת הזמן של הרשומה החדשה ביותר שפונתה. `lsSetArray` מסננת
   מתחתיו בכל כתיבה. **הזיכרון והענן לא נוגעים** — רק הדיסק מצטמצם. */

  var v = parseInt(lsGet(LS_CFG.hzPrefix + key, '0'), 10);
  return isFinite(v) && v > 0 ? v : 0;
}
function lsHorizonKeys() {
  var out = [];
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf(LS_CFG.hzPrefix) === 0) out.push(k);

  } catch (e) { }

  var ks = lsHorizonKeys();
  ks.forEach(lsRemove);

  return ks.length;
}
// כתיבת מערך מכובדת-אופק. `tsOf(rec)` מחזירה חותמת זמן במילישניות.
function lsSetArray(key, arr, tsOf) {
  var list = Array.isArray(arr) ? arr : [];
  var hz = lsHorizon(key), keep = list;
  if (hz > 0 && typeof tsOf === 'function') {
    keep = list.filter(function (r) {
      var t = Number(tsOf(r));

  return lsSet(key, JSON.stringify(keep));
}

/* ── פינוי יזום ─────────────────────────────────────────────────────────
   סדר קפדני:
     א. מטמונים וערכים שניתן לשחזר מהענן בכל רגע.
     ב. ארכיון ורשומות ישנות **שכבר מסונכרנות** — הישן ביותר קודם.
     ג. ⛔ נתון שטרם הסתנכרן לענן לא מפונה בשום מצב, גם אם המקום נגמר
        לגמרי. במצב כזה עדיף להיכשל ברעש מאשר למחוק. */

  var sized = [];
  (LS_CFG.tier1 || []).forEach(function (k) {
    var v = lsGet(k, null);
    if (v != null) sized.push({ k: k, b: lsEntryBytes(k, v) });
  });
  sized.sort(function (a, b) { return b.b - a.b; });   // הגדול קודם — מפנה מהר
  var hit = [];
  for (i = 0; i < sized.length; i++) {
    if (need && freed >= need) break;

  }
  if (hit.length) lsLog('פינוי א׳ — מטמונים', hit.join(', '), freed);
  if (need && freed >= need) return freed;

  // ── שלב ב: רשומות ישנות מסונכרנות ──
  // כלל ג נאכף כאן, לפני הכול: אם יש **משהו** בתור שטרם עלה לענן, אי אפשר
  // לדעת מה כבר בטוח שם — ולכן שלב ב מדולג לגמרי.
  if (LS_CFG.pending && LS_CFG.pending()) {
    lsLog('פינוי ב׳ דולג', 'יש נתונים שטרם סונכרנו — לא מפנים דבר', 0);
    return freed;

  var through = lsGlobalWitness();
  var specs = (LS_CFG.tier2 || []).slice();
  // מפתח בלי עֵד מקומי אך עם מסלול אימות מול הענן אינו מפונה כאן — האימות
  // אסינכרוני ולכן הוא רץ ב-`lsBootDeferred`, אחרי העלייה. מדווח כדי
  // שהיומן לא יראה כאילו לא נעשה כלום.
  var defer = lsVerifySpecs(through);
  if (defer.length) lsLog('פינוי ב׳ — ' + defer.length + ' מפתחות ללא עֵד מקומי', 'ימשיכו באימות מול הענן', 0);
  // מפתח יכול להביא עֵד סנכרון משלו (`spec.syncedThrough`) כשהחותמת הגלובלית

  for (i = 0; i < specs.length; i++) specs[i]._b = lsEntryBytes(specs[i].key, lsGet(specs[i].key, ''));

function lsPruneKey(spec, through, want) {

  // היינו מפנים דווקא את מה שהמשתמש עובד עליו עכשיו.
  var cut = lsSpecWitness(spec, through);
  if (!cut) return 0;   // אין עֵד מקומי — המסלול הנכון הוא האימות מול הענן
  if (spec.minAgeMs) cut = Math.min(cut, Date.now() - spec.minAgeMs);
  if (cut <= 0) return 0;

  var before = lsEntryBytes(spec.key, raw);
  var cand = [];
  for (var i = 0; i < arr.length; i++) {
    var t = Number(spec.ts(arr[i]));
    if (isFinite(t) && t > 0 && t <= cut) cand.push({ i: i, t: t });

  if (!cand.length) return 0;
  cand.sort(function (a, b) { return a.t - b.t; });     // הישן ביותר קודם

   ופינוי שהחזיר 0.

   התיקון אינו הרפיה של הדרישה אלא **החלפת מקור הראיה**: במקום להסיק

   ⛔ **נכשל סגור.** אין רשת, `verify` זרקה, החזירה `ok:false`, או שהמפתח

   ⛔ **פינוי רצף בלבד.** הרשומות נבדקות מהישנה לחדשה, והפינוי **נעצר**
      בראשונה שלא אומתה — לא מדלג עליה וממשיך מעליה. הסיבה היא האופק:
      אחרי הפינוי נשמר `hz` = חותמת הרשומה החדשה ביותר שנמחקה,

   ⚠️ **אסינכרוני.** `lsBoot` סינכרונית ורצה לפני שהמסך עולה, ולכן מסלול

var LS_DEFER_MS = 3000;   // המתנה אחרי העלייה לפני האימות — שהאפליקציה תספיק לעלות

      /* ⭐ דגל-יום פר-מקור (סבב 62) — מקור שכבר גובה היום מדולג, גם

         השאר בלולאה: הדגל הגלובלי נכתב רק כשכולם הצליחו, ולכן כל עלייה
         גיבתה מחדש את מה שכבר גובה — נמדד ב-26.8, 66 גיבויים ביום.
         ⚠️ הדחיפה ל-`dailyKeys` קודמת לדילוג בכוונה: הרשימה היא
         רשימת-ההיתר של הגריעה, ומפתח שנופל ממנה אינו מתפנה לעולם. */
      var dayKey = 'bk_day_' + bkey;
      if (lsGet(dayKey, '') === today) { same++; continue; }
      if (s.kind === 'kv') {
        var res = await c.from(s.table).select('value').eq('key', s.name).maybeSingle();
        if (!res || res.error) { ok = false; failed.push(bkey); continue; }
        val = (res.data && res.data.value != null) ? String(res.data.value) : null;
      } else {
        /*  ⛔⛔ שכבת הגיבוי — עוגן שבועי מלא, ודיפרנציאלי בכל שאר הימים
         *  (סבב 87ג): ⚠️ הנימוק המדוד — הקריאה הייתה בקשה **אחת** בלי
         *  עימוד, ⛔ ו-Supabase מחזיר 1,000 שורות כברירת מחדל **בלי
         *  שגיאה**: ⭐ `ys_marks_rows` גובתה 1,000 מתוך 18,085, ⛔ כלומר
         *  94.5% ממנה מעולם לא גובו — ⚠️ והכשל היה שקט לחלוטין. */
        var layer = _bkLayer(bkey, s);
        var rows = await _bkReadRows(c, s, layer.win);
        if (rows === null) { ok = false; failed.push(bkey); continue; }
        bkey = layer.prefix + bkey;
        // ⛔ שדה-סוד בשורות טבלה מסונן לפני הסריאליזציה (השלמת סבב 35) —
        //    שורה שמפתחה (`secretField`, ברירת מחדל `key`) ברשימת הסודות
        //    אינה מגיעה לגיבוי, גם כשהיא עדיין קיימת במקור.
        if (secrets.length) rows = rows.filter(function (r) {
          return secrets.indexOf(r && r[s.secretField || 'key']) === -1;
        });
        /*  ⛔ דיפרנציאלי ריק אינו נכתב ⛔ ואינו כישלון — ⚠️ יום שלא השתנה
         *  בו דבר הוא המצב הרגיל, ⭐ ועותק ריק בכל לילה מציף את הפינוי. */
        if (layer.diff && !rows.length) { same++; continue; }
        val = JSON.stringify(rows);
        if (!layer.diff && s.ts) _bkSetMark(layer.key, _bkMaxTs(rows, s.ts));
      }
      // מקור שאין לו ערך בענן — אין מה לגבות, וזה אינו כישלון.
      if (val == null) continue;
      var sig = bkSig(val), sigKey = 'bk_sig_' + bkey;
      if (lsGet(sigKey, '') === sig) { same++; continue; }
      var ins = await c.from(BK_TABLE).insert({ key: bkey, value: val });
      if (!ins || ins.error) { ok = false; failed.push(bkey); continue; }
      lsSet(sigKey, sig);
      lsSet(dayKey, today);
      wrote++;
    }
    /* ⭐ הגריעה אינה מותנית עוד בהצלחת **כל** המקורות (סבב 62) — היא רצה
       על רשימת-ההיתר המלאה בכל פעם שנכתב עותק חדש. ⛔ הכריכה הישנה היא
       ששיתקה אותה: מקור אחד שנכשל מנע גריעה של כל השאר, וזה שורש מצבור
       ה-503 השורות שנוקה ב-26.8. ⚠️ והיא עדיין רצה **אחרי** הכתיבה, כדי
       שלא ייגרע עותק ישן לפני שהחדש נכתב (השלמת סבב 35). */
    if (wrote) { try { await _bkRetention(c, dailyKeys); } catch (e2) { } }
    if (ok) {
      lsSet(flag, today);
      lsSet(_bkVal(BK_CFG.atKey), String(Date.now()));
      logAction('backup', null, wrote, { date: today, scope: pre || null, wrote: wrote, unchanged: same });
    } else {
      /* ⛔ בלי כתיבת הדגל הגלובלי — ההזדמנות הבאה באותו יום תנסה שוב
         (נרשם בסבב 6 בהנהלה): גיבוי שנכשל ודילג על יממה שלמה הוא בדיוק
         מה שהדגל שנכתב-מראש גרם. ⚠️ ומה שכן השתנה (סבב 62): המקורות
         שהצליחו נושאים דגל-יום משלהם ואינם נגבים שוב, ולכן הניסיון החוזר
         מכוון למי שנכשל בלבד. ⛔ וכשל חלקי מדווח ואינו נבלע — `failed`
         נושא את שמות המקורות, אחרת «נכשל» היה מספר בלי מען. */
      logAction('backup_fail', null, wrote, { date: today, scope: pre || null, wrote: wrote, unchanged: same, failed: failed });
      console.warn('[backup] מקורות שנכשלו: ' + (failed.join(', ') || '?') + ' — ייבחנו שוב בהזדמנות הבאה');
    }
  } catch (e) { ok = false; }
  _bkRunning = false;
  return ok;
}

/* ── מדיניות השמירה — גריעת עותקים יומיים ישנים מ-30 יום ──────────────── */
// ⛔ הגריעה מוגבלת ב-`in('key', keys)` לרשימת המפתחות היומיים של
//    האפליקציה הנוכחית בלבד (השלמת סבב 35) — רשימת-היתר, לא קידומת:
//    גיבויי `PRE_*` וגיבויים של אפליקציה אחרת אינם מועמדים כלל.
// ⚠️ נכשלת סגור: `error` (כולל היעדר הרשאת DELETE — סבב 29) מוחזר כאפס
//    בשקט, בלי להפיל את הגיבוי ובלי רישום-סרק יומי ליומן הראיות.
async function _bkRetention(c, keys) {
  if (!c || !Array.isArray(keys) || !keys.length) return 0;
  var cutoff = new Date(Date.now() - BK_RETENTION_DAYS * 86400000).toISOString();
  var del = await c.from(BK_TABLE)['delete']().in('key', keys).lt('created_at', cutoff).select('id');
  if (!del || del.error || !Array.isArray(del.data)) return 0;
  var n = del.data.length;
  if (n > 0) logAction('retention', null, n, { days: BK_RETENTION_DAYS, keys: keys.length });
  return n;
}

/* ── תצוגה: «גובה לאחרונה» בתוך «מידע טכני» ───────────────────────────── */
// ⛔ הרכיב נתלה **אחרי** הבלוק הקפוא ואינו עורך אותו (סבב 30) — «מידע
//    טכני» חתום ב-`check-status-area.mjs`, ועריכתו הייתה מחייבת שינוי
//    בארבעת הריפו ובחתימות עבור שורת תצוגה אחת.
function bkLastAt() {
  var v = parseInt(lsGet(_bkCfg('atKey', ''), '0'), 10);
  return isFinite(v) ? v : 0;
}
// ⚠️ מחזירה את מספר הימים רק כשהוא חצה את הסף, ו-0 אחרת — כדי שאתר
//    הקריאה יהיה `if (bkStale())` ולא השוואה שמשוכפלת בכל מקום.
//    מכשיר שטרם גיבה בכלל מחזיר 0: «— טרם גובה —» כבר אומר את זה, והתרעה
//    בנוסף לו הייתה רעש בעלייה הראשונה.
function bkStale() {
  var t = bkLastAt();
  if (!t) return 0;
  var d = Math.floor((Date.now() - t) / 86400000);
  return (d >= BK_STALE_DAYS) ? d : 0;
}
function bkStatusHTML() {
  var t = bkLastAt(), st = bkStale();
  return '<div class="sync-line bk-line"><div>גובה לאחרונה: <b>' +
    (t ? esc(syncFmtTime(t)) : '— טרם גובה —') + '</b></div>' +
    (st ? '<div class="bk-stale">⚠️ הגיבוי לא רץ ' + st + ' ימים</div>' : '') +
    '</div>';
}
function bkStatusMount() {
  var box = document.getElementById('tech-info-box');
  if (!box) return;
  var d = box.querySelector('details.tech-info');
  if (!d) return;
  var prev = d.querySelector('.bk-line');
  if (prev && prev.parentNode) prev.parentNode.removeChild(prev);
  var wrap = document.createElement('div');
  wrap.innerHTML = bkStatusHTML();
  var node = wrap.firstChild;
  if (node) d.appendChild(node);
}
window.bkStatusMount = bkStatusMount;

/* ── נקודת ההפעלה היחידה ─────────────────────────────────────────────── */
// ⛔ זו הקריאה היחידה שקוד האפליקציה עושה למודול (סבב 30, השלמה) — היא
//    יושבת בפונקציית העלייה, לצד `lsBoot()` ו-`pendBoot()`, ולעולם לא
//    במסלול דחיפה/סנכרון. ר' הנימוק המלא בכותרת הבלוק.
// ⚠️ שתי הקריאות אינן ב-`await` ואינן חוסמות: העלייה אינה ממתינה לרשת,
//    וכל כשל נבלע בשקט בתוך המודול.
function bkBoot() {
  try { bkMaybeDaily(); } catch (e) { }
  try { logFlush(); } catch (e) { }
}
window.bkBoot = bkBoot;
/* ═══════════════ סוף מודול הגיבוי היומי ═══════════════════════════════ */

/* ── PEND_CFG — הדבר היחיד שנבדל בין האפליקציות ─────────────────────────── */
// המפתח הוא **פונקציה**: שני המוסדות חיים באותו דומיין ובאותו localStorage,
// וסימון "ממתין" של ראשון לציון אינו תקף לרמת אביב. `selectYeshiva` קוראת
// ל-`pendReload()` אחרי שהיא מעדכנת את `LS`.
var PEND_CFG = {
  app: 'yoman-avoda',
  key: function () { return 'tb_pending' + (typeof LS === 'string' ? LS : ''); },
  // השהיית ציור (סבב 16): בתום ההחזקה, תגית ⏳ שנותרה צריכה להיכנס לשורות
  // שכבר רונדרו בלעדיה. renderLog הוא האתר היחיד שמצייר pendTag כאן.
  redraw: function () { try { renderLog(); } catch (e) { } }
};

/* ═══ ממתין לסנכרון — מודול משותף (סבב 12) ═══════════════════════════════
   ⛔ שינוי כאן (סבב 65) — ארבע האפליקציות **וארבעת עותקי השער**, באותו
      סבב: אחרת החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ═══════════════════════════════════════════════════════════════════════ */
var PEND_LATE_MS = 24 * 60 * 60 * 1000;   // סף ההתרעה

var _pendMap = null;
var _pendAlertDismissed = 0;

/* ---------------------------------------------- השהיית ציור (סבב 16) ----
   באונליין תקין האישור מגיע תוך פחות משתי שניות מהסימון, והתגית והסרגל היו
   מהבהבים לשבריר שנייה על כל שמירה. לכן סימון שנוצר **הרגע** בכתיבה חדשה
   מקבל "החזקת ציור" בזיכרון: אם האישור הגיע בתוך PEND_DRAW_DELAY_MS —
   ה-⏳ לא מופיע כלל; אם לא — הוא מופיע וממשיך להתנהג בדיוק כמו היום.
   ⚠️ ההשהיה היא על ה**ציור בלבד**: הסימון הלוגי נכתב ל-localStorage מיידית
   (מנגנוני הבטיחות — פינוי, דחיפה, מיגרציות — נשענים עליו), מסך ההגדרות

   מושהים לעולם, וההחזקה חיה **בזיכרון בלבד** — סימון שנטען מהדיסק בעליית
   האפליקציה (המכשיר נסגר בתוך שתי השניות) מצויר מיד. */
var PEND_DRAW_DELAY_MS = 2000;

function pendHoldDraw(key, now) {
  _pendDrawHold[key] = (now || Date.now()) + PEND_DRAW_DELAY_MS;

// חותמת לציור: 0 כל עוד הסימון מוחזק. סימון בלי החזקה (נטען מהדיסק) — מיידי.
function pendDrawSince(key) {
  var t = pendSince(key);
  if (!t) return 0;
  var h = _pendDrawHold[key];
  if (h && Date.now() < h) return 0;
  if (h) delete _pendDrawHold[key];
  return t;
}
// כמה סימונים מותר לצייר עכשיו. משמש רק להחלטת "האם להציג את הסרגל" —
// המספר המוצג עצמו הוא תמיד pendCount() המלא.
function pendDrawCount() {
  var m = pendAll(), keys = Object.keys(m), n = 0, now = Date.now();
  for (var i = 0; i < keys.length; i++) {
    var h = _pendDrawHold[keys[i]];
    if (!h || now >= h) n++;

  return n;
}
// בתום ההחזקה: הסימון עדיין קיים (לא אושר — אופליין/רשת איטית) ⇒ מציירים
// אותו עכשיו, כולל רינדור הרשימות דרך PEND_CFG.redraw (פר-אפליקציה).
// אושר בינתיים (המסלול המהיר הרגיל) ⇒ אין מה לצייר ואין רינדור מיותר.
function pendDrawFlush() {
  var m = pendAll(), now = Date.now(), revealed = false;
  Object.keys(_pendDrawHold).forEach(function (k) {
    if (now >= _pendDrawHold[k]) {
      delete _pendDrawHold[k];
      if (m[k]) revealed = true;
    }
  });
  if (!revealed) return;
  pendRender();
  try { if (typeof PEND_CFG === 'object' && PEND_CFG.redraw) PEND_CFG.redraw(); } catch (e) { }
}
function pendScheduleFlush() {
  try { setTimeout(pendDrawFlush, PEND_DRAW_DELAY_MS + 50); } catch (e) { }
}

// `PEND_CFG.key` יכולה להיות מחרוזת או פונקציה. yoman-avoda מחזיקה שני
// מוסדות באותו דומיין, וסימוני האחד אינם תקפים לשני — שם היא פונקציה.
function pendKeyName() {
  var k = (typeof PEND_CFG === 'object') ? PEND_CFG.key : null;
  if (typeof k === 'function') { try { k = k(); } catch (e) { k = null; } }
  return k || 'pending_sync';
}
// החלפת הקשר (מוסד/משתמש) — המפה נטענת מחדש מהמפתח החדש.
function pendReload() { _pendMap = null; _pendDrawHold = {}; pendAll(); pendRender(); }

function pendAll() {
  if (_pendMap) return _pendMap;
  var v = null;
  try { var raw = lsGet(pendKeyName(), null); v = raw == null ? null : JSON.parse(raw); }
  catch (e) { v = null; }
  _pendMap = (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
  // ניקוי ערכים פגומים — חותמת שאינה מספר חיובי אינה ראיה לכלום
  Object.keys(_pendMap).forEach(function (k) {
    var t = Number(_pendMap[k]);
    if (!isFinite(t) || t <= 0) delete _pendMap[k];
  });
  return _pendMap;
}

// הכתיבה עוברת דרך lsSet (כלל ברזל 1). כישלון כאן אינו שקט: lsSet מרימה
// באנר ורושמת ליומן, ו-lsGuardToast יבלע כל "✅" בשתי השניות הבאות.
function pendSave() {
  var m = pendAll();
  var keys = Object.keys(m);
  if (keys.length > PEND_MAX) {
    // גריעה של הישנים ביותר. זו לא "מחיקת נתון שטרם הסתנכרן" — הרשומה עצמה
    // נשארת במקומה; רק הסימון שלה יורד. עדיין נרשם ליומן, כי סימון שנעלם
    // בלי אישור הוא בדיוק מה שהמודול בא למנוע.
    keys.sort(function (a, b) { return m[a] - m[b]; });
    var drop = keys.slice(0, keys.length - PEND_MAX);
    drop.forEach(function (k) { delete m[k]; });
    try { lsLog('pend-overflow', drop.length + ' סימונים נגרעו (תקרה ' + PEND_MAX + ')', 0); } catch (e) { }
  }
  return lsSet(pendKeyName(), JSON.stringify(m));
}

// סימון. חותמת קיימת **אינה נדרסת** — הגיל נמדד מהכתיבה הראשונה שלא אושרה,
// אחרת עריכה חוזרת של אותה רשומה הייתה מאפסת את שעון ההתרעה לנצח.
function pendMark(key) {
  if (!key) return 0;
  var m = pendAll();
  if (!m[key]) {
    // הסימון הלוגי נכתב מיידית (pendSave); רק הציור מוחזק (סבב 16).
    m[key] = Date.now();
    pendHoldDraw(key, m[key]); pendScheduleFlush();
    pendSave(); pendRender();
  }
  return m[key];
}
function pendMarkMany(keys) {
  if (!keys || !keys.length) return;
  var m = pendAll(), now = Date.now(), ch = false;
  for (var i = 0; i < keys.length; i++) {
    if (keys[i] && !m[keys[i]]) { m[keys[i]] = now; pendHoldDraw(keys[i], now); ch = true; }
  }
  if (ch) { pendScheduleFlush(); pendSave(); pendRender(); }
}

// אישור — יש ראיה שהענן קיבל.
function pendClear(key) {
  if (!key) return;
  var m = pendAll();
  if (m[key]) { delete m[key]; delete _pendDrawHold[key]; pendSave(); pendRender(); }
}
function pendClearMany(keys) {
  if (!keys || !keys.length) return;
  var m = pendAll(), ch = false;
  for (var i = 0; i < keys.length; i++) if (m[keys[i]]) { delete m[keys[i]]; delete _pendDrawHold[keys[i]]; ch = true; }
  if (ch) { pendSave(); pendRender(); }
}

// כשל סמכותי — הכתיבה **לא** נכנסה, ולכן הסימון יורד. ראה ההערה בראש המודול.
function pendFailed(key) { pendClear(key); }

// אישור דחיפת-מצב מלא: כל מה שסומן לפני `t0` נכלל בצילום שנדחף בהצלחה.
// `prefix` מגביל לקטגוריה אחת — דחיפה של מפתח אחד אינה מאשרת את השאר.
function pendConfirmPush(prefix, t0) {
  var m = pendAll(), ch = false;
  t0 = Number(t0) || 0;
  if (!t0) return;
  Object.keys(m).forEach(function (k) {
    if (prefix && k.indexOf(prefix) !== 0) return;
    if (m[k] < t0) { delete m[k]; delete _pendDrawHold[k]; ch = true; }
  });
  if (ch) { pendSave(); pendRender(); }
}

function pendHas(key) { return !!pendAll()[key]; }
function pendSince(key) { return pendAll()[key] || 0; }
function pendCount() { return Object.keys(pendAll()).length; }
function pendOldest() {
  var m = pendAll(), keys = Object.keys(m), t = 0;
  for (var i = 0; i < keys.length; i++) if (!t || m[keys[i]] < t) t = m[keys[i]];
  return t;
}
function pendLateCount() {

function newClientId(){
  try{
    if(typeof crypto!=='undefined'&&crypto&&typeof crypto.randomUUID==='function')return crypto.randomUUID();
  }catch(e){}

    if(typeof crypto!=='undefined'&&crypto&&typeof crypto.getRandomValues==='function'){

    }

  if(!b){b=new Array(16);for(var i=0;i<16;i++)b[i]=Math.floor(Math.random()*256);}
  b[6]=(b[6]&0x0f)|0x40;b[8]=(b[8]&0x3f)|0x80;  // גרסה 4, variant RFC 4122
  var h=[],j;for(j=0;j<16;j++)h.push((b[j]+0x100).toString(16).slice(1));
  return h.slice(0,4).join('')+'-'+h.slice(4,6).join('')+'-'+h.slice(6,8).join('')+'-'+h.slice(8,10).join('')+'-'+h.slice(10,16).join('');

  try { return !!(typeof RTY_CFG !== 'undefined' && RTY_CFG && RTY_CFG.pending && RTY_CFG.pending()); }
  catch (e) { return false; }
}
function _rtyOnline() {
  try { return typeof navigator === 'undefined' || navigator.onLine !== false; } catch (e) { return true; }
}
function _rtyVisible() {
  try { return typeof document === 'undefined' || document.visibilityState !== 'hidden'; } catch (e) { return true; }

/*  ⛔ קוד מיושן עוצר את הניסיון החוזר — ⚠️ סכימה שהשתנתה אינה כשל
 *  חולף, ⭐ והלולאה שניסתה שוב ושוב היא ה«איטיות» שדווחה מהשטח. */
function rtyReady() { return !_staleSchema && _rtyPending() && _rtyOnline() && _rtyVisible(); }
function rtyGate()  { return _rtyBusy || _rtyDelay > RTY_BASE_MS; }
function rtyState() { return { armed: !!_rtyTimer, delay: _rtyDelay, busy: _rtyBusy }; }

function rtyStop() { if (_rtyTimer) { clearTimeout(_rtyTimer); _rtyTimer = null; } }

function rtyArm() {
  if (_rtyTimer) return false;
  if (!_rtyPending()) return false;
  _rtyTimer = setTimeout(_rtyFire, _rtyDelay);
  return true;
}

function _rtyFire() {
  _rtyTimer = null;
  if (!_rtyPending()) { _rtyDelay = RTY_BASE_MS; return; }
  if (!_rtyOnline() || !_rtyVisible()) { rtyArm(); return; }

function rtyKick() {

  if (!_rtyPending()) { rtyStop(); _rtyDelay = RTY_BASE_MS; return Promise.resolve(false); }

}

function rtyNote() { _rtyDelay = RTY_BASE_MS; rtyArm(); }

function rtyBoot() {
  if (!_rtyWired) {
    _rtyWired = true;
    try {
      window.addEventListener('online', function () { _rtyDelay = RTY_BASE_MS; rtyKick(); });
      document.addEventListener('visibilitychange', function () {

  }
  rtyArm();
}

/* ── PL_CFG — הדבר היחיד שנבדל בין האפליקציות ──────────────────────────── */
/* ⚠️ ביומן החותמת היא שורת `tb_last_changed` שבטבלת המוסד (`KV_TABLE`),
   ⛔ ולכן `active()` נבדק מול `YESHIVA` (סבב 51) — פולינג לפני בחירת מוסד
   היה נוגע בנתונים של דייר שאיש לא בחר.
   ⚠️ `ok()` הוא `_tbMarkSynced()` — חותמת **תצוגה** בלבד. ⛔ אין להזין
   ממנה את עֵד הפינוי (סבב 51) — הוא `_tbPushedAt` פר-מפתח, ר' כלל ברזל 7. */
var PL_CFG = {
  every:  3000,
  active: function () { return !!YESHIVA; },
  seen:   function () { return _lastKnownTimestamp; },
  note:   function (ts) { _lastKnownTimestamp = ts; },
  ok:     function () { _tbMarkSynced(); },
  stamp:  function (ts) { return sbSet("tb_last_changed", ts); },
  pull:   function () { return tbPullFromCloud(); },
  remote: function () {
    return Promise.resolve(getSB().from(KV_TABLE).select("value").eq("key", "tb_last_changed").maybeSingle())
      .then(function (r) {
        if (!r || r.error) return { ok: false, ts: null };
        return { ok: true, ts: r.data ? plNum(r.data.value) : null };
      }, function () { return { ok: false, ts: null }; });
  },
};
/* ═══ מנגנון המשיכה — מודול משותף (סבב 51) ════════════════════════════════
   ⛔ שינוי כאן (סבב 65) — ארבע האפליקציות **וארבעת עותקי השער**, באותו
      סבב: אחרת החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ═══════════════════════════════════════════════════════════════════════ */
var PL_FALLBACK_MS = 60000;   // אין שורת חותמת בענן ⇒ משיכה מלאה אחת לדקה
var _plTimer = null, _plBusy = false, _plFullAt = 0, _plWired = false;

/* חותמת מהענן: מספר, מחרוזת JSON של מספר, או כל דבר אחר ⇒ 0. */
function plNum(v) {
  if (v === null || v === undefined) return 0;
  if (typeof v === 'number') return Math.floor(v) || 0;
  try { var p = JSON.parse(v); if (typeof p === 'number') return Math.floor(p) || 0; } catch (e) { }
  return parseInt(v, 10) || 0;
}

function plBusy() { return _plBusy; }
function _plSeen() { try { return plNum(PL_CFG.seen()); } catch (e) { return 0; } }
function plState() { return { busy: _plBusy, armed: !!_plTimer, fullAt: _plFullAt, seen: _plSeen() }; }

/* ⭐ נקראת אחרי כל כתיבה מוצלחת לענן. היא מקדמת קודם את «מה שכבר נראה»
   מקומית — כדי שהתקתוק הבא לא ימשוך מלא בגלל השינוי של המכשיר הזה
   עצמו — ורק אז כותבת את החותמת לענן. ⛔ כשל בכתיבת החותמת אינו מפיל
   את הכתיבה שקדמה לה (סבב 51) — הנתון כבר בענן, והמכשירים האחרים
   יראו אותו בשינוי הבא או בנפילה-חזרה. */
function plTouch(ts) {
  var t = plNum(ts) || Date.now();
  try { PL_CFG.note(t); } catch (e) { }
  try {
    return Promise.resolve(PL_CFG.stamp(t)).then(function () { return t; }, function () { return t; });
  } catch (e) { return Promise.resolve(t); }
}

function _plFull() {
  var done = function (v) { _plBusy = false; return v; };
  try {
    return Promise.resolve(PL_CFG.pull()).then(
      function () { _plFullAt = Date.now(); return done(true); },
      function () { return done(false); });

}

function plTick() {
  if (_plBusy) return Promise.resolve(false);
  var live; try { live = !!PL_CFG.active(); } catch (e) { live = false; }
  if (!live) return Promise.resolve(false);
  _plBusy = true;
  var done = function (v) { _plBusy = false; return v; };
  var p;
  try { p = Promise.resolve(PL_CFG.remote()); } catch (e) { p = Promise.reject(e); }
  return p.then(function (r) {
    if (!r || !r.ok) return done(false);
    try { PL_CFG.ok(); } catch (e) { }
    if (r.ts === null || r.ts === undefined) {
      if (Date.now() - _plFullAt >= PL_FALLBACK_MS) return _plFull();
      return done(false);
    }
    var ts = plNum(r.ts);
    if (ts > _plSeen()) { try { PL_CFG.note(ts); } catch (e) { } return _plFull(); }
    return done(false);
  }, function () { return done(false); });

function plStop() { if (_plTimer) { clearInterval(_plTimer); _plTimer = null; } }

function plBoot() {
  if (!_plWired) {
    _plWired = true;
    try { window.addEventListener('online', function () { plTick(); }); }
    catch (e) { console.warn('[pl] wiring', e); }
  }
  if (_plTimer) return false;
  var ms = 0;
  try { ms = parseInt(PL_CFG.every, 10) || 0; } catch (e) { ms = 0; }

}
/* ═══════════════ סוף מנגנון המשיכה ══════════════════════════════════════ */

    ts: function (r) { return _tbRecTs(r); },
    isPending: function (r) { return pendHas(PK_ARC + archiveKey(r)); },
    fetch: async function () {

                                                  : { ok: false, rows: [] };
    },
    rows: function () { return ARCHIVE; },
    apply: function (kept) { return lsSetArray('tb_archive' + LS, kept, _tbRecTs); }

/* ═══ חלון חם ושחזור מקומי — מודול משותף (סבב 35) ════════════════════════
   ⛔ שינוי כאן (סבב 65) — ארבע האפליקציות **וארבעת עותקי השער**, באותו
      סבב: אחרת החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ══════════════════════════════════════════════════════════════════════ */
var HW_BOOT_DEFER_MS = 3000;      // כמו הפינוי הנדחה של סבב 14 — רשת אחרי עלייה
var HW_RESTORE_ARM_MS = 8000;     // חלון האישור הדו-שלבי של כפתור השחזור

  catch (e) { return false; }

  var spec = _hwSpecFor(key);

  var idx = _hwCloudSeen[key] || (_hwCloudSeen[key] = {});
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i], id, t;
    try { id = spec.idOf(r); t = Number(spec.ts(r)) || 0; } catch (e) { continue; }

// שער הדיסק. ⛔ כל ספק משאיר את הרשומה (סבב 35) — רשומה בלי ראיה עננית
// עדכנית לה-עצמה נכתבת לדיסק כרגיל; רק ודאות מפנה.
function hwDiskFilter(key, rows) {
  if (!hwEnabled() || !Array.isArray(rows)) return rows;
  var spec = _hwSpecFor(key);
  if (!spec) return rows;
  var idx = _hwCloudSeen[key];
  if (!idx) return rows;

        try { pend = !!spec.isPending(r); } catch (e1) { pend = true; }

async function hwSweep() {

  try {

        typeof LS_CFG.pending === 'function' && LS_CFG.pending()) {

// מסך העבר — קריאה בלבד. מחזיר מהענן את הרשומות החיות שמחוץ לחלון,
// מהחדשה לישנה, בלי לגעת בדיסק ובלי לגעת בזיכרון האפליקציה.
async function hwPastLoad(key, filter) {
  var spec = _hwSpecFor(key);
  if (!spec) return { ok: false, rows: [] };
  var res = null;
  try { res = await spec.fetch(); } catch (e) { res = null; }
  if (!res || res.ok !== true || !Array.isArray(res.rows)) return { ok: false, rows: [] };
  hwNoteCloud(key, res.rows);
  var out = [];
  for (var i = 0; i < res.rows.length; i++) {
    var r = res.rows[i];
    var inW = true;
    try { inW = !!spec.inWindow(r); } catch (e1) { }

    out.push(r);

    try { ta = Number(spec.ts(a)) || 0; tb = Number(spec.ts(b)) || 0; } catch (e3) { }

/* ── נקודת ההפעלה ──────────────────────────────────────────────────────── */

// שמירה כללית ל-Supabase (מאגר מפתח/ערך בטבלה "kv").
// מחזירה {ok, error} — supabase-js **אינו זורק** בכשל רשת או הרשאה, אלא
// נפתר עם res.error; ולכן קורא שהסתפק ב-try/catch לא ראה כשלים מעולם

async function sbSet(key, value) {

    /*  ⛔ ההקשר התחלף בזמן הכתיבה — ⚠️ הכתיבה עצמה הגיעה לטבלה הנכונה, שהיא

     *  בדחיפה שלא נעשתה עבורו: ⭐ נכשל-סגור — ⚠️ עֵד חסר מונע פינוי, ⛔ ועֵד

    if (ysTenantStale(_ep)) return { ok: false, error: "ההקשר התחלף", stale: true };
    if (res.error) {

      return { ok: false, error: res.error.message || "שגיאת שרת" };
    }
    console.log("sbSet ok [" + key + "]");
    return { ok: true, error: null };
  } catch(e) {
    console.error("sbSet exception [" + key + "]:", e);
    return { ok: false, error: (e && e.message) || String(e) };

// אותה קריאה, עם התוצאה משומרת: {ok, data, error}.
// מפתח חסר (PGRST116 מ-single()) הוא תוצאה ריקה, לא כישלון.
async function sbGetResult(key) {
  var tbl = KV_TABLE;   // ר' הנימוק ב-sbSet — הטבלה נלכדת ואינה נקראת מהגלובלי
  try {
    var sb = getSB();
    var res = await withTimeout(sb.from(tbl).select("value").eq("key", key).single());
    if (res.error) {
      var missing = res.error.code === "PGRST116";
      if (!missing) console.error("sbGet error [" + key + "]:", res.error.message, res.error);
      return { ok: missing, data: null, error: missing ? null : (res.error.message || "שגיאת שרת") };
    }
    return { ok: true, data: res.data ? JSON.parse(res.data.value) : null, error: null };
  } catch(e) {
    console.error("sbGet exception [" + key + "]:", e);
    return { ok: false, data: null, error: (e && e.message) || String(e) };
  }
}

// מעטפת ערך-בלבד — חוזה שלא השתנה, לרבים מאתרי הקריאה שרוצים רק את הנתון.
async function sbGet(key) {
  var r = await sbGetResult(key);
  return r.data;
}

// ============================================================
// ===== RECORD-LEVEL MERGE ENGINE (סבב 3ב) =====
// ============================================================
// העיקרון (זהה ל-ysMergeRecords ב-hanhala-ruchanit): היעדר רשומה אצל מכשיר
// אינו מחיקה. מחיקה היא אך ורק tombstone מפורש — deleted:true + updatedAt.
// מכשיר לעולם לא מוחק רשומה שהוא פשוט לא מכיר.
//
// נתונים קיימים (legacy): בענן יש רשומות שנוצרו לפני הסבב הזה, בלי updatedAt.
// recTs() מחזיר עבורן 0 — כלומר הן "ותיקות" ומפסידות לכל רשומה מתוארכת —
// אבל הן לעולם לא נופלות מהמיזוג רק בגלל שהצד השני לא מכיר אותן. לכן המיזוג
// הראשון אחרי השדרוג הוא איחוד מלא של מקומי + ענן, בלי אובדן נתונים.
/* ══════════════════════════════════════════════════════════════════════════
   מנוע המיזוג ברמת רשומה (סבב 3ב) — חותמות ו-tombstones
   ══════════════════════════════════════════════════════════════════════════
   ⛔ **היעדר רשומה אצל צד אחד אינו מחיקה** (סבב 3ב) — זה הכלל היחיד
   שחשוב כאן, והוא מה שמנע את אובדן הנתונים שקדם לסבב. מחיקה היא
   `deleted:true` + `updatedAt`, והענן מנצח בשוויון (דטרמיניסטי).
   ══════════════════════════════════════════════════════════════════════════ */
function recTs(r) {

//
// שלושה כללים, כולם קריטיים:
// 1. **רק tombstones.** רשומה חיה לא נגרעת לעולם, בלי קשר לגיל.
// 2. **רק עם updatedAt מספרי.** tombstone בלי חותמת (נתוני legacy) — אי אפשר
//    לדעת מתי נמחק, ולכן הוא **נשאר**. recTs() מחזיר 0 עבורו, וגריעה לפי 0
//    הייתה מוחקת דווקא את הישנים ביותר בלי שום ראיה לגילם.
// 3. **`TOMBSTONE_TTL_MS`.** הסף צריך להיות ארוך בהרבה מכל היעדרות סבירה
//
// המחיר המודע (זהה לזה שכבר תועד במנוע המיזוג): מכשיר שהיה מנותק יותר
// מעבר ל-`TOMBSTONE_TTL_MS` ולא קיבל את ה-tombstone עדיין מחזיק את הרשומה
// כחיה, וכשיסתנכרן

// גריעה מקומית בלבד היא חסרת משמעות — mergeRecords מחזיר כל רשומה שקיימת
// בענן ואין לה מקבילה מקומית, ולכן ה-tombstones היו חוזרים תוך שניות
// והעותק הענני לעולם לא היה מצטמצם. הגריעה **אינה** רצה בפולינג של 3
// השניות ואינה נוגעת במנוע המיזוג — היא מופעלת על התוצאה, פעם אחת.

    if (typeof r.updatedAt !== 'number') return true;      // בלי חותמת — לא יודעים, משאירים
    return r.updatedAt >= cutoff;                          // tombstone טרי — משאירים

// מיזוג ברמת רשומה. remote (הענן) קובע את סדר הבסיס ומנצח בשוויון — דטרמיניסטי.
// mergePair (אופציונלי) — מיזוג מותאם כששני הצדדים מכירים את אותו מפתח.
//
// ⛔ **רשומה מקומית מסומנת ⏳ מנצחת ללא תלות בחותמת (סבב 37) — אין להסיר

//    לדחיפה» — כבר יושב ב-`tbDirtyRows`.
//    המחיר המודע: מכשיר שהיה מנותק זמן רב ידרוס בעלייתו עריכה מרוחקת חדשה
//    יותר. זו העדפה מכוונת — הרשומה מסומנת ⏳ כל אותו זמן ומתריעה אחרי
//    24 שעות, בעוד שעריכה שנמחקת בשקט אינה משאירה עקבות.
/* ═══ מזהה מכשיר — מודול משותף (סבב 40) ═══════════════════════════════════
   ⛔ שינוי כאן (סבב 65) — ארבע האפליקציות **וארבעת עותקי השער**, באותו
      סבב: אחרת החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ═══════════════════════════════════════════════════════════════════════ */
var _deviceIdMem = null;
function getDeviceId() {
  var id = lsGet(DEV_CFG.key, null);
  if (!id) {
    id = _deviceIdMem || _randDeviceId();
    lsSetRaw(DEV_CFG.key, id);
  }
  _deviceIdMem = id;
  return id;
}
function _randDeviceId() {
  var c = 'abcdefghijklmnopqrstuvwxyz0123456789', id = '';
  for (var i = 0; i < 8; i++) id += c.charAt(Math.floor(Math.random() * c.length));

/* ═══════════════ סוף מודול מזהה המכשיר ═════════════════════════════════ */
/* ═══ מיזוג רשומות — מודול משותף (סבב 38) ════════════════════════════════
   ⛔ שינוי כאן (סבב 65) — ארבע האפליקציות **וארבעת עותקי השער**, באותו
      סבב: אחרת החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ═══════════════════════════════════════════════════════════════════════ */
// כלל ההכרעה בין שתי גרסאות של **אותה** רשומה — הנקודה היחידה בארגון שבה
// הוא נכתב. ⛔ אין לשכפל אותה (סבב 38) — ר' הנימוק שבראש הבלוק.
// `isPend` הוא הסימון ⏳ של הרשומה המקומית; `mergePair`, כשהוא קיים, מקבל
// את ההכרעה כפרמטר ומרחיב אותה (מיזוג פנימי של סנאפשוט).
function _mergePick(loc, rem, k, isPend, tsOf, mergePair) {
  if (mergePair) return mergePair(loc, rem, k, isPend);
  return (isPend || tsOf(loc) > tsOf(rem)) ? loc : rem;   // שוויון → הענן

// `opts`: getKey · ts · isPending · mergePair · keepUnversionedLocal · onDrop

function mergeCore(local, remote, opts) {

  var keepUnversionedLocal = !!o.keepUnversionedLocal, onDrop = o.onDrop || null;

      if (!(k in map)) { order.push(k); map[k] = r; return; }
      // ⚠️ הסדר כאן הוא (הקיים, החדש) — שוויון נופל על ה**מאוחר** במערך.
      //    היפוך הארגומנטים הופך את שובר-השוויון בשקט.
      map[k] = (remoteDupe === 'last') ? r

    });
    L.forEach(function (r) {
      if (!r) return;

/* ═══════════════ סוף מודול המיזוג ══════════════════════════════════════ */

// חיבור יומן העבודה לליבה המשותפת (סבב 38). ⛔ החתימה לא השתנתה —
// עשרות אתרי קריאה מסתמכים עליה.
// ⚠️ `dedupe: true` **נדרש כאן ואינו ברירת מחדל שקטה**: שתי קריאות
//    `autoArchiveDay` על אותו יום מייצרות שני סנאפשוטים לאותו `gdate`
//    באותו מערך, ובלי איחוד הם היו שורדים שניהם ומכפילים את הארכיון.
// `remoteDupe: 'ts'` — בכפילות בתוך המערך המרוחק מנצחת החותמת הגבוהה,
//    ובשוויון המאוחר. ⚠️ שני הצדדים שם מרוחקים, ולכן הגנת ה-⏳ אינה חלה.
function mergeRecords(local, remote, getKey, mergePair, isPending) {
  return mergeCore(local, remote, {
    getKey: getKey, ts: recTs, mergePair: mergePair, isPending: isPending,
    keepUnversionedLocal: true, dedupe: true, remoteDupe: 'ts'

/* ══════════════════════════════════════════════════════════════════════════
   סדר רשומות היומן
   ══════════════════════════════════════════════════════════════════════════
   ⚠️ השוואה וציטוט של מזהה — `idEq` ו-`idArg` — יושבים ב**מודול
   מזהי הרשומות המשותף** (סבב 64), ולא כאן. מה שנשאר כאן הוא
   סדר הרשומות, שהוא פרטי ליומן.
   ══════════════════════════════════════════════════════════════════════════ */
// מפתח הסדר של רשומת יומן. ⚠️ **`createdAt` ולא `id`** (סבב 38) — מזהה אינו
// מפתח סדר, ו-uuid אינו ניתן להשוואה מספרית.
// ⚠️ ורשומות העבר: אצלן ה-`id` **הוא** חותמת היצירה (`Date.now()`), והוא
//    מקור הזמן היחיד שיש להן. לכן הוא נשאר כנפילה-חזרה — בלעדיו כל
//    ההיסטוריה הייתה מתמוטטת ל-0 ומאבדת את סדרה. `updatedAt` הוא הנפילה

  if (isFinite(i) && i > 0) return i;

//    (בחירת מה לדחוף) ו-`HW_CFG.specs[].isPending` (שער הפינוי) — קידומת
//    הסימון + מפתח מנוע המיזוג. שלוש הנקודות חייבות לקרוא את אותו מפתח.

// סנאפשוט ארכיון מזוהה לפי היום שלו (gdate); רק סנאפשוטים ישנים בלי gdate

  if (!changed) { console.log('[arcCleanup] ✅ הארכיון תקין — אין צורך בניקוי'); return; }

var _tbEpoch = 0;

function ysTenantStale(ep) { return ep !== ysTenantEpoch(); }
var _tbPullLogged = false;

async function syncFromCloud() {
  toast("🔄 מסנכרן...", 3000);
  // אילו משיכות באמת נכשלו — ההודעה הסופית חייבת לתאר את מה שקרה בפועל.
  var failed = [];

   *  אחרי כל `await`, ⭐ שזו הנקודה היחידה שבה ההקשר יכול להתחלף. */
  var _ep = ysTenantEpoch();

  async function pull(key, label) {
    var r = await sbGetResult(key);

    var cloudCats = await pull('tb_cats', 'קטגוריות');
    /*  ⛔ ההקשר התחלף באמצע המחזור — ⚠️ הנתונים שבזיכרון שייכים למוסד
     *  הקודם, ⭐ והכתיבה שאחרי הייתה כותבת אותם תחת החדש. */
    if (stale()) { console.warn('[sync] ההקשר התחלף באמצע — הסנכרון נעצר'); return; }
    if (cloudCats && cloudCats.length) {
      CATS = mergeCats(CATS, cloudCats);
      lsSet('tb_cats'+LS, JSON.stringify(CATS));
      sbSet('tb_cats', CATS).then(function(r){ if (stale()) return; if (r && r.ok) _tbMarkPushed('tb_cats'); });
    }

     *  הקודם, ⭐ והכתיבה שאחרי הייתה כותבת אותם תחת החדש. */
    if (stale()) { console.warn('[sync] ההקשר התחלף באמצע — הסנכרון נעצר'); return; }

      sbSet('tb_subs_meta', SUBS_META);

    // ENTRIES: מיזוג ברמת רשומה (updatedAt + tombstones). קודם: איחוד לפי id

    /* ⛔ מהטבלה בלבד, ⛔ ובלי נפילה-חזרה לערך השלם — ⚠️ וכשל אינו נכנס

    var _rowsE = await tbRowsGet('tb_entries');

    if (stale()) { console.warn('[sync] ההקשר התחלף באמצע — הסנכרון נעצר'); return; }
    if (!_rowsE.ok) failed.push('רשומות');
    else {
    var cloudEntries = _rowsE.data;

      tbRowsPush('tb_entries', ENTRIES).then(function(r){ if (stale()) return; if (r && r.ok) _tbMarkPushed('tb_entries'); });

    } else if (ENTRIES.length) {
      tbRowsPush('tb_entries', ENTRIES);

    // איבדו את הצד הקטן יותר.
    var _rowsA = await tbRowsGet('tb_archive');
    /*  ⛔ ההקשר התחלף באמצע המחזור — ⚠️ הנתונים שבזיכרון שייכים למוסד
     *  הקודם, ⭐ והכתיבה שאחרי הייתה כותבת אותם תחת החדש. */
    if (stale()) { console.warn('[sync] ההקשר התחלף באמצע — הסנכרון נעצר'); return; }
    if (!_rowsA.ok) failed.push('ארכיון');
    else {
    hwNoteCloud('tb_archive'+LS, _rowsA.data);   // ראיה עננית לשער הדיסק (סבב 35)
    var cloudArchive = _rowsA.data;
    if (cloudArchive && cloudArchive.length) {
      ARCHIVE = mergeArchive(ARCHIVE, cloudArchive);
      lsSetArray('tb_archive'+LS, hwDiskFilter('tb_archive'+LS, ARCHIVE), _tbRecTs);
      // דוחף את הארכיון הממוזג בחזרה לענן כדי שכל המכשירים יישארו מסונכרנים
      tbRowsPush('tb_archive', ARCHIVE).then(function(r){ if (stale()) return; if (r && r.ok) _tbMarkPushed('tb_archive'); });
      if (TB_KV_LEGACY_WRITE) sbSet('tb_archive', ARCHIVE);
    } else if (ARCHIVE.length) {
      // הענן ריק אך במכשיר יש נתונים — דוחף לענן
      tbRowsPush('tb_archive', ARCHIVE);
      if (TB_KV_LEGACY_WRITE) sbSet('tb_archive', ARCHIVE);
    }
    }

    // ניקוי חד-פעמי של סנאפשוטים פגומים (אחרי שהארכיון מהענן כבר יושב ב-ARCHIVE)
    arcCleanupCorrupted();

    buildCatGrid();
    // מיישב את selCat אחרי ש-CATS הוחלף — ההפניה הישנה אינה במערך החדש
    if (selCat) {
      selCat = CATS.find(function(c){ return c.letter === selCat.letter && isLive(c); }) || null;
    }
    buildTaskBtns();
    buildSubBtns();
    renderLog();
    // הסימון לפני הרינדור — שורת המצב שבאזור המצב נבנית בתוך renderSettings.
    if (failed.length === 0) _tbMarkSynced();
    renderSettings();
    if (failed.length === 0 && !_tbPullLogged) { _tbPullLogged = true; tbSyncLog('pull', null, null); }
    if (failed.length === 0) {
      toast("✅ מסונכרן");
    } else if (failed.length >= 5) {
      toast("⚠️ הסנכרון נכשל — עובד עם הנתונים שבמכשיר");
    } else {
      toast("⚠️ סנכרון חלקי — נכשל: " + failed.join(", "));

    console.error("[syncFromCloud] error:", e);

window.DAYS_HEB=["","א׳","ב׳","ג׳","ד׳","ה׳","ו׳","ז׳","ח׳","ט׳","י׳","י״א","י״ב","י״ג","י״ד","ט״ו","ט״ז","י״ז","י״ח","י״ט","כ׳","כ״א","כ״ב","כ״ג","כ״ד","כ״ה","כ״ו","כ״ז","כ״ח","כ״ט","ל׳"];
window.MONTHS_HEB     =["תשרי","חשון","כסלו","טבת","שבט","אדר","ניסן","אייר","סיון","תמוז","אב","אלול"];
window.MONTHS_HEB_LEAP=["תשרי","חשון","כסלו","טבת","שבט","אדר א","אדר ב","ניסן","אייר","סיון","תמוז","אב","אלול"];
window.YS_DOW_HEB=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];

// שנה מעוברת — מחזור 19 השנים (7 שנים מעוברות)
window.ysHebIsLeap=function(hy){return ((7*(+hy)+1)%19)<7;};
window.ysHebMonthNames=function(hy){return window.ysHebIsLeap(hy)?window.MONTHS_HEB_LEAP:window.MONTHS_HEB;};

// גימטריה — מספר → אותיות (כולל ט״ו/ט״ז). sep = התו שלפני האות האחרונה
window.ysGematria=function(n,sep){
  n=Math.floor(Math.abs(+n))||0;
  if(!n) return '';
  if(n>=1000) n=n%1000;
  var HUN=['','ק','ר','ש','ת'],TENS=['','י','כ','ל','מ','נ','ס','ע','פ','צ'],ONES=['','א','ב','ג','ד','ה','ו','ז','ח','ט'];
  var s='',h=Math.floor(n/100),r=n%100;
  while(h>4){s+='ת';h-=4;}
  s+=HUN[h]||'';
  if(r===15) s+='טו';
  else if(r===16) s+='טז';
  else s+=TENS[Math.floor(r/10)]+ONES[r%10];
  if(sep===undefined) sep='״';
  if(!sep||!s) return s;
  if(s.length===1) return s+'׳';
  return s.slice(0,-1)+sep+s.slice(-1);
};
window.ysHebDayLabel=function(day){var T=window.DAYS_HEB;return (T&&T[day])||window.ysGematria(day)||String(day);};
// תווית שנה קצרה — תשפ"ו (גרשיים ישרים, כפי שהוצג עד היום בלוח)
window.ysHebYearLabel=function(hy){return window.ysGematria((+hy)%1000,'"');};
// תווית שנה מלאה — ה׳תשפ״ו
window.ysHebYearLabelFull=function(hy){
  var ONES=['','א','ב','ג','ד','ה','ו','ז','ח','ט'],th=Math.floor((+hy)/1000);

// ---- קריאת הלוח העברי של הדפדפן ----
// שמות החודשים נקראים באנגלית ('en-u-ca-hebrew') כי הם יציבים בין גרסאות ICU,
// וממופים לאינדקס בטבלאות התצוגה שלנו.
window._ysMICodeLeap={tishri:0,heshvan:1,kislev:2,tevet:3,shevat:4,adar1:5,adar2:6,nisan:7,iyar:8,sivan:9,tamuz:10,av:11,elul:12};
window._ysMICodeStd ={tishri:0,heshvan:1,kislev:2,tevet:3,shevat:4,adar:5,nisan:6,iyar:7,sivan:8,tamuz:9,av:10,elul:11};
window._ysMonthCode=function(name){
  var s=(name||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  if(s.indexOf('adar')===0){
    var t=s.slice(4);
    if(t==='i'||t==='1'||t==='a') return 'adar1';
    if(t==='ii'||t==='2'||t==='b') return 'adar2';
    return 'adar';
  }
  if(s.indexOf('tishr')===0) return 'tishri';
  if(s.indexOf('hesh')!==-1||s.indexOf('chesh')!==-1) return 'heshvan';
  if(s.indexOf('kislev')===0||s.indexOf('chislev')===0) return 'kislev';
  if(s.indexOf('tevet')===0||s.indexOf('teveth')===0) return 'tevet';
  if(s.indexOf('shevat')===0||s.indexOf('shvat')===0||s.indexOf('shebat')===0) return 'shevat';
  if(s.indexOf('nisan')===0||s.indexOf('nissan')===0) return 'nisan';
  if(s.indexOf('iyar')===0||s.indexOf('iyyar')===0) return 'iyar';
  if(s.indexOf('sivan')===0) return 'sivan';
  if(s.indexOf('tamuz')===0||s.indexOf('tammuz')===0) return 'tamuz';
  if(s==='av'||s==='ab') return 'av';
  if(s.indexOf('elul')===0) return 'elul';

window._ysIntlFmt=null;window._ysIntlOK=null;
// גרגוריאני → {hy,mi,day,leap} דרך Intl. מחזיר null אם לא זמין / תוצאה לא צפויה
window.ysIntlHeb=function(d){
  try{
    if(window._ysIntlOK===false) return null;
    if(!window._ysIntlFmt){
      if(typeof Intl==='undefined'||!Intl.DateTimeFormat){window._ysIntlOK=false;return null;}
      var f=new Intl.DateTimeFormat('en-u-ca-hebrew',{year:'numeric',month:'long',day:'numeric'});
      var ro=f.resolvedOptions?f.resolvedOptions():null;
      if(!ro||ro.calendar!=='hebrew'||!f.formatToParts){window._ysIntlOK=false;return null;}
      window._ysIntlFmt=f;window._ysIntlOK=true;
    }
    var o={};
    window._ysIntlFmt.formatToParts(d).forEach(function(p){o[p.type]=p.value;});
    var hy=parseInt(String(o.year||'').replace(/[^0-9]/g,''),10);
    var day=parseInt(String(o.day||'').replace(/[^0-9]/g,''),10);
    var code=window._ysMonthCode(o.month);
    if(!(hy>=4000&&hy<=7000)||!(day>=1&&day<=30)||!code) return null;
    var leap=window.ysHebIsLeap(hy);
    var mi=leap?window._ysMICodeLeap[code]:window._ysMICodeStd[code];
    if(mi===undefined){
      // אי-התאמה בין חישוב העיבור לשם החודש — סימן שמשהו לא צפוי; לא מנחשים
      return null;
    }
    return {hy:hy,mi:mi,day:day,leap:leap};
  }catch(e){ window._ysIntlOK=false; return null; }

  var ck=d.getFullYear()+'|'+d.getMonth()+'|'+d.getDate();

  var nd=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12,0,0);

};
