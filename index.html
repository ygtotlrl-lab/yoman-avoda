<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1E6FBF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="יומן עבודה">
<title></title>
<link rel="manifest" href="manifest.json">
<script src="app.config.js"></script>
<script src="core/boot.js"></script>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.b8f26c23.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.98eaf57d.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.987dce4d.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&family=Heebo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<!-- גרסאות CDN נעוצות במדויק ולא ראשית צפה — שחרור בצד הספק שובר את האפליקציה בלי שינוי קוד.
     התגיות זהות לרשימת המטמון של ה-service worker. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="core/ui.css">
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<!-- הקליפה מתחילה חשופה — המסגרת נחשפת רק כשנבחרה ישיבה, ולא בטעינה ובמסך הבחירה. -->
<div class="app is-bare">

  <div class="hdr">
    <div class="hdr-top">
      <div class="hdr-logo-wrap"><button class="hdr-logo-btn" data-act="open-yeshiva-picker" aria-label="החלפת ישיבה" title="החלפת ישיבה"><img id="appLogo" class="hdr-logo" alt="" /></button></div>
      <div class="hdr-mid">
        <div class="hdr-bh">ב״ה | ימות המשיח</div>
        <div class="hdr-title-wrap"><div class="hdr-h1">יומן עבודה</div></div>
        <div class="hdr-sub" id="hdrSub"></div>
      </div>
    </div>
    <div class="hdr-div"></div>
    <div class="hdr-yechi">יחי אדוננו מורנו ורבינו מלך המשיח לעולם ועד</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-act="show-tab" data-tab="entry">📝 הזנה</button>
    <button class="tab-btn" data-act="show-tab" data-tab="log">📋 יומן</button>
    <button class="tab-btn" data-act="show-tab" data-tab="settings">⚙️ עריכה</button>
    <button class="tab-btn" data-act="show-tab" data-tab="archive">🗄 ארכיון</button>
  </div>

  <main id="view"><div class="view-loading" role="status" aria-label="טוען"><span class="view-spin"></span></div></main>

</div>

<div id="toasts" aria-live="polite"></div>
<div id="updater">
  <div class="in">
    <span>🔄 גרסה חדשה זמינה</span>
    <button data-act="sw-apply">עדכן עכשיו</button>
    <button class="x" data-act="sw-dismiss" aria-label="סגור">✕</button>
  </div>
</div>


<script type="module" src="app/main.js"></script>
<div id="modal" class="veil" data-veil="modal">
  <div class="sheet" data-ks role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="sheet-hd">
      <h3 id="modal-title"></h3>
      <button class="x" data-act="modal-close" aria-label="סגירה">✕</button>
    </div>
    <div class="sheet-bd" id="modal-body"></div>
    <div class="sheet-ft" id="modal-foot"></div>
  </div>
</div>
<div id="ask" class="veil" data-veil="ask">
  <div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="ask-title">
    <div class="sheet-hd"><h3 id="ask-title"></h3></div>
    <div class="sheet-bd" id="ask-body"></div>
    <div class="sheet-ft">
      <button data-act="ask-no">ביטול</button>
      <button class="danger" data-act="ask-yes" id="ask-yes">אישור</button>
    </div>
  </div>
</div>
</body>
</html>
