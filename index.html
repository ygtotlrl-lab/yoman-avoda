<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1E6FBF">
<title></title>
<link rel="manifest" href="manifest.json">
<script src="app.config.js"></script>
<script src="core/boot.js"></script>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.8ec7a033.png">
<link rel="icon" href="icons/favicon-32.80976f95.png" sizes="32x32">
<link rel="icon" href="icons/favicon-16.86269b65.png" sizes="16x16">
<!-- גרסאות CDN נעוצות במדויק ולא ראשית צפה — שחרור בצד הספק שובר את האפליקציה בלי שינוי קוד.
     התגיות זהות לרשימת המטמון של ה-service worker. -->
<link rel="preload" href="core/fonts/heebo-hebrew.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="core/fonts/frank-ruhl-libre-hebrew.woff2" as="font" type="font/woff2" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="core/ui.css">
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<!-- הקליפה מתחילה חשופה — המסגרת נחשפת רק כשנבחרה ישיבה, ולא בטעינה ובמסך הבחירה. -->
<div class="app is-bare">

  <div class="hdr">
    <div class="hdr-top">
      <div class="hdr-mid">
        <div class="hdr-bh">ב״ה | ימות המשיח</div>
        <div class="hdr-logo-wrap"><button class="hdr-logo-btn" data-act="open-yeshiva-picker" aria-label="החלפת ישיבה" title="החלפת ישיבה"><img id="appLogo" class="hdr-logo" alt="" /></button></div>
        <div class="hdr-title-wrap"><div class="hdr-h1">יומן עבודה</div></div>
        <div class="hdr-sub" id="hdrSub"></div>
      </div>
    </div>
    <div class="hdr-div"></div>
    <div class="hdr-yechi">יחי אדוננו מורנו ורבינו מלך המשיח לעולם ועד</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-act="show-tab" data-tab="entry">הזנה</button>
    <button class="tab-btn" data-act="show-tab" data-tab="log">יומן</button>
    <button class="tab-btn" data-act="show-tab" data-tab="settings">עריכה</button>
    <button class="tab-btn" data-act="show-tab" data-tab="archive">ארכיון</button>
  </div>

  <main id="view" class="view"><div class="view-loading view-boot" role="status" aria-label="טוען"><img class="view-logo" src="icons/icon-maskable-512.2f1f36af.png" alt=""></div></main>

</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="updater" class="updater">
  <div class="in">
    <span class="upd-ic" data-shell-ic="refresh"></span><span>גרסה חדשה זמינה</span>
    <button data-act="sw-apply">עדכן עכשיו</button>
    <button class="x" data-act="sw-dismiss" data-shell-ic="close" aria-label="סגירה"></button>
  </div>
</div>


<script type="module" src="app/main.js"></script>
<div id="modal" class="veil veil-modal" data-veil="modal">
  <div class="sheet" data-ks role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="sheet-hd">
      <h3 id="modal-title"></h3>
      <button class="x" data-act="modal-close" data-shell-ic="close" aria-label="סגירה"></button>
    </div>
    <div class="sheet-bd modal-body" id="modal-body"></div>
    <div class="sheet-ft modal-foot" id="modal-foot"></div>
  </div>
</div>
<div id="ask" class="veil veil-ask" data-veil="ask">
  <div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="ask-title">
    <div class="sheet-hd"><h3 id="ask-title"></h3></div>
    <div class="sheet-bd ask-body" id="ask-body"></div>
    <div class="sheet-ft">
      <button data-act="ask-no">ביטול</button>
      <button data-act="ask-yes" id="ask-yes">אישור</button>
    </div>
  </div>
</div>
</body>
</html>
