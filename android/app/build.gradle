plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yoman.avoda'
    compileSdk 34

    defaultConfig {
        applicationId "com.yoman.avoda"   // same ID as the existing app
        minSdk 21
        targetSdk 34
        // ⛔ versionCode לעולם אינו יורד (סבב 46ב) — מספר נמוך ממה
        // שמותקן במכשיר חוסם את העדכון.
        // ⛔ קדם בכל שינוי ב-`android/` (סבב 68) — ⚠️ ר' טבלת הגרסאות
        // ב-`android/README.md`, ⛔ שהיא מקור האמת היחיד להיסטוריה
        // (כלל ברזל 21); `tools/test_gradle.mjs` אוכף את הקידום מול
        // קומיט הקידום האחרון.
        versionCode 14
        versionName "14.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    // WebViewCompat.addWebMessageListener — the origin allow-list for the share bridge
    // is enforced by WebView itself, per frame. See MainActivity#installShareBridge.
    implementation 'androidx.webkit:webkit:1.11.0'
}
