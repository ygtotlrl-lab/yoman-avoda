// נוצר מהתצורה — app.config.js, ב-node tools/gen-app.mjs: אין לערוך ביד
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yoman.avoda'
    compileSdk 34

    defaultConfig {
        applicationId "com.yoman.avoda"
        minSdk 21
        targetSdk 34
        versionCode 37
        versionName "21.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // מסך הפתיחה — אותו מסך בכל גרסאות האנדרואיד, והמעטפת מחזיקה אותו עד שהמסך הראשון צויר
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.core:core:1.13.1'
    // WebViewCompat.addWebMessageListener — רשימת המקורות של גשר השיתוף נאכפת ב-WebView עצמו, לכל frame
    implementation 'androidx.webkit:webkit:1.11.0'
}
