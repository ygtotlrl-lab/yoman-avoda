// ⛔ נוצר מהתצורה — `app.config.js`, ב-`node tools/gen-app.mjs`: אין לערוך ביד
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yoman.avoda'
    compileSdk 34

    defaultConfig {
        applicationId "com.yoman.avoda"
        minSdk 21
        targetSdk 34
        versionCode 27
        versionName "20.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    // WebViewCompat.addWebMessageListener — the origin allow-list for the share bridge
    // is enforced by WebView itself, per frame. See MainActivity#installShareBridge.
    implementation 'androidx.webkit:webkit:1.11.0'
}
