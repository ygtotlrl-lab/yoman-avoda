plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yoman.avoda'
    compileSdk 34

    defaultConfig {
        applicationId "com.yoman.avoda"   // same ID as the existing app
        minSdk 21
        targetSdk 34
        // ⛔ versionCode לעולם אינו יורד (סבב 46ב) — מספר נמוך ממה
        // שמותקן במכשיר חוסם את העדכון.
        // 1 = the shell that loaded file:///android_asset/index.html.
        // 2 = loads the live site (https://ygtotlrl-lab.github.io/yoman-avoda/).
        // Anything installing over an earlier build has to be higher.
        // 3 = סבב 41 — יישור שכבת הבנייה והחילוץ של המעטפת לתבנית
        // משותפת. ⛔ כל שינוי תחת android/ מחייב קידום כאן,
        // ו-tools/test_round40_gradle.mjs אוכף זאת מול origin/main.
        // 4 = סבב 45 — יישור `AndroidManifest.xml` (`configChanges` לסופרסט)
        // ואכיפת חתימה על החלק המשותף של המניפסט ושל קובץ הבנייה.
        // 5 = סבב 46ב — היפוך ברירת המחדל בקובצי התצורה: חתימה חסרת-גשר
        // על המניפסט ועל קובץ הבנייה, וחתימה אחת לשני ה-workflows.
        versionCode 5
        versionName "5.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    // WebViewCompat.addWebMessageListener — the origin allow-list for the share bridge
    // is enforced by WebView itself, per frame. See MainActivity#installShareBridge.
    implementation 'androidx.webkit:webkit:1.11.0'
}
