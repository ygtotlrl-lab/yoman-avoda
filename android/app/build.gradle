plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yoman.avoda'
    compileSdk 34

    defaultConfig {
        applicationId "com.yoman.avoda"   // same ID as the existing app
        minSdk 21
        targetSdk 34
        // 1 = the shell that loaded file:///android_asset/index.html.
        // 2 = loads the live site (https://ygtotlrl-lab.github.io/yoman-avoda/).
        // 3 = new launcher icon ("שכבות", round 22). Shell behaviour unchanged.
        // Anything installing over an earlier build has to be higher.
        versionCode 3
        versionName "2.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    // WebViewCompat.addWebMessageListener — the origin allow-list for the share bridge
    // is enforced by WebView itself, per frame. See MainActivity#installShareBridge.
    implementation 'androidx.webkit:webkit:1.11.0'
}
