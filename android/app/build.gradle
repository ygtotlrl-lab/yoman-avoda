plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yoman.avoda'
    compileSdk 34

    defaultConfig {
        applicationId "com.yoman.avoda"   // same ID as the existing app
        minSdk 21
        targetSdk 34
        // ⛔ versionCode לעולם אינו יורד — מספר נמוך ממה
        // שמותקן במכשיר חוסם את העדכון.
        // ⛔ קדם בכל שינוי ב-`android/` — ⚠️ בלי קידום המכשיר המותקן
        // אינו מקבל את ה-APK החדש, ⭐ וההיסטוריה ב-git ⛔ ולא כאן.
        versionCode 24
        versionName "19.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    // WebViewCompat.addWebMessageListener — the origin allow-list for the share bridge
    // is enforced by WebView itself, per frame. See MainActivity#installShareBridge.
    implementation 'androidx.webkit:webkit:1.11.0'
}
